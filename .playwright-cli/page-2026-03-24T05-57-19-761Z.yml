              - generic [ref=e95]:
                - heading "下载 " [level=2] [ref=e96]:
                  - text: 下载
                  - link "" [ref=e97] [cursor=pointer]:
                    - /url: "#downloads"
                - paragraph [ref=e98]: 你可以选择以下版本：
                - list [ref=e99]:
                  - listitem [ref=e100]:
                    - paragraph [ref=e101]:
                      - link "最新的稳定发布版本" [ref=e102] [cursor=pointer]:
                        - /url: https://github.com/Phobos-developers/Phobos/releases/latest
                      - text: （Bug 最少的版本，但功能更新上非常缓慢）
                  - listitem [ref=e103]:
                    - paragraph [ref=e104]:
                      - link "最新的开发分支版本" [ref=e105] [cursor=pointer]:
                        - /url: https://github.com/Phobos-developers/Phobos/releases
                      - text: （Bug 相对较少的版本，开发构建会在新功能
                      - strong [ref=e106]: 完成后
                      - text: 立即更新）
                  - listitem [ref=e107]:
                    - paragraph [ref=e108]:
                      - link "最新的自动构建版本" [ref=e109] [cursor=pointer]:
                        - /url: https://nightly.link/Phobos-developers/Phobos/blob/develop/.github/workflows/nightly.yml
                      - text: （添加了尚未发布的功能，这些功能将在下一个开发版本中推出）
                  - listitem [ref=e110]:
                    - paragraph [ref=e111]:
                      - text: 用于测试单个新功能的自动构建版本可在
                      - link "拉取请求" [ref=e112] [cursor=pointer]:
                        - /url: https://github.com/Phobos-developers/Phobos/pulls
                      - text: 中找到
                - generic [ref=e113]:
                  - heading "关于自动构建版本的说明 " [level=3] [ref=e114]:
                    - text: 关于自动构建版本的说明
                    - link "" [ref=e115] [cursor=pointer]:
                      - /url: "#note-on-nightly-builds"
                  - paragraph [ref=e116]:
                    - text: 后两个版本是前瞻版本（不要在测试之外重新分发它们！）并且它们会在游戏中显示无法关闭的版本构建信息（提交和分支／标签）。你可以通过开发分支（上方链接）获取一个构建版本以及在拉取请求中通过自动化机器人的评论获取其开发分支上任何最新成功编译的 Phobos 版本。注意
                    - strong [ref=e117]: 只有当拉取请求没有合并冲突时
                    - text: 才会生成。此外，你可以手动运行 GitHub Actions 来获取一个由工作流自动生成的工件。只需要点击绿色勾号，打开工作流页面，找到并下载对应的工件。这仅限于被授权的用户执行。
              - generic [ref=e118]:
                - heading "安装和使用 " [level=2] [ref=e119]:
                  - text: 安装和使用
                  - link "" [ref=e120] [cursor=pointer]:
                    - /url: "#installation-and-usage"
                - list [ref=e121]:
                  - listitem [ref=e122]:
                    - paragraph [ref=e123]:
                      - text: 如果你的 mod 中还没有安装 Syringe，可以连同
                      - link "最新版 Ares 软件包" [ref=e124] [cursor=pointer]:
                        - /url: https://launchpad.net/ares/+download
                      - text: 一同下载。安装时，只需将
                      - code [ref=e125]: Syringe.exe
                      - text: 置入游戏根目录（即你
                      - code [ref=e126]: gamemd.exe
                      - text: 所在的位置）。强烈建议同时
                      - strong [ref=e127]: 安装 Ares
                      - text: 以获得完整的 Phobos 功能体验，只需将压缩包中除 Documentation 目录之外的所有文件放入游戏根目录即可。
                  - listitem [ref=e128]:
                    - paragraph [ref=e129]:
                      - text: 获取 Phobos 「软件包」（可在
                      - link "发布页面" [ref=e130] [cursor=pointer]:
                        - /url: https://github.com/Phobos-developers/Phobos/releases
                      - text: 找到官方构建版；阅读下文了解如何获取自动构建版本）。最终会生成两个文件：
                      - code [ref=e131]: Phobos.dll
                      - text: 和
                      - code [ref=e132]: Phobos.pdb
                      - text: 。
                  - listitem [ref=e133]:
                    - paragraph [ref=e134]:
                      - text: 将这些文件放入游戏根目录（即你的
                      - code [ref=e135]: gamemd.exe
                      - text: 所在的位置）。
                  - listitem [ref=e136]:
                    - paragraph [ref=e137]:
                      - text: 要使用 Phobos（以及所有其他已安装且兼容的 Syringe 拓展引擎，包括 Ares）启动游戏，你需要在命令行中执行
                      - code [ref=e138]: Syringe.exe "gamemd.exe" [gamemd.exe 的命令行参数]
                      - text: （如果不需要参数，请省略）。Ares 软件包中的
                      - code [ref=e139]: RunAres.bat
                      - text: 也有相同的功能，因此你也同样可以使用它来启动。
                - paragraph [ref=e140]:
                  - text: 如果你已经在 mod 中使用了 Ares，只需将上述 Phobos 扩展引擎的文件放到游戏根目录中，Syringe 就会自动加载 Phobos。这也适用于使用 XNA 客户端和 Syringe 的 mod；如果你的 mod 尚未使用 Syringe 和 Ares（或者你尚未设置客户端），我们建议你使用
                  - link "Starkku 的 CnCNet 客户端 mod 基底" [ref=e141] [cursor=pointer]:
                    - /url: https://github.com/Starkku/cncnet-client-mod-base
                  - text: ，它与 Ares 和 Phobos 兼容并且开袋即食。
                - paragraph [ref=e142]:
                  - text: 你可能用到的其他文件与工具位于
                  - link "Phobos 补充资源库" [ref=e143] [cursor=pointer]:
                    - /url: https://github.com/Phobos-developers/PhobosSupplementaries
                  - text: 。
                - paragraph [ref=e144]: 在默认情况下除一些错误修复外 Phobos 不会作出任何非常明显的更改。若要了解如何使用 Phobos 功能，请通读本文档。
