            - generic [ref=e73]:
              - heading "Phobos " [level=1] [ref=e74]:
                - text: Phobos
                - link "" [ref=e75] [cursor=pointer]:
                  - /url: "#phobos"
              - paragraph [ref=e76]:
                - text: …是一个社区引擎扩展项目，它基于
                - link "自定义 YRpp" [ref=e77] [cursor=pointer]:
                  - /url: https://github.com/Phobos-developers/YRpp
                - text: 与
                - link "Syringe" [ref=e78] [cursor=pointer]:
                  - /url: https://github.com/Ares-Developers/Syringe
                - text: 为《尤里的复仇》提供一系列新功能和修复。它旨在与
                - link "Ares" [ref=e79] [cursor=pointer]:
                  - /url: https://github.com/Ares-Developers/Ares
                - text: 引擎搭配使用，而非取而代之，因此不会带来不兼容问题。
              - paragraph [ref=e80]: 虽然 Phobos 独立于 Ares 且无需 Ares 即可运行，但 Phobos 补充了 Ares 的一些功能，反之亦然。
              - paragraph [ref=e81]: 此产品不受 EA 官方认可及支持。
              - generic [ref=e82]:
                - heading "社区 " [level=2] [ref=e83]:
                  - text: 社区
                  - link "" [ref=e84] [cursor=pointer]:
                    - /url: "#community"
                - paragraph [ref=e85]: 由于这是一个国际性的项目而英语是目前最常用的第二语言，因此英语是该项目的主要语言。 不过我们知道很多人的英语可能不如母语那样好，而且／或者在访问 Discord 时可能会遇到困难，所以我们并不限制创建特定语言的社区群组。
                - list [ref=e86]:
                  - listitem [ref=e87]:
                    - paragraph [ref=e88]:
