                    - paragraph [ref=e3017]: 心灵控制者现在可以设置哪些所属方可以看到它与被心灵控制单位之间的连线。
                  - listitem [ref=e3018]:
                    - paragraph [ref=e3019]: 多重心控单位现在可以达到控制上限而又要控制一个新目标时释放第一个被控制的单位。
                - paragraph [ref=e3020]:
                  - text: 在
                  - code [ref=e3021]: rulesmd.ini
                  - text: ：
                - generic [ref=e3024]: "[SOMETECHNO] ; TechnoType, as Mind controllers MindControlRangeLimit=-1.0 ; floating point value MindControl.IgnoreSize=true ; boolean MindControlLink.VisibleToHouse=all ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) MultiMindControl.ReleaseVictim=false ; boolean [SOMETECHNO] ; TechnoType, as Mind controlled targets MindControlSize=1 ; integer"
              - generic [ref=e3025]:
                - heading "多武器 " [level=3] [ref=e3026]:
                  - text: 多武器
                  - link "" [ref=e3027] [cursor=pointer]:
                    - /url: "#multi-weapon"
                - paragraph [ref=e3028]:
                  - img "图像" [ref=e3029]
                  - emphasis [ref=e3030]:
                    - text: "@"
                    - link "暴风硫" [ref=e3031] [cursor=pointer]:
                      - /url: https://space.bilibili.com/11638715/lists/5358986
                    - text: 在
                    - strong [ref=e3032]: 零点界限
                    - text: 中使用多武器逻辑来实现对不同目标使用不同武器
                - list [ref=e3033]:
                  - listitem [ref=e3034]:
                    - paragraph [ref=e3035]:
                      - text: 现在你可以使用
                      - code [ref=e3036]: WeaponX
                      - text: 来为一个单位启用 2 种以上的武器而无需原先硬编码的
                      - code [ref=e3037]: Gunner=yes
                      - text: 、
                      - code [ref=e3038]: IsGattling=yes
                      - text: 或
                      - code [ref=e3039]: IsChargeTurret=yes
                      - text: 这些启用语句。
                    - list [ref=e3040]:
                      - listitem [ref=e3041]:
                        - paragraph [ref=e3042]:
                          - text: 设置
                          - code [ref=e3043]: MultiWeapon=yes
                          - text: 来启用此功能，注意别忘了设置
                          - code [ref=e3044]: WeaponCount
                          - text: 。
                      - listitem [ref=e3045]:
                        - paragraph [ref=e3046]:
                          - code [ref=e3047]: MultiWeapon.IsSecondary
                          - text: 指定在选择武器或触发步兵
                          - code [ref=e3048]: SecondaryFire
                          - text: 时哪些武器被视为
                          - code [ref=e3049]: Secondary
                          - text: ，若不设置则使用
                          - code [ref=e3050]: Weapon1
                          - text: 。
                      - listitem [ref=e3051]:
                        - paragraph [ref=e3052]:
                          - code [ref=e3053]: MultiWeapon.SelectCount
                          - text: 决定默认武器选用逻辑下可以被考虑使用的武器数量。设置过高会导致性能问题。
                        - list [ref=e3054]:
                          - listitem [ref=e3055]:
                            - paragraph [ref=e3056]: 如果该值小于武器数量那么将会优先选择索引序号更小的武器。
                          - listitem [ref=e3057]:
                            - paragraph [ref=e3058]:
                              - text: 其他武器仍可通过
                              - link "对特定目标使用特定武器" [ref=e3059] [cursor=pointer]:
                                - /url: "#forcing-specific-weapon-against-certain-targets"
                              - text: 等指定武器索引序号的逻辑来使用。
                - paragraph [ref=e3060]:
                  - text: 在
                  - code [ref=e3061]: rulesmd.ini
                  - text: ：
                - generic [ref=e3064]: "[SOMETECHNO] ; TechnoType MultiWeapon=false ; boolean MultiWeapon.IsSecondary= ; List of integers MultiWeapon.SelectCount=2 ; integer"
              - generic [ref=e3065]:
                - heading "多武器的攻击指令音效 " [level=3] [ref=e3066]:
                  - text: 多武器的攻击指令音效
                  - link "" [ref=e3067] [cursor=pointer]:
                    - /url: "#multi-voiceattack"
                - list [ref=e3068]:
                  - listitem [ref=e3069]:
                    - paragraph [ref=e3070]: 单位可以在使用更多武器时自定义各武器下达攻击指令时的音效。
                    - list [ref=e3071]:
                      - listitem [ref=e3072]:
                        - paragraph [ref=e3073]:
                          - text: 如果你需要为
                          - code [ref=e3074]: Weapon1
                          - text: 分配攻击音效那么直接设置
                          - code [ref=e3075]: VoiceWeapon1Attack
                          - text: 即可。其他武器同理。
                      - listitem [ref=e3076]:
                        - paragraph [ref=e3077]:
                          - text: 也可使用
                          - code [ref=e3078]: VoiceEliteWeaponNAttack
                          - text: 指定用于
                          - code [ref=e3079]: EliteWeaponN
                          - text: 的音效。默认使用
                          - code [ref=e3080]: VoiceWeaponNAttack
                          - text: 。
                - paragraph [ref=e3081]:
                  - text: 在
                  - code [ref=e3082]: rulesmd.ini
                  - text: ：
                - generic [ref=e3085]: "[SOMETECHNO] ; TechnoType VoiceWeaponNAttack= ; Sound entry VoiceEliteWeaponNAttack= ; Sound entry"
              - generic [ref=e3086]:
                - heading "禁止手动移动 " [level=3] [ref=e3087]:
                  - text: 禁止手动移动
                  - link "" [ref=e3088] [cursor=pointer]:
                    - /url: "#no-manual-move"
                - list [ref=e3089]:
                  - listitem [ref=e3090]:
                    - paragraph [ref=e3091]: 现在你可以指定一个科技类型是否无法接收移动指令。
                  - listitem [ref=e3092]:
                    - paragraph [ref=e3093]:
                      - text: 在一个拥有
                      - code [ref=e3094]: UndeploysInto
                      - text: 的建筑上将此设为 true 可以阻止其在设置集结点时反部署。
                - paragraph [ref=e3095]:
                  - text: 在
                  - code [ref=e3096]: rulesmd.ini
                  - text: ：
                - generic [ref=e3099]: "[SOMETECHNO] ; TechnoType NoManualMove=false ; boolean"
                - generic [ref=e3100]:
                  - paragraph [ref=e3101]:  备注
                  - paragraph [ref=e3102]:
                    - text: 注意你仍可使用一个
                    - code [ref=e3103]: BuildingUndeploy=true
                    - text: 的弹头或设置集结点后出售建筑来解除部署。
              - generic [ref=e3104]:
                - heading "EMP 或超时空停止 CD " [level=3] [ref=e3105]:
                  - text: EMP 或超时空停止 CD
                  - link "" [ref=e3106] [cursor=pointer]:
                    - /url: "#no-rearm-and-reload-in-emp-or-temporal"
                - list [ref=e3107]:
                  - listitem [ref=e3108]:
                    - paragraph [ref=e3109]:
                      - text: 现在你可以让科技类型在 EMP 或被超时空武器冻结时武器 ROF 与弹药 Reload 也同步停止。默认值取自
                      - code [ref=e3110]: "[General]"
                      - text: 。这对机场战机的重新装填无效。
                - paragraph [ref=e3111]:
                  - text: 在
                  - code [ref=e3112]: rulesmd.ini
                  - text: ：
                - generic [ref=e3115]: "[General] NoRearm.UnderEMP=false ; boolean NoRearm.Temporal=false ; boolean NoReload.UnderEMP=false ; boolean NoReload.Temporal=false ; boolean [SOMETECHNO] ; TechnoType NoRearm.UnderEMP= ; boolean NoRearm.Temporal= ; boolean NoReload.UnderEMP= ; boolean NoReload.Temporal= ; boolean"
              - generic [ref=e3116]:
                - heading "自定义脑车过载 " [level=3] [ref=e3117]:
                  - text: 自定义脑车过载
                  - link "" [ref=e3118] [cursor=pointer]:
                    - /url: "#overload-characteristic-dehardcoded"
                - list [ref=e3119]:
                  - listitem [ref=e3120]:
                    - paragraph [ref=e3121]:
                      - text: 现在可以为一个使用
                      - code [ref=e3122]: InfiniteMindControl=yes
                      - text: 武器的单位自定义其过载相关特性。
                - paragraph [ref=e3123]:
                  - text: 在
                  - code [ref=e3124]: rulesmd.ini
                  - text: ：
                - generic [ref=e3127]: "[SOMETECHNO] ; TechnoType Overload.Count= ; List of integers, default to [CombatDamage] -> OverloadCount Overload.Damage= ; List of integers, default to [CombatDamage] -> OverloadDamage Overload.Frames= ; List of integers, default to [CombatDamage] -> OverloadFrames Overload.DeathSound= ; Sound entry, default to [AudioVisual] -> MasterMindOverloadDeathSound Overload.ParticleSys= ; ParticleSystemType, default to [CombatDamage] -> DefaultSparkSystem Overload.ParticleSysCount=5 ; integer"
              - generic [ref=e3128]:
                - heading "子机升级 " [level=3] [ref=e3129]:
                  - text: 子机升级
                  - link "" [ref=e3130] [cursor=pointer]:
                    - /url: "#promoted-spawns"
                - paragraph [ref=e3131]:
                  - img "图像" [ref=e3132]
                  - emphasis [ref=e3133]:
                    - link "幻想奇遇" [ref=e3134] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/fantasy-adventure
                    - text: 中的子机同步升级
                - list [ref=e3135]:
                  - listitem [ref=e3136]:
                    - paragraph [ref=e3137]: 生成的单位可以根据其所有者的等级进行同步升级。
                - paragraph [ref=e3138]:
                  - text: 在
                  - code [ref=e3139]: rulesmd.ini
                  - text: ：
                - generic [ref=e3142]: "[SOMETECHNO] ; TechnoType Promote.IncludeSpawns=false ; boolean"
              - generic [ref=e3143]:
                - heading "升级动画 " [level=3] [ref=e3144]:
                  - text: 升级动画
                  - link "" [ref=e3145] [cursor=pointer]:
                    - /url: "#promotion-animation"
                - list [ref=e3146]:
                  - listitem [ref=e3147]:
                    - paragraph [ref=e3148]: 现在你可以在单位或建筑升级时播放指定动画。
                    - list [ref=e3149]:
                      - listitem [ref=e3150]:
                        - paragraph [ref=e3151]:
                          - code [ref=e3152]: Promote.VeteranAnimation
                          - text: 用于单位或建筑升级为老兵时。若为单位设置本句则覆盖全局
                          - code [ref=e3153]: "[AudioVisual]"
                          - text: 中的设置。如果列出了多个动画，则将随机选择一个。
                      - listitem [ref=e3154]:
                        - paragraph [ref=e3155]:
                          - code [ref=e3156]: Promote.EliteAnimation
                          - text: 用于单位或建筑升级为精英时。若为单位设置本句则覆盖全局
                          - code [ref=e3157]: "[AudioVisual]"
                          - text: 中的设置。如果列出了多个动画，则将随机选择一个。
                      - listitem [ref=e3158]:
                        - paragraph [ref=e3159]:
                          - text: 如果未定义
                          - code [ref=e3160]: Promote.EliteAnimation
                          - text: 则使用
                          - code [ref=e3161]: Promote.VeteranAnimation
                          - text: 。
                - paragraph [ref=e3162]:
                  - text: 在
                  - code [ref=e3163]: rulesmd.ini
                  - text: ：
                - generic [ref=e3166]: "[AudioVisual] Promote.VeteranAnimation= ; List of AnimationTypes Promote.EliteAnimation= ; List of AnimationTypes [SOMETECHNO] ; TechnoType Promote.VeteranAnimation= ; List of AnimationTypes, default to Promote.VeteranAnimation in [AudioVisual] Promote.EliteAnimation= ; List of AnimationTypes, default to Promote.EliteAnimation in [AudioVisual]"
              - generic [ref=e3167]:
                - heading "单位受伤警报 " [level=3] [ref=e3168]:
                  - text: 单位受伤警报
                  - link "" [ref=e3169] [cursor=pointer]:
                    - /url: "#raise-alert-when-technos-are-taking-damage"
                - list [ref=e3170]:
                  - listitem [ref=e3171]:
                    - paragraph [ref=e3172]: 在原版，非建筑科技类型在收到攻击时不会生成雷达事件或 EVA 播报，因此它们很难在被摧毁前被玩家注意到。现在当你的单位受到攻击时可以收到雷达事件（以及可选的声音效果），以便及时应战。
                  - listitem [ref=e3173]:
                    - paragraph [ref=e3174]:
                      - code [ref=e3175]: "[AudioVisual] -> CombatAlert"
                      - text: 是一个全局开关，将其设置为
                      - code [ref=e3176]: "true"
                      - text: 以启用整个逻辑。
                  - listitem [ref=e3177]:
                    - paragraph [ref=e3178]: 这些标签控制什么时候触发战斗警报。
                    - list [ref=e3179]:
                      - listitem [ref=e3180]:
                        - paragraph [ref=e3181]:
                          - text: 你可以通过将
                          - code [ref=e3182]: "[TechnoType] -> CombatAlert"
                          - text: 设置为
                          - code [ref=e3183]: "false"
                          - text: 来为特定科技类型禁用此逻辑，默认为
                          - code [ref=e3184]: "[AudioVisual] -> CombatAlert.Default"
                          - text: 。如果
                          - code [ref=e3185]: CombatAlert.Default
                          - text: 也为空，则默认为对
                          - code [ref=e3186]: Insignificant=yes
                          - text: 或
                          - code [ref=e3187]: Spawned=yes
                          - text: 的科技类型禁用。
                      - listitem [ref=e3188]:
                        - paragraph [ref=e3189]:
                          - code [ref=e3190]: "[AudioVisual] -> CombatAlert.IgnoreBuilding"
                          - text: 将在建筑上关闭此逻辑，你可以通过设置
                          - code [ref=e3191]: "[TechnoType] -> CombatAlert.NotBuilding"
                          - text: 为
                          - code [ref=e3192]: "true"
                          - text: 来为特定建筑覆盖设置。你可能希望将其用于载具性质的建筑。
                      - listitem [ref=e3193]:
                        - paragraph [ref=e3194]:
                          - code [ref=e3195]: "[AudioVisual] -> CombatAlert.SuppressIfInScreen"
                          - text: 决定是否为当前屏幕中的单位禁用此逻辑。
                      - listitem [ref=e3196]:
                        - paragraph [ref=e3197]:
                          - code [ref=e3198]: "[AudioVisual] -> CombatAlert.Interval"
                          - text: 决定警报之间的间隔（以帧为单位），以防止警报过于频繁。默认为 150 帧。
                      - listitem [ref=e3199]:
                        - paragraph [ref=e3200]:
                          - code [ref=e3201]: "[AudioVisual] -> CombatAlert.SuppressIfAllyDamage"
                          - text: 决定是否为盟友造成的伤害禁用此逻辑。
                      - listitem [ref=e3202]:
                        - paragraph [ref=e3203]:
                          - text: 科技类型被拥有
                          - code [ref=e3204]: "[WarheadType] -> CombatAlert.Suppress"
                          - text: 设置为
                          - code [ref=e3205]: "true"
                          - text: 的弹头击中将不会触发雷达事件或 EVA。此标签默认为 Ares 标签
                          - code [ref=e3206]: "[WarheadType] -> Malicious"
                          - text: 的相反值和
                          - code [ref=e3207]: "[WarheadType] -> Nonprovocative"
                          - text: 的值。
                  - listitem [ref=e3208]:
                    - paragraph [ref=e3209]: 以下标签控制战斗警报的效果。
                    - list [ref=e3210]:
                      - listitem [ref=e3211]:
                        - paragraph [ref=e3212]:
                          - code [ref=e3213]: "[AudioVisual] -> CombatAlert.MakeAVoice"
                          - text: 决定是否与战斗警报一起播放一些音效。将其设为 true 以启用以下标签，否则它们将被忽略。
                      - listitem [ref=e3214]:
                        - paragraph [ref=e3215]:
                          - code [ref=e3216]: "[TechnoType] -> CombatAlert.UseFeedbackVoice"
                          - text: 决定是否使用
                          - code [ref=e3217]: VoiceFeedback
                          - text: 定义的声音。默认为
                          - code [ref=e3218]: "[AudioVisual] -> CombatAlert.UseFeedbackVoice"
                          - text: 。
                      - listitem [ref=e3219]:
                        - paragraph [ref=e3220]:
                          - code [ref=e3221]: "[TechnoType] -> CombatAlert.UseAttackVoice"
                          - text: 决定是否使用
                          - code [ref=e3222]: VoiceAttack
                          - text: 定义的声音。默认为
                          - code [ref=e3223]: "[AudioVisual] -> CombatAlert.UseAttackVoice"
                          - text: 。
                      - listitem [ref=e3224]:
                        - paragraph [ref=e3225]:
                          - code [ref=e3226]: "[TechnoType] -> CombatAlert.UseEVA"
                          - text: 决定是否使用 EVA。默认为
                          - code [ref=e3227]: "[AudioVisual] -> CombatAlert.UseEVA"
                          - text: 。所用的 EVA 默认为
                          - code [ref=e3228]: EVA_UnitsInCombat
                          - text: ，可以通过
                          - code [ref=e3229]: "[TechnoType] -> CombatAlert.EVA"
                          - text: 指定。
                      - listitem [ref=e3230]:
                        - paragraph [ref=e3231]:
                          - text: 声音效果
                          - strong [ref=e3232]: 依次
                          - text: 被使用，首先是反馈，然后是攻击，最后是 EVA。在
                          - code [ref=e3233]: "[AudioVisual]"
                          - text: 中的标签控制是否全局检查，可以为每个科技类型单独指定。
                      - listitem [ref=e3234]:
                        - paragraph [ref=e3235]:
                          - text: 一个示例：你设置了
                          - code [ref=e3236]: CombatAlert.UseFeedbackVoice
                          - text: 和
                          - code [ref=e3237]: CombatAlert.UseEVA
                          - text: 为
                          - code [ref=e3238]: "true"
                          - text: ，
                          - code [ref=e3239]: CombatAlert.UseAttackVoice
                          - text: 为
                          - code [ref=e3240]: "false"
                          - text: 。拥有
                          - code [ref=e3241]: VoiceFeedback
                          - text: 、
                          - code [ref=e3242]: VoiceAttack
                          - text: 和
                          - code [ref=e3243]: CombatAlert.EVA
                          - text: 的单位将播放
                          - code [ref=e3244]: VoiceFeedback
                          - text: 。拥有
                          - code [ref=e3245]: VoiceAttack
                          - text: 的单位将播放
                          - code [ref=e3246]: EVA_UnitsInCombat
                          - text: 。
                - paragraph [ref=e3247]:
                  - text: 在
                  - code [ref=e3248]: rulesmd.ini
                  - text: ：
                - generic [ref=e3251]: "[AudioVisual] CombatAlert=false ; boolean CombatAlert.Default= ; boolean CombatAlert.IgnoreBuilding=true ; boolean CombatAlert.SuppressIfInScreen=true ; boolean CombatAlert.Interval=150 ; integer, game frames CombatAlert.SuppressIfAllyDamage=true ; boolean CombatAlert.MakeAVoice=true ; boolean CombatAlert.UseFeedbackVoice=true ; boolean CombatAlert.UseAttackVoice=true ; boolean CombatAlert.UseEVA=true ; boolean [SOMETECHNO] ; TechnoType CombatAlert= ; boolean CombatAlert.NotBuilding=false ; boolean CombatAlert.UseFeedbackVoice=true ; boolean CombatAlert.UseAttackVoice=true ; boolean CombatAlert.UseEVA=true ; boolean CombatAlert.EVA=EVA_UnitsInCombat ; EVA entry [SOMEWARHEAD] ; WarheadType CombatAlert.Suppress= ; boolean"
              - generic [ref=e3252]:
                - heading "重置连发索引 " [level=3] [ref=e3253]:
                  - text: 重置连发索引
                  - link "" [ref=e3254] [cursor=pointer]:
                    - /url: "#recount-burst-index"
                - list [ref=e3255]:
                  - listitem [ref=e3256]:
                    - paragraph [ref=e3257]:
                      - text: 现在你可以让单位在更换了开火武器或一段时间（取上一次发射武器的
                      - code [ref=e3258]: ROF
                      - text: 与 30 帧之间的较大值）内没有目标的情况下重置当前的连发索引。
                - paragraph [ref=e3259]:
                  - text: 在
                  - code [ref=e3260]: rulesmd.ini
                  - text: ：
                - generic [ref=e3263]: "[General] RecountBurst=false ; boolean [SOMETECHNO] ; TechnoType RecountBurst= ; boolean, default to [General] -> RecountBurst"
              - generic [ref=e3264]:
                - heading "变形后重置心控效果 " [level=3] [ref=e3265]:
                  - text: 变形后重置心控效果
                  - link "" [ref=e3266] [cursor=pointer]:
                    - /url: "#reset-mindcontrol-after-transformation"
                - list [ref=e3267]:
                  - listitem [ref=e3268]:
                    - paragraph [ref=e3269]: 单位变形完毕后其心控效果可被重置。
                    - list [ref=e3270]:
                      - listitem [ref=e3271]:
                        - paragraph [ref=e3272]:
                          - text: 如果变形后的单位所有弹头都没有
                          - code [ref=e3273]: MindControl=yes
                          - text: ，那么
                          - code [ref=e3274]: Convert.ResetMindControl=yes
                          - text: 将释放所有被心控的单位。
                      - listitem [ref=e3275]:
                        - paragraph [ref=e3276]:
                          - text: 如果变形后的单位任意弹头拥有
                          - code [ref=e3277]: MindControl=yes
                          - text: ，那么
                          - code [ref=e3278]: Convert.ResetMindControl=yes
                          - text: 将重置最大控制数量上限。
                      - listitem [ref=e3279]:
                        - paragraph [ref=e3280]:
                          - text: 如果变形后的单位所有武器都没有
                          - code [ref=e3281]: InfiniteMindControl=yes
                          - text: ，那么
                          - code [ref=e3282]: Convert.ResetMindControl=yes
                          - text: 将释放超出上限的被心控单位。
                - paragraph [ref=e3283]:
                  - text: 在
                  - code [ref=e3284]: rulesmd.ini
                  - text: ：
                - generic [ref=e3287]: "[SOMETECHNO] ; TechnoType, before conversion Convert.ResetMindControl=false ; boolean"
              - generic [ref=e3288]:
                - heading "复仇武器 " [level=3] [ref=e3289]:
                  - text: 复仇武器
                  - link "" [ref=e3290] [cursor=pointer]:
                    - /url: "#revenge-weapon"
                - paragraph [ref=e3291]:
                  - img "图像" [ref=e3292]
                  - emphasis [ref=e3293]:
                    - 'link "RA2: Reboot" [ref=e3294] [cursor=pointer]':
                      - /url: https://www.moddb.com/mods/reboot
                    - text: 中的复仇武器
                - list [ref=e3295]:
                  - listitem [ref=e3296]:
                    - paragraph [ref=e3297]:
                      - text: 类似于
                      - code [ref=e3298]: DeathWeapon
                      - text: ，它在科技类型被击杀后发射，但不同的是它将发射给造成伤害并杀死科技类型的人。如果科技类型不是由于其他科技类型造成的直接伤害而死亡，那么
                      - code [ref=e3299]: RevengeWeapon
                      - text: 将不会被发射。
                    - list [ref=e3300]:
                      - listitem [ref=e3301]:
                        - paragraph [ref=e3302]:
                          - code [ref=e3303]: RevengeWeapon.AffectsHouse
                          - text: 可用于筛选可以对哪些所属方的击杀者发射武器。
                      - listitem [ref=e3304]:
                        - paragraph [ref=e3305]:
                          - text: 也可以通过
                          - link "Attach Effect" [ref=e3306] [cursor=pointer]:
                            - /url: "#attached-effects"
                          - text: 来授予复仇武器。
                      - listitem [ref=e3307]:
                        - paragraph [ref=e3308]:
                          - text: 如果弹头
                          - code [ref=e3309]: SuppressRevengeWeapons
                          - text: 设为 true 则不会触发复仇武器。
                          - code [ref=e3310]: SuppressRevengeWeapons.Types
                          - text: 可用于列出受影响的武器类型，如果没有列出，则所有武器类型都受影响。
                - paragraph [ref=e3311]:
                  - text: 在
                  - code [ref=e3312]: rulesmd.ini
                  - text: ：
                - generic [ref=e3315]: "[SOMETECHNO] ; TechnoType RevengeWeapon= ; WeaponType RevengeWeapon.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) [SOMEWARHEAD] ; WarheadType SuppressRevengeWeapons=false ; boolean SuppressRevengeWeapons.Types= ; List of WeaponTypes"
              - generic [ref=e3316]:
                - heading "共享弹药 " [level=3] [ref=e3317]:
                  - text: 共享弹药
                  - link "" [ref=e3318] [cursor=pointer]:
                    - /url: "#shared-ammo"
                - list [ref=e3319]:
                  - listitem [ref=e3320]:
                    - paragraph [ref=e3321]:
                      - text: 拥有
                      - code [ref=e3322]: OpenTopped=yes
                      - text: 和
                      - code [ref=e3323]: Ammo.Shared=yes
                      - text: 的运输工具将像拥有
                      - code [ref=e3324]: Ammo.Shared=yes
                      - text: 的载员共享弹药。此外如果载员拥有与运输工具相同的
                      - code [ref=e3325]: Ammo.Shared.Group=<integer>
                      - text: 值则运输工具可以筛选谁将接收弹药而忽略不拥有同组值的其他载员。
                  - listitem [ref=e3326]:
                    - paragraph [ref=e3327]:
                      - text: 拥有
                      - code [ref=e3328]: Ammo.Shared.Group=-1
                      - text: 的运输工具将像任何拥有
                      - code [ref=e3329]: Ammo.Shared=yes
                      - text: 的载员共享弹药。
                  - listitem [ref=e3330]:
                    - paragraph [ref=e3331]: 运输工具必须拥有弹药并应当能够自行重装弹药。
                - paragraph [ref=e3332]:
                  - text: 在
                  - code [ref=e3333]: rulesmd.ini
                  - text: ：
                - generic [ref=e3336]: "[SOMETECHNO1] ; TechnoType, transport with OpenTopped=yes Ammo.Shared=no ; boolean Ammo.Shared.Group=-1 ; integer [SOMETECHNO2] ; TechnoType, passenger Ammo.Shared=no ; boolean Ammo.Shared.Group=-1 ; integer"
              - generic [ref=e3337]:
                - heading "单位创建时音效 " [level=3] [ref=e3338]:
                  - text: 单位创建时音效
                  - link "" [ref=e3339] [cursor=pointer]:
                    - /url: "#sound-entry-on-unit-s-creation"
                - list [ref=e3340]:
                  - listitem [ref=e3341]:
                    - paragraph [ref=e3342]:
                      - text: 当一个单位被创建时将为单位所有者播放
                      - code [ref=e3343]: VoiceCreated
                      - text: 指定的音效。
                  - listitem [ref=e3344]:
                    - paragraph [ref=e3345]:
                      - text: 如果
                      - code [ref=e3346]: IsVoiceCreatedGlobal
                      - text: 设为 true 则将全局播放
                      - code [ref=e3347]: VoiceCreated
                      - text: 而不是
                      - code [ref=e3348]: EVA_UnitReady
                      - text: 。
                - paragraph [ref=e3349]:
                  - text: 在
                  - code [ref=e3350]: rulesmd.ini
                  - text: ：
                - generic [ref=e3353]: "[AudioVisual] IsVoiceCreatedGlobal=false ; boolean [SOMETECHNO] ; TechnoType VoiceCreated= ; Sound entry"
              - generic [ref=e3354]:
                - heading "狂暴单位索敌限制 " [level=3] [ref=e3355]:
                  - text: 狂暴单位索敌限制
                  - link "" [ref=e3356] [cursor=pointer]:
                    - /url: "#targeting-limitation-for-berzerk-technos"
                - list [ref=e3357]:
                  - listitem [ref=e3358]:
                    - paragraph [ref=e3359]: 现在你可以设定狂暴单位可以对哪些所属方的目标索敌和开火。
                - paragraph [ref=e3360]:
                  - text: 在
                  - code [ref=e3361]: rulesmd.ini
                  - text: ：
                - generic [ref=e3364]: "[General] BerzerkTargeting=all ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all)"
              - generic [ref=e3365]:
                - heading "马夫逻辑 " [level=3] [ref=e3366]:
                  - text: 马夫逻辑
                  - link "" [ref=e3367] [cursor=pointer]:
                    - /url: "#tiberium-eater"
                - list [ref=e3368]:
                  - listitem [ref=e3369]:
                    - paragraph [ref=e3370]: 可以让单位实时将自身脚下的矿石直接转化为资金，就像《凯恩之怒》中 GDI 的 MARV 那样。
                  - listitem [ref=e3371]:
                    - paragraph [ref=e3372]:
                      - code [ref=e3373]: TiberiumEater.TransDelay
                      - text: 指定了两次吃矿之间间隔的帧数，0 代表逐帧。负值禁用。
                  - listitem [ref=e3374]:
                    - paragraph [ref=e3375]:
                      - code [ref=e3376]: TiberiumEater.CellN
                      - text: 用于设定吃矿位置以单元格为单位的偏移列表，
                      - code [ref=e3377]: "N"
                      - text: 为 0 始序号，数值表示相对于单位所在单元格的偏移坐标。如果不设置则只吃脚下的。
                  - listitem [ref=e3378]:
                    - paragraph [ref=e3379]:
                      - code [ref=e3380]: TiberiumEater.AmountPerCell
                      - text: 控制单次吃矿对与每个单元格而言可吃进去的矿石量上限。负值喂不饱。
                  - listitem [ref=e3381]:
                    - paragraph [ref=e3382]:
                      - text: 默认通过此方式采集的矿石价值与常规采矿相同。这可以通过
                      - code [ref=e3383]: TiberiumEater.CashMultiplier
                      - text: 加以调整。
                  - listitem [ref=e3384]:
                    - paragraph [ref=e3385]:
                      - text: 若
                      - code [ref=e3386]: TiberiumEater.Display
                      - text: 设为 true 则每次吃矿时都会飘起一个代表所得总资金量的数字。
                    - list [ref=e3387]:
                      - listitem [ref=e3388]:
                        - paragraph [ref=e3389]:
                          - code [ref=e3390]: TiberiumEater.Display.Houses
                          - text: 决定了哪些所属方能看见。
                  - listitem [ref=e3391]:
                    - paragraph [ref=e3392]:
                      - text: 每次吃矿时都会在被吃的单元格播放动画。若
                      - code [ref=e3393]: TiberiumEater.Anims
                      - text: 包含 8 个条目则根据单位当前朝向选择动画，否则随机选取。
                    - list [ref=e3394]:
                      - listitem [ref=e3395]:
                        - paragraph [ref=e3396]:
                          - text: 若设置了
                          - code [ref=e3397]: TiberiumEater.Anims.TiberiumN
                          - text: 则在吃进去对应类型（
                          - code [ref=e3398]: "N"
                          - text: =
                          - code [ref=e3399]: "[0,3]"
                          - text: ）的矿石时使用对应序列的
                          - code [ref=e3400]: TiberiumEater.Anims
                          - text: 。
                      - listitem [ref=e3401]:
                        - paragraph [ref=e3402]:
                          - text: 若
                          - code [ref=e3403]: TiberiumEater.AnimMove
                          - text: 设为 true 则动画会跟随单位移动。
                - paragraph [ref=e3404]:
                  - text: 在
                  - code [ref=e3405]: rulesmd.ini
                  - text: ：
                - generic [ref=e3408]: "[SOMETECHNO] ; InfantryType, VehicleType or AircraftType TiberiumEater.TransDelay=-1 ; integer TiberiumEater.CellN= ; X,Y - cell offset TiberiumEater.CashMultiplier=1.0 ; floating point value TiberiumEater.AmountPerCell=0 ; integer TiberiumEater.Display=true ; boolean TiberiumEater.Display.Houses=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) TiberiumEater.Anims= ; List of AnimationTypes TiberiumEater.Anims.Tiberium0= ; List of AnimationTypes TiberiumEater.Anims.Tiberium1= ; List of AnimationTypes TiberiumEater.Anims.Tiberium2= ; List of AnimationTypes TiberiumEater.Anims.Tiberium3= ; List of AnimationTypes TiberiumEater.AnimMove=true ; boolean"
              - generic [ref=e3409]:
                - heading "武器在传送时开火 " [level=3] [ref=e3410]:
                  - text: 武器在传送时开火
                  - link "" [ref=e3411] [cursor=pointer]:
                    - /url: "#weapons-fired-on-warping-in-out"
                - list [ref=e3412]:
                  - listitem [ref=e3413]:
                    - paragraph [ref=e3414]:
                      - text: 现在可以在科技类型传送来/去时发射武器。它们会与相应的 (
                      - code [ref=e3415]: WarpIn
                      - text: ／
                      - code [ref=e3416]: WarpOut
                      - text: ) 动画一起显示。
                    - list [ref=e3417]:
                      - listitem [ref=e3418]:
                        - paragraph [ref=e3419]:
                          - code [ref=e3420]: WarpInMinRangeWeapon
                          - text: 将在传送距离（以 leptons 为单位）小于
                          - code [ref=e3421]: ChronoRangeMinimum
                          - text: 时使用，无论是否设置了
                          - code [ref=e3422]: ChronoTrigger
                          - text: 。如果未设置
                          - code [ref=e3423]: WarpInMinRangeWeapon
                          - text: ，则默认为
                          - code [ref=e3424]: WarpInWeapon
                          - text: 。
                      - listitem [ref=e3425]:
                        - paragraph [ref=e3426]:
                          - text: 如果设置了
                          - code [ref=e3427]: WarpInWeapon.UseDistanceAsDamage
                          - text: 则
                          - code [ref=e3428]: WarpIn(MinRange)Weapon
                          - text: 的
                          - code [ref=e3429]: Damage
                          - text: 将被覆盖为传送所跨越的完整单元格数。
                - paragraph [ref=e3430]:
                  - text: 在
                  - code [ref=e3431]: rulesmd.ini
                  - text: ：
                - generic [ref=e3434]: "[SOMETECHNO] ; TechnoType WarpInWeapon= ; WeaponType WarpInMinRangeWeapon= ; WeaponType WarpInWeapon.UseDistanceAsDamage=false ; boolean WarpOutWeapon= ; WeaponType"
            - generic [ref=e3435]:
              - heading "地形对象 " [level=2] [ref=e3436]:
                - text: 地形对象
                - link "" [ref=e3437] [cursor=pointer]:
                  - /url: "#terrain"
              - generic [ref=e3438]:
                - heading "摧毁动画与音效 " [level=3] [ref=e3439]:
                  - text: 摧毁动画与音效
                  - link "" [ref=e3440] [cursor=pointer]:
                    - /url: "#destroy-animation-sound"
                - list [ref=e3441]:
                  - listitem [ref=e3442]:
                    - paragraph [ref=e3443]: 现在你可以指定当地形对象被摧毁时播放播放的摧毁动画与音效。如果列出了多个动画，则将随机选择一个。
                    - list [ref=e3444]:
                      - listitem [ref=e3445]:
                        - paragraph [ref=e3446]:
                          - text: 如果
                          - code [ref=e3447]: DestroyAnim
                          - text: 中列出了多个动画，则将随机选择一个。
                - paragraph [ref=e3448]:
                  - text: 在
                  - code [ref=e3449]: rulesmd.ini
                  - text: ：
                - generic [ref=e3452]: "[SOMETERRAINTYPE] ; TerrainType DestroyAnim= ; List of AnimationTypes DestroySound= ; Sound entry"
            - generic [ref=e3453]:
              - heading "载具类型 " [level=2] [ref=e3454]:
                - text: 载具类型
                - link "" [ref=e3455] [cursor=pointer]:
                  - /url: "#vehicles"
              - generic [ref=e3456]:
                - heading "两栖载具装载拓展 " [level=3] [ref=e3457]:
                  - text: 两栖载具装载拓展
                  - link "" [ref=e3458] [cursor=pointer]:
                    - /url: "#amphibious-access-vehicle"
                - list [ref=e3459]:
                  - listitem [ref=e3460]:
                    - paragraph [ref=e3461]: 现在两栖步兵或载具可以在水中进入或离开两栖运输工具。
                - paragraph [ref=e3462]:
                  - text: 在
                  - code [ref=e3463]: rulesmd.ini
                  - text: ：
                - generic [ref=e3466]: "[General] AmphibiousEnter=false ; boolean AmphibiousUnload=false ; boolean [SOMEVEHICLE] ; VehicleType, transport AmphibiousEnter= ; boolean, default to [General] -> AmphibiousEnter AmphibiousUnload= ; boolean, default to [General] -> AmphibiousUnload"
              - generic [ref=e3467]:
                - heading "基于弹药量的自动部署与禁用部署 " [level=3] [ref=e3468]:
                  - text: 基于弹药量的自动部署与禁用部署
                  - link "" [ref=e3469] [cursor=pointer]:
                    - /url: "#automatic-deploy-and-blocking-deploying-based-on-ammo"
                - list [ref=e3470]:
                  - listitem [ref=e3471]:
                    - paragraph [ref=e3472]:
                      - text: 现可为可部署（
                      - code [ref=e3473]: DeploysInto
                      - text: 、
                      - code [ref=e3474]: DeployFire
                      - text: 、
                      - code [ref=e3475]: IsSimpleDeployer
                      - text: 以及那些有乘客的）载具设定根据当前弹药量自动部署或禁用部署
                    - list [ref=e3476]:
                      - listitem [ref=e3477]:
                        - paragraph [ref=e3478]:
                          - code [ref=e3479]: Ammo.AutoDeployMinimumAmount
                          - text: "&"
                          - code [ref=e3480]: Ammo.AutoDeployMaximumAmount
                          - text: 分别设定载具自动部署所需的最低与最高弹药量阈值，负值表示禁用检查。
                      - listitem [ref=e3481]:
                        - paragraph [ref=e3482]:
                          - code [ref=e3483]: Ammo.DeployUnlockMinimumAmount
                          - text: "&"
                          - code [ref=e3484]: Ammo.DeployUnlockMaximumAmount
                          - text: 分别设定载具启用部署功能所需的最低与最高弹药量阈值，负值表示禁用检查。
                - paragraph [ref=e3485]:
                  - text: 在
                  - code [ref=e3486]: rulesmd.ini
                  - text: ：
                - generic [ref=e3489]: "[SOMEVEHICLE] ; VehicleType Ammo.AutoDeployMinimumAmount=-1 ; integer Ammo.AutoDeployMaximumAmount=-1 ; integer Ammo.DeployUnlockMinimumAmount=-1 ; integer Ammo.DeployUnlockMaximumAmount=-1 ; integer"
              - generic [ref=e3490]:
                - heading "自定义悬浮载具溺死 " [level=3] [ref=e3491]:
                  - text: 自定义悬浮载具溺死
                  - link "" [ref=e3492] [cursor=pointer]:
                    - /url: "#custom-hover-vehicles-shutdown-drowning-death"
                - list [ref=e3493]:
                  - listitem [ref=e3494]:
                    - paragraph [ref=e3495]:
                      - code [ref=e3496]: HoverDrownable
                      - text: 允许自定义悬浮载具在水域上失灵时是否会溺死。
                - paragraph [ref=e3497]:
                  - text: 在
                  - code [ref=e3498]: rulesmd.ini
                  - text: ：
                - generic [ref=e3501]: "[SOMEVEHICLE] ; VehicleType HoverDrownable=true ; boolean"
              - generic [ref=e3502]:
                - heading "载具伤残更换图像 " [level=3] [ref=e3503]:
                  - text: 载具伤残更换图像
                  - link "" [ref=e3504] [cursor=pointer]:
                    - /url: "#damaged-unit-image-changes"
                - list [ref=e3505]:
                  - listitem [ref=e3506]:
                    - paragraph [ref=e3507]:
                      - text: 现在当载具伤残（生命值低于
                      - code [ref=e3508]: "[AudioVisual] -> ConditionYellow"
                      - text: 的百分比）时可以通过
                      - code [ref=e3509]: Image.ConditionYellow
                      - text: 为载具设置不同的图像。
                  - listitem [ref=e3510]:
                    - paragraph [ref=e3511]:
                      - text: 同样的如果载具生命值低于
                      - code [ref=e3512]: "[AudioVisual] -> ConditionRed"
                      - text: 的百分比那么将会使用
                      - code [ref=e3513]: Image.ConditionRed
                      - text: 作为图像。
                  - listitem [ref=e3514]:
                    - paragraph [ref=e3515]:
                      - text: 类似于 Ares 的
                      - code [ref=e3516]: WaterImage
                      - text: ，可以通过设置
                      - code [ref=e3517]: WaterImage.ConditionYellow
                      - text: 和
                      - code [ref=e3518]: WaterImage.ConditionRed
                      - text: 的载具类型来在水上应用这一效果。
                - paragraph [ref=e3519]:
                  - text: 在
                  - code [ref=e3520]: rulesmd.ini
                  - text: ：
                - generic [ref=e3523]: "[SOMEVEHICLE] ; VehicleType Image.ConditionYellow= ; VehicleType entry Image.ConditionRed= ; VehicleType entry WaterImage.ConditionYellow= ; VehicleType entry WaterImage.ConditionRed= ; VehicleType entry"
                - generic [ref=e3524]:
                  - paragraph [ref=e3525]:  警告
                  - paragraph [ref=e3526]:
                    - text: 注意这些被使用的载具必须在
                    - code [ref=e3527]: "[VehicleTypes]"
                    - text: 下注册并且在常规／伤残状态下使用相同的图像类型（Shape／Voxel）。
              - generic [ref=e3528]:
                - heading "独立的 Shape 载具炮塔文件 " [level=3] [ref=e3529]:
                  - text: 独立的 Shape 载具炮塔文件
                  - link "" [ref=e3530] [cursor=pointer]:
                    - /url: "#independent-shp-vehicle-turret-files"
                - list [ref=e3531]:
                  - listitem [ref=e3532]:
                    - paragraph [ref=e3533]:
                      - text: Shape 有炮塔载具支持使用
                      - code [ref=e3534]: "*tur.shp"
                      - text: 文件。。
                    - list [ref=e3535]:
                      - listitem [ref=e3536]:
                        - paragraph [ref=e3537]:
                          - text: 若 Shape 载具在绘制炮塔时存在名为
                          - code [ref=e3538]: "*tur.shp"
                          - text: 的 Shape 文件，则炮塔从该文件的第 0 帧开始；否则它仍然开始自 Shape 载具本体图像的第
                          - code [ref=e3539]: WalkFrames * Facings
                          - text: 帧（0 始序列）。
                      - listitem [ref=e3540]:
                        - paragraph [ref=e3541]: 如果你想要将现有 Shape 文件拆分成两部分，那么只需要从原文件中分离作为炮塔图像的 32 帧及其对应的 32 帧影子图像，再将其合并成一个新的 Shape 文件即可。
                      - listitem [ref=e3542]:
                        - paragraph [ref=e3543]: 当需要更改载具所使用的炮塔时，将其分为两个文件有助于简化操作。
              - generic [ref=e3544]:
                - heading "Jumpjet 在移动时倾斜 " [level=3] [ref=e3545]:
                  - text: Jumpjet 在移动时倾斜
                  - link "" [ref=e3546] [cursor=pointer]:
                    - /url: "#jumpjet-tilts-while-moving"
                - paragraph [ref=e3547]:
                  - img "图像" [ref=e3548]
                  - emphasis [ref=e3549]:
                    - link "冲击计划：征服" [ref=e3550] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/project-rush-conquer
                    - text: 中的 Jumpjet 前倾
                - list [ref=e3551]:
                  - listitem [ref=e3552]:
                    - paragraph [ref=e3553]:
                      - text: 现在你可以通过将
                      - code [ref=e3554]: JumpjetTilt
                      - text: 设为 true 来使 Jumpjet 单位在向前移动时前倾以及在转向时侧倾。
                  - listitem [ref=e3555]:
                    - paragraph [ref=e3556]: 最大倾斜角度不会超过 90 度。
                    - list [ref=e3557]:
                      - listitem [ref=e3558]:
                        - paragraph [ref=e3559]: 向前倾斜的幅度与当前速度和加速度相关。它们会相加，这里给出两个用于细节调整的系数。
                      - listitem [ref=e3560]:
                        - paragraph [ref=e3561]: 侧向倾斜的幅度与当前速度和旋转角度相关。它们会相乘，同样给出两个用于细节调整的系数。
                - paragraph [ref=e3562]:
                  - text: 在
                  - code [ref=e3563]: rulesmd.ini
                  - text: ：
                - generic [ref=e3566]: "[SOMEVEHICLE] ; VehicleType, with Locomotor=Jumpjet JumpjetTilt=false ; boolean JumpjetTilt.ForwardAccelFactor=1.0 ; floating point value JumpjetTilt.ForwardSpeedFactor=1.0 ; floating point value JumpjetTilt.SidewaysRotationFactor=1.0 ; floating point value JumpjetTilt.SidewaysSpeedFactor=1.0 ; floating point value"
              - generic [ref=e3567]:
                - heading "炮塔响应 " [level=3] [ref=e3568]:
                  - text: 炮塔响应
                  - link "" [ref=e3569] [cursor=pointer]:
                    - /url: "#turret-response"
                - list [ref=e3570]:
                  - listitem [ref=e3571]:
                    - paragraph [ref=e3572]: 你可以自定义当载具丢失目标时炮塔方向是否回正（与车身对齐）
                    - list [ref=e3573]:
                      - listitem [ref=e3574]:
                        - paragraph [ref=e3575]:
                          - text: 若
                          - code [ref=e3576]: Speed=0
                          - text: 或单位由于
                          - code [ref=e3577]: MovementRestrictedTo
                          - text: 导致无法移动，则默认 no；否则默认 yes。
                - paragraph [ref=e3578]:
                  - text: 在
                  - code [ref=e3579]: rulesmd.ini
                  - text: ：
                - generic [ref=e3582]: "[SOMEVEHICLE] ; VehicleType TurretResponse= ; boolean"
              - generic [ref=e3583]:
                - heading "无炮塔 Shape 载具开火前摇 " [level=3] [ref=e3584]:
                  - text: 无炮塔 Shape 载具开火前摇
                  - link "" [ref=e3585] [cursor=pointer]:
                    - /url: "#turretless-shape-vehicle-fireup"
                - paragraph [ref=e3586]:
                  - img "图像" [ref=e3587]
                  - emphasis [ref=e3588]:
                    - text: "@"
                    - link "暴风硫" [ref=e3589] [cursor=pointer]:
                      - /url: https://space.bilibili.com/11638715/lists/5358986
                    - text: 在
                    - strong [ref=e3590]: 零点界限
                    - text: 中为 Shape 载具类型的机甲单位使用开火前摇效果
                - list [ref=e3591]:
                  - listitem [ref=e3592]:
                    - paragraph [ref=e3593]:
                      - text: 现在
                      - code [ref=e3594]: Voxel=no
                      - text: 的无炮塔载具已经支持
                      - code [ref=e3595]: FireUp
                      - text: 。
                  - listitem [ref=e3596]:
                    - paragraph [ref=e3597]:
                      - code [ref=e3598]: FireUp.ResetInRetarget
                      - text: 决定当前载具目标改变时其前摇是否重置。失去目标强制重置。
                - paragraph [ref=e3599]:
                  - text: 在
                  - code [ref=e3600]: artmd.ini
                  - text: ：
                - generic [ref=e3603]: "[SOMEVEHICLE] ; VehicleType FireUp= ; integer FireUp.ResetInRetarget=true ; boolean"
            - generic [ref=e3604]:
              - heading "弹头 " [level=2] [ref=e3605]:
                - text: 弹头
                - link "" [ref=e3606] [cursor=pointer]:
                  - /url: "#warheads"
              - generic [ref=e3607]:
                - paragraph [ref=e3608]:  提示
                - paragraph [ref=e3609]: 所有新增的弹头效果
                - list [ref=e3610]:
                  - listitem [ref=e3611]:
                    - paragraph [ref=e3612]:
                      - text: 可在适用的情况下与
                      - code [ref=e3613]: CellSpread
                      - text: 和 Ares 的通用弹头超级武器一起使用。
                  - listitem [ref=e3614]:
                    - paragraph [ref=e3615]:
                      - text: 不能与 Ares 的
                      - code [ref=e3616]: MindControl.Permanent=yes
                      - text: 共同使用。
                  - listitem [ref=e3617]:
                    - paragraph [ref=e3618]:
                      - text: 在适用的情况下除非
                      - code [ref=e3619]: EffectsRequireVerses
                      - text: 设为
                      - code [ref=e3620]: "false"
                      - text: 否则尊重
                      - code [ref=e3621]: Verses
                      - text: 。
                  - listitem [ref=e3622]:
                    - paragraph [ref=e3623]:
                      - text: 如果目标拥有一个激活的
                      - link "护盾" [ref=e3624] [cursor=pointer]:
                        - /url: "#shields"
                      - text: ，那么它的护甲类型将被使用，除非弹头可以穿透护盾。
              - generic [ref=e3625]:
                - heading "允许将建筑所受的 AOE 伤害合而为一 " [level=3] [ref=e3626]:
                  - text: 允许将建筑所受的 AOE 伤害合而为一
                  - link "" [ref=e3627] [cursor=pointer]:
                    - /url: "#allow-merging-aoe-damage-to-buildings-into-one"
                - list [ref=e3628]:
                  - listitem [ref=e3629]:
                    - paragraph [ref=e3630]:
                      - text: 弹头现在可以在
                      - code [ref=e3631]: MergeBuildingDamage
                      - text: 设为 true 时通过合并 AOE 伤害来仅对建筑造成单次杀伤，其默认同
                      - code [ref=e3632]: "[CombatDamage] -> MergeBuildingDamage"
                      - text: 。
                - paragraph [ref=e3633]:
                  - text: 在
                  - code [ref=e3634]: rulesmd.ini
                  - text: ：
                - generic [ref=e3637]: "[CombatDamage] MergeBuildingDamage=false ; boolean [SOMEWARHEAD] ; WarheadType MergeBuildingDamage= ; boolean"
                - generic [ref=e3638]:
                  - paragraph [ref=e3639]:  备注
                  - list [ref=e3640]:
                    - listitem [ref=e3641]:
                      - paragraph [ref=e3642]:
                        - text: 这是与
                        - code [ref=e3643]: CellSpread.MaxAffect
                        - text: 不同的机制。
                    - listitem [ref=e3644]:
                      - paragraph [ref=e3645]: 由于原本的部分杀伤被取整消去，开启本功能后所造成的杀伤可能略有增大。
              - generic [ref=e3646]:
                - heading "解除心控 " [level=3] [ref=e3647]:
                  - text: 解除心控
                  - link "" [ref=e3648] [cursor=pointer]:
                    - /url: "#break-mind-control-on-impact"
                - paragraph [ref=e3649]:
                  - img "图像" [ref=e3650]
                  - emphasis [ref=e3651]:
                    - 'link "RA2: Reboot" [ref=e3652] [cursor=pointer]':
                      - /url: https://www.moddb.com/mods/reboot
                    - text: 中的心控解除弹头
                - list [ref=e3653]:
                  - listitem [ref=e3654]:
                    - paragraph [ref=e3655]: 弹头现在可以解除心灵控制（不适用于永久心控的对象）。
                - paragraph [ref=e3656]:
                  - text: 在
                  - code [ref=e3657]: rulesmd.ini
                  - text: ：
                - generic [ref=e3660]: "[SOMEWARHEAD] ; WarheadType RemoveMindControl=false ; boolean"
              - generic [ref=e3661]:
                - heading "弹头范围增强 " [level=3] [ref=e3662]:
                  - text: 弹头范围增强
                  - link "" [ref=e3663] [cursor=pointer]:
                    - /url: "#cellspread-enhancement"
                - list [ref=e3664]:
                  - listitem [ref=e3665]:
                    - paragraph [ref=e3666]:
                      - text: 在原版中，范围伤害的杀伤区域是一个球形。某些例如你希望制作一个给目标区域上 Buff 的弹头超武的时候空中单位的受益范围总是比地面单位更小。现在你可以使用新语句
                      - code [ref=e3667]: CellSpread.Cylinder
                      - text: 来解决这一问题。
                  - listitem [ref=e3668]:
                    - paragraph [ref=e3669]:
                      - code [ref=e3670]: AffectsAir
                      - text: 允许你制作一个仅可杀伤 208 高度以上单位的弹头。
                  - listitem [ref=e3671]:
                    - paragraph [ref=e3672]:
                      - code [ref=e3673]: AffectsGround
                      - text: 允许你制作一个仅可杀伤 208 高度以下单位的弹头。
                - paragraph [ref=e3674]:
                  - text: 在
                  - code [ref=e3675]: rulesmd.ini
                  - text: ：
                - generic [ref=e3678]: "[SOMEWARHEAD] ; WarheadType CellSpread.Cylinder=false ; boolean AffectsAir=true ; boolean AffectsGround=true ; boolean"
                - generic [ref=e3679]:
                  - paragraph [ref=e3680]:  备注
                  - list [ref=e3681]:
                    - listitem [ref=e3682]:
                      - paragraph [ref=e3683]:
                        - text: 这些功能不会覆盖 Ares 语句
                        - code [ref=e3684]: DamageAirThreshold
                        - text: 的效果：除非同时设置
                        - code [ref=e3685]: DamageAirThreshold=-1
                        - text: ，否则一个在地面引爆的弹头即使拥有
                        - code [ref=e3686]: CellSpread.Cylinder
                        - text: 也无法作用于空中单位。
                    - listitem [ref=e3687]:
                      - paragraph [ref=e3688]: 这些功能同样作用于相关的 Phobos 弹头效果。由于技术限制，这不包括 EMP 和 铁幕等 Ares 弹头效果
              - generic [ref=e3689]:
                - heading "暴击 " [level=3] [ref=e3690]:
                  - text: 暴击
                  - link "" [ref=e3691] [cursor=pointer]:
                    - /url: "#chance-based-extra-damage-or-warhead-detonation-critical-hits"
                - list [ref=e3692]:
                  - listitem [ref=e3693]:
                    - paragraph [ref=e3694]: 现在弹头可以基于概率额外造成暴击伤害或弹头爆炸，可以自定义暴击的概率、伤害、影响目标、受影响目标生命值阈值和暴击动画。
                    - list [ref=e3695]:
                      - listitem [ref=e3696]:
                        - paragraph [ref=e3697]:
                          - code [ref=e3698]: Crit.Chance
                          - text: 决定暴击发生的概率。默认情况下这在弹头爆炸时检查一次，每个受影响的目标都可能受到暴击。如果设置了
                          - code [ref=e3699]: Crit.ApplyChancePerTarget
                          - text: ，那么每个目标是否成功进行暴击的概率将单独计算。
                      - listitem [ref=e3700]:
                        - paragraph [ref=e3701]:
                          - code [ref=e3702]: Crit.ExtraDamage
                          - text: 决定暴击造成的额外伤害，如果设置了
                          - code [ref=e3703]: Crit.Warhead
                          - text: ，那么伤害将用于在每个受影响的目标上引爆指定的弹头，否则伤害将基于当前弹头的
                          - code [ref=e3704]: Verses
                          - text: 设置直接造成伤害。
                      - listitem [ref=e3705]:
                        - paragraph [ref=e3706]:
                          - code [ref=e3707]: Crit.ExtraDamage.ApplyFirepowerMult
                          - text: 决定暴击造成的额外伤害是否受益于科技类型所拥有的火力加成。
                      - listitem [ref=e3708]:
                        - paragraph [ref=e3709]:
                          - code [ref=e3710]: Crit.Warhead
                          - text: 可用于设置一个替代当前弹头引爆的弹头。
                      - listitem [ref=e3711]:
                        - paragraph [ref=e3712]:
                          - code [ref=e3713]: Crit.Warhead.FullDetonation
                          - text: 控制弹头是否在目标上完全引爆（作为虚拟武器的一部分）或者只能对所在区域造成杀伤并应用 Phobos 的弹头效果。
                      - listitem [ref=e3714]:
                        - paragraph [ref=e3715]:
                          - code [ref=e3716]: Crit.AffectsTarget
                          - text: 可用于自定义此弹头可暴击的目标类型。暴击不能影响空置单元格或仅包含地形对象和覆盖物等的单元格。
                      - listitem [ref=e3717]:
                        - paragraph [ref=e3718]:
                          - code [ref=e3719]: Crit.AffectsHouse
                          - text: 可用于自定义此弹头可暴击的目标所属。
                      - listitem [ref=e3720]:
                        - paragraph [ref=e3721]:
                          - code [ref=e3722]: Crit.AffectsBelowPercent
                          - text: 和
                          - code [ref=e3723]: Crit.AffectsAbovePercent
                          - text: 用于设置可被暴击影响的单位其当前血量所占百分比必须高于和／或低于／等于的限制。若目标血量为 0 则跳过该检查。
                      - listitem [ref=e3724]:
                        - paragraph [ref=e3725]:
                          - code [ref=e3726]: Crit.AnimList
                          - text: 可用于设置一个当弹头对至少一个目标造成暴击时替代弹头
                          - code [ref=e3727]: AnimList
                          - text: 使用的动画列表。如果设置了
                          - code [ref=e3728]: Crit.AnimList.PickRandom
                          - text: （默认为
                          - code [ref=e3729]: AnimList.PickRandom
                          - text: ），则从列表中随机选择一个动画。如果设置了
                          - code [ref=e3730]: Crit.AnimList.CreateAll
                          - text: （默认为
                          - code [ref=e3731]: AnimList.CreateAll
                          - text: ），则创建列表中的所有动画。
                        - list [ref=e3732]:
                          - listitem [ref=e3733]:
                            - paragraph [ref=e3734]:
                              - code [ref=e3735]: Crit.AnimOnAffectedTargets
                              - text: 如果设置则使
                              - code [ref=e3736]: Crit.AnimList
                              - text: 中的动画在每个受影响的目标上播放，
                              - emphasis [ref=e3737]: 此外
                              - text: 还会正常播放弹头
                              - code [ref=e3738]: AnimList
                              - text: 而不是覆盖之。注意因为这些动画与
                              - code [ref=e3739]: AnimList
                              - text: 独立所以，
                              - code [ref=e3740]: Crit.AnimList.PickRandom
                              - text: 和
                              - code [ref=e3741]: Crit.AnimList.CreateAll
                              - text: 将不会默认为
                              - code [ref=e3742]: AnimList
                              - text: 对应项的值，需要手动设置。
                      - listitem [ref=e3743]:
                        - paragraph [ref=e3744]:
                          - code [ref=e3745]: Crit.ActiveChanceAnims
                          - text: 可用于设置当前弹头有几率造成暴击时始终显示在弹头爆炸坐标处的动画。列出多个动画则随机选择其一。
                      - listitem [ref=e3746]:
                        - paragraph [ref=e3747]:
                          - code [ref=e3748]: Crit.SuppressWhenIntercepted
                          - text: 如果设置则禁用弹头在被
                          - link "抛射体拦截" [ref=e3749] [cursor=pointer]:
                            - /url: "#projectile-interception-logic"
                          - text: 而引爆时造成暴击。
                      - listitem [ref=e3750]:
                        - paragraph [ref=e3751]:
                          - code [ref=e3752]: ImmuneToCrit
                          - text: 可以设置在科技类型和护盾类型上以使它们免疫暴击。
                - paragraph [ref=e3753]:
                  - text: 在
                  - code [ref=e3754]: rulesmd.ini
                  - text: ：
                - generic [ref=e3757]: "[SOMEWARHEAD] ; WarheadType Crit.Chance=0.0 ; floating point value, percents or absolute (0.0-1.0) Crit.ApplyChancePerTarget=false ; boolean Crit.ExtraDamage=0 ; integer Crit.ExtraDamage.ApplyFirepowerMult=false ; boolean Crit.Warhead= ; WarheadType Crit.Warhead.FullDetonation=true ; boolean Crit.AffectsTarget=all ; List of Affected Target Enumeration (none|land|water|infantry|units|buildings|all) Crit.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) Crit.AffectsBelowPercent=1.0 ; floating point value, percents or absolute (0.0-1.0) Crit.AffectsAbovePercent=0.0 ; floating point value, percents or absolute (0.0-1.0) Crit.AnimList= ; List of AnimationTypes Crit.AnimList.PickRandom= ; boolean Crit.AnimList.CreateAll= ; boolean Crit.ActiveChanceAnims= ; List of AnimationTypes Crit.AnimOnAffectedTargets=false ; boolean Crit.SuppressWhenIntercepted=false ; boolean [SOMETECHNO] ; TechnoType ImmuneToCrit=false ; boolean"
                - generic [ref=e3758]:
                  - paragraph [ref=e3759]:  警告
                  - paragraph [ref=e3760]:
                    - text: 如果你将
                    - code [ref=e3761]: Crit.Warhead
                    - text: 设为定义暴击的弹头或者创建一个最终回到第一个弹头的循环那么游戏可能会陷入循环并随后卡死或崩溃。
              - generic [ref=e3762]:
                - heading "单位转换弹头 " [level=3] [ref=e3763]:
                  - text: 单位转换弹头
                  - link "" [ref=e3764] [cursor=pointer]:
                    - /url: "#convert-technotype-on-impact"
                - paragraph [ref=e3765]:
                  - img "图像" [ref=e3766]
                  - emphasis [ref=e3767]:
                    - link "NanodaSupercalifragilisticexpialidocious" [ref=e3768] [cursor=pointer]:
                      - /url: https://www.bilibili.com/opus/896077937747427433
                    - text: 中的载具版基因突变
                - list [ref=e3769]:
                  - listitem [ref=e3770]:
                    - paragraph [ref=e3771]: 现在弹头可以将受影响单位的科技类型更改为同大类的其他科技类型（步兵到步兵，车辆到车辆，战机到战机）。
                    - list [ref=e3772]:
                      - listitem [ref=e3773]:
                        - paragraph [ref=e3774]:
                          - code [ref=e3775]: ConvertN.From
                          - text: （此处 N 为 0, 1, 2…）指定哪些科技类型可用于转换。此条目可以列出许多类型以一次全部转换。当没有包含任何类型时将影响所有有效目标。
                      - listitem [ref=e3776]:
                        - paragraph [ref=e3777]:
                          - code [ref=e3778]: ConvertN.To
                          - text: 指定转换后的科技类型。
                      - listitem [ref=e3779]:
                        - paragraph [ref=e3780]:
                          - code [ref=e3781]: ConvertN.AffectsHouse
                          - text: 指定哪些所属方的单位可以被转换。
                      - listitem [ref=e3782]:
                        - paragraph [ref=e3783]:
                          - text: 若只指定一组转换则
                          - code [ref=e3784]: Convert.From
                          - text: 、
                          - code [ref=e3785]: Convert.To
                          - text: 和
                          - code [ref=e3786]: Convert.AffectsHouse
                          - text: （不带序号）相当于
                          - code [ref=e3787]: Convert0.From
                          - text: 、
                          - code [ref=e3788]: Convert0.To
                          - text: 和
                          - code [ref=e3789]: Convert0.AffectsHouse
                          - text: 的别称。
                - paragraph [ref=e3790]:
                  - text: 例如这个弹头可以将所有被影响的己方和友方
                  - code [ref=e3791]: SOLDIERA
                  - text: 和
                  - code [ref=e3792]: SOLDIERB
                  - text: 转换为
                  - code [ref=e3793]: NEWSOLDIER
                  - text: ：
                - generic [ref=e3796]: "[ExampleWH] Convert.From=SOLDIERA,SOLDIERB Convert.To=NEWSOLDIER Convert.AffectsHouse=team"
                - paragraph [ref=e3797]:
                  - text: 在
                  - code [ref=e3798]: rulesmd.ini
                  - text: ：
                - generic [ref=e3801]: "[SOMEWARHEAD] ; WarheadType ConvertN.From= ; List of TechnoTypes ConvertN.To= ; TechnoType ConvertN.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) ; where N = 0, 1, 2, ... ; or Convert.From= ; List of TechnoTypes Convert.To= ; TechnoType Convert.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all)"
                - generic [ref=e3802]:
                  - paragraph [ref=e3803]:  警告
                  - paragraph [ref=e3804]:
                    - text: 此功能与
                    - link "Ares 的单位转换" [ref=e3805] [cursor=pointer]:
                      - /url: https://ares-developers.github.io/Ares-docs/new/typeconversion.html
                    - text: 存在同样的限制。此功能不支持建筑类型。
                - generic [ref=e3806]:
                  - paragraph [ref=e3807]:  警告
                  - paragraph [ref=e3808]: 此功能需要 3.0 及以上版本的 Ares！如果未检测到 Ares 3.0+，单位的某些属性可能不会被更新。
              - generic [ref=e3809]:
                - heading "自定义心灵控制动画 " [level=3] [ref=e3810]:
                  - text: 自定义心灵控制动画
                  - link "" [ref=e3811] [cursor=pointer]:
                    - /url: "#custom-mind-control-animation"
                - list [ref=e3812]:
                  - listitem [ref=e3813]:
                    - paragraph [ref=e3814]:
                      - text: 允许弹头播放自定义的
                      - code [ref=e3815]: MindControl.Anim
                      - text: 。
                - paragraph [ref=e3816]:
                  - text: 在
                  - code [ref=e3817]: rulesmd.ini
                  - text: ：
                - generic [ref=e3820]: "[SOMEWARHEAD] ; WarheadType MindControl.Anim= ; Animation, defaults to [CombatDamage] -> ControlledAnimationType"
              - generic [ref=e3821]:
                - heading "自定义弹头水花 " [level=3] [ref=e3822]:
                  - text: 自定义弹头水花
                  - link "" [ref=e3823] [cursor=pointer]:
                    - /url: "#custom-splashlist-on-warheads"
                - paragraph [ref=e3824]:
                  - img "图像" [ref=e3825]
                - list [ref=e3826]:
                  - listitem [ref=e3827]:
                    - paragraph [ref=e3828]:
                      - text: 允许弹头自定义其水花动画，在此参阅原版的
                      - link "Conventional" [ref=e3829] [cursor=pointer]:
                        - /url: https://www.modenc.renegadeprojects.com/Conventional
                      - text: 系统。
                      - code [ref=e3830]: SplashList.PickRandom
                      - text: 可设置为
                      - code [ref=e3831]: "true"
                      - text: 以从列表中随机选择一个动画。
                - paragraph [ref=e3832]:
                  - text: 在
                  - code [ref=e3833]: rulesmd.ini
                  - text: ：
                - generic [ref=e3836]: "[SOMEWARHEAD] ; WarheadType SplashList= ; List of AnimationTypes, default to [CombatDamage] -> SplashList SplashList.PickRandom=false ; boolean"
              - generic [ref=e3837]:
                - heading "伤害修正比 " [level=3] [ref=e3838]:
                  - text: 伤害修正比
                  - link "" [ref=e3839] [cursor=pointer]:
                    - /url: "#damage-multipliers"
                - list [ref=e3840]:
                  - listitem [ref=e3841]:
                    - paragraph [ref=e3842]: 现在弹头可以定义对己方所属、友方所属、敌方所属的额外伤害倍率。
                    - list [ref=e3843]:
                      - listitem [ref=e3844]:
                        - paragraph [ref=e3845]:
                          - code [ref=e3846]: DamageOwnerMultiplier.NotAffectsEnemies
                          - text: 和
                          - code [ref=e3847]: DamageAlliesMultiplier.NotAffectsEnemies
                          - text: 用于设定弹头
                          - code [ref=e3848]: AffectsEnemies=false
                          - text: 时的默认值。
                      - listitem [ref=e3849]:
                        - paragraph [ref=e3850]:
                          - code [ref=e3851]: DamageOwnerMultiplier.Berzerk
                          - text: 、
                          - code [ref=e3852]: DamageAlliesMultiplier.Berzerk
                          - text: 和
                          - code [ref=e3853]: DamageEnemiesMultiplier.Berzerk
                          - text: 在单位处于狂暴状态时被使用。
                  - listitem [ref=e3854]:
                    - paragraph [ref=e3855]:
                      - text: 一个基于开火者或目标剩余血量的额外伤害倍率将被纳入总倍率计算。具体而言：伤害倍率将先增加
                      - code [ref=e3856]: (开火者剩余血量比 * DamageSourceHealthMultiplier)
                      - text: ，再增加
                      - code [ref=e3857]: (目标剩余血量比 * DamageTargetHealthMultiplier)
                      - text: 。
                  - listitem [ref=e3858]:
                    - paragraph [ref=e3859]:
                      - text: 这些修正不会影响无视防御的伤害，例如
                      - code [ref=e3860]: Suicide
                      - text: 等。
                - paragraph [ref=e3861]:
                  - text: 在
                  - code [ref=e3862]: rulesmd.ini
                  - text: ：
                - generic [ref=e3865]: "[CombatDamage] DamageOwnerMultiplier=1.0 ; floating point value DamageAlliesMultiplier=1.0 ; floating point value DamageEnemiesMultiplier=1.0 ; floating point value DamageOwnerMultiplier.NotAffectsEnemies= ; floating point value, default to [CombatDamage] -> DamageOwnerMultiplier DamageAlliesMultiplier.NotAffectsEnemies= ; floating point value, default to [CombatDamage] -> DamageAlliesMultiplier DamageOwnerMultiplier.Berzerk= ; floating point value, default to [CombatDamage] -> DamageOwnerMultiplier DamageAlliesMultiplier.Berzerk= ; floating point value, default to [CombatDamage] -> DamageAlliesMultiplier DamageEnemiesMultiplier.Berzerk= ; floating point value, default to [CombatDamage] -> DamageEnemiesMultiplier [SOMEWARHEAD] ; WarheadType DamageOwnerMultiplier= ; floating point value, default to [CombatDamage] -> DamageOwnerMultiplier or [CombatDamage] -> DamageOwnerMultiplier.NotAffectsEnemies, depending on AffectsEnemies DamageAlliesMultiplier= ; floating point value, default to [CombatDamage] -> DamageAlliesMultiplier or [CombatDamage] -> DamageAlliesMultiplier.NotAffectsEnemies, depending on AffectsEnemies DamageEnemiesMultiplier= ; floating point value, default to [CombatDamage] -> DamageEnemiesMultiplier DamageOwnerMultiplier.Berzerk= ; floating point value, default to [CombatDamage] -> DamageOwnerMultiplier.Berzerk DamageAlliesMultiplier.Berzerk= ; floating point value, default to [CombatDamage] -> DamageAlliesMultiplier.Berzerk DamageEnemiesMultiplier.Berzerk= ; floating point value, default to [CombatDamage] -> DamageEnemiesMultiplier.Berzerk DamageSourceHealthMultiplier=0.0 ; floating point value DamageTargetHealthMultiplier=0.0 ; floating point value"
                - generic [ref=e3866]:
                  - paragraph [ref=e3867]:  备注
                  - paragraph [ref=e3868]:
                    - code [ref=e3869]: DamageAlliesMultiplier
                    - text: 不会像旧有的
                    - code [ref=e3870]: AffectsAllies
                    - text: 那样作用于友方单位的同时还带上己方单位。
              - generic [ref=e3871]:
                - heading "杀伤地下单位 " [level=3] [ref=e3872]:
                  - text: 杀伤地下单位
                  - link "" [ref=e3873] [cursor=pointer]:
                    - /url: "#damage-technos-underground"
                - list [ref=e3874]:
                  - listitem [ref=e3875]:
                    - paragraph [ref=e3876]: 现在你可以让弹头对处于地下的单位造成伤害！
                    - list [ref=e3877]:
                      - listitem [ref=e3878]:
                        - paragraph [ref=e3879]:
                          - text: 若需允许武器瞄准地下单位，你需要在抛射体上将
                          - link "AU" [ref=e3880] [cursor=pointer]:
                            - /url: "#attack-technos-underground"
                          - text: 设为
                          - code [ref=e3881]: "yes"
                          - text: 。
                  - listitem [ref=e3882]:
                    - paragraph [ref=e3883]: 注意如果弹头在地下引爆其动画效果可能显示异常。
                    - list [ref=e3884]:
                      - listitem [ref=e3885]:
                        - paragraph [ref=e3886]:
                          - text: 你可以使用
                          - code [ref=e3887]: "[WarheadType] -> PlayAnimUnderground=false"
                          - text: 来阻止弹头在地下引爆时播放动画。
                      - listitem [ref=e3888]:
                        - paragraph [ref=e3889]:
                          - text: 你也可以使用
                          - code [ref=e3890]: "[WarheadType] -> PlayAnimAboveSurface=true"
                          - text: 来使弹头在地下引爆时在其正上方地表处播放弹头动画。
                - paragraph [ref=e3891]:
                  - text: 在
                  - code [ref=e3892]: rulesmd.ini
                  - text: ：
                - generic [ref=e3895]: "[SOMEWARHEAD] ; WarheadType AffectsUnderground=false ; boolean PlayAnimUnderground=true ; boolean PlayAnimAboveSurface=false ; boolean"
              - generic [ref=e3896]:
                - heading "全图弹头 " [level=3] [ref=e3897]:
                  - text: 全图弹头
                  - link "" [ref=e3898] [cursor=pointer]:
                    - /url: "#detonate-warhead-on-all-objects-on-map"
                - list [ref=e3899]:
                  - listitem [ref=e3900]:
                    - paragraph [ref=e3901]:
                      - text: 设置
                      - code [ref=e3902]: DetonateOnAllMapObjects
                      - text: 为 true 允许由抛射体引爆的弹头（例如这不包括动画直接挂
                      - code [ref=e3903]: Warhead
                      - text: 和 Ares 通用弹头超武所引爆的弹头，但包括
                      - code [ref=e3904]: Crit.Warhead
                      - text: 和动画
                      - code [ref=e3905]: Weapon
                      - text: （最好带有
                      - code [ref=e3906]: Damage.DealtByInvoker=true
                      - text: 以避免部分特殊情况）所引爆的弹头）以及随之在后的任何
                      - code [ref=e3907]: AirburstWeapon/ShrapnelWeapon
                      - text: ，无论其实际目标如何，都可以对当前地图上所有存在且没死的对象进行引爆，并可以对目标进行筛选。注意，这是在弹头引爆之前的瞬间完成的，因此
                      - code [ref=e3908]: PreImpactAnim
                      - text: （Ares 功能）可以显示。
                    - list [ref=e3909]:
                      - listitem [ref=e3910]:
                        - paragraph [ref=e3911]:
                          - code [ref=e3912]: DetonateOnAllMapObjects.Full
                          - text: 自定义弹头是否在目标上完全引爆（作为虚拟武器的一部分）或者只能对所在区域造成杀伤并应用 Phobos 的弹头效果。
                      - listitem [ref=e3913]:
                        - paragraph [ref=e3914]:
                          - code [ref=e3915]: DetonateOnAllMapObjects.AffectsTarget
                          - text: 用于在非
                          - code [ref=e3916]: none
                          - text: 时筛选哪些类型的目标（科技类型）可被视为有效。仅
                          - code [ref=e3917]: none
                          - text: 、
                          - code [ref=e3918]: all
                          - text: 、
                          - code [ref=e3919]: aircraft
                          - text: 、
                          - code [ref=e3920]: buildings
                          - text: 、
                          - code [ref=e3921]: infantry
                          - text: 和
                          - code [ref=e3922]: units
                          - text: 是有效值。默认为
                          - code [ref=e3923]: none
                          - text: ，因为包含所有对象类型可能会影响性能。
                      - listitem [ref=e3924]:
                        - paragraph [ref=e3925]:
                          - code [ref=e3926]: DetonateOnAllMapObjects.AffectsHouse
                          - text: 用于在非
                          - code [ref=e3927]: none
                          - text: 时筛选哪些所属方的目标可以被视为有效。仅适用于发射弹头的所属方已知的情况。默认为
                          - code [ref=e3928]: none
                          - text: ，因为包含所有所属方可能会影响性能。
                      - listitem [ref=e3929]:
                        - paragraph [ref=e3930]:
                          - code [ref=e3931]: DetonateOnAllMapObjects.AffectTypes
                          - text: 可用于列出特定的科技类型作为有效目标。如果列出了任何有效科技类型，则只有匹配的对象才会被作为目标。注意
                          - code [ref=e3932]: DetonateOnAllMapObjects.AffectsTarget
                          - text: 和
                          - code [ref=e3933]: DetonateOnAllMapObjects.AffectsHouse
                          - text: 的优先级高于此设置。
                      - listitem [ref=e3934]:
                        - paragraph [ref=e3935]:
                          - code [ref=e3936]: DetonateOnAllMapObjects.IgnoreTypes
                          - text: 可用于列出特定的科技类型不得作为目标。
                      - listitem [ref=e3937]:
                        - paragraph [ref=e3938]:
                          - code [ref=e3939]: DetonateOnAllMapObjects.RequireVerses
                          - text: 如果设为 true 则只考虑弹头对其护甲类型具有非零
                          - code [ref=e3940]: Verses
                          - text: 值的目标为有效。对于具有激活状态护盾的目标除非弹头拥有
                          - code [ref=e3941]: Shield.Penetrate=true
                          - text: ，否则使用护盾的护甲类型。在所有上述筛选之后进行检查。
                - paragraph [ref=e3942]:
                  - text: 在
                  - code [ref=e3943]: rulesmd.ini
                  - text: ：
                - generic [ref=e3946]: "[SOMEWARHEAD] ; WarheadType DetonateOnAllMapObjects=false ; boolean DetonateOnAllMapObjects.Full=true ; boolean DetonateOnAllMapObjects.AffectsTarget=none ; List of Affected Target Enumeration (none|aircraft|buildings|infantry|units|all) DetonateOnAllMapObjects.AffectsHouse=none ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) DetonateOnAllMapObjects.AffectTypes= ; List of TechnoTypes DetonateOnAllMapObjects.IgnoreTypes= ; List of TechnoTypes DetonateOnAllMapObjects.RequireVerses=false ; boolean"
                - generic [ref=e3947]:
                  - paragraph [ref=e3948]:  警告
                  - paragraph [ref=e3949]:
                    - text: 虽然此功能比巨大的
                    - code [ref=e3950]: CellSpread
                    - text: 值性能上好得多但它仍然可能减慢游戏速度。特别是与动画、AlphaImage 等共同使用时。建议 modder 谨慎使用并通过筛选语句进行限制。
              - generic [ref=e3951]:
