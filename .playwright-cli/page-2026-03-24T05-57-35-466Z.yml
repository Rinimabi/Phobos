                - generic [ref=e3983]: "[SOMEWARHEAD] ; WarheadType KillWeapon= ; WeaponType KillWeapon.OnFirer= ; WeaponType KillWeapon.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) KillWeapon.OnFirer.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) KillWeapon.AffectsTarget=all ; List of Affected Target Enumeration (none|aircraft|buildings|infantry|units|all) KillWeapon.OnFirer.AffectsTarget=all ; List of Affected Target Enumeration (none|aircraft|buildings|infantry|units|all) [SOMETECHNO] ; TechnoType SuppressKillWeapons=false ; boolean SuppressKillWeapons.Types= ; List of WeaponTypes"
              - generic [ref=e3984]:
