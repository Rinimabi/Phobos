                    - paragraph [ref=e2986]: 现在你可以为单位在部署行为中设置低优先级，这意味着如果它与其他单位一同被选中那么不会与其他单位一起执行部署指令。这不影响通过光标下达部署指令，这种情况本就不需要事先选中其他对象。
                - paragraph [ref=e2987]:
