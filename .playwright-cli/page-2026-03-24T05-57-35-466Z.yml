                      - text: 前计算）任何寄生单位都会被移除和删除。现在可以自定义此行为以禁用负伤害的移除效果或为任意弹头启用它。
                  - listitem [ref=e4095]:
                    - paragraph [ref=e4096]:
                      - code [ref=e4097]: RemoveParasite.Allow
                      - text: 定义哪些寄生者可以被移除。
                  - listitem [ref=e4098]:
                    - paragraph [ref=e4099]:
                      - code [ref=e4100]: RemoveParasite.Disallow
                      - text: 定义哪些寄生者不能被移除。
                - paragraph [ref=e4101]:
                  - text: 在
                  - code [ref=e4102]: rulesmd.ini
                  - text: ：
                - generic [ref=e4105]: "[SOMEWARHEAD] ; WarheadType RemoveParasite= ; boolean RemoveParasite.Allow= ; List of TechnoTypes RemoveParasite.Disallow= ; List of TechnoTypes"
              - generic [ref=e4106]:
                - heading "对运输工具的穿透伤害 " [level=3] [ref=e4107]:
                  - text: 对运输工具的穿透伤害
                  - link "" [ref=e4108] [cursor=pointer]:
                    - /url: "#penetrates-damage-on-transporter"
                - list [ref=e4109]:
                  - listitem [ref=e4110]:
                    - paragraph [ref=e4111]: 现在弹头引爆时可以杀伤乘客。
                    - list [ref=e4112]:
                      - listitem [ref=e4113]:
                        - paragraph [ref=e4114]:
                          - text: 如果弹头的
                          - code [ref=e4115]: PenetratesTransport.Level
                          - text: 高于目标及其乘客的
                          - code [ref=e4116]: PenetratesTransport.Level
                          - text: ，则它会对乘客启用穿透伤害逻辑。
                      - listitem [ref=e4117]:
                        - paragraph [ref=e4118]:
                          - code [ref=e4119]: PenetratesTransport.PassThrough
                          - text: 为穿透的概率，实际概率还要乘上目标的
                          - code [ref=e4120]: PenetratesTransport.PassThroughMultiplier
                          - text: 。
                      - listitem [ref=e4121]:
                        - paragraph [ref=e4122]:
                          - code [ref=e4123]: PenetratesTransport.FatalRate
                          - text: 为对乘客一击必杀的概率，实际概率还要乘上目标的
                          - code [ref=e4124]: PenetratesTransport.FatalRateMultiplier
                          - text: 。
                      - listitem [ref=e4125]:
                        - paragraph [ref=e4126]:
                          - code [ref=e4127]: PenetratesTransport.DamageAll
                          - text: 控制伤害作用于运输工具的所有乘客还是随机选取其一。
                      - listitem [ref=e4128]:
                        - paragraph [ref=e4129]:
                          - code [ref=e4130]: PenetratesTransport.DamageMultiplier
                          - text: 是对乘客所造成伤害的倍率。
                      - listitem [ref=e4131]:
                        - paragraph [ref=e4132]:
                          - code [ref=e4133]: PenetratesTransport.CleanSound
                          - text: 会在乘客全部被击杀后播放。
                - paragraph [ref=e4134]:
                  - text: 在
                  - code [ref=e4135]: rulesmd.ini
                  - text: ：
                - generic [ref=e4138]: "[CombatDamage] PenetratesTransport.Level=10 ; integer, default value of [TechnoType] -> PenetratesTransport.Level [SOMEWARHEAD] ; WarheadType PenetratesTransport.Level=0 ; integer PenetratesTransport.PassThrough=1.0 ; double PenetratesTransport.FatalRate=0.0 ; double PenetratesTransport.DamageMultiplier=1.0 ; double PenetratesTransport.DamageAll=false ; boolean PenetratesTransport.CleanSound= ; sound entry [SOMETECHNO] ; TechnoType PenetratesTransport.Level= ; integer, default to [CombatDamage] -> PenetratesTransport.Level PenetratesTransport.PassThroughMultiplier=1.0 ; double PenetratesTransport.FatalRateMultiplier=1.0 ; double PenetratesTransport.DamageMultiplier=1.0 ; double"
              - generic [ref=e4139]:
                - heading "移除伪装弹头 " [level=3] [ref=e4140]:
                  - text: 移除伪装弹头
                  - link "" [ref=e4141] [cursor=pointer]:
                    - /url: "#remove-disguise-on-impact"
                - list [ref=e4142]:
                  - listitem [ref=e4143]:
                    - paragraph [ref=e4144]:
                      - text: 弹头现在可以移除间谍或幻影坦克的伪装。即使伪装是通过
                      - code [ref=e4145]: PermaDisguise
                      - text: 默认获得来的。
                - paragraph [ref=e4146]:
                  - text: 在
                  - code [ref=e4147]: rulesmd.ini
                  - text: ：
                - generic [ref=e4150]: "[SOMEWARHEAD] ; WarheadType RemoveDisguise=false ; boolean"
              - generic [ref=e4151]:
                - heading "归返弹头 " [level=3] [ref=e4152]:
                  - text: 归返弹头
                  - link "" [ref=e4153] [cursor=pointer]:
                    - /url: "#return-warhead"
                - list [ref=e4154]:
                  - listitem [ref=e4155]:
                    - paragraph [ref=e4156]: 对于每个受该弹头影响的单位都会有一个在该弹头的所有者处引爆且属于自己的弹头。
                    - list [ref=e4157]:
                      - listitem [ref=e4158]:
                        - paragraph [ref=e4159]:
                          - code [ref=e4160]: ReturnWarhead
                          - text: 决定从目标“归返”回原弹头所有者的弹头类型。
                      - listitem [ref=e4161]:
                        - paragraph [ref=e4162]:
                          - code [ref=e4163]: ReturnWarhead.Damage
                          - text: 决定归返弹头造成的伤害。
                      - listitem [ref=e4164]:
                        - paragraph [ref=e4165]:
                          - code [ref=e4166]: ReturnWarhead.Chance
                          - text: 决定归返弹头发生的概率。默认情况下这在弹头爆炸时检查一次，每个受影响的目标都可能触发归返弹头。如果设置了
                          - code [ref=e4167]: ReturnWarhead.ApplyChancePerTarget
                          - text: ，那么每个目标是否成功触发归返的概率将单独计算。
                      - listitem [ref=e4168]:
                        - paragraph [ref=e4169]:
                          - code [ref=e4170]: ReturnWarhead.FullDetonation
                          - text: 控制弹头是否在目标上完全引爆（作为虚拟武器的一部分）或者只能对所在区域造成杀伤并应用 Phobos 的弹头效果。
                      - listitem [ref=e4171]:
                        - paragraph [ref=e4172]:
                          - code [ref=e4173]: ReturnWarhead.AffectsTarget
                          - text: 可用于自定义此弹头可触发归返的目标类型。归返弹头不能影响空置单元格或仅包含地形对象和覆盖物等的单元格。
                      - listitem [ref=e4174]:
                        - paragraph [ref=e4175]:
                          - code [ref=e4176]: ReturnWarhead.AffectsHouse
                          - text: 可用于自定义此弹头可触发归返的目标所属。
                - paragraph [ref=e4177]:
                  - text: 在
                  - code [ref=e4178]: rulesmd.ini
                  - text: ：
                - generic [ref=e4181]: "[SOMEWARHEAD] ; WarheadType ReturnWarhead= ; WarheadType ReturnWarhead.Damage=0 ; integer ReturnWarhead.Chance=0.0 ; floating point value, percents or absolute (0.0-1.0) ReturnWarhead.ApplyChancePerTarget=false ; boolean ReturnWarhead.FullDetonation=true ; boolean ReturnWarhead.AffectsTarget=all ; List of Affected Target Enumeration (none|land|water|infantry|units|buildings|all) ReturnWarhead.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all)"
                - generic [ref=e4182]:
                  - paragraph [ref=e4183]:  警告
                  - paragraph [ref=e4184]:
                    - text: 如果你将
                    - code [ref=e4185]: ReturnWarhead
                    - text: 设为定义暴击的弹头或者创建一个最终回到第一个弹头的循环那么游戏可能会陷入循环并随后卡死或崩溃。
              - generic [ref=e4186]:
                - heading "揭示弹 " [level=3] [ref=e4187]:
                  - text: 揭示弹
                  - link "" [ref=e4188] [cursor=pointer]:
                    - /url: "#reveal-map-for-owner-on-impact"
                - list [ref=e4189]:
                  - listitem [ref=e4190]:
                    - paragraph [ref=e4191]: 现在弹头可以在引爆时揭示部分区域或整个地图的黑幕。
                    - list [ref=e4192]:
                      - listitem [ref=e4193]:
                        - paragraph [ref=e4194]: 仅适用于弹头所有者。
                - paragraph [ref=e4195]:
                  - text: 在
                  - code [ref=e4196]: rulesmd.ini
                  - text: ：
                - generic [ref=e4199]: "[SOMEWARHEAD] ; WarheadType Reveal=0 ; integer - cell radius, negative values mean reveal the entire map"
              - generic [ref=e4200]:
                - heading "逆向工程弹头 " [level=3] [ref=e4201]:
                  - text: 逆向工程弹头
                  - link "" [ref=e4202] [cursor=pointer]:
                    - /url: "#reverse-engineer-warhead"
                - list [ref=e4203]:
                  - listitem [ref=e4204]:
                    - paragraph [ref=e4205]:
                      - text: 现在弹头可以使用逆向工程逻辑（
                      - emphasis [ref=e4206]: Ares 功能
                      - text: ），被命中的单位将会被逆向工程。
                - paragraph [ref=e4207]:
                  - text: 在
                  - code [ref=e4208]: rulesmd.ini
                  - text: ：
                - generic [ref=e4211]: "[SOMEWARHEAD] ; WarheadType ReverseEngineer=false ; boolean"
                - generic [ref=e4212]:
                  - paragraph [ref=e4213]:  警告
                  - paragraph [ref=e4214]: 此功能需要 3.0 及以上版本的 Ares 才能运作！
              - generic [ref=e4215]:
                - heading "将建筑出售或反部署 " [level=3] [ref=e4216]:
                  - text: 将建筑出售或反部署
                  - link "" [ref=e4217] [cursor=pointer]:
                    - /url: "#sell-or-undeploy-building-on-impact"
                - list [ref=e4218]:
                  - listitem [ref=e4219]:
                    - paragraph [ref=e4220]:
                      - text: 现在拥有
                      - code [ref=e4221]: BuildingSell
                      - text: 的弹头可以出售拥有拔起动画的建筑。它的优先级高于
                      - code [ref=e4222]: BuildingUndeploy
                      - text: 。
                    - list [ref=e4223]:
                      - listitem [ref=e4224]:
                        - paragraph [ref=e4225]:
                          - code [ref=e4226]: BuildingSell.IgnoreUnsellable
                          - text: 控制是否忽略除了缺失拔起动画之外所有可能禁止建筑出售的情况。
                  - listitem [ref=e4227]:
                    - paragraph [ref=e4228]:
                      - text: 现在拥有
                      - code [ref=e4229]: BuildingUndeploy
                      - text: 的弹头可以令目标建筑反部署为
                      - code [ref=e4230]: UndeploysInto
                      - text: 的对象。
                    - list [ref=e4231]:
                      - listitem [ref=e4232]:
                        - paragraph [ref=e4233]:
                          - code [ref=e4234]: BuildingUndeploy.Leave
                          - text: 控制是否需要让它们移动到附近较低威胁的位置。这里的威胁程度使用科技类型的价格计算。如果附近的科技类型没有主武器或属于友方所属，那么不被计入。
                - paragraph [ref=e4235]:
                  - text: 在
                  - code [ref=e4236]: rulesmd.ini
                  - text: ：
                - generic [ref=e4239]: "[SOMEWARHEAD] ; WarheadType BuildingSell=false ; boolean BuildingSell.IgnoreUnsellable=false ; boolean BuildingUndeploy=false ; boolean BuildingUndeploy.Leave=false ; boolean"
              - generic [ref=e4240]:
                - heading "黑幕弹 " [level=3] [ref=e4241]:
                  - text: 黑幕弹
                  - link "" [ref=e4242] [cursor=pointer]:
                    - /url: "#shroud-map-for-enemies-on-impact"
                - list [ref=e4243]:
                  - listitem [ref=e4244]:
                    - paragraph [ref=e4245]: 现在弹头可以在引爆时填充部分区域或整个地图的黑幕
                    - list [ref=e4246]:
                      - listitem [ref=e4247]:
                        - paragraph [ref=e4248]: 仅适用于敌对所属方。
                - paragraph [ref=e4249]:
                  - text: 在
                  - code [ref=e4250]: rulesmd.ini
                  - text: ：
                - generic [ref=e4253]: "[SOMEWARHEAD] ; WarheadType CreateGap=0 ; integer - cell radius, negative values mean shroud the entire map"
              - generic [ref=e4254]:
                - heading "生成工具箱 " [level=3] [ref=e4255]:
                  - text: 生成工具箱
                  - link "" [ref=e4256] [cursor=pointer]:
                    - /url: "#spawn-powerup-crate"
                - list [ref=e4257]:
                  - listitem [ref=e4258]:
                    - paragraph [ref=e4259]:
                      - text: 现在弹头可以在其引爆的单元格上创建指定类型的升级工具箱（如果空置，若被非工具箱的对象占据则生成到附近的单元格）类似于地图触发动作
                      - code [ref=e4260]: 108 创建工具箱...
                      - text: 。
                    - list [ref=e4261]:
                      - listitem [ref=e4262]:
                        - paragraph [ref=e4263]:
                          - code [ref=e4264]: SpawnsCrateN
                          - text: 中的 N 是从 0 开始的数字，游戏会解析到最后一个为止。用于定义每个生成的升级工具箱类型。
                      - listitem [ref=e4265]:
                        - paragraph [ref=e4266]:
                          - code [ref=e4267]: SpawnsCrateN.Weight
                          - text: 是一个用于确定生成对应升级工具箱类型与其他列出的类型相比的相对权重（0 表示没门，越高代表概率越高）如果未定义则默认为 1。
                      - listitem [ref=e4268]:
                        - paragraph [ref=e4269]:
                          - text: 如果未设置
                          - code [ref=e4270]: SpawnsCrate0.Type/Weight
                          - text: 则
                          - code [ref=e4271]: SpawnsCrate.Type/Weight
                          - text: 是其别名。
                - paragraph [ref=e4272]:
                  - text: 在
                  - code [ref=e4273]: rulesmd.ini
                  - text: ：
                - generic [ref=e4276]: "[SOMEWARHEAD] ; WarheadType SpawnsCrate(N).Type= ; Powerup crate type enum (money|unit|healbase|cloak|explosion|napalm|squad|reveal|armor|speed|firepower|icbm|invulnerability|veteran|ionstorm|gas|tiberium|pod) SpawnsCrate(N).Weight=1 ; integer"
              - generic [ref=e4277]:
                - heading "嘲讽弹头 " [level=3] [ref=e4278]:
                  - text: 嘲讽弹头
                  - link "" [ref=e4279] [cursor=pointer]:
                    - /url: "#taunt-warhead"
                - list [ref=e4280]:
                  - listitem [ref=e4281]:
                    - paragraph [ref=e4282]: 现在你可以使用以下标签使弹头“嘲讽”目标，这会覆盖其当前任务并强制其攻击伤害的来源。
                    - list [ref=e4283]:
                      - listitem [ref=e4284]:
                        - paragraph [ref=e4285]: 被嘲讽的目标将表现为进行反击的形式。
                      - listitem [ref=e4286]:
                        - paragraph [ref=e4287]: 如果是无源伤害，那么嘲讽将不会生效。
                - paragraph [ref=e4288]:
                  - text: 在
                  - code [ref=e4289]: rulesmd.ini
                  - text: ：
                - generic [ref=e4292]: "[SOMEWARHEAD] ; WarheadType Taunt=false ; boolean"
              - generic [ref=e4293]:
                - heading "设置按目标生效的弹头效果应用时机 " [level=3] [ref=e4294]:
                  - text: 设置按目标生效的弹头效果应用时机
                  - link "" [ref=e4295] [cursor=pointer]:
                    - /url: "#toggle-per-target-warhead-effects-apply-timing"
                - list [ref=e4296]:
                  - listitem [ref=e4297]:
                    - paragraph [ref=e4298]:
                      - text: 现在你可以通过将下列语句设为
                      - code [ref=e4299]: "false"
                      - text: 来使
                      - strong [ref=e4300]: Phobos
                      - text: 弹头效果在每个目标受伤时而不只是在抛射体引爆时生效。
                    - list [ref=e4301]:
                      - listitem [ref=e4302]:
                        - paragraph [ref=e4303]:
                          - text: 这将允许此类效果通过包括但不限于来自粒子、原版辐射以及 Ares 的
                          - code [ref=e4304]: Type=GenericWarhead
                          - text: 类超武造成的无抛射体杀伤效果生效。
                      - listitem [ref=e4305]:
                        - paragraph [ref=e4306]:
                          - text: 这也将导致这些弹头效果同样会被包括但不限于
                          - code [ref=e4307]: DamageSelf
                          - text: 、
                          - code [ref=e4308]: DamageAirThreshold
                          - text: 、
                          - code [ref=e4309]: AffectsAllies
                          - text: 、
                          - code [ref=e4310]: AffectsAir
                          - text: 的杀伤阻断效果阻断。
                      - listitem [ref=e4311]:
                        - paragraph [ref=e4312]:
                          - text: 如果你使用带有
                          - code [ref=e4313]: CellSpread
                          - text: 的弹头对一个建筑造成多次杀伤，那么这些效果将被多次应用。若不希望如此则可使用
                          - link "MergeBuildingDamage" [ref=e4314] [cursor=pointer]:
                            - /url: "#allow-merging-aoe-damage-to-buildings-into-one"
                            - code [ref=e4315]: MergeBuildingDamage
                          - text: 来避免。
                      - listitem [ref=e4316]:
                        - paragraph [ref=e4317]: 适用的效果包括：
                        - list [ref=e4318]:
                          - listitem [ref=e4319]:
                            - paragraph [ref=e4320]:
                              - link "解除心控" [ref=e4321] [cursor=pointer]:
                                - /url: "#break-mind-control-on-impact"
                          - listitem [ref=e4322]:
                            - paragraph [ref=e4323]:
                              - link "单位转换弹头" [ref=e4324] [cursor=pointer]:
                                - /url: "#convert-technotype-on-impact"
                          - listitem [ref=e4325]:
                            - paragraph [ref=e4326]:
                              - link "将建筑出售或反部署" [ref=e4327] [cursor=pointer]:
                                - /url: "#sell-or-undeploy-building-on-impact"
                          - listitem [ref=e4328]:
                            - paragraph [ref=e4329]:
                              - link "移除伪装弹头" [ref=e4330] [cursor=pointer]:
                                - /url: "#remove-disguise-on-impact"
                          - listitem [ref=e4331]:
                            - paragraph [ref=e4332]:
                              - link "逆向工程弹头" [ref=e4333] [cursor=pointer]:
                                - /url: "#reverse-engineer-warhead"
                          - listitem [ref=e4334]:
                            - paragraph [ref=e4335]:
                              - link "护盾修改" [ref=e4336] [cursor=pointer]:
                                - /url: "#shields"
                          - listitem [ref=e4337]:
                            - paragraph [ref=e4338]:
                              - link "AE 修改" [ref=e4339] [cursor=pointer]:
                                - /url: "#attached-effects"
                          - listitem [ref=e4340]:
                            - paragraph [ref=e4341]:
                              - link "暴击" [ref=e4342] [cursor=pointer]:
                                - /url: "#chance-based-extra-damage-or-warhead-detonation-critical-hits"
                            - list [ref=e4343]:
                              - listitem [ref=e4344]:
                                - paragraph [ref=e4345]:
                                  - text: 由于技术原因，强制
                                  - code [ref=e4346]: Crit.SuppressWhenIntercepted=false
                                  - text: 且
                                  - code [ref=e4347]: Crit.ApplyChancePerTarget=true
                                  - text: 。
                - paragraph [ref=e4348]:
                  - text: 在
                  - code [ref=e4349]: rulesmd.ini
                  - text: ：
                - generic [ref=e4352]: "[CombatDamage] ; WarheadType ApplyPerTargetEffectsOnDetonate=true ; boolean [SOMEWARHEAD] ; WarheadType ApplyPerTargetEffectsOnDetonate= ; boolean, default to [CombatDamage] -> ApplyPerTargetEffectsOnDetonate"
                - generic [ref=e4353]:
                  - paragraph [ref=e4354]:  备注
                  - list [ref=e4355]:
                    - listitem [ref=e4356]:
                      - paragraph [ref=e4357]: Ares 弹头效果例如 EMP 或铁幕弹头将不受影响。
                    - listitem [ref=e4358]:
                      - paragraph [ref=e4359]:
                        - text: Ares 弹头效果控制器例如
                        - code [ref=e4360]: EffectsRequireDamage
                        - text: 仅影响 Ares 效果。所以它们与此功能无关。
              - generic [ref=e4361]:
                - heading "指定非人步兵死亡序列 " [level=3] [ref=e4362]:
                  - text: 指定非人步兵死亡序列
                  - link "" [ref=e4363] [cursor=pointer]:
                    - /url: "#trigger-specific-nothuman-infantry-death-anim-sequence"
                - list [ref=e4364]:
                  - listitem [ref=e4365]:
                    - paragraph [ref=e4366]:
                      - text: 现在弹头可以使用相应的标签触发特定的
                      - code [ref=e4367]: NotHuman=yes
                      - text: 步兵
                      - code [ref=e4368]: Death
                      - text: 动画序列。其值代表从
                      - code [ref=e4369]: Die1
                      - text: 到
                      - code [ref=e4370]: Die5
                      - text: 。
                - paragraph [ref=e4371]:
                  - text: 在
                  - code [ref=e4372]: rulesmd.ini
                  - text: ：
                - generic [ref=e4375]: "[SOMEWARHEAD] ; WarheadType NotHuman.DeathSequence= ; integer (1 to 5)"
              - generic [ref=e4376]:
                - heading "弹头击杀限制 " [level=3] [ref=e4377]:
                  - text: 弹头击杀限制
                  - link "" [ref=e4378] [cursor=pointer]:
                    - /url: "#warhead-that-can-not-kill"
                - list [ref=e4379]:
                  - listitem [ref=e4380]:
                    - paragraph [ref=e4381]: 现在可以让一个弹头可以杀伤敌人但无法击杀它们（至少保留 1 滴血）。
                - paragraph [ref=e4382]:
                  - text: 在
                  - code [ref=e4383]: rulesmd.ini
                  - text: ：
                - generic [ref=e4386]: "[SOMEWARHEAD] ; WarheadType CanKill=true ; boolean"
              - generic [ref=e4387]:
                - heading "去虚拟化弹头 " [level=3] [ref=e4388]:
                  - text: 去虚拟化弹头
                  - link "" [ref=e4389] [cursor=pointer]:
                    - /url: "#unlimbo-detonate-warhead"
                - paragraph [ref=e4390]:
                  - img "去虚拟化弹头" [ref=e4391]
                  - emphasis [ref=e4392]:
                    - text: "@"
                    - link "八棱彩" [ref=e4393] [cursor=pointer]:
                      - /url: https://space.bilibili.com/360577336
                    - text: 在
                    - strong [ref=e4394]: 恐慌之矛的召唤
                    - text: 中使用的去虚拟化弹头
                - list [ref=e4395]:
                  - listitem [ref=e4396]:
                    - paragraph [ref=e4397]:
                      - code [ref=e4398]: UnlimboDetonate
                      - text: 允许发射了拥有
                      - code [ref=e4399]: LimboLaunch=yes
                      - text: 的武器的单位在弹头引爆后重新刷出（退出 Limbo 状态）。
                    - list [ref=e4400]:
                      - listitem [ref=e4401]:
                        - paragraph [ref=e4402]:
                          - code [ref=e4403]: UnlimboDetonate.ForceLocation
                          - text: 允许单位强制出现在抛射体爆炸的位置，否则它们会检索其他可用的单元格。
                      - listitem [ref=e4404]:
                        - paragraph [ref=e4405]:
                          - code [ref=e4406]: UnlimboDetonate.KeepTarget
                          - text: 允许单位进出 Limbo 状态前后保留原先的目标。
                      - listitem [ref=e4407]:
                        - paragraph [ref=e4408]:
                          - code [ref=e4409]: UnlimboDetonate.KeepSelected
                          - text: 允许单位进出 Limbo 状态前保留原先选中状态。
                - paragraph [ref=e4410]:
                  - text: 在
                  - code [ref=e4411]: rulesmd.ini
                  - text: ：
                - generic [ref=e4414]: "[SOMEWARHEAD] ; WarheadType UnlimboDetonate=false ; boolean UnlimboDetonate.ForceLocation=false ; boolean UnlimboDetonate.KeepTarget=false ; boolean UnlimboDetonate.KeepSelected=false ; boolean"
                - generic [ref=e4415]:
                  - paragraph [ref=e4416]:  警告
                  - paragraph [ref=e4417]:
                    - code [ref=e4418]: UnlimboDetonate
                    - text: 不能与
                    - code [ref=e4419]: Parasite
                    - text: 共用。
            - generic [ref=e4420]:
              - heading "武器 " [level=2] [ref=e4421]:
                - text: 武器
                - link "" [ref=e4422] [cursor=pointer]:
                  - /url: "#weapons"
              - generic [ref=e4423]:
                - heading "自定义 AreaFire 目标 " [level=3] [ref=e4424]:
                  - text: 自定义
                  - code [ref=e4425]: AreaFire
                  - text: 目标
                  - link "" [ref=e4426] [cursor=pointer]:
                    - /url: "#areafire-target-customization"
                - list [ref=e4427]:
                  - listitem [ref=e4428]:
                    - paragraph [ref=e4429]:
                      - text: 现在你可以指定 AreaFire 武器如何选择目标。默认情况下它会瞄准开火者当前所处的单元格，现在可以通过将
                      - code [ref=e4430]: AreaFire.Target
                      - text: 设为
                      - code [ref=e4431]: self
                      - text: 或
                      - code [ref=e4432]: random
                      - text: 分别改为瞄准发开火者自身或武器
                      - code [ref=e4433]: Range
                      - text: 范围内的随机单元格。
                  - listitem [ref=e4434]:
                    - paragraph [ref=e4435]:
                      - code [ref=e4436]: AreaFire.Target=self
                      - text: 遵守对开火者自身的正常目标筛选规则（弹头
                      - code [ref=e4437]: Verses
                      - text: 等）。
                  - listitem [ref=e4438]:
                    - paragraph [ref=e4439]:
                      - code [ref=e4440]: AreaFire.Target=random
                      - text: 会忽略由武器
                      - code [ref=e4441]: CanTarget
                      - text: 和
                      - code [ref=e4442]: CanTargetHouses
                      - text: 值设为不可作为目标的单元格或存在不可作为目标的对象的单元格。
                - paragraph [ref=e4443]:
                  - text: 在
                  - code [ref=e4444]: rulesmd.ini
                  - text: ：
                - generic [ref=e4447]: "[SOMEWEAPON] ; WeaponType AreaFire.Target=base ; AreaFire Target Enumeration (base|self|random)"
              - generic [ref=e4448]:
                - heading "攻击无威胁建筑（武器定义） " [level=3] [ref=e4449]:
                  - text: 攻击无威胁建筑（武器定义）
                  - link "" [ref=e4450] [cursor=pointer]:
                    - /url: "#attack-non-threatening-structures-weapon"
                - list [ref=e4451]:
                  - listitem [ref=e4452]:
                    - paragraph [ref=e4453]:
                      - code [ref=e4454]: AttackNoThreatBuildings
                      - text: 允许单位（主动）攻击无威胁建筑。这会覆盖其他设置。
                - paragraph [ref=e4455]:
                  - text: 在
                  - code [ref=e4456]: rulesmd.ini
                  - text: ：
                - generic [ref=e4459]: "[SOMEWEAPON] ; WeaponType AttackNoThreatBuildings= ; boolean"
              - generic [ref=e4460]:
                - heading "自定义 BurstDelay " [level=3] [ref=e4461]:
                  - text: 自定义 BurstDelay
                  - link "" [ref=e4462] [cursor=pointer]:
                    - /url: "#burst-delay-customizations"
                - list [ref=e4463]:
                  - listitem [ref=e4464]:
                    - paragraph [ref=e4465]:
                      - code [ref=e4466]: Burst.Delays
                      - text: 允许为特定武器指定其连发间隔。优先于载具类型中就有的
                      - code [ref=e4467]: BurstDelayX
                      - text: 逻辑，且适用于步兵和建筑类型的武器（由于战机类型武器的发射系统完全不同因此暂不支持），并允许独立设置每一发
                      - code [ref=e4468]: Burst
                      - text: 之间的间隔而不仅限于第 1 发到第 4 发。
                    - list [ref=e4469]:
                      - listitem [ref=e4470]:
                        - paragraph [ref=e4471]:
                          - text: 如果未未某一发设定间隔那么它会使用上一发所定义的间隔（例如
                          - code [ref=e4472]: Burst=3
                          - text: 和
                          - code [ref=e4473]: Burst.Delays=10
                          - text: 将使用 10 作为所有连发的间隔）。
                      - listitem [ref=e4474]:
                        - paragraph [ref=e4475]:
                          - text: 使用
                          - code [ref=e4476]: "-1"
                          - text: 作为间隔会使该发使用旧逻辑（如果有则使用载具类型的
                          - code [ref=e4477]: BurstDelay0-3
                          - text: 否则使用 3-5 之间的随机值）。
                  - listitem [ref=e4478]:
                    - paragraph [ref=e4479]:
                      - code [ref=e4480]: Burst.FireWithinSequence
                      - text: 仅在步兵或
                      - code [ref=e4481]: Voxel=no
                      - text: 的无炮塔载具发射武器时使用，将其设为 true 以允许步兵/载具在同一射击序列内射出多发
                      - code [ref=e4482]: Burst
                      - text: 。
                    - list [ref=e4483]:
                      - listitem [ref=e4484]:
                        - paragraph [ref=e4485]:
                          - text: 第一发始终在由步兵类型图像的射击帧（如
                          - code [ref=e4486]: FireUp
                          - text: 等）确定的帧序列决定。
                      - listitem [ref=e4487]:
                        - paragraph [ref=e4488]:
                          - text: 后续的连发发射间隔由
                          - code [ref=e4489]: Burst.Delays
                          - text: 决定（最小间隔为 1 帧）或未定义情况下使用随机 3 到 5 帧。注意如果下一发的发射帧超出了射击序列长度则连发计数器将被重置且武器会重新开始装填。
                      - listitem [ref=e4490]:
                        - paragraph [ref=e4491]: 如果在至少一发后停止射击则连发计数器不会立即重置，但每个连发的发射帧不会受此影响（换而言之，如果之后重新开始射击而武器没有重新装填，那么射击序列会重新开始，但不会发射任何直到下一发应该被发射的帧）。
                - paragraph [ref=e4492]:
                  - text: 在
                  - code [ref=e4493]: rulesmd.ini
                  - text: ：
                - generic [ref=e4496]: "[SOMEWEAPON] ; WeaponType Burst.Delays=-1 ; integer - burst delays (comma-separated) for shots in order from first to last. Burst.FireWithinSequence=false ; boolean"
              - generic [ref=e4497]:
                - heading "无间隔连发 " [level=3] [ref=e4498]:
                  - text: 无间隔连发
                  - link "" [ref=e4499] [cursor=pointer]:
                    - /url: "#burst-without-delay"
                - list [ref=e4500]:
                  - listitem [ref=e4501]:
                    - paragraph [ref=e4502]:
                      - text: 原版中即便武器的
                      - code [ref=e4503]: ROF
                      - text: 或载具的
                      - code [ref=e4504]: BurstDelay
                      - text: 设为 0 也最快每帧发射一次。现在可以通过将
                      - code [ref=e4505]: Burst.NoDelay
                      - text: 设为 true 强制单位在一帧内全部发射。
                - paragraph [ref=e4506]:
                  - text: 在
                  - code [ref=e4507]: rulesmd.ini
                  - text: ：
                - generic [ref=e4510]: "[SOMEWEAPON] ; WeaponType Burst.NoDelay=false ; boolean"
                - generic [ref=e4511]:
                  - paragraph [ref=e4512]:  备注
                  - list [ref=e4513]:
                    - listitem [ref=e4514]:
                      - paragraph [ref=e4515]: 此功能对建筑和战机无效。
                    - listitem [ref=e4516]:
                      - paragraph [ref=e4517]:
                        - text: 这会无视
                        - code [ref=e4518]: Burst.Delays
                        - text: 设置。
              - generic [ref=e4519]:
                - heading "自定义武器能否瞄准被铁幕作用中的对象 " [level=3] [ref=e4520]:
                  - text: 自定义武器能否瞄准被铁幕作用中的对象
                  - link "" [ref=e4521] [cursor=pointer]:
                    - /url: "#customize-whether-weapon-can-target-iron-curtained-technos"
                - list [ref=e4522]:
                  - listitem [ref=e4523]:
                    - paragraph [ref=e4524]: 在原版中，AI 玩家总是不会攻击被铁幕作用中的单位。现在你可以自定义这点。
                    - list [ref=e4525]:
                      - listitem [ref=e4526]:
                        - paragraph [ref=e4527]:
                          - code [ref=e4528]: CanTarget.IronCurtained
                          - text: 控制人类玩家，
                          - code [ref=e4529]: CanTargetAI.IronCurtained
                          - text: 控制 AI 玩家。
                      - listitem [ref=e4530]:
                        - paragraph [ref=e4531]:
                          - code [ref=e4532]: AutoTarget.IronCurtained
                          - text: 决定玩家控制的单位能否主动攻击铁幕保护中的目标。AI 只遵循
                          - code [ref=e4533]: CanTarget.IronCurtained
                          - text: 而无视此设置。
                - paragraph [ref=e4534]:
                  - text: 在
                  - code [ref=e4535]: rulesmd.ini
                  - text: ：
                - generic [ref=e4538]: "[CombatDamage] CanTarget.IronCurtained=true ; boolean CanTargetAI.IronCurtained=false ; boolean AutoTarget.IronCurtained=true ; boolean [SOMEWEAPON] ; WeaponType CanTarget.IronCurtained= ; boolean, default to [CombatDamage] -> CanTarget.IronCurtained for human player and CanTargetAI.IronCurtained for computer AutoTarget.IronCurtained= ; boolean, default to [CombatDamage] -> AutoTarget.IronCurtained"
              - generic [ref=e4539]:
                - heading "延迟开火 " [level=3] [ref=e4540]:
                  - text: 延迟开火
                  - link "" [ref=e4541] [cursor=pointer]:
                    - /url: "#delayed-firing"
                - list [ref=e4542]:
                  - listitem [ref=e4543]:
                    - paragraph [ref=e4544]:
                      - text: 通过为武器设置
                      - code [ref=e4545]: DelayedFire.Duration
                      - text: 可使其延迟开火 - 它支持单个整数或用逗号隔开的两个整数作为随机取值区间。
                    - list [ref=e4546]:
                      - listitem [ref=e4547]:
                        - paragraph [ref=e4548]:
                          - text: 若
                          - code [ref=e4549]: DelayedFire.SkipInTransport
                          - text: 设为 true 且开火者在运输工具中则这种情况下跳过延迟。
                      - listitem [ref=e4550]:
                        - paragraph [ref=e4551]:
                          - code [ref=e4552]: DelayedFire.Animation
                          - text: 可用于定义延时计时器启动时创建的动画。可用
                          - code [ref=e4553]: DelayedFire.OpenToppedAnimation
                          - text: 单独定义开火者在运输工具中开火时创建的。
                        - list [ref=e4554]:
                          - listitem [ref=e4555]:
                            - paragraph [ref=e4556]:
                              - text: 若
                              - code [ref=e4557]: DelayedFire.AnimIsAttached
                              - text: 设为 true 则该动画将附着于开火的单位上。若
                              - code [ref=e4558]: DelayedFire.RemoveAnimOnNoDelay
                              - text: 也设为 true，则在持续时间结束或开火被中断时无论是否播放完毕都立即移除动画。
                          - listitem [ref=e4559]:
                            - paragraph [ref=e4560]:
                              - code [ref=e4561]: DelayedFire.AnimOffset
                              - text: 可用于覆盖开火坐标来设置动画的位置。
                          - listitem [ref=e4562]:
                            - paragraph [ref=e4563]:
                              - code [ref=e4564]: DelayedFire.AnimOnTurret
                              - text: 决定在单位有炮塔的情况下该动画的位置是相对于开火单位的本体还是炮塔。
                          - listitem [ref=e4565]:
                            - paragraph [ref=e4566]:
                              - text: 若设置了
                              - code [ref=e4567]: DelayedFire.CenterAnimOnFirer
                              - text: 则动画会创建于开火单位的中心而非开火坐标处。
                      - listitem [ref=e4568]:
                        - paragraph [ref=e4569]:
                          - text: 若该武器由一个步兵发射且
                          - code [ref=e4570]: DelayedFire.PauseFiringSequence
                          - text: 为 true 则当步兵的动画序列达到其在
                          - code [ref=e4571]: artmd.ini
                          - text: 中由
                          - code [ref=e4572]: FireUp/Prone
                          - text: 或
                          - code [ref=e4573]: SecondaryFire/Prone
                          - text: 定义的开火帧时其开火序列动画将会暂停直至延时计时器结束。
                      - listitem [ref=e4574]:
                        - paragraph [ref=e4575]:
                          - text: 若武器
                          - code [ref=e4576]: Burst
                          - text: "> 1 且"
                          - code [ref=e4577]: DelayedFire.OnlyOnInitialBurst
                          - text: 为 true 则延迟仅在首次发射前生效。注意若使用了 Ares 则开火被中断或开火者失去目标时
                          - code [ref=e4578]: Burst
                          - text: 索引不会重置，这意味着它可以无需等待延迟时间即可开火。
                - paragraph [ref=e4579]:
                  - text: 在
                  - code [ref=e4580]: rulesmd.ini
                  - text: ：
                - generic [ref=e4583]: "[SOMEWEAPON] ; WeaponType DelayedFire.Duration= ; integer - single or comma-sep. range (game frames) DelayedFire.SkipInTransport=false ; boolean DelayedFire.Animation= ; Animation DelayedFire.OpenToppedAnimation= ; Animation DelayedFire.AnimIsAttached=true ; boolean DelayedFire.AnimOffset= ; integer - Forward,Lateral,Height DelayedFire.AnimOnTurret=true ; boolean DelayedFire.CenterAnimOnFirer=false ; boolean DelayedFire.RemoveAnimOnNoDelay=false ; boolean DelayedFire.PauseFiringSequence=false ; boolean DelayedFire.OnlyOnInitialBurst=false ; boolean"
                - generic [ref=e4584]:
                  - paragraph [ref=e4585]:  备注
                  - paragraph [ref=e4586]: 战机类单位由于其独特的攻击模式并不会等待延迟结束后才尝试开火而是延迟过长时会不开火直接继续飞。
              - generic [ref=e4587]:
                - heading "额外射程 " [level=3] [ref=e4588]:
                  - text: 额外射程
                  - link "" [ref=e4589] [cursor=pointer]:
                    - /url: "#extra-range"
                - list [ref=e4590]:
                  - listitem [ref=e4591]:
                    - paragraph [ref=e4592]: 现在你可以在开火者或目标处于特定状态时调整武器的射程。此功能仅在攻击过程中有效且不影响例如寻路等其他行为。
                  - listitem [ref=e4593]:
                    - paragraph [ref=e4594]:
                      - code [ref=e4595]: ExtraRange.TargetMoving
                      - text: 当
                      - strong [ref=e4596]: 目标
                      - text: 正在移动时提供的额外射程。
                    - list [ref=e4597]:
                      - listitem [ref=e4598]:
                        - paragraph [ref=e4599]:
                          - code [ref=e4600]: ExtraRange.TargetMoving.CloseRangeOnly
                          - text: 用于全局默认值是否仅适用于拥有
                          - code [ref=e4601]: CloseRange=yes
                          - text: 的单位。
                  - listitem [ref=e4602]:
                    - paragraph [ref=e4603]:
                      - code [ref=e4604]: ExtraRange.FirerMoving
                      - text: 当
                      - strong [ref=e4605]: 开火者
                      - text: 正在移动时提供的额外射程。
                  - listitem [ref=e4606]:
                    - paragraph [ref=e4607]:
                      - code [ref=e4608]: ExtraRange.Prefiring
                      - text: 当开火者处于预开火状态时提供的额外射程，该状态包括：
                    - list [ref=e4609]:
                      - listitem [ref=e4610]:
                        - paragraph [ref=e4611]:
                          - text: 拥有
                          - code [ref=e4612]: FiringSyncFrame%d
                          - text: 等标签的载具。
                      - listitem [ref=e4613]:
                        - paragraph [ref=e4614]: 正在开火的飞行器。
                      - listitem [ref=e4615]:
                        - paragraph [ref=e4616]:
                          - text: 拥有
                          - code [ref=e4617]: IsAnimDelayedFire
                          - text: 等标签的建筑。
                      - listitem [ref=e4618]:
                        - paragraph [ref=e4619]:
                          - text: 拥有
                          - code [ref=e4620]: FireUp
                          - text: 等标签的步兵。
                      - listitem [ref=e4621]:
                        - paragraph [ref=e4622]:
                          - text: 任何拥有
                          - link "DelayedFire" [ref=e4623] [cursor=pointer]:
                            - /url: "#delayed-firing"
                            - code [ref=e4624]: DelayedFire
                          - text: 的单位。
                      - listitem [ref=e4625]:
                        - paragraph [ref=e4626]:
                          - code [ref=e4627]: ExtraRange.Prefiring.IncludeBurst
                          - text: 用于决定连发过程是否被视为预开火状态。
                - paragraph [ref=e4628]:
                  - text: 在
                  - code [ref=e4629]: rulesmd.ini
                  - text: ：
                - generic [ref=e4632]: "[General] ExtraRange.TargetMoving=0.0 ; float, range in cells ExtraRange.TargetMoving.CloseRangeOnly=false ; boolean ExtraRange.FirerMoving=0.0 ; float, range in cells ExtraRange.Prefiring=0.0 ; float, range in cells ExtraRange.Prefiring.IncludeBurst=true ; boolean [SOMEWEAPON] ; WeaponType ExtraRange.TargetMoving= ; float, range in cells, the default values refer to the descriptions above ExtraRange.FirerMoving= ; float, range in cells, default to [General] -> ExtraRange.FirerMoving ExtraRange.Prefiring= ; float, range in cells, default to [General] -> ExtraRange.Prefiring ExtraRange.Prefiring.IncludeBurst= ; boolean, default to [General] -> ExtraRange.Prefiring.IncludeBurst"
                - generic [ref=e4633]:
                  - paragraph [ref=e4634]:  备注
                  - list [ref=e4635]:
                    - listitem [ref=e4636]:
                      - paragraph [ref=e4637]: 在原版中，近战单位即便追得上正在逃离的敌人也难以对其发起攻击。这是因为游戏的寻路算法以单元格为单位寻找开火位置，这会对近战单位产生不可接受的误差，导致目标总是在其足够靠近前逃出攻击范围。
                    - listitem [ref=e4638]:
                      - paragraph [ref=e4639]: 具有各类预开火行为的单位也存在类似的问题。目标可能在单位开火前移出射程。
                    - listitem [ref=e4640]:
                      - paragraph [ref=e4641]: 此功能可解决上述问题。
              - generic [ref=e4642]:
                - heading "额外弹头 " [level=3] [ref=e4643]:
                  - text: 额外弹头
                  - link "" [ref=e4644] [cursor=pointer]:
                    - /url: "#extra-warhead-detonations"
                - list [ref=e4645]:
                  - listitem [ref=e4646]:
                    - paragraph [ref=e4647]:
                      - text: 现在可以通过列出
                      - code [ref=e4648]: ExtraWarheads
                      - text: 来让同一武器在命中时引爆多个弹头。这些弹头会在主弹头爆炸后按列出的顺序在同一位置引爆。这仅适用于由武器发射且引爆时仍保留其信息的抛射体（由于目前存在的技术限制，这不包括
                      - code [ref=e4649]: AirburstWeapon
                      - text: ）。
                    - list [ref=e4650]:
                      - listitem [ref=e4651]:
                        - paragraph [ref=e4652]:
                          - code [ref=e4653]: ExtraWarheads.DamageOverrides
                          - text: 可用于额外弹头引爆时覆盖武器的
                          - code [ref=e4654]: Damage
                          - text: 属性。如果找到
                          - code [ref=e4655]: ExtraWarheads
                          - text: 中与之对应的值则使用，否则使用最后列出的值。如果列表为空则使用武器的
                          - code [ref=e4656]: Damage
                          - text: 属性。
                      - listitem [ref=e4657]:
                        - paragraph [ref=e4658]:
                          - code [ref=e4659]: ExtraWarheads.DetonationChances
                          - text: 可用于自定义每个额外弹头爆炸的概率。如果找到
                          - code [ref=e4660]: ExtraWarheads
                          - text: 中与之对应的值则使用，否则使用最后列出的值。如果列表为空则每个额外弹头都必然引爆。
                      - listitem [ref=e4661]:
                        - paragraph [ref=e4662]:
                          - code [ref=e4663]: ExtraWarheads.FullDetonation
                          - text: 可用于设置每个额外弹头是否在目标上完全引爆（作为虚拟武器的一部分）或者只能对所在区域造成杀伤并应用 Phobos 的弹头效果。如果找到
                          - code [ref=e4664]: ExtraWarheads
                          - text: 中与之对应的值则使用，否则使用最后列出的值。如果列表为空则默认为 true。
                      - listitem [ref=e4665]:
                        - paragraph [ref=e4666]:
                          - text: 注意列出的弹头必须在
                          - code [ref=e4667]: "[Warheads]"
                          - text: 中列出才能生效。
                - paragraph [ref=e4668]:
                  - text: 在
                  - code [ref=e4669]: rulesmd.ini
                  - text: ：
                - generic [ref=e4672]: "[SOMEWEAPON] ; WeaponType ExtraWarheads= ; List of WarheadTypes ExtraWarheads.DamageOverrides= ; List of integers ExtraWarheads.DetonationChances= ; List of floating-point values (percentage or absolute) ExtraWarheads.FullDetonation= ; List of booleans"
              - generic [ref=e4673]:
                - heading "反馈武器 " [level=3] [ref=e4674]:
                  - text: 反馈武器
                  - link "" [ref=e4675] [cursor=pointer]:
                    - /url: "#feedback-weapon"
                - paragraph [ref=e4676]:
                  - img "图像" [ref=e4677]
                  - emphasis [ref=e4678]:
                    - link "幽灵计划" [ref=e4679] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/project-phantom
                    - text: 中使用反馈武器在发射武器时对目标施加治疗光环
                - list [ref=e4680]:
                  - listitem [ref=e4681]:
                    - paragraph [ref=e4682]: 现在你可以指定一个辅助武器在发射武器时对开火者自身发射。
                    - list [ref=e4683]:
                      - listitem [ref=e4684]:
                        - paragraph [ref=e4685]:
                          - text: 当原始武器于运输工具内的载员使用时反馈武器会根据自身的
                          - code [ref=e4686]: FireInTransport
                          - text: 决定能否发射。如果反馈武器被发射那么它将命中运输工具。注：
                          - code [ref=e4687]: OpenToppedDamageMultiplier
                          - text: 不适用于反馈武器。
                - paragraph [ref=e4688]:
                  - text: 在
                  - code [ref=e4689]: rulesmd.ini
                  - text: ：
                - generic [ref=e4692]: "[SOMEWEAPON] ; WeaponType FeedbackWeapon= ; WeaponType"
              - generic [ref=e4693]:
                - heading "开火后保持距离 " [level=3] [ref=e4694]:
                  - text: 开火后保持距离
                  - link "" [ref=e4695] [cursor=pointer]:
                    - /url: "#keep-range-after-firing"
                - list [ref=e4696]:
                  - listitem [ref=e4697]:
                    - paragraph [ref=e4698]:
                      - text: 如果
                      - code [ref=e4699]: KeepRange
                      - text: 没有设为 0 那么科技类型可以在开火后与目标保持适当的距离。
                    - list [ref=e4700]:
                      - listitem [ref=e4701]:
                        - paragraph [ref=e4702]:
                          - code [ref=e4703]: KeepRange
                          - text: 的绝对值控制科技类型 ROF 期间要保持的距离。对于正值会让科技类型保持在该距离之外，就像它有一个开火后的
                          - code [ref=e4704]: MinimumRange
                          - text: 。对于负值则科技类型会尽可能保持在该距离附近，就像它有一个开火后的特殊
                          - code [ref=e4705]: Range
                          - text: 。此外如果有效射程区间太小单位将被视为无法开火。最好有一个 1.0 长度的有效射程，对步兵而言为 2.0。
                        - list [ref=e4706]:
                          - listitem [ref=e4707]:
                            - paragraph [ref=e4708]:
                              - code [ref=e4709]: KeepRange.AllowAI
                              - text: 控制此功能是否对 AI 玩家生效。
                          - listitem [ref=e4710]:
                            - paragraph [ref=e4711]:
                              - code [ref=e4712]: KeepRange.AllowPlayer
                              - text: 控制此功能是否对人类玩家生效。
                          - listitem [ref=e4713]:
                            - paragraph [ref=e4714]:
                              - text: 如果单位开火剩余 CD 短于
                              - code [ref=e4715]: KeepRange.EarlyStopFrame
                              - text: 的时间则该功能不会生效。
                - generic [ref=e4716]:
                  - paragraph [ref=e4717]:  备注
                  - paragraph [ref=e4718]:
                    - text: 也就是说执行 KeepRange 效果的总时长 = 武器
                    - code [ref=e4719]: ROF
                    - text: 的值 -
                    - code [ref=e4720]: KeepRange.EarlyStopFrame
                    - text: 的值。
                - paragraph [ref=e4721]:
                  - text: 在
                  - code [ref=e4722]: rulesmd.ini
                  - text: ：
                - generic [ref=e4725]: "[SOMEWEAPON] ; WeaponType KeepRange=0 ; floating point value KeepRange.AllowAI=false ; boolean KeepRange.AllowPlayer=false ; boolean KeepRange.EarlyStopFrame=0 ; integer"
              - generic [ref=e4726]:
                - heading "OmniFire=yes 下转向 " [level=3] [ref=e4727]:
                  - code [ref=e4728]: OmniFire=yes
                  - text: 下转向
                  - link "" [ref=e4729] [cursor=pointer]:
                    - /url: "#make-units-try-turning-to-target-when-firing-with-omnifire-yes"
                - list [ref=e4730]:
                  - listitem [ref=e4731]:
                    - paragraph [ref=e4732]:
                      - text: 即便使用
                      - code [ref=e4733]: OmniFire=yes
                      - text: 的武器开火单位也会尝试将车体转向目标。
                    - list [ref=e4734]:
                      - listitem [ref=e4735]:
                        - paragraph [ref=e4736]:
                          - text: 建议 Jumpjet 的
                          - code [ref=e4737]: ROT
                          - text: 和
                          - code [ref=e4738]: JumpjetTurnRate
                          - text: 相同。
                - paragraph [ref=e4739]:
                  - text: 在
                  - code [ref=e4740]: rulesmd.ini
                  - text: ：
                - generic [ref=e4743]: "[SOMEWEAPON] ; WeaponType, with OmniFire=yes OmniFire.TurnToTarget=no ; boolean"
              - generic [ref=e4744]:
                - heading "辐射增强 " [level=3] [ref=e4745]:
                  - text: 辐射增强
                  - link "" [ref=e4746] [cursor=pointer]:
                    - /url: "#radiation-enhancements"
                - list [ref=e4747]:
                  - listitem [ref=e4748]:
                    - paragraph [ref=e4749]:
                      - text: 除了允许自定义辐射类型外还有对于默认辐射类型
                      - code [ref=e4750]: "[Radiation]"
                      - text: 的增强，例如可以设置所有者与开火者或对建筑造成伤害。详见
                      - link "自定义辐射类型" [ref=e4751] [cursor=pointer]:
                        - /url: "#custom-radiation-types"
                      - text: 。
              - generic [ref=e4752]:
                - heading "圆柱形射程 " [level=3] [ref=e4753]:
                  - text: 圆柱形射程
                  - link "" [ref=e4754] [cursor=pointer]:
                    - /url: "#range-finding-in-cylinder"
                - list [ref=e4755]:
                  - listitem [ref=e4756]:
                    - paragraph [ref=e4757]: 在原版中，处于空中的单位在检查目标是否处于射程内时会忽略 Z 轴的距离。现在你可以用下面的语句使单位总是这样进行射程计算。
                  - listitem [ref=e4758]:
                    - paragraph [ref=e4759]:
                      - text: 用
                      - code [ref=e4760]: "[General] -> CylinderRangefinding"
                      - text: 进行全局控制，也可在每个武器上自定义。
                  - listitem [ref=e4761]:
                    - paragraph [ref=e4762]:
                      - text: 注意将语句设为
                      - code [ref=e4763]: "false"
                      - text: 意味着「使用默认规则」而不是「禁用」。空中单位无论此值如何始终使用圆柱形射程。
                - paragraph [ref=e4764]:
                  - text: 在
                  - code [ref=e4765]: rulesmd.ini
                  - text: ：
                - generic [ref=e4768]: "[General] CylinderRangefinding=false ; boolean [SOMEWEAPON] ; WeaponType CylinderRangefinding= ; boolean"
              - generic [ref=e4769]:
                - heading "自定义战机扫射 " [level=3] [ref=e4770]:
                  - text: 自定义战机扫射
                  - link "" [ref=e4771] [cursor=pointer]:
                    - /url: "#strafing-aircraft-weapon-customization"
                - paragraph [ref=e4772]:
                  - img "图像" [ref=e4773]
                  - emphasis [ref=e4774]:
                    - link "幽灵计划" [ref=e4775] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/project-phantom
                    - text: 中的自定义战机扫射武器
                - list [ref=e4776]:
                  - listitem [ref=e4777]:
                    - paragraph [ref=e4778]: 现在可以自定义战机扫射武器的一些行为。
                    - list [ref=e4779]:
                      - listitem [ref=e4780]:
                        - paragraph [ref=e4781]:
                          - code [ref=e4782]: Strafing
                          - text: 控制战机在目标射击时是否可以扫射。如果抛射体
                          - code [ref=e4783]: ROT
                          - text: < 2 且
                          - code [ref=e4784]: Inviso=false
                          - text: 并且没有
                          - code [ref=e4785]: Trajectory
                          - text: 则默认为
                          - code [ref=e4786]: "true"
                          - text: 其他情况为
                          - code [ref=e4787]: "false"
                          - text: 。
                      - listitem [ref=e4788]:
                        - paragraph [ref=e4789]:
                          - code [ref=e4790]: Strafing.Shots
                          - text: 控制在单次扫射过程中武器发射的次数，如果未设置则默认为 5。
                          - code [ref=e4791]: Ammo
                          - text: 只会在扫射结束后扣除一次，无论实际多少次。
                      - listitem [ref=e4792]:
                        - paragraph [ref=e4793]:
                          - code [ref=e4794]: Strafing.SimulateBurst
                          - text: 控制在扫射过程中发射的武器是否模拟
                          - code [ref=e4795]: Burst
                          - text: 的行为，即允许交替开火坐标。仅当武器
                          - code [ref=e4796]: Burst
                          - text: 设置为 1 或未定义时才有效。
                      - listitem [ref=e4797]:
                        - paragraph [ref=e4798]:
                          - code [ref=e4799]: Strafing.UseAmmoPerShot
                          - text: 如果设为
                          - code [ref=e4800]: "true"
                          - text: 将在每次开火后都扣除弹药而不是通常的仅在扫射结束后才扣除弹药。
                      - listitem [ref=e4801]:
                        - paragraph [ref=e4802]:
                          - code [ref=e4803]: Strafing.TargetCell
                          - text: 控制战机是否会在第一发后将目标切换为地板以确保与
                          - code [ref=e4804]: Strafing.Shots
                          - text: 设定的次数一致。也就是扫射不再会由于目标被摧毁而中断。
                      - listitem [ref=e4805]:
                        - paragraph [ref=e4806]:
                          - code [ref=e4807]: Strafing.EndDelay
                          - text: 可用于覆盖战机在扫射过程中射出最后一发后进行另一轮扫射或返航前的时间间隔。默认为 (
                          - code [ref=e4808]: "[WeaponType] -> Range"
                          - text: "* 256 + 1024) /"
                          - code [ref=e4809]: "[AircraftType] -> Speed"
                          - text: 。注意对于弹药量足够进行多次扫射的战机而言过短的间隔可能导致并不理想的行为例如四处游走或朝向怪异的方向，具体取决于
                          - code [ref=e4810]: "[WeaponType] -> ROF"
                          - text: 和
                          - code [ref=e4811]: "[AircraftType] -> Speed"
                          - text: 等其他因素。
                  - listitem [ref=e4812]:
                    - paragraph [ref=e4813]:
                      - text: 对于
                      - code [ref=e4814]: Type=SpyPlane
                      - text: 超级武器生成的战机在
                      - code [ref=e4815]: SpyPlane Approach
                      - text: 或
                      - code [ref=e4816]: SpyPlane Overfly
                      - text: 任务中的情况
                      - code [ref=e4817]: Strafing.Shots
                      - text: 只有在其主武器上手动设置才会生效并决定地图揭示效果的最大次数而无视其他因素。
                - paragraph [ref=e4818]:
                  - text: 在
                  - code [ref=e4819]: rulesmd.ini
                  - text: ：
                - generic [ref=e4822]: "[SOMEWEAPON] ; WeaponType Strafing= ; boolean Strafing.Shots= ; integer Strafing.SimulateBurst=false ; boolean Strafing.UseAmmoPerShot=false ; boolean Strafing.TargetCell=false ; boolean Strafing.EndDelay= ; integer, game frames"
              - generic [ref=e4823]:
                - heading "视觉效果散布 " [level=3] [ref=e4824]:
                  - text: 视觉效果散布
                  - link "" [ref=e4825] [cursor=pointer]:
                    - /url: "#visual-effect-scatter"
                - list [ref=e4826]:
                  - listitem [ref=e4827]:
                    - paragraph [ref=e4828]:
                      - text: 现在你可以在
                      - code [ref=e4829]: VisualScatter
                      - text: 设为 true 时为视觉效果（
                      - code [ref=e4830]: IsLaser=true
                      - text: 、
                      - code [ref=e4831]: IsElectricBolt=true
                      - text: 或
                      - code [ref=e4832]: IsRadBeam=true
                      - text: ）添加一个随机偏移。
                - paragraph [ref=e4833]:
                  - text: 在
                  - code [ref=e4834]: rulesmd.ini
                  - text: ：
                - generic [ref=e4837]: "[AudioVisual] VisualScatter.Min=0.03 ; floating point value, distance in cells VisualScatter.Max=0.13 ; floating point value, distance in cells [SOMEWEAPON] ; WeaponType VisualScatter=false ; boolean"
                - generic [ref=e4838]:
                  - paragraph [ref=e4839]:  备注
                  - paragraph [ref=e4840]:
                    - text: 此功能仅叠加到
                    - strong [ref=e4841]: 视觉效果
                    - text: 原本的散布上，也就是说它独立于
                    - code [ref=e4842]: BallisticScatter.(Min/Max)
                    - text: 且可共同使用，不会影响抛射体实际爆点的散布。
              - generic [ref=e4843]:
                - heading "武器瞄准筛选 " [level=3] [ref=e4844]:
                  - text: 武器瞄准筛选
                  - link "" [ref=e4845] [cursor=pointer]:
                    - /url: "#weapon-targeting-filter"
                - paragraph [ref=e4846]:
                  - img "图像" [ref=e4847]
                  - emphasis [ref=e4848]:
                    - link "幽灵计划" [ref=e4849] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/project-phantom
                    - text: 中的武器瞄准筛选 - 就像分别对单位和建筑使用那样对敌军和友军使用不同武器
                - list [ref=e4850]:
                  - listitem [ref=e4851]:
                    - paragraph [ref=e4852]: 现在你可以指定武器可以开火的目标或所属方。这还会影响武器选择，除了某些特殊情况下的固定选择。
                    - list [ref=e4853]:
                      - listitem [ref=e4854]:
                        - paragraph [ref=e4855]:
                          - code [ref=e4856]: CanTarget.MaxHealth
                          - text: 和
                          - code [ref=e4857]: CanTarget.MinHealth
                          - text: 用于设置可被攻击的（仅单位）目标所需的血量阈值，分别要求目标血量必须高于和／或低于／等于的限制。若目标血量为 0 则跳过检查。
                - paragraph [ref=e4858]:
                  - text: 在
                  - code [ref=e4859]: rulesmd.ini
                  - text: ：
                - generic [ref=e4862]: "[SOMEWEAPON] ; WeaponType CanTarget=all ; List of Affected Target Enumeration (none|land|water|empty|infantry|units|buildings|all) CanTargetHouses=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) CanTarget.MaxHealth=1.0 ; floating point value, percents or absolute CanTarget.MinHealth=0.0 ; floating point value, percents or absolute CanTargetVeterancy=all ; List of Affected Veterancy Enumeration (none|rookie|veteran|elite|all)"
                - generic [ref=e4863]:
                  - paragraph [ref=e4864]:  备注
                  - paragraph [ref=e4865]:
                    - code [ref=e4866]: CanTarget
                    - text: 要求明确列出
                    - code [ref=e4867]: all
                    - text: 或
                    - code [ref=e4868]: empty
                    - text: 才能对不包含任何科技类型的单元格开火。
