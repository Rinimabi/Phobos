          - generic [ref=e93]:
            - heading "新增或增强的逻辑 " [level=1] [ref=e94]:
              - text: 新增或增强的逻辑
              - link "" [ref=e95] [cursor=pointer]:
                - /url: "#new-enhanced-logics"
            - paragraph [ref=e96]: 此页面列出了 Phobos 新增的引擎功能或着重扩展的旧有逻辑。
            - generic [ref=e97]:
              - heading "新类型或游戏内实体 " [level=2] [ref=e98]:
                - text: 新类型或游戏内实体
                - link "" [ref=e99] [cursor=pointer]:
                  - /url: "#new-types-ingame-entities"
              - generic [ref=e100]:
                - heading "新的 AE 逻辑 " [level=3] [ref=e101]:
                  - text: 新的 AE 逻辑
                  - link "" [ref=e102] [cursor=pointer]:
                    - /url: "#attached-effects"
                - list [ref=e103]:
                  - listitem [ref=e104]:
                    - paragraph [ref=e105]:
                      - text: 类似于
                      - link "Ares 的 AttachEffect" [ref=e106] [cursor=pointer]:
                        - /url: https://ares-developers.github.io/Ares-docs/new/attacheffect.html
                      - text: ，但是有一些差异和新特性。最大的不同在于这里的 Attach Effect 是一个需要明确定义的新类型。
                    - list [ref=e107]:
                      - listitem [ref=e108]:
                        - paragraph [ref=e109]:
                          - code [ref=e110]: Duration
                          - text: 决定了 AE 的持续时长。它可以被科技类型和弹头上的
                          - code [ref=e111]: DurationOverrides
                          - text: 覆盖。
                        - list [ref=e112]:
                          - listitem [ref=e113]:
                            - paragraph [ref=e114]:
                              - text: 如果
                              - code [ref=e115]: Duration.ApplyFirepowerMult
                              - text: 设为 true，那么持续时间会乘以调用者的火力加成倍率，前提是倍率非负。即无法通过负值火力加成倍率将持续时间降低至 0 以下。
                          - listitem [ref=e116]:
                            - paragraph [ref=e117]:
                              - text: 如果
                              - code [ref=e118]: Duration.ApplyArmorMultOnTarget
                              - text: 设为 true，那么持续时间会除以调用者的装甲加成倍率，前提是倍率非负。即无法通过负值装甲加成倍率将持续时间降至 0 以下。此处计算会考虑目标自身的
                              - code [ref=e119]: ArmorMultiplier
                              - text: 并忽略
                              - code [ref=e120]: ArmorMultiplier.Allow/DisallowWarheads
                              - text: 。
                      - listitem [ref=e121]:
                        - paragraph [ref=e122]:
                          - code [ref=e123]: Cumulative
                          - text: 如果设为 true，那么允许在同一对象上多次赋予相同类型的 AE，上限取决于
                          - code [ref=e124]: Cumulative.MaxCount
                          - text: 的值，如果
                          - code [ref=e125]: Cumulative.MaxCount
                          - text: 是一个负数则没有上限。如果目标已经有了
                          - code [ref=e126]: Cumulative.MaxCount
                          - text: 个相同类型的 AE，那么再赋予同类 AE 将会刷新所剩持续时间最短的已有 AE 的剩余持续时间。
                      - listitem [ref=e127]:
                        - paragraph [ref=e128]:
                          - code [ref=e129]: Powered
                          - text: 控制如果附加的对象罢工（
                          - code [ref=e130]: PoweredUnit
                          - text: 或者正处于 EMP 中）或缺少电力支持时 AE 是否同样会进入非活动状态。动画的行为由
                          - code [ref=e131]: Animation.OfflineAction
                          - text: 控制。
                      - listitem [ref=e132]:
                        - paragraph [ref=e133]:
                          - code [ref=e134]: DiscardOn
                          - text: 是一个控制什么情况下弃用该 AE 的条件列表。默认为
                          - code [ref=e135]: none
                          - text: 表示永远不会弃用。
                        - list [ref=e136]:
                          - listitem [ref=e137]:
                            - paragraph [ref=e138]:
                              - code [ref=e139]: entry
                              - text: ：当进入运输工具或建筑等而从地图上消失时弃用。
                          - listitem [ref=e140]:
                            - paragraph [ref=e141]:
                              - code [ref=e142]: move
                              - text: ：当 AE 所附加的对象移动时弃用。如果对象是建筑则忽略。
                          - listitem [ref=e143]:
                            - paragraph [ref=e144]:
                              - code [ref=e145]: stationary
                              - text: ：当 AE 所附加的对象停止移动时弃用。如果对象是建筑则忽略。
                          - listitem [ref=e146]:
                            - paragraph [ref=e147]:
                              - code [ref=e148]: drain
                              - text: ：当对象受到一个带有
                              - code [ref=e149]: DrainWeapon=true
                              - text: 的武器影响时弃用。
                          - listitem [ref=e150]:
                            - paragraph [ref=e151]:
                              - code [ref=e152]: inrange
                              - text: ：当对象处于当前目标的武器射程内则弃用。距离可以通过
                              - code [ref=e153]: DiscardOn.RangeOverride
                              - text: 覆盖。
                          - listitem [ref=e154]:
                            - paragraph [ref=e155]:
                              - code [ref=e156]: outofrange
                              - text: ：当对象处于当前目标的武器射程外则弃用。距离可以通过
                              - code [ref=e157]: DiscardOn.RangeOverride
                              - text: 覆盖。
                          - listitem [ref=e158]:
                            - paragraph [ref=e159]:
                              - code [ref=e160]: firing
                              - text: ：当对象开火时弃用。这包括那些实际上并未开火的特殊武器，例如带有
                              - code [ref=e161]: Spawner=true
                              - text: 或
                              - code [ref=e162]: DrainWeapon=true
                              - text: 的武器。
                      - listitem [ref=e163]:
                        - paragraph [ref=e164]:
                          - text: 如果
                          - code [ref=e165]: PenetratesIronCurtain
                          - text: 没有设为 true，AE 不会应用在当前被铁幕保护的对象上。
                        - list [ref=e166]:
                          - listitem [ref=e167]:
                            - paragraph [ref=e168]:
                              - code [ref=e169]: PenetratesForceShield
                              - text: 可以用于为处于力场护盾保护中的对象分离控制，默认为
                              - code [ref=e170]: PenetratesIronCurtain
                              - text: 的值。
                      - listitem [ref=e171]:
                        - paragraph [ref=e172]:
                          - text: 如果
                          - code [ref=e173]: AffectTypes
                          - text: 设为非空列表，则 AE 仅对列出的特定单位生效。若未设置或为空则不执行白名单过滤。此项检查具有最高优先级。
                      - listitem [ref=e174]:
                        - paragraph [ref=e175]:
                          - text: 如果
                          - code [ref=e176]: IgnoreTypes
                          - text: 设为非空列表，则 AE 不对列出的特定单位生效。若未设置或为空则不执行黑名单过滤。此项检查在
                          - code [ref=e177]: AffectTypes
                          - text: 之后执行。
                      - listitem [ref=e178]:
                        - paragraph [ref=e179]:
                          - text: 如果
                          - code [ref=e180]: AffectsTarget
                          - text: 设为非空列表，则 AE 仅可对特定大类目标生效（例如步兵、载具、战机、建筑）。此项检查在两个类型名单过滤之后执行。
                      - listitem [ref=e181]:
                        - paragraph [ref=e182]:
                          - code [ref=e183]: Animation
                          - text: 定义一个只要 AE 所附加的对象处于活动状态就会一直循环播放的动画。
                        - list [ref=e184]:
                          - listitem [ref=e185]:
                            - paragraph [ref=e186]:
                              - text: 如果
                              - code [ref=e187]: Animation.ResetOnReapply
                              - text: 设为 true，当
                              - code [ref=e188]: Cumulative=false
                              - text: 时再次赋予 AE 会重设动画。
                          - listitem [ref=e189]:
                            - paragraph [ref=e190]:
                              - code [ref=e191]: Animation.OfflineAction
                              - text: 决定当 AE 所附加的对象处于非活动状态或电力不足时动画的行为。仅当
                              - code [ref=e192]: Powered=true
                              - text: 时有效。
                          - listitem [ref=e193]:
                            - paragraph [ref=e194]:
                              - code [ref=e195]: Animation.TemporalAction
                              - text: 决定当 AE 所附加的对象被
                              - code [ref=e196]: Temporal=true
                              - text: 的弹头冻结时动画的行为。
                          - listitem [ref=e197]:
                            - paragraph [ref=e198]:
                              - code [ref=e199]: Animation.UseInvokerAsOwner
                              - text: 可以设置创建该效果的所属方和科技类型（例如武器的发射者）为 AE 动画的所有者和调用者而不是 AE 所附加的对象。
                          - listitem [ref=e200]:
                            - paragraph [ref=e201]:
                              - code [ref=e202]: Animation.HideIfAttachedWith
                              - text: 包含一个如果与此 AE 附加到同一个科技类型时会导致此 AE 动画隐藏的 AE 类型列表。
                      - listitem [ref=e203]:
                        - paragraph [ref=e204]:
                          - code [ref=e205]: CumulativeAnimations
                          - text: 可用于声明一个在
                          - code [ref=e206]: Cumulative=true
                          - text: 类 AE 上替代
                          - code [ref=e207]: Animation
                          - text: 语句使用的动画列表。列表中的动画索引对应叠加的层数，如果层数超过列表中的动画数量则使用最后一个动画。此动画会在 AE 层数变化时更换成另一个对应层数的动画。注意由于
                          - code [ref=e208]: Cumulative.MaxCount
                          - text: 限制了可以叠加的 AE 类型数量，这可能导致某些情况下动画在 AE 过期之前闪现。
                        - list [ref=e209]:
                          - listitem [ref=e210]:
                            - paragraph [ref=e211]:
                              - code [ref=e212]: CumulativeAnimations.RestartOnChange
                              - text: 决定当 AE 层数改变时是否重设动画，如果为
                              - code [ref=e213]: "false"
                              - text: 则从上个动画相同长度的位置开始播放。例如使用两个图形相同但颜色不同的原版动画
                              - code [ref=e214]: "[RING1]"
                              - text: 和
                              - code [ref=e215]: "[PDFXLOC]"
                              - text: 那么默认层数变化时另一个动画从起始帧开始播放，而如果该句改为
                              - code [ref=e216]: "false"
                              - text: 那么视觉上将会表现为动画在层数改变时变成了另一种颜色继续播放。
                      - listitem [ref=e217]:
                        - paragraph [ref=e218]:
                          - text: AE 可以在自然结束／被移除／对象死亡时通过设置
                          - code [ref=e219]: ExpireWeapon
                          - text: 发射一个武器。
                        - list [ref=e220]:
                          - listitem [ref=e221]:
                            - paragraph [ref=e222]:
                              - code [ref=e223]: ExpireWeapon.TriggerOn
                              - text: 决定触发发射武器的条件，如果为
                              - code [ref=e224]: expire
                              - text: 则意味着只有当 AE 自然结束时才会触发。
                          - listitem [ref=e225]:
                            - paragraph [ref=e226]:
                              - code [ref=e227]: ExpireWeapon.CumulativeOnlyOnce
                              - text: 如果设为 true，则
                              - code [ref=e228]: Cumulative=true
                              - text: 的 AE 只会整体触发一次，而不是每层 AE 都触发。在
                              - code [ref=e229]: remove
                              - text: 和
                              - code [ref=e230]: expire
                              - text: 条件下这会让它们只在最后一层 AE 自然结束或被移除后触发。
                          - listitem [ref=e231]:
                            - paragraph [ref=e232]:
                              - code [ref=e233]: ExpireWeapon.UseInvokerAsOwner
                              - text: 可以设置创建该效果的所属方和科技类型（例如武器的发射者）为
                              - code [ref=e234]: ExpireWeapon
                              - text: 的所有者和调用者而不是 AE 所附加的对象。
                      - listitem [ref=e235]:
                        - paragraph [ref=e236]:
                          - code [ref=e237]: Tint.Color
                          - text: 和
                          - code [ref=e238]: Tint.Intensity
                          - text: 可用于设置一个染色效果和染色的光效强度。
                        - list [ref=e239]:
                          - listitem [ref=e240]:
                            - paragraph [ref=e241]:
                              - code [ref=e242]: Tint.VisibleToHouses
                              - text: 可用于控制哪些所属方可见这些染色效果。
                      - listitem [ref=e243]:
                        - paragraph [ref=e244]:
                          - code [ref=e245]: FirepowerMultiplier
                          - text: 、
                          - code [ref=e246]: ArmorMultiplier
                          - text: 、
                          - code [ref=e247]: SpeedMultiplier
                          - text: 和
                          - code [ref=e248]: ROFMultiplier
                          - text: 分别修改对象的火力、护甲强度、移动速度和武器装填速度。
                        - list [ref=e249]:
                          - listitem [ref=e250]:
                            - paragraph [ref=e251]:
                              - code [ref=e252]: ArmorMultiplier.AllowWarheads
                              - text: 和
                              - code [ref=e253]: ArmorMultiplier.DisallowWarheads
                              - text: 可用于限制护甲倍率在哪些弹头造成杀伤时生效。
                          - listitem [ref=e254]:
                            - paragraph [ref=e255]:
                              - text: 如果
                              - code [ref=e256]: ROFMultiplier.ApplyOnCurrentTimer
                              - text: 设为 true，
                              - code [ref=e257]: ROFMultiplier
                              - text: 会在 AE 首次赋予时就对当前正在使用的武器装填计时器生效而不是等到下一次。
                      - listitem [ref=e258]:
                        - paragraph [ref=e259]:
                          - text: 如果
                          - code [ref=e260]: Cloakable
                          - text: 设为 true，被附加 AE 的对象在 AE 生效期间获得隐形能力。
                      - listitem [ref=e261]:
                        - paragraph [ref=e262]:
                          - text: 如果
                          - code [ref=e263]: ForceDecloak
                          - text: 设为 true，被附加 AE 的对象在 AE 生效期间强制显形。
                      - listitem [ref=e264]:
                        - paragraph [ref=e265]:
                          - code [ref=e266]: WeaponRange.Multiplier
                          - text: 和
                          - code [ref=e267]: WeaponRange.ExtraRange
                          - text: 可分别用于乘算或加算（以单元格为单位）所附加对象的武器射程。
                          - code [ref=e268]: ExtraRange
                          - text: 会在所有 AE 的
                          - code [ref=e269]: Multiplier
                          - text: 值叠加后叠加计算。
                        - list [ref=e270]:
                          - listitem [ref=e271]:
                            - paragraph [ref=e272]:
                              - code [ref=e273]: WeaponRange.AllowWeapons
                              - text: 和
                              - code [ref=e274]: WeaponRange.DisallowWeapons
                              - text: 分别设定哪些武器可以／不可以获得上述射程加成。
                          - listitem [ref=e275]:
                            - paragraph [ref=e276]:
                              - text: 对于拥有
                              - code [ref=e277]: OpenTopped=true
                              - text: 的科技类型，
                              - code [ref=e278]: OpenTopped.UseTransportRangeModifiers
                              - text: 可以设为 true 以使载员同步获得运输工具所获得的射程加成。
                      - listitem [ref=e279]:
                        - paragraph [ref=e280]:
                          - code [ref=e281]: Crit.Multiplier
                          - text: 和
                          - code [ref=e282]: Crit.ExtraChance
                          - text: 可以分别乘算或加算 AE 所附加对象的
                          - link "暴击" [ref=e283] [cursor=pointer]:
                            - /url: "#chance-based-extra-damage-or-warhead-detonation-critical-hits"
                          - text: 概率。
                        - list [ref=e284]:
                          - listitem [ref=e285]:
                            - paragraph [ref=e286]:
                              - code [ref=e287]: Crit.AllowWarheads
                              - text: 和
                              - code [ref=e288]: Crit.DisallowWarheads
                              - text: 可分别列出哪些弹头可以／不可以获得上述暴击概率加成。
                      - listitem [ref=e289]:
                        - paragraph [ref=e290]:
                          - code [ref=e291]: RevengeWeapon
                          - text: 可用于通过 AE 为被附加对象设置一个临时的
                          - link "复仇武器" [ref=e292] [cursor=pointer]:
                            - /url: "#revenge-weapon"
                          - text: 。
                        - list [ref=e293]:
                          - listitem [ref=e294]:
                            - paragraph [ref=e295]:
                              - code [ref=e296]: RevengeWeapon.AffectsHouse
                              - text: 定义哪些所属方可以触发这个复仇武器。
                          - listitem [ref=e297]:
                            - paragraph [ref=e298]:
                              - code [ref=e299]: RevengeWeapon.UseInvokerAsOwner
                              - text: 可以设置创建该效果的所属方和科技类型（例如武器的发射者）为
                              - code [ref=e300]: RevengeWeapon
                              - text: 的所有者和调用者而不是 AE 所附加的对象。
                      - listitem [ref=e301]:
                        - paragraph [ref=e302]:
                          - code [ref=e303]: ReflectDamage
                          - text: 可设为 true 以使 AE 所附加对象所受的任何正值杀伤反弹回攻击者。
                          - code [ref=e304]: ReflectDamage.Warhead
                          - text: 决定用于反弹伤害的弹头，默认读取自
                          - code [ref=e305]: "[CombatDamage] -> C4Warhead"
                          - text: 。如果
                          - code [ref=e306]: ReflectDamage.Warhead.Detonate
                          - text: 设为 true 那么弹头可以完整的引爆而不仅仅用于造成杀伤。
                          - code [ref=e307]: ReflectDamage.Chance
                          - text: 决定触发反弹的几率，
                          - code [ref=e308]: ReflectDamage.Multiplier
                          - text: 是反弹回的伤害值相对于所接收的伤害值的倍率，而
                          - code [ref=e309]: ReflectDamage.Override
                          - text: 则定义反弹回了一个固定大小的伤害量。反弹效果不会被另一个反弹来的伤害所触发。
                        - list [ref=e310]:
                          - listitem [ref=e311]:
                            - paragraph [ref=e312]:
                              - text: 可以将弹头的
                              - code [ref=e313]: SuppressReflectDamage
                              - text: 设为 true 来避免触发伤害反弹效果。
                              - code [ref=e314]: SuppressReflectDamage.Types
                              - text: 可以控制哪些 AE 类型的反弹伤害效果会被抑制。如果留空则代表所有 AE 类型。
                              - code [ref=e315]: SuppressReflectDamage.Groups
                              - text: 的作用与此相同，但用于所列分组名下的所有 AE 类型。
                          - listitem [ref=e316]:
                            - paragraph [ref=e317]:
                              - code [ref=e318]: ReflectDamage.UseInvokerAsOwner
                              - text: 可以设置创建该效果的所属方和科技类型（例如武器的发射者）为
                              - code [ref=e319]: ReflectDamage
                              - text: 的所有者和调用者而不是 AE 所附加的对象。
                      - listitem [ref=e320]:
                        - paragraph [ref=e321]:
                          - code [ref=e322]: DisableWeapons
                          - text: 可用于禁用 AE 附加对象的所有武器。
                        - list [ref=e323]:
                          - listitem [ref=e324]:
                            - paragraph [ref=e325]:
                              - text: 在拥有
                              - code [ref=e326]: OpenTopped=true
                              - text: 的科技类型上，
                              - code [ref=e327]: OpenTopped.CheckTransportDisableWeapons
                              - text: 可设为 true 以使载员在运输工具受
                              - code [ref=e328]: DisableWeapons
                              - text: 影响期间同步禁言效果。
                      - listitem [ref=e329]:
                        - paragraph [ref=e330]:
                          - code [ref=e331]: Unkillable
                          - text: 可用于防止科技类型因受到伤害而死亡（最低为 1）。
                      - listitem [ref=e332]:
                        - paragraph [ref=e333]:
                          - text: 可以通过在
                          - code [ref=e334]: Groups
                          - text: 中定义字符串来为 AE 类型设置分组。
                        - list [ref=e335]:
                          - listitem [ref=e336]:
                            - paragraph [ref=e337]: 组别可用于在移除 AE 和武器过滤时替代类型参与计算。
                  - listitem [ref=e338]:
                    - paragraph [ref=e339]:
                      - text: AE 可以通过
                      - code [ref=e340]: AttachEffect.AttachTypes
                      - text: 在科技类型上赋予。
                    - list [ref=e341]:
                      - listitem [ref=e342]:
                        - paragraph [ref=e343]:
                          - code [ref=e344]: AttachEffect.DurationOverrides
                          - text: 可用于覆盖 AE 自身所写的默认
                          - code [ref=e345]: Duration
                          - text: 。该列表中的值与
                          - code [ref=e346]: AttachTypes
                          - text: 中的 AE 类型一一对应，如果一个 AE 类型没有对应的项目则使用该列表中的最后一个。
                      - listitem [ref=e347]:
                        - paragraph [ref=e348]:
                          - code [ref=e349]: AttachEffect.Delays
                          - text: 可用于设置 AE 在科技类型上自然结束后重新创建所需的时间间隔。默认为 0（立即），负值表示 AE 不会被重新创建。该列表中的值与
                          - code [ref=e350]: AttachTypes
                          - text: 中的 AE 类型一一对应，如果一个 AE 类型没有对应的项目则使用该列表中的最后一个。
                      - listitem [ref=e351]:
                        - paragraph [ref=e352]:
                          - code [ref=e353]: AttachEffect.InitialDelays
                          - text: 可用于设置 AE 在科技类型上首次创建所需的初始间隔。默认为 0（立即）。该列表中的值与
                          - code [ref=e354]: AttachTypes
                          - text: 中的 AE 类型一一对应，如果一个 AE 类型没有对应的项目则使用该列表中的最后一个。
                      - listitem [ref=e355]:
                        - paragraph [ref=e356]:
                          - code [ref=e357]: AttachEffect.RecreationDelays
                          - text: 用于决定如果 AE 被完全移除（例如使用
                          - code [ref=e358]: AttachEffect.RemoveTypes
                          - text: ）是否可以重新创建 AE，如果可以则这里设置了重新创建所需的时间间隔。默认为 -1 表示不允许重新创建。该列表中的值与
                          - code [ref=e359]: AttachTypes
                          - text: 中的 AE 类型一一对应，如果一个 AE 类型没有对应的项目则使用该列表中的最后一个。
                        - list [ref=e360]:
                          - listitem [ref=e361]:
                            - paragraph [ref=e362]:
                              - text: 需要注意的是
                              - code [ref=e363]: InitialDelays
                              - text: 或
                              - code [ref=e364]: RecreationDelays
                              - text: 在由于
                              - code [ref=e365]: DiscardOn
                              - text: 导致 AE 当前不生效的情况下都不会进行计时。
                  - listitem [ref=e366]:
                    - paragraph [ref=e367]:
                      - text: AE 可以通过
                      - code [ref=e368]: AttachEffect.AttachTypes
                      - text: 被弹头上赋予给其他对象。
                    - list [ref=e369]:
                      - listitem [ref=e370]:
                        - paragraph [ref=e371]:
                          - code [ref=e372]: AttachEffect.DurationOverrides
                          - text: 可用于覆盖 AE 自身所写的默认
                          - code [ref=e373]: Duration
                          - text: 。该列表中的值与
                          - code [ref=e374]: AttachTypes
                          - text: 中的 AE 类型一一对应，如果一个 AE 类型没有对应的项目则使用该列表中的最后一个。
                      - listitem [ref=e375]:
                        - paragraph [ref=e376]:
                          - code [ref=e377]: AttachEffect.CumulativeSourceMaxCount
                          - text: 可用于控制来自同一来源的
                          - code [ref=e378]: Cumulative=true
                          - text: 的 AE 可叠加的最大数量，如果
                          - code [ref=e379]: AttachEffect.CumulativeSourceMaxCount
                          - text: 是一个负数则没有上限。独立于
                          - code [ref=e380]: Cumulative.MaxCount
                          - text: 工作。如果目标已经有了
                          - code [ref=e381]: AttachEffect.CumulativeSourceMaxCount
                          - text: 个来自同一来源的、相同类型的 AE，那么再赋予同类 AE 将会刷新所剩持续时间最短的已有 AE 的剩余持续时间。
                      - listitem [ref=e382]:
                        - paragraph [ref=e383]:
                          - code [ref=e384]: AttachEffect.CumulativeRefreshAll
                          - text: 如果设为 true 将尝试在
                          - code [ref=e385]: Cumulative=true
                          - text: 的 AE 赋予被到一个现有 AE 已达到
                          - code [ref=e386]: Cumulative.MaxCount
                          - text: 的目标时刷新该目标上所有同类 AE 的持续时间而不只是刷新所剩持续时间最短的那个。如果
                          - code [ref=e387]: AttachEffect.CumulativeRefreshAll.OnAttach
                          - text: 也设为 true，那么即使未达到
                          - code [ref=e388]: Cumulative.MaxCount
                          - text: 也使用此刷新效果。
                      - listitem [ref=e389]:
                        - paragraph [ref=e390]:
                          - code [ref=e391]: AttachEffect.CumulativeRefreshSameSourceOnly
                          - text: 控制是否需要现有 AE 来自同一个发射者的同一个弹头才能达到使用上述刷新效果的条件。
                      - listitem [ref=e392]:
                        - paragraph [ref=e393]:
                          - text: AE 可以通过弹头上的
                          - code [ref=e394]: AttachEffect.RemoveTypes
                          - text: 或
                          - code [ref=e395]: AttachEffect.RemoveGroups
                          - text: 移除。
                        - list [ref=e396]:
                          - listitem [ref=e397]:
                            - paragraph [ref=e398]:
                              - code [ref=e399]: AttachEffect.CumulativeRemoveMinCounts
                              - text: 设置了
                              - code [ref=e400]: Cumulative=true
                              - text: 类 AE 被
                              - code [ref=e401]: RemoveTypes
                              - text: /
                              - code [ref=e402]: RemoveGroups
                              - text: 每次移除的最小数量。
                          - listitem [ref=e403]:
                            - paragraph [ref=e404]:
                              - code [ref=e405]: AttachEffect.CumulativeRemoveMaxCounts
                              - text: 设置了
                              - code [ref=e406]: Cumulative=true
                              - text: 类 AE 被
                              - code [ref=e407]: RemoveTypes
                              - text: /
                              - code [ref=e408]: RemoveGroups
                              - text: 一次移除的最大数量。
                  - listitem [ref=e409]:
                    - paragraph [ref=e410]: 武器可以根据目标上是否附加了特定的 AE 来决定是否（不）可以开火。
                    - list [ref=e411]:
                      - listitem [ref=e412]:
                        - paragraph [ref=e413]:
                          - code [ref=e414]: AttachEffect.RequiredTypes
                          - text: 可用设置一个对象可以作为武器目标所需要拥有的 AE 列表，当所有列出的 AE 类型全部拥有时才允许开火。
                      - listitem [ref=e415]:
                        - paragraph [ref=e416]:
                          - code [ref=e417]: AttachEffect.DisallowedTypes
                          - text: 可用于设置一个对象作为武器目标所不得拥有的 AE 列表，当表中列出的 AE 任一类型存在时将阻止开火。
                      - listitem [ref=e418]:
                        - paragraph [ref=e419]:
                          - code [ref=e420]: AttachEffect.Required/DisallowedGroups
                          - text: 与上面两句拥有相同的效果但使用
                          - code [ref=e421]: Groups
                          - text: 列表而不是 AE 类型列表。
                      - listitem [ref=e422]:
                        - paragraph [ref=e423]:
                          - code [ref=e424]: AttachEffect.(Required|Disallowed)MinCounts & (Required|Disallowed)MaxCounts
                          - text: 可用于设置科技类型上必须存在／禁止存在的
                          - code [ref=e425]: Cumulative=true
                          - text: 类（对其他类型无效） AE 的最小／最大数量。
                      - listitem [ref=e426]:
                        - paragraph [ref=e427]:
                          - code [ref=e428]: AttachEffect.IgnoreFromSameSource
                          - text: 可设为 true 以忽略由武器开火者及其弹头赋予的 AE 效果。
                      - listitem [ref=e429]:
                        - paragraph [ref=e430]:
                          - code [ref=e431]: AttachEffect.CheckOnFirer
                          - text: 可设为 true 以将必须存在／禁止存在 AE 的检查对象更改为武器发射者而不是目标。
                - paragraph [ref=e432]:
                  - text: 在
                  - code [ref=e433]: rulesmd.ini
                  - text: ：
                - generic [ref=e436]: "[AttachEffectTypes] 0=SOMEATTACHEFFECT [SOMEATTACHEFFECT] ; AttachEffectType Duration=0 ; integer - game frames or negative value for indefinite duration Duration.ApplyFirepowerMult=false ; boolean Duration.ApplyArmorMultOnTarget=false ; boolean Cumulative=false ; boolean Cumulative.MaxCount=-1 ; integer Powered=false ; boolean DiscardOn=none ; List of discard condition enumeration (none|entry|move|stationary|drain|inrange|outofrange) DiscardOn.RangeOverride= ; floating point value, distance in cells PenetratesIronCurtain=false ; boolean PenetratesForceShield= ; boolean AffectTypes= ; List of TechnoTypes IgnoreTypes= ; List of TechnoTypes AffectsTarget=all ; List of TechnoType Enumeration (none|infantry|units|aircraft|buildings|all) Animation= ; AnimationType Animation.ResetOnReapply=false ; boolean Animation.OfflineAction=Hides ; AttachedAnimFlag (None, Hides, Temporal, Paused or PausedTemporal) Animation.TemporalAction=None ; AttachedAnimFlag (None, Hides, Temporal, Paused or PausedTemporal) Animation.UseInvokerAsOwner=false ; boolean Animation.HideIfAttachedWith= ; List of AttachEffectTypes CumulativeAnimations= ; List of AnimationTypes CumulativeAnimations.RestartOnChange=true ; boolean ExpireWeapon= ; WeaponType ExpireWeapon.TriggerOn=expire ; List of expire weapon trigger condition enumeration (none|expire|remove|death|discard|all) ExpireWeapon.CumulativeOnlyOnce=false ; boolean ExpireWeapon.UseInvokerAsOwner=false ; boolean Tint.Color= ; integer - R,G,B Tint.Intensity= ; floating point value Tint.VisibleToHouses=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) FirepowerMultiplier=1.0 ; floating point value ArmorMultiplier=1.0 ; floating point value ArmorMultiplier.AllowWarheads= ; List of WarheadTypes ArmorMultiplier.DisallowWarheads= ; List of WarheadTypes SpeedMultiplier=1.0 ; floating point value ROFMultiplier=1.0 ; floating point value ROFMultiplier.ApplyOnCurrentTimer=true ; boolean Cloakable=false ; boolean ForceDecloak=false ; boolean WeaponRange.Multiplier=1.0 ; floating point value WeaponRange.ExtraRange=0.0 ; floating point value WeaponRange.AllowWeapons= ; List of WeaponTypes WeaponRange.DisallowWeapons= ; List of WeaponTypes Crit.Multiplier=1.0 ; floating point value Crit.ExtraChance=0.0 ; floating point value Crit.AllowWarheads= ; List of WarheadTypes Crit.DisallowWarheads= ; List of WarheadTypes RevengeWeapon= ; WeaponType RevengeWeapon.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) RevengeWeapon.UseInvokerAsOwner=false ; boolean ReflectDamage=false ; boolean ReflectDamage.Warhead= ; WarheadType ReflectDamage.Warhead.Detonate=false ; WarheadType ReflectDamage.Multiplier=1.0 ; floating point value, percents or absolute ReflectDamage.AffectsHouse=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) ReflectDamage.Chance=1.0 ; floating point value ReflectDamage.Override= ; integer ReflectDamage.UseInvokerAsOwner=false ; boolean DisableWeapons=false ; boolean Unkillable=false ; boolean LaserTrail.Type= ; LaserTrailType Groups= ; comma-separated list of strings (group IDs) [SOMETECHNO] ; TechnoType AttachEffect.AttachTypes= ; List of AttachEffectTypes AttachEffect.DurationOverrides= ; integer - duration overrides (comma-separated) for AttachTypes in order from first to last. AttachEffect.Delays= ; integer - delays (comma-separated) for AttachTypes in order from first to last. AttachEffect.InitialDelays= ; integer - initial delays (comma-separated) for AttachTypes in order from first to last. AttachEffect.RecreationDelays= ; integer - recreation delays (comma-separated) for AttachTypes in order from first to last. OpenTopped.UseTransportRangeModifiers=false ; boolean OpenTopped.CheckTransportDisableWeapons=false ; boolean [SOMEWEAPON] ; WeaponType AttachEffect.RequiredTypes= ; List of AttachEffectTypes AttachEffect.DisallowedTypes= ; List of AttachEffectTypes AttachEffect.RequiredGroups= ; comma-separated list of strings (group IDs) AttachEffect.DisallowedGroups= ; comma-separated list of strings (group IDs) AttachEffect.RequiredMinCounts= ; integer - minimum required instance count (comma-separated) for cumulative types in order from first to last. AttachEffect.RequiredMaxCounts= ; integer - maximum required instance count (comma-separated) for cumulative types in order from first to last. AttachEffect.DisallowedMinCounts= ; integer - minimum disallowed instance count (comma-separated) for cumulative types in order from first to last. AttachEffect.DisallowedMaxCounts= ; integer - maximum disallowed instance count (comma-separated) for cumulative types in order from first to last. AttachEffect.IgnoreFromSameSource=false ; boolean AttachEffect.CheckOnFirer=false ; boolean [SOMEWARHEAD] ; WarheadType AttachEffect.AttachTypes= ; List of AttachEffectTypes AttachEffect.CumulativeSourceMaxCount=-1 ; integer AttachEffect.CumulativeRefreshAll=false ; boolean AttachEffect.CumulativeRefreshAll.OnAttach=false ; boolean AttachEffect.CumulativeRefreshSameSourceOnly=true ; boolean AttachEffect.RemoveTypes= ; List of AttachEffectTypes AttachEffect.RemoveGroups= ; comma-separated list of strings (group IDs) AttachEffect.CumulativeRemoveMinCounts= ; integer - minimum required instance count (comma-separated) for cumulative types in order from first to last. AttachEffect.CumulativeRemoveMaxCounts= ; integer - maximum removed instance count (comma-separated) for cumulative types in order from first to last. AttachEffect.DurationOverrides= ; integer - duration overrides (comma-separated) for AttachTypes in order from first to last. SuppressReflectDamage=false ; boolean SuppressReflectDamage.Types= ; List of AttachEffectTypes SuppressReflectDamage.Groups= ; comma-separated list of strings (group IDs)"
              - generic [ref=e437]:
                - heading "自定义辐射类型 " [level=3] [ref=e438]:
                  - text: 自定义辐射类型
                  - link "" [ref=e439] [cursor=pointer]:
                    - /url: "#custom-radiation-types"
                - paragraph [ref=e440]:
                  - img "图像" [ref=e441]
                  - emphasis [ref=e442]: 混合起来的多种辐射类型
                - list [ref=e443]:
                  - listitem [ref=e444]:
                    - paragraph [ref=e445]:
                      - text: 现在任何武器都可以拥有自定义的辐射类。有关辐射的更多详细信息请参见
                      - link "此处" [ref=e446] [cursor=pointer]:
                        - /url: https://www.modenc.renegadeprojects.com/Radiation
                      - text: 。
                  - listitem [ref=e447]:
                    - paragraph [ref=e448]: 所有辐射类型现在都有几个新的属性可用。
                    - list [ref=e449]:
                      - listitem [ref=e450]:
                        - paragraph [ref=e451]:
                          - code [ref=e452]: RadApplicationDelay.Building
                          - text: 可以设置为大于 0 的值以允许辐射对建筑造成伤害。单个辐射源可以对同一建筑（建筑所占的每个单元格都会受到该单元格上所有辐射源的伤害）造成这种伤害的次数可以通过
                          - code [ref=e453]: RadBuildingDamageMaxCount
                          - text: 来定义，负值表示无限制。
                      - listitem [ref=e454]:
                        - paragraph [ref=e455]:
                          - code [ref=e456]: RadSiteWarhead.Detonate
                          - text: 可以使得
                          - code [ref=e457]: RadSiteWarhead
                          - text: 在被影响的对象上引爆而不单纯造成直接杀伤。这可以使大多数弹头效果、动画显示等生效。如果
                          - code [ref=e458]: RadSiteWarhead.Detonate.Full
                          - text: 设为 false 那么它只能对所在区域造成杀伤和 Phobos 所提供的弹头效果而不是完全引爆。
                      - listitem [ref=e459]:
                        - paragraph [ref=e460]:
                          - code [ref=e461]: RadHasOwner
                          - text: 如果设为 true 则辐射造成的伤害会被视为由发射用于创建辐射区域的抛射体其开火者的所属方造成的。这意味着诸如
                          - code [ref=e462]: AffectsAllies
                          - text: 之类的弹头设置将可以使用，并且任何被击杀的单位都将计入该玩家的摧毁数。
                      - listitem [ref=e463]:
                        - paragraph [ref=e464]:
                          - code [ref=e465]: RadHasInvoker
                          - text: 如果设为 true 则辐射造成的伤害会被视为由发射用于创建辐射区域的抛射体的科技类型（即 “调用者”）造成的。除
                          - code [ref=e466]: RadHasOwner
                          - text: 的效果外这还将使调用者从被辐射击杀的单位中获得经验。注意如果调用者在辐射生命周期中的任何时刻死亡那么它将继续变得如同没有调用者一样。
                  - listitem [ref=e467]:
                    - paragraph [ref=e468]:
                      - text: 默认情况下
                      - code [ref=e469]: UseGlobalRadApplicationDelay
                      - text: 被设为 true，这使得游戏始终使用
                      - code [ref=e470]: "[Radiation]"
                      - text: 中的
                      - code [ref=e471]: RadApplicationDelay
                      - text: 和
                      - code [ref=e472]: RadApplicationDelay.Building
                      - text: 而不是特定辐射类型的。这是个性能优化措施，如果你需要给辐射类型使用不同的间隔那么应当禁用该设置。
                - paragraph [ref=e473]:
                  - text: 在
                  - code [ref=e474]: rulesmd.ini
                  - text: ：
                - generic [ref=e477]: "[RadiationTypes] 0=SOMERADTYPE [Radiation] UseGlobalRadApplicationDelay=true ; boolean [SOMEWEAPON] ; WeaponType RadType=Radiation ; RadType to use instead of default of [Radiation] [SOMERADTYPE] ; RadType RadDurationMultiple=1 ; integer RadApplicationDelay=16 ; integer RadApplicationDelay.Building=0 ; integer RadBuildingDamageMaxCount=-1 ; integer RadLevelMax=500 ; integer RadLevelDelay=90 ; integer RadLightDelay=90 ; integer RadLevelFactor=0.2 ; floating point value RadLightFactor=0.1 ; floating point value RadTintFactor=1.0 ; floating point value RadColor=0,255,0 ; integer - R,G,B RadSiteWarhead=RadSite ; WarheadType RadSiteWarhead.Detonate=false ; boolean RadSiteWarhead.Detonate.Full=true ; boolean RadHasOwner=false ; boolean RadHasInvoker=false ; boolean"
                - generic [ref=e478]:
                  - paragraph [ref=e479]:  警告
                  - paragraph [ref=e480]:
                    - text: 出于性能方面的考虑，除非存在
                    - code [ref=e481]: RadApplicationDelay.Building
                    - text: 高于 0 的辐射类型否则与之相关的所有功能在游戏内都将被完全禁用。这在其最早的可用时机（地图初始场景启动结束或存档加载后）就会进行判定，并且
                    - strong [ref=e482]: 不会
                    - text: 随着后续场景的改变或存档的加载而更新。
              - generic [ref=e483]:
                - heading "激光尾焰 " [level=3] [ref=e484]:
                  - text: 激光尾焰
                  - link "" [ref=e485] [cursor=pointer]:
                    - /url: "#laser-trails"
                - paragraph [ref=e486]:
                  - img "激光尾焰" [ref=e487]
                  - emphasis [ref=e488]:
                    - link "东方崛起" [ref=e489] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/riseoftheeast
                    - text: 中的激光尾焰应用实例
                - list [ref=e490]:
                  - listitem [ref=e491]:
                    - paragraph [ref=e492]: 科技类型、抛射体和 Voxel 碎片现在都可以拥有不同透明度、宽度和颜色的彩色尾焰，这些尾焰是通过激光绘制代码完成的。
                  - listitem [ref=e493]:
                    - paragraph [ref=e494]: 科技类型、抛射体和 Voxel 碎片可以拥有多个尾焰。对于科技类型的每个激光尾焰都可以自定义其相对于炮塔或车体的 FLH 偏移值。
                  - listitem [ref=e495]:
                    - paragraph [ref=e496]: 激光尾焰现在同样可以使用 EBolt 或 辐射波 特效。
                - paragraph [ref=e497]:
                  - text: 在
                  - code [ref=e498]: artmd.ini
                  - text: ：
                - generic [ref=e501]: "[LaserTrailTypes] 0=SOMETRAIL [SOMETRAIL] ; LaserTrailType name DrawType=laser ; laser trail type (laser | ebolt | radbeam) FadeDuration= ; integer, default to 64 for laser, 17 for ebolt, 15 for radbeam SegmentLength=128 ; integer, minimal length of each trail segment IgnoreVertical=false ; boolean, whether the trail won't be drawn on vertical movement CloakVisible=false ; boolean, whether the laser is visible when the attached unit is cloaked CloakVisible.DetectedOnly=false ; boolean, whether CloakVisible=true laser is visible only to those who can detect the attached unit ; laser Color=255,0,0 ; integer - R,G,B IsHouseColor=false ; boolean Thickness=4 ; integer IsIntense=false ; boolean, whether the laser is \"supported\" (AKA prism forwarding) ; ebolt IsAlternateColor=false ; boolean Bolt.Color1= ; integer - R,G,B Bolt.Disable1=false ; boolean Bolt.Color2= ; integer - R,G,B Bolt.Disable2=false ; boolean Bolt.Color3= ; integer - R,G,B Bolt.Disable3=false ; boolean ; radbeam Beam.Color= ; integer - R,G,B Beam.Amplitude=40.0 ; floating point value [SOMEPROJECTILE] ; Projectile Image LaserTrail.Types=SOMETRAIL ; List of LaserTrailTypes [SOMETECHNO] ; TechnoType Image LaserTrailN.Type=SOMETRAIL ; LaserTrailType LaserTrailN.FLH=0,0,0 ; integer - Forward,Lateral,Height LaserTrailN.IsOnTurret=false ; boolean, whether the trail origin is turret ; where N = 0, 1, 2, ..."
                - paragraph [ref=e502]:
                  - text: 在
                  - code [ref=e503]: rulesmd.ini
                  - text: ：
                - generic [ref=e506]: "[SOMEVOXELANIM] ; VoxelAnim LaserTrail.Types=SOMETRAIL ; List of LaserTrailTypes"
                - generic [ref=e507]:
                  - paragraph [ref=e508]:  警告
                  - paragraph [ref=e509]: 激光尾焰非常占用资源！由于游戏不使用 GPU，大量尾焰即便在高性能设备上也会迅速降低 FPS。想要减少这种影响：
                  - list [ref=e510]:
                    - listitem [ref=e511]:
                      - paragraph [ref=e512]: 不要在单位和抛射体上使用过多的激光尾焰；
                    - listitem [ref=e513]:
                      - paragraph [ref=e514]:
                        - text: 在确保在尾焰不会过于锯齿状的前提下使用尽量高的
                        - code [ref=e515]: SegmentLength
                        - text: 值；
                    - listitem [ref=e516]:
                      - paragraph [ref=e517]:
                        - text: 使用长度尽量短的激光尾焰，即设置一个较小的
                        - code [ref=e518]: FadeDuration
                        - text: 值。
              - generic [ref=e519]:
                - heading "护盾 " [level=3] [ref=e520]:
                  - text: 护盾
                  - link "" [ref=e521] [cursor=pointer]:
                    - /url: "#shields"
                - paragraph [ref=e522]:
                  - img "图像" [ref=e523]
                  - emphasis [ref=e524]:
                    - link "幻想奇遇" [ref=e525] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/fantasy-adventure
                    - text: 中拥有护盾的建筑、步兵和载具
                - paragraph [ref=e526]:
                  - text: 在
                  - code [ref=e527]: rulesmd.ini
                  - text: ：
                - generic [ref=e530]: "[CombatDamage] ShieldApplyArmorMult=false ; boolean [AudioVisual] Shield.ConditionYellow= ; floating point value, percents or absolute Shield.ConditionRed= ; floating point value, percents or absolute Pips.Shield=-1,-1,-1 ; integer, frames of pips.shp (zero-based) for Green, Yellow, Red Pips.Shield.Building=-1,-1,-1 ; integer, frames of pips.shp (zero-based) for Green, Yellow, Red Pips.Shield.Background=PIPBRD.SHP ; filename - including the .shp/.pcx extension Pips.Shield.Building.Empty=0 ; integer, frame of pips.shp (zero-based) for empty building pip [ShieldTypes] 0=SOMESHIELDTYPE [SOMESHIELDTYPE] ; ShieldType name Strength=0 ; integer InitialStrength=0 ; integer ConditionYellow= ; floating point value, percents or absolute ConditionRed= ; floating point value, percents or absolute Armor=none ; ArmorType InheritArmorFromTechno=false ; boolean InheritArmor.Allowed= ; List of TechnoTypes InheritArmor.Disallowed= ; List of TechnoTypes ApplyArmorMult= ; boolean, default to [CombatDamage] -> ShieldApplyArmorMult Powered=false ; boolean AbsorbOverDamage=false ; boolean SelfHealing=0.0 ; floating point value, percents or absolute SelfHealing.Rate=0.0 ; floating point value, ingame minutes SelfHealing.RestartInCombat=true ; boolean SelfHealing.RestartInCombatDelay=0 ; integer, game frames SelfHealing.EnabledBy= ; List of BuildingTypes Respawn=0.0 ; floating point value, percents or absolute Respawn.Rate=0.0 ; floating point value, ingame minutes Respawn.RestartInCombat=true ; boolean Respawn.RestartInCombatDelay=0 ; integer, game frames Respawn.Anim= ; List of AnimationTypes Respawn.Weapon= ; WeaponType BracketDelta=0 ; integer - pixels Pips=-1,-1,-1 ; integer, frames of pips.shp (zero-based) for Green, Yellow, Red Pips.Building=-1,-1,-1 ; integer, frames of pips.shp (zero-based) for Green, Yellow, Red Pips.Background= ; filename - including the .shp/.pcx extension Pips.Building.Empty= ; integer, frame of pips.shp (zero-based) for empty building pip Pips.HideIfNoStrength=false ; boolean IdleAnim= ; AnimationType IdleAnim.ConditionYellow= ; AnimationType IdleAnim.ConditionRed= ; AnimationType IdleAnimDamaged= ; AnimationType IdleAnimDamaged.ConditionYellow= ; AnimationType IdleAnimDamaged.ConditionRed= ; AnimationType IdleAnim.OfflineAction=Hides ; AttachedAnimFlag (None, Hides, Temporal, Paused or PausedTemporal) IdleAnim.TemporalAction=Hides ; AttachedAnimFlag (None, Hides, Temporal, Paused or PausedTemporal) BreakAnim= ; List of AnimationTypes HitAnim= ; List of AnimationTypes HitFlash=false ; boolean HitFlash.FixedSize= ; integer HitFlash.Red=true ; boolean HitFlash.Green=true ; boolean HitFlash.Blue=true ; boolean HitFlash.Black=false ; boolean BreakWeapon= ; WeaponType AbsorbPercent=1.0 ; floating point value PassPercent=0.0 ; floating point value ReceivedDamage.Minimum=-2147483648 ; integer ReceivedDamage.Maximum=2147483647 ; integer AllowTransfer= ; boolean ImmuneToBerserk=no ; boolean ImmuneToCrit=no ; boolean Tint.Color= ; integer - R,G,B Tint.Intensity=0.0 ; floating point value Tint.VisibleToHouses=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) [SOMETECHNO] ; TechnoType ShieldType=SOMESHIELDTYPE ; ShieldType; none by default [SOMEWARHEAD] ; WarheadType Shield.Penetrate=false ; boolean Shield.Break=false ; boolean Shield.BreakAnim= ; List of AnimationTypes Shield.HitAnim= ; List of AnimationTypes Shield.SkipHitAnim=false ; boolean Shield.HitFlash=true ; boolean Shield.BreakWeapon= ; WeaponType Shield.AbsorbPercent= ; floating point value Shield.PassPercent= ; floating point value Shield.ReceivedDamage.Minimum= ; integer Shield.ReceivedDamage.Maximum= ; integer Shield.ReceivedDamage.MinMultiplier=1.0 ; floating point value Shield.ReceivedDamage.MaxMultiplier=1.0 ; floating point value Shield.Respawn.Duration=0 ; integer, game frames Shield.Respawn.Amount=0.0 ; floating point value, percents or absolute Shield.Respawn.Rate=-1.0 ; floating point value, ingame minutes Shield.Respawn.RestartInCombat= ; boolean Shield.Respawn.RestartInCombatDelay=-1 ; integer, game frames Shield.Respawn.RestartTimer=false ; boolean Shield.Respawn.Anim= ; List of AnimationTypes Shield.Respawn.Weapon= ; WeaponType Shield.SelfHealing.Duration=0 ; integer, game frames Shield.SelfHealing.Amount=0.0 ; floating point value, percents or absolute Shield.SelfHealing.Rate=-1.0 ; floating point value, ingame minutes Shield.SelfHealing.RestartInCombat= ; boolean Shield.SelfHealing.RestartInCombatDelay=-1 ; integer, game frames Shield.SelfHealing.RestartTimer=false ; boolean Shield.AffectTypes= ; List of ShieldTypes Shield.Penetrate.Types= ; List of ShieldTypes Shield.Break.Types= ; List of ShieldTypes Shield.Respawn.Types= ; List of ShieldTypes Shield.SelfHealing.Types= ; List of ShieldTypes Shield.AttachTypes= ; List of ShieldTypes Shield.RemoveTypes= ; List of ShieldTypes Shield.RemoveAll=false ; boolean Shield.ReplaceOnly=false ; boolean Shield.ReplaceNonRespawning=false ; boolean Shield.MinimumReplaceDelay=0 ; integer, game frames Shield.InheritStateOnReplace=false ; boolean"
                - list [ref=e531]:
                  - listitem [ref=e532]:
                    - paragraph [ref=e533]:
                      - text: 现在你可以给予任何科技类型护盾。它作为一个独立的第二血条拥有独立的
                      - code [ref=e534]: Armor
                      - text: 和
                      - code [ref=e535]: Strength
                      - text: 设定。
                    - list [ref=e536]:
                      - listitem [ref=e537]:
                        - paragraph [ref=e538]:
                          - text: 如果科技类型处于
                          - code [ref=e539]: Temporal
                          - text: 弹头的效果中、处于铁幕／力场护盾保护中、拥有
                          - code [ref=e540]: Immune=true
                          - text: 或者拥有
                          - code [ref=e541]: TypeImmune=true
                          - text: 并且伤害来自相同所属的同种科技类型，那么护盾将不会受到伤害。
                      - listitem [ref=e542]:
                        - paragraph [ref=e543]: 负值伤害将会恢复护盾，除非护盾已被击碎。在护盾回满前所有负值伤害都将被护盾吸收。
                        - list [ref=e544]:
                          - listitem [ref=e545]:
                            - paragraph [ref=e546]:
                              - text: 负值伤害武器会将一个拥有激活状态且不满血的护盾的目标视为需要治疗／维修，除非弹头具有
                              - code [ref=e547]: Shield.Penetrate=true
                              - text: ，这种情况下只会考虑对象的血量。
                      - listitem [ref=e548]:
                        - paragraph [ref=e549]:
                          - text: 当一个科技类型拥有未被击碎的护盾时，
                          - code [ref=e550]: "[ShieldType] -> Armor"
                          - text: 将替代
                          - code [ref=e551]: "[TechnoType] -> Armor"
                          - text: 用于参与索敌和杀伤计算。
                        - list [ref=e552]:
                          - listitem [ref=e553]:
                            - paragraph [ref=e554]:
                              - code [ref=e555]: InheritArmorFromTechno
                              - text: 可设为 true 以覆盖这一行为即即便护盾处于激活状态也使用
                              - code [ref=e556]: "[TechnoType] -> Armor"
                              - text: 而忽略
                              - code [ref=e557]: "[ShieldType] -> Armor"
                              - text: 。
                          - listitem [ref=e558]:
                            - paragraph [ref=e559]:
                              - code [ref=e560]: InheritArmor.Allowed
                              - text: 列出了其护甲可以被覆盖的科技类型。如果为空，则相当于任何不在
                              - code [ref=e561]: InheritArmor.Disallowed
                              - text: 列表的对象。
                          - listitem [ref=e562]:
                            - paragraph [ref=e563]:
                              - code [ref=e564]: InheritArmor.Disallowed
                              - text: 列出了其护甲不可被覆盖的科技类型。如果为空，则相当于任何科技类型都可以被覆盖，只要
                              - code [ref=e565]: InheritArmor.Allowed
                              - text: 为空或者这些科技类型列在该列表中。
                          - listitem [ref=e566]:
                            - paragraph [ref=e567]: "ApplyArmorMult` 可设为 true 以允许护盾享受护甲倍率。"
                      - listitem [ref=e568]:
                        - paragraph [ref=e569]:
                          - code [ref=e570]: InitialStrength
                          - text: 可用于设置一个不同于最大值的初始护盾值。
                      - listitem [ref=e571]:
                        - paragraph [ref=e572]:
                          - code [ref=e573]: ConditionYellow
                          - text: 和
                          - code [ref=e574]: ConditionRed
                          - text: 可被用于设置护盾损伤状态的阈值，默认分别为
                          - code [ref=e575]: "[AudioVisual] -> Shield.ConditionYellow & Shield.ConditionRed"
                          - text: 而它们又默认为
                          - code [ref=e576]: ConditionYellow & ConditionRed
                          - text: 。
                  - listitem [ref=e577]:
                    - paragraph [ref=e578]:
                      - text: 当执行
                      - code [ref=e579]: DeploysInto
                      - text: 或
                      - code [ref=e580]: UndeploysInto
                      - text: 时，如果两个科技类型都拥有护盾，转换后的单位／建筑将保持相对（百分比）的护盾值，类似
                      - code [ref=e581]: Strength
                      - text: 。如果其中一个科技类型没有护盾，其护盾状态会被保留直到转换回来。
                    - list [ref=e582]:
                      - listitem [ref=e583]:
                        - paragraph [ref=e584]:
                          - text: 这同样适用于 Ares 的
                          - code [ref=e585]: Convert.*
                          - text: 。
                  - listitem [ref=e586]:
                    - paragraph [ref=e587]:
                      - code [ref=e588]: Powered
                      - text: 控制当前单位电力不足或受 EMP 影响时护盾是否依然工作。
                    - list [ref=e589]:
                      - listitem [ref=e590]:
                        - paragraph [ref=e591]:
                          - text: 注意，如果科技类型自身不受制于
                          - code [ref=e592]: Powered
                          - text: ，那么护盾在电力不足时也不会罢工。
                  - listitem [ref=e593]:
                    - paragraph [ref=e594]:
                      - code [ref=e595]: AbsorbOverDamage
                      - text: 控制护盾是否在被击碎时吸收本次所受的所有伤害。
                  - listitem [ref=e596]:
                    - paragraph [ref=e597]:
                      - code [ref=e598]: SelfHealing
                      - text: 和
                      - code [ref=e599]: Respawn
                      - text: 遵循以下设置：0.0 禁用该功能，1%-100% 按百分比恢复／重生护盾值，其他数字直接恢复／重生指定护盾值。特别的一点是
                      - code [ref=e600]: SelfHealing
                      - text: 为负数代表扣除护盾值。
                    - list [ref=e601]:
                      - listitem [ref=e602]:
                        - paragraph [ref=e603]:
                          - text: 如果你想让护盾每次恢复／重生 1 点 HP，目前你需要将标签值设为 1 到 2 之间的任意数字，比如
                          - code [ref=e604]: "1.1"
                          - text: 。
                      - listitem [ref=e605]:
                        - paragraph [ref=e606]:
                          - text: 如果设置了
                          - code [ref=e607]: SelfHealing.RestartInCombat
                          - text: 当护盾受到伤害时其恢复计时器将被暂停直至
                          - code [ref=e608]: SelfHealing.RestartInCombatDelay
                          - text: 指定的帧数后。
                      - listitem [ref=e609]:
                        - paragraph [ref=e610]:
                          - text: 如果设置了
                          - code [ref=e611]: Respawn.RestartInCombat
                          - text: 当科技类型的护盾处于重生过程中时其重生计时器将被暂停直至
                          - code [ref=e612]: Respawn.RestartInCombatDelay
                          - text: 指定的帧数后。
                  - listitem [ref=e613]:
                    - paragraph [ref=e614]:
                      - code [ref=e615]: SelfHealing.Rate
                      - text: 和
                      - code [ref=e616]: Respawn.Rate
                      - text: 遵循以下设置：0.0 立即恢复护盾，其他值表示护盾恢复／重生间隔（单位：分）。
                  - listitem [ref=e617]:
                    - paragraph [ref=e618]:
                      - code [ref=e619]: Respawn.Anim
                      - text: 如果设置则会在护盾重生时播放。如果列出了多个动画，则将随机选择一个。
                  - listitem [ref=e620]:
                    - paragraph [ref=e621]:
                      - code [ref=e622]: Respawn.Weapon
                      - text: 如果设置则将在护盾重生时向科技类型发射一次。
                  - listitem [ref=e623]:
                    - paragraph [ref=e624]:
                      - code [ref=e625]: SelfHealing.EnabledBy
                      - text: 可用于控制护盾自愈和重生行为。只有拥有此列表中的建筑时才可以自愈或重生。
                  - listitem [ref=e626]:
                    - paragraph [ref=e627]:
                      - code [ref=e628]: IdleAnim
                      - text: 如果设置则会在护盾完好时播放。该动画会自动设置为无限循环播放。
                    - list [ref=e629]:
                      - listitem [ref=e630]:
                        - paragraph [ref=e631]:
                          - code [ref=e632]: IdleAnim.ConditionYellow
                          - text: 和
                          - code [ref=e633]: IdleAnim.ConditionRed
                          - text: 可用于设置当护盾值达到
                          - code [ref=e634]: "[AudioVisual] -> ConditionYellow/ConditionRed"
                          - text: 的百分比时使用的不同动画。如果未设置
                          - code [ref=e635]: IdleAnim.ConditionRed
                          - text: 则会回退到
                          - code [ref=e636]: IdleAnim.ConditionYellow
                          - text: ，而后者则会回退到
                          - code [ref=e637]: IdleAnim
                          - text: 。
                      - listitem [ref=e638]:
                        - paragraph [ref=e639]:
                          - code [ref=e640]: IdleAnimDamaged
                          - text: 、
                          - code [ref=e641]: IdleAnimDamaged.ConditionYellow
                          - text: 和
                          - code [ref=e642]: IdleAnimDamaged.ConditionRed
                          - text: 的使用方式相同，但仅当护盾附着的对象血量处于或低于
                          - code [ref=e643]: "[AudioVisual] -> ConditionYellow"
                          - text: 的百分比时使用。遵守与常规
                          - code [ref=e644]: IdleAnim
                          - text: 相同的回退序列，如果未设置则回退到伤残状态的上一个闲置动画变体或者直至回退到常规的
                          - code [ref=e645]: IdleAnim
                          - text: 。
                      - listitem [ref=e646]:
                        - paragraph [ref=e647]:
                          - code [ref=e648]: Bouncer=true
                          - text: 和
                          - code [ref=e649]: IsMeteor=true
                          - text: 的动画在用作
                          - code [ref=e650]: IdleAnim
                          - text: 时会出现不合理的行为，应避免使用。
                  - listitem [ref=e651]:
                    - paragraph [ref=e652]:
                      - code [ref=e653]: IdleAnim.OfflineAction
                      - text: 指定处于低电量状态时护盾动画的行为。
                  - listitem [ref=e654]:
                    - paragraph [ref=e655]:
                      - code [ref=e656]: IdleAnim.TemporalAction
                      - text: 指定被时空武器冻结时护盾动画的行为。
                  - listitem [ref=e657]:
                    - paragraph [ref=e658]:
                      - code [ref=e659]: BreakAnim
                      - text: 如果设置则会在护盾被击碎时播放。如果列出了多个动画，则将随机选择一个。
                  - listitem [ref=e660]:
                    - paragraph [ref=e661]:
                      - code [ref=e662]: HitAnim
                      - text: 如果设置则会在护盾受到攻击时播放，类似于
                      - code [ref=e663]: WeaponNullifyAnim
                      - text: 用于铁幕。如果列出了多个动画，则将随机选择一个。
                  - listitem [ref=e664]:
                    - paragraph [ref=e665]:
                      - code [ref=e666]: HitFlash
                      - text: 如果设为 true 则当护盾受到一个弹头攻击时将产生一个闪光除非其拥有
                      - code [ref=e667]: Shield.HitFlash=false
                      - text: 。闪光的大小由受到的伤害决定，除非设置了
                      - code [ref=e668]: HitFlash.FixedSize
                      - text: 为某个数值，此时将使用该值（想要产生可见的该效果该句有效值范围为 81 到 252，高于或低于该范围的值将没有该效果）。颜色可以通过
                      - code [ref=e669]: HitFlash.Red/Green/Blue
                      - text: 进行自定义。如果设置了
                      - code [ref=e670]: HitFlash.Black
                      - text: 为 true，那么无论其他颜色设置如何，产生的闪光都是黑色的。
                  - listitem [ref=e671]:
                    - paragraph [ref=e672]:
                      - code [ref=e673]: BreakWeapon
                      - text: 如果设置则将在护盾被击碎时向科技类型发射一次。
                  - listitem [ref=e674]:
                    - paragraph [ref=e675]:
                      - code [ref=e676]: AbsorbPercent
                      - text: 控制该护盾吸收伤害的百分比。默认为 1.0，表示完全吸收伤害。
                  - listitem [ref=e677]:
                    - paragraph [ref=e678]:
                      - code [ref=e679]: PassPercent
                      - text: 控制该护盾所
                      - strong [ref=e680]: 没
                      - text: 能吸收（穿透了）伤害的百分比，即使护盾处于激活状态也会直接被施加到单位上。默认为 0.0 - 无穿透。
                  - listitem [ref=e681]:
                    - paragraph [ref=e682]:
                      - code [ref=e683]: ReceivedDamage.Minimum
                      - text: 和
                      - code [ref=e684]: ReceivedDamage.Maximum
                      - text: 控制单次攻击中对护盾造成的最小和最大伤害量。这在应用护甲类型和
                      - code [ref=e685]: AbsorbPercent
                      - text: 百分比之后生效。如果
                      - code [ref=e686]: AbsorbOverDamage=false
                      - text: ，则对科技类型造成的剩余伤害仍基于原始伤害受此范围调整前的值。
                  - listitem [ref=e687]:
                    - paragraph [ref=e688]:
                      - code [ref=e689]: AllowTransfer
                      - text: 控制如果科技类型发生变化（例如
                      - code [ref=e690]: (Un)DeploysInto
                      - text: 或 Ares 的单位转换）时护盾能否转移。如果未设置，通过
                      - code [ref=e691]: Shield.AttachTypes
                      - text: 被赋予来的护盾默认为 true 其他默认为 false。
                  - listitem [ref=e692]:
                    - paragraph [ref=e693]:
                      - code [ref=e694]: ImmuneToBerserk
                      - text: 给予对
                      - code [ref=e695]: Psychedelic=yes
                      - text: 弹头的免疫能力。否则混乱默认可以穿过护盾。注意这不应阻止单位对护盾所保护对象进行索敌。在这种情况下
                      - code [ref=e696]: Versus.shieldArmor=0%
                      - text: 仍然是必需的。
                  - listitem [ref=e697]:
                    - paragraph [ref=e698]:
                      - text: 通过设置
                      - code [ref=e699]: Tint.Color
                      - text: 和
                      - code [ref=e700]: Tint Intensity
                      - text: 可以为拥有护盾的科技类型使用类似于铁幕／力场护盾或
                      - code [ref=e701]: Psychedelic=true
                      - text: 弹头的染色效果。
                    - list [ref=e702]:
                      - listitem [ref=e703]:
                        - paragraph [ref=e704]:
                          - code [ref=e705]: Tint.Intensity
                          - text: 是增加／减少的光照，1.0 是默认的对象光照。
                      - listitem [ref=e706]:
                        - paragraph [ref=e707]:
                          - code [ref=e708]: Tint.VisibleToHouses
                          - text: 可用于自定义哪些所属方可见这些染色效果。
                  - listitem [ref=e709]:
                    - paragraph [ref=e710]: 拥有护盾的科技类型将显示其护盾值。若护盾可以重生则会在被击碎后留下一个空的护盾条。对于护盾条的 pip 有多种自定义选项可选。
                    - list [ref=e711]:
                      - listitem [ref=e712]:
                        - paragraph [ref=e713]:
                          - text: 默认情况下建筑使用
                          - code [ref=e714]: pips.shp
                          - text: 的第 6 帧来显示护盾值，其他则使用第 17 帧。
                      - listitem [ref=e715]:
                        - paragraph [ref=e716]:
                          - code [ref=e717]: Pips.Shield
                          - text: 可用于指定使用哪个 pip 帧作为护盾值。如果仅设为 1 位数字则始终显示该帧；如果设置 3 位数字，则它们会根据护盾值达到
                          - code [ref=e718]: ConditionYellow
                          - text: 和
                          - code [ref=e719]: ConditionRed
                          - text: 与否分别使用。
                          - code [ref=e720]: Pips.Shield.Building
                          - text: 用于 BuildingTypes。-1 作为值将使用默认帧，无论是否回退到第一个值或上述硬编码的默认值。
                      - listitem [ref=e721]:
                        - paragraph [ref=e722]:
                          - code [ref=e723]: Pips.Shield.Background
                          - text: 可用于指定非建筑 pip 的背景或 “边框”。默认为
                          - code [ref=e724]: pipbrd.shp
                          - text: 。第 4 帧用于显示步兵的护盾值，其他单位使用第 3 帧，如果可用帧不足则分别使用第 2 帧和第 1 帧。
                      - listitem [ref=e725]:
                        - paragraph [ref=e726]:
                          - code [ref=e727]: Pips.Shield.Building.Empty
                          - text: 可用于设置建筑空护盾值显示的 pip 帧，默认为
                          - code [ref=e728]: pips.shp
                          - text: 的第 1 帧。
                      - listitem [ref=e729]:
                        - paragraph [ref=e730]:
                          - code [ref=e731]: Pips.HideIfNoStrength
                          - text: 可用于在
                          - code [ref=e732]: Strength
                          - text: 归 0 时隐藏护盾条而不是留下一个空框。
                      - listitem [ref=e733]:
                        - paragraph [ref=e734]:
                          - text: 以上配置支持基于每个护盾类型单独设置，例如使用
                          - code [ref=e735]: "[ShieldType] -> Pips"
                          - text: 替代全局的
                          - code [ref=e736]: "[AudioVisual] -> Pips.Shield"
                          - text: 。护盾类型上的设置优先于全局设置，未单独设置时回退至全局默认值。
                      - listitem [ref=e737]:
                        - paragraph [ref=e738]:
                          - code [ref=e739]: BracketDelta
                          - text: 可用于添加护盾条在竖直方向的偏移量（负数为向上）。类似于
                          - code [ref=e740]: PixelSelectionBracketDelta
                          - text: ，对建筑无效。
                  - listitem [ref=e741]:
                    - paragraph [ref=e742]:
                      - text: 弹头拥有与护盾交互的新选项。注意，所有这些本身并不需要能够对护盾进行目标选择（例如像
                      - code [ref=e743]: Shield.Break
                      - text: 或移除／附加护盾这样的修改）的选项仍然需要弹头的
                      - code [ref=e744]: Verses
                      - text: 才能影响目标，除非在弹头上将
                      - code [ref=e745]: EffectsRequireVerses
                      - text: 设置为 false。
                    - list [ref=e746]:
                      - listitem [ref=e747]:
                        - paragraph [ref=e748]:
                          - code [ref=e749]: Shield.Penetrate
                          - text: 允许弹头无视这些护盾始终对科技类型本体造成全额伤害。并允许忽略护盾直接锁定科技类型。
                      - listitem [ref=e750]:
                        - paragraph [ref=e751]:
                          - code [ref=e752]: Shield.Break
                          - text: 允许弹头总是会击碎科技类型上的这些护盾。此效果在结算伤害前生效。
                      - listitem [ref=e753]:
                        - paragraph [ref=e754]:
                          - code [ref=e755]: Shield.BreakAnim
                          - text: 用于设置弹头击中护盾时替代护盾
                          - code [ref=e756]: BreakAnim
                          - text: 播放的动画。如果列出了多个动画，则将随机选择一个。
                      - listitem [ref=e757]:
                        - paragraph [ref=e758]:
                          - code [ref=e759]: Shield.HitAnim
                          - text: 用于设置弹头击中护盾时替代护盾
                          - code [ref=e760]: HitAnim
                          - text: 播放的动画。如果列出了多个动画，则将随机选择一个。
                      - listitem [ref=e761]:
                        - paragraph [ref=e762]:
                          - text: 如果
                          - code [ref=e763]: Shield.SkipHitAnim
                          - text: 设为 true，当弹头对护盾造成伤害时将不会播放任何击中动画。
                      - listitem [ref=e764]:
                        - paragraph [ref=e765]:
                          - code [ref=e766]: Shield.BreakWeapon
                          - text: 用于设置弹头击碎护盾时替代护盾
                          - code [ref=e767]: BreakWeapon
                          - text: 发射的武器，无论是伤害饱和还是
                          - code [ref=e768]: Shield.Break
                          - text: 所造成的击碎。
                      - listitem [ref=e769]:
                        - paragraph [ref=e770]:
                          - code [ref=e771]: Shield.AbsorbPercent
                          - text: 覆盖被杀伤护盾类型的
                          - code [ref=e772]: AbsorbPercent
                          - text: 值。
                      - listitem [ref=e773]:
                        - paragraph [ref=e774]:
                          - code [ref=e775]: Shield.PassPercent
                          - text: 覆盖被杀伤护盾类型的
                          - code [ref=e776]: PassPercent
                          - text: 值。
                      - listitem [ref=e777]:
                        - paragraph [ref=e778]:
                          - code [ref=e779]: Shield.ReceivedDamage.Minimum
                          - text: 和
                          - code [ref=e780]: Shield.ReceivedDamage.Maximum
                          - text: 覆盖被杀伤护盾类型上的同类设置。
                        - list [ref=e781]:
                          - listitem [ref=e782]:
                            - paragraph [ref=e783]:
                              - code [ref=e784]: Shield.ReceivedDamage.MinMultiplier
                              - text: 和
                              - code [ref=e785]: Shield.ReceivedDamage.MinMultiplier
                              - text: 分别为上面
                              - code [ref=e786]: Shield.ReceivedDamage.Minimum
                              - text: 和
                              - code [ref=e787]: Shield.ReceivedDamage.Maximum
                              - text: 用于被杀伤护盾计算弹头所造成伤害的倍率。
                      - listitem [ref=e788]:
                        - paragraph [ref=e789]:
                          - code [ref=e790]: Shield.Respawn.Rate
                          - text: 、
                          - code [ref=e791]: Shield.Respawn.Amount
                          - text: 、
                          - code [ref=e792]: Shield.Respawn.Anim
                          - text: 和
                          - code [ref=e793]: Shield.Respawn.Weapon
                          - text: 会在
                          - code [ref=e794]: Shield.Respawn.Duration
                          - text: 的帧数内覆盖护盾的
                          - code [ref=e795]: Respawn.Rate
                          - text: 、
                          - code [ref=e796]: Respawn.Amount
                          - text: 、
                          - code [ref=e797]: Respawn.Anim
                          - text: 和
                          - code [ref=e798]: Respawn.Weapon
                          - text: 。负值和 0 会默认使用护盾类型自身的值。如果设置了
                          - code [ref=e799]: Shield.Respawn.RestartTimer
                          - text: 当前正在使用的护盾重生计时器将被重置否则计时器将被根据新的
                          - code [ref=e800]: Shield.Respawn.Rate
                          - text: 按比例进行调整（例如计时器在前后保持相同百分比的进度）而不会重置。如果效果在重生计时器运作状态中失效，剩余时间也同样会按比例调整为护盾自身的
                          - code [ref=e801]: Respawn.Rate
                          - text: 。重新应用效果会将持续时间重置为
                          - code [ref=e802]: Shield.Respawn.Duration
                        - list [ref=e803]:
                          - listitem [ref=e804]:
                            - paragraph [ref=e805]:
                              - text: 此外
                              - code [ref=e806]: Shield.Respawn.RestartInCombat
                              - text: 和
                              - code [ref=e807]: Shield.Respawn.RestartInCombatDelay
                              - text: 可用于覆盖护盾类型上的同类设置。
                      - listitem [ref=e808]:
                        - paragraph [ref=e809]:
                          - code [ref=e810]: Shield.SelfHealing.Rate
                          - text: 和
                          - code [ref=e811]: Shield.SelfHealing.Amount
                          - text: 会在
                          - code [ref=e812]: Shield.Respawn.Duration
                          - text: 的帧数内覆盖护盾的
                          - code [ref=e813]: SelfHealing.Rate
                          - text: 和
                          - code [ref=e814]: SelfHealing.Amount
                          - text: 。负值和 0 会默认使用护盾类型自身的值。如果设置了
                          - code [ref=e815]: Shield.SelfHealing.RestartTimer
                          - text: 当前正在使用的恢复计时器将被重置否则计时器将被根据新的
                          - code [ref=e816]: Shield.SelfHealing.Rate
                          - text: 按比例进行调整（例如计时器在前后保持相同百分比的进度）而不会重置。如果效果在恢复计时器运作状态中失效，剩余时间也同样会按比例调整为护盾自身的
                          - code [ref=e817]: SelfHealing.Rate
                          - text: 。重新应用效果会将持续时间重置为
                          - code [ref=e818]: Shield.SelfHealing.Duration
                          - text: 。
                        - list [ref=e819]:
                          - listitem [ref=e820]:
                            - paragraph [ref=e821]:
                              - text: 此外
                              - code [ref=e822]: Shield.SelfHealing.RestartInCombat
                              - text: 和
                              - code [ref=e823]: Shield.SelfHealing.RestartInCombatDelay
                              - text: 可用于覆盖护盾类型上的同类设置。
                      - listitem [ref=e824]:
                        - paragraph [ref=e825]:
                          - code [ref=e826]: Shield.AffectTypes
                          - text: 允许列出哪些护盾类型受上述效果的影响。如果未列出则代表所有护盾类型。
                        - list [ref=e827]:
                          - listitem [ref=e828]:
                            - paragraph [ref=e829]:
                              - code [ref=e830]: Shield.AffectTypes
                              - text: 可以通过使用标签
                              - code [ref=e831]: Shield.Penetrate.Types
                              - text: 、
                              - code [ref=e832]: Shield.Break.Types
                              - text: 、
                              - code [ref=e833]: Shield.Respawn.Types
                              - text: 和
                              - code [ref=e834]: Shield.SelfHealing.Types
                              - text: 分别为特定的护盾分离覆盖的参数类型。
                      - listitem [ref=e835]:
                        - paragraph [ref=e836]:
                          - code [ref=e837]: Shield.AttachTypes
                          - text: 和
                          - code [ref=e838]: Shield.RemoveTypes
                          - text: 允许分别列出从被弹头影响（正
                          - code [ref=e839]: Verses
                          - text: 值）的任何目标上附加或移除的护盾类型。通常只使用
                          - code [ref=e840]: Shield.AttachTypes
                          - text: 中列出的第一个。
                        - list [ref=e841]:
                          - listitem [ref=e842]:
                            - paragraph [ref=e843]:
                              - text: 如果设置
                              - code [ref=e844]: Shield.ReplaceOnly
                              - text: 则
                              - code [ref=e845]: Shield.AttachTypes
                              - text: 中的所有护盾只会应用于同时移除了护盾的目标，并与
                              - code [ref=e846]: Shield.RemoveTypes
                              - text: 列表中的顺序对应。如果
                              - code [ref=e847]: Shield.AttachTypes
                              - text: 中的项少于
                              - code [ref=e848]: Shield.RemoveTypes
                              - text: 则使用前者的最后一项来替换任何剩余的被移除护盾类型。
                          - listitem [ref=e849]:
                            - paragraph [ref=e850]:
                              - text: 如果设置
                              - code [ref=e851]: Shield.ReplaceNonRespawning
                              - text: 则
                              - code [ref=e852]: Shield.AttachTypes
                              - text: 中的护盾将替换那些已被击碎且无法自行重生的已有护盾。
                          - listitem [ref=e853]:
                            - paragraph [ref=e854]:
                              - text: 如果设置
                              - code [ref=e855]: Shield.RemoveAll
                              - text: 则移除所影响目标上的所有护盾，即使这些护盾没有列在
                              - code [ref=e856]: Shield.RemoveTypes
                              - text: 中。如果设置了
                              - code [ref=e857]: Shield.ReplaceOnly
                              - text: 则
                              - code [ref=e858]: Shield.AttachTypes
                              - text: 中的第一项将用于替换那些被移除但未列在
                              - code [ref=e859]: Shield.RemoveTypes
                              - text: 中的护盾类型。
                          - listitem [ref=e860]:
                            - paragraph [ref=e861]:
                              - code [ref=e862]: Shield.MinimumReplaceDelay
                              - text: 可用于控制护盾被击碎后（以游戏帧为单位）多久才能被替换。如果未经过足够的时间则不会被替换。
                          - listitem [ref=e863]:
                            - paragraph [ref=e864]:
                              - text: 如果设置
                              - code [ref=e865]: Shield.InheritStateOnReplace
                              - text: 则通过
                              - code [ref=e866]: Shield.ReplaceOnly
                              - text: 替换的护盾将继承前一个护盾的当前强度（护盾类型的
                              - code [ref=e867]: Strength
                              - text: ）以及是否已被击碎的状态。恢复和重生计时器将始终被重置。
            - generic [ref=e868]:
              - heading "战机 " [level=2] [ref=e869]:
                - text: 战机
                - link "" [ref=e870] [cursor=pointer]:
                  - /url: "#aircraft"
              - generic [ref=e871]:
                - heading "战机伤残更换图像 " [level=3] [ref=e872]:
                  - text: 战机伤残更换图像
                  - link "" [ref=e873] [cursor=pointer]:
                    - /url: "#damaged-aircraft-image-changes"
                - list [ref=e874]:
                  - listitem [ref=e875]:
                    - paragraph [ref=e876]:
                      - text: 现在当战机伤残（生命值低于
                      - code [ref=e877]: "[AudioVisual] -> ConditionYellow"
                      - text: 的百分比）时可以通过
                      - code [ref=e878]: Image.ConditionYellow
                      - text: 为战机设置不同的图像。
                  - listitem [ref=e879]:
                    - paragraph [ref=e880]:
                      - text: 同样的如果战机生命值低于
                      - code [ref=e881]: "[AudioVisual] -> ConditionRed"
                      - text: 的百分比那么将会使用
                      - code [ref=e882]: Image.ConditionRed
                      - text: 作为图像。
                - paragraph [ref=e883]:
                  - text: 在
                  - code [ref=e884]: rulesmd.ini
                  - text: ：
                - generic [ref=e887]: "[SOMEAIRCRAFT] ; AircraftType Image.ConditionYellow= ; AircraftType entry Image.ConditionRed= ; AircraftType entry"
                - generic [ref=e888]:
                  - paragraph [ref=e889]:  警告
                  - paragraph [ref=e890]:
                    - text: 注意这些被使用的战机必须在
                    - code [ref=e891]: "[AircraftTypes]"
                    - text: 下注册。
            - generic [ref=e892]:
              - heading "动画 " [level=2] [ref=e893]:
                - text: 动画
                - link "" [ref=e894] [cursor=pointer]:
                  - /url: "#animations"
              - generic [ref=e895]:
                - heading "动画生成单位 " [level=3] [ref=e896]:
                  - text: 动画生成单位
                  - link "" [ref=e897] [cursor=pointer]:
                    - /url: "#anim-to-unit"
                - paragraph [ref=e898]:
                  - img "图像" [ref=e899]
                - list [ref=e900]:
                  - listitem [ref=e901]:
                    - paragraph [ref=e902]:
                      - text: 动画现在可以在结束时通过
                      - code [ref=e903]: CreateUnit
                      - text: 创建任何单位（载具、战机和步兵）。这比专用于生成步兵的
                      - code [ref=e904]: MakeInfantry
                      - text: 提供了更多的可选参数。
                    - list [ref=e905]:
                      - listitem [ref=e906]:
                        - paragraph [ref=e907]:
                          - code [ref=e908]: CreateUnit.Owner
                          - text: 决定创建的单位属于哪个所属方。这仅在动画拥有所有者的情况生效。如果没有所属方或所属方已败北，除非
                          - code [ref=e909]: CreateUnit.RequireOwner
                          - text: 为 true 以禁止生成，否则被创建的单位将归属于第一个平民所属方
                        - list [ref=e910]:
                          - listitem [ref=e911]:
                            - paragraph [ref=e912]:
                              - text: 载具
                              - link "摧毁动画" [ref=e913] [cursor=pointer]:
                                - /url: Fixed-or-Improved-Logics.html#destroy-animations
                              - text: 、弹头
                              - code [ref=e914]: AnimList/SplashList
                              - text: 的动画以及地图触发结果
                              - code [ref=e915]: 41 播放动画在...
                              - text: 将拥有正确的所有者。
                          - listitem [ref=e916]:
                            - paragraph [ref=e917]:
                              - code [ref=e918]: CreateUnit.RemapAnim
                              - text: 如果设为 true 则动画将使用单位色盘绘制并可重映射所有者的颜色。
                      - listitem [ref=e919]:
                        - paragraph [ref=e920]:
                          - code [ref=e921]: CreateUnit.Mission
                          - text: 决定所创建单位的初始任务。对于 AI 玩家可使用
                          - code [ref=e922]: CreateUnit.AIMission
                          - text: 来分离设置。
                      - listitem [ref=e923]:
                        - paragraph [ref=e924]:
                          - code [ref=e925]: CreateUnit.Facing
                          - text: 决定所创建单位的初始朝向。
                        - list [ref=e926]:
                          - listitem [ref=e927]:
                            - paragraph [ref=e928]:
                              - code [ref=e929]: CreateUnit.RandomFacing
                              - text: 如果设为 true 那么初始朝向会随机选取。
                          - listitem [ref=e930]:
                            - paragraph [ref=e931]:
                              - text: 仅用于载具：如果动画来自一个被摧毁载具的载具摧毁动画那么
                              - code [ref=e932]: CreateUnit.InheritFacings
                              - text: 和
                              - code [ref=e933]: CreateUnit.InheritTurretFacings
                              - text: 将分别从被摧毁载具的载具上继承载具主体和炮塔的朝向。由于技术限制，
                              - code [ref=e934]: InheritTurretFacings
                              - text: 不适用于 Jumpjet 载具。
                      - listitem [ref=e935]:
                        - paragraph [ref=e936]:
                          - code [ref=e937]: CreateUnit.AlwaysSpawnOnGround
                          - text: 如果设为 true 那么即使动画在空中单位也会在对应的地面单元格上创建。如果设为 false 则此设置无效。
                      - listitem [ref=e938]:
                        - paragraph [ref=e939]:
                          - code [ref=e940]: CreateUnit.SpawnParachutedInAir
                          - text: 如果设为 true 那么动画在空中的情况下所创建的单位会拥有降落伞。如果
                          - code [ref=e941]: CreateUnit.AlwaysSpawnOnGround
                          - text: 设为 true 则此设置无效。
                      - listitem [ref=e942]:
                        - paragraph [ref=e943]:
                          - code [ref=e944]: CreateUnit.ConsiderPathfinding
                          - text: 如果设为 true 则考虑动画所在单元格是否被其他对象占据或对于所要创建的单位而言无法行驶并尝试寻找一个附近未被占用的单元格。否则即便存在障碍物单位也会尽量创建在动画所在的位置。
                      - listitem [ref=e945]:
                        - paragraph [ref=e946]:
                          - code [ref=e947]: CreateUnit.SpawnAnim
                          - text: 可用于在创建的单位出现后在其位置播放另一个动画。此动画拥有与父动画相同的所有者和调用者。如果列出了多个动画，则将随机选择一个。
                      - listitem [ref=e948]:
                        - paragraph [ref=e949]:
                          - code [ref=e950]: CreateUnit.SpawnHeight
                          - text: 如果设为正值则决定动画创建单位的高度。如果
                          - code [ref=e951]: CreateUnit.AlwaysSpawnOnGround
                          - text: 设为 true 则此设置无效。
                - paragraph [ref=e952]:
                  - text: 在
                  - code [ref=e953]: artmd.ini
                  - text: ：
                - generic [ref=e956]: "[SOMEANIM] ; AnimationType CreateUnit= ; TechnoType CreateUnit.Owner=Victim ; Owner house kind, Invoker/Killer/Victim/Civilian/Special/Neutral/Random CreateUnit.RequireOwner=false ; boolean CreateUnit.RemapAnim=false ; boolean CreateUnit.Mission=Guard ; MissionType CreateUnit.AIMission= ; MissionType CreateUnit.Facing=0 ; Direction type (integers from 0-255) CreateUnit.RandomFacing=true ; boolean CreateUnit.InheritFacings=false ; boolean CreateUnit.InheritTurretFacings=false ; boolean CreateUnit.AlwaysSpawnOnGround=false ; boolean CreateUnit.SpawnParachutedInAir=false ; boolean CreateUnit.ConsiderPathfinding=false ; boolean CreateUnit.SpawnAnim= ; List of AnimationTypes CreateUnit.SpawnHeight=-1 ; integer, height in leptons"
                - generic [ref=e957]:
                  - paragraph [ref=e958]:  备注
                  - paragraph [ref=e959]:
                    - text: 由于技术限制，包括 Ares 语句
                    - code [ref=e960]: InfDeathAnim
                    - text: 在内的步兵死亡动画无法正确应用
                    - code [ref=e961]: CreateUnit.Owner
                    - text: 。你可以使用 Ares 的
                    - code [ref=e962]: MakeInfantryOwner
                    - text: 作为替代方案，此方案无需设置
                    - code [ref=e963]: MakeInfantry
                    - text: 也能正常工作。
              - generic [ref=e964]:
                - heading "附加粒子系统 " [level=3] [ref=e965]:
                  - text: 附加粒子系统
                  - link "" [ref=e966] [cursor=pointer]:
                    - /url: "#attached-particle-system"
                - list [ref=e967]:
                  - listitem [ref=e968]:
                    - paragraph [ref=e969]:
                      - text: 现在可以为一个动画附加一个粒子系统。仅支持
                      - code [ref=e970]: BehavesLike=Smoke
                      - text: 的粒子系统。这与 Voxel 碎片中的同名语句等效。
                    - list [ref=e971]:
                      - listitem [ref=e972]:
                        - paragraph [ref=e973]:
                          - text: 对于有
                          - code [ref=e974]: Next
                          - text: 的动画下一个动画开始播放时粒子系统将被删除且如果
                          - code [ref=e975]: Next
                          - text: 的动画定义了另一个粒子系统那么新的粒子系统将被创建。
                - paragraph [ref=e976]:
                  - text: 在
                  - code [ref=e977]: artmd.ini
                  - text: ：
                - generic [ref=e980]: "[SOMEANIM] ; AnimationType AttachedSystem= ; ParticleSystemType"
              - generic [ref=e981]:
                - heading "自定义动画可见性 " [level=3] [ref=e982]:
                  - text: 自定义动画可见性
                  - link "" [ref=e983] [cursor=pointer]:
                    - /url: "#customizable-animation-visibility-settings"
                - list [ref=e984]:
                  - listitem [ref=e985]:
                    - paragraph [ref=e986]:
                      - text: 现在可以通过
                      - code [ref=e987]: VisibleTo
                      - text: 自定义哪些玩家可以看到动画。
                    - list [ref=e988]:
                      - listitem [ref=e989]:
                        - paragraph [ref=e990]:
                          - code [ref=e991]: VisibleTo.ConsiderInvokerAsOwner
                          - text: 如果设置则动画调用者的所属方将被视为
                          - code [ref=e992]: VisibleTo
                          - text: 的所有者而不是它所附着科技类型或动画的的所属方。大多动画中它们是相同的但部分动画可能不同。
                      - listitem [ref=e993]:
                        - paragraph [ref=e994]: 注意这是一个视觉效果，任何附加到动画上的逻辑例如造成伤害仍然会为所有玩家处理。
                  - listitem [ref=e995]:
                    - paragraph [ref=e996]:
                      - code [ref=e997]: RestrictVisibilityIfCloaked
                      - text: 如果设为 true 则隐形对象上所附着的动画和战机
                      - code [ref=e998]: Trailer
                      - text: 的（由于技术限制导弹子机的尾烟不受此限制）动画仅对观察者和可检测到它们的玩家可见。
                  - listitem [ref=e999]:
                    - paragraph [ref=e1000]:
                      - code [ref=e1001]: DetachOnCloak
                      - text: 可设为 false 以覆盖原本游戏从隐形对象上移除所附着动画的行为。
                - paragraph [ref=e1002]:
                  - text: 在
                  - code [ref=e1003]: artmd.ini
                  - text: ：
                - generic [ref=e1006]: "[SOMEANIM] ; AnimationType VisibleTo=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) VisibleTo.ConsiderInvokerAsOwner=false ; boolean RestrictVisibilityIfCloaked=false ; boolean DetachOnCloak=true ; boolean"
              - generic [ref=e1007]:
                - heading "以独立声音事件播放声音 " [level=3] [ref=e1008]:
                  - text: 以独立声音事件播放声音
                  - link "" [ref=e1009] [cursor=pointer]:
                    - /url: "#play-sound-as-a-detached-sound-event"
                - list [ref=e1010]:
                  - listitem [ref=e1011]:
                    - paragraph [ref=e1012]:
                      - text: 现在可以通过
                      - code [ref=e1013]: DetachedReport
                      - text: 让动画播放一个未附加到音频事件处理器的声音。默认情况下动画的
                      - code [ref=e1014]: Report
                      - text: ／
                      - code [ref=e1015]: StartSound
                      - text: 由音频事件处理器播放，这允许它即使在初始创建后发生了变化声音也会循环和在正确的位置播放。这也导致通过
                      - code [ref=e1016]: Next
                      - text: 链接不同的动画类型时出现问题，因为动画重新开始时音频事件处理器会重置。
                - paragraph [ref=e1017]:
                  - text: 在
                  - code [ref=e1018]: artmd.ini
                  - text: ：
                - generic [ref=e1021]: "[SOMEANIM] ; AnimationType DetachedReport= ; Sound entry"
            - generic [ref=e1022]:
              - heading "建筑 " [level=2] [ref=e1023]:
                - text: 建筑
                - link "" [ref=e1024] [cursor=pointer]:
                  - /url: "#buildings"
              - generic [ref=e1025]:
                - heading "自定义建造区域 " [level=3] [ref=e1026]:
                  - text: 自定义建造区域
                  - link "" [ref=e1027] [cursor=pointer]:
                    - /url: "#build-area-customizations"
                - list [ref=e1028]:
                  - listitem [ref=e1029]:
                    - paragraph [ref=e1030]: 现在允许自定义一个建筑能为哪些建筑扩展建造范围。
                    - list [ref=e1031]:
                      - listitem [ref=e1032]:
                        - paragraph [ref=e1033]:
                          - code [ref=e1034]: Adjacent.Allowed
                          - text: 列出了可以放置在其附近（由
                          - code [ref=e1035]: Adjacent
                          - text: 定义的距离内）的建筑类型（白名单）。如果留空则任何未列在
                          - code [ref=e1036]: Adjacent.Disallowed
                          - text: 的建筑类型都可以。
                      - listitem [ref=e1037]:
                        - paragraph [ref=e1038]:
                          - code [ref=e1039]: Adjacent.Disallowed
                          - text: 列出了不得放置在其附近（由
                          - code [ref=e1040]: Adjacent
                          - text: 定义的距离内）的建筑类型（黑名单）。如果留空则只看白名单。
                        - list [ref=e1041]:
                          - listitem [ref=e1042]:
                            - paragraph [ref=e1043]:
                              - text: 上一条的黑名单在默认情景下只是不拓展建造范围，但如果
                              - code [ref=e1044]: Adjacent.Disallowed.Prohibit
                              - text: 设为 true，它将真正禁止建筑放置在所规定的范围内，并且优先于白名单。当
                              - code [ref=e1045]: Adjacent.Disallowed.ProhibitDistance
                              - text: 设为大于 0 的值时将会覆盖
                              - code [ref=e1046]: Adjacent
                              - text: 以实现对禁止放置范围的独立控制。
                      - listitem [ref=e1047]:
                        - paragraph [ref=e1048]:
                          - text: 如果
                          - code [ref=e1049]: NoBuildAreaOnBuildup
                          - text: 设为 true 则任何建筑类型都不能当其在播放建造动画时在其附近建造。
                - paragraph [ref=e1050]:
                  - text: 在
                  - code [ref=e1051]: rulesmd.ini
                  - text: ：
                - generic [ref=e1054]: "[SOMEBUILDING] ; BuildingType Adjacent.Allowed= ; List of BuildingTypes Adjacent.Disallowed= ; List of BuildingTypes Adjacent.Disallowed.Prohibit=false ; boolean Adjacent.Disallowed.ProhibitDistance=0 ; integer, cell offset NoBuildAreaOnBuildup=false ; boolean"
              - generic [ref=e1055]:
                - heading "可摧毁的寻路障碍 " [level=3] [ref=e1056]:
                  - text: 可摧毁的寻路障碍
                  - link "" [ref=e1057] [cursor=pointer]:
                    - /url: "#destroyable-pathfinding-obstacles"
                - list [ref=e1058]:
                  - listitem [ref=e1059]:
                    - paragraph [ref=e1060]:
                      - text: 可以通过将
                      - code [ref=e1061]: IsDestroyableBlockage
                      - text: 设为 true 使建筑被视为可摧毁的寻路障碍物。这会使得每个无法飞行或没有适当
                      - code [ref=e1062]: MovementZone
                      - text: （允许处理可摧毁障碍物的类别，例如
                      - code [ref=e1063]: (Infantry|Amphibious)Destroyer
                      - text: ）的单位能够将建筑视为像墙类覆盖物和地形对象那样不可通行且不可逾越的障碍物。
                    - list [ref=e1064]:
                      - listitem [ref=e1065]:
                        - paragraph [ref=e1066]:
                          - text: 注意如果一个单位拥有适当的
                          - code [ref=e1067]: MovementZone
                          - text: 但缺少实际摧毁障碍物的手段（例如一个可以发射并造成伤害的武器）那么它们仍会尝试摧毁并穿越障碍物并导致卡在那里而不是绕过障碍物。
                - paragraph [ref=e1068]:
                  - text: 在
                  - code [ref=e1069]: rulesmd.ini
                  - text: ：
                - generic [ref=e1072]: "[SOMEBUILDING] ; BuildingType IsDestroyableObstacle=false ; boolean"
              - generic [ref=e1073]:
                - heading "自定义工程师维修 " [level=3] [ref=e1074]:
                  - text: 自定义工程师维修
                  - link "" [ref=e1075] [cursor=pointer]:
                    - /url: "#engineer-repair-customization"
                - list [ref=e1076]:
                  - listitem [ref=e1077]:
                    - paragraph [ref=e1078]: 现在你可以在工程师维修一个建筑时为它们设定最大修复值。0 代表满血。
                    - list [ref=e1079]:
                      - listitem [ref=e1080]:
                        - paragraph [ref=e1081]:
                          - text: 负值按百分比计算。例如
                          - code [ref=e1082]: EngineerRepairAmount=-50
                          - text: 表示每名工程师每次最多修 50%。
                      - listitem [ref=e1083]:
                        - paragraph [ref=e1084]:
                          - text: 如果建筑和工程师都设置了
                          - code [ref=e1085]: EngineerRepairAmount
                          - text: 则区其中更小的那个使用。
                  - listitem [ref=e1086]:
                    - paragraph [ref=e1087]:
                      - code [ref=e1088]: BuildingRepairedSound
                      - text: 现在可以为在每种建筑上单独定义。
                - paragraph [ref=e1089]:
                  - text: 在
                  - code [ref=e1090]: rulesmd.ini
                  - text: ：
                - generic [ref=e1093]: "[SOMEBUILDING] ; BuildingType EngineerRepairAmount=0 ; integer BuildingRepairedSound= ; Sound entry, default to [AudioVisual] -> BuildingRepairedSound [SOMEINFANTRY] ; InfantryType EngineerRepairAmount=0 ; integer"
              - generic [ref=e1094]:
                - heading "拓展的建筑加载物 " [level=3] [ref=e1095]:
                  - text: 拓展的建筑加载物
                  - link "" [ref=e1096] [cursor=pointer]:
                    - /url: "#extended-building-upgrades"
                - paragraph [ref=e1097]:
                  - img "图像" [ref=e1098]
                  - emphasis [ref=e1099]:
                    - 'link "CnC: Final War" [ref=e1100] [cursor=pointer]':
                      - /url: https://www.moddb.com/mods/cncfinalwar
                    - text: 中加载到自己的和盟友的发电厂
                - list [ref=e1101]:
                  - listitem [ref=e1102]:
                    - paragraph [ref=e1103]:
                      - text: 现在建筑加载物可以放置在己方建筑、友方建筑乃至敌方建筑上。这三种所有者可以通过
                      - code [ref=e1104]: PowersUp.Owner
                      - text: 指定。当加载物放置在建筑上时，它将自动更改为与建筑所有者相同的所有者。
                  - listitem [ref=e1105]:
                    - paragraph [ref=e1106]:
                      - text: 现在一个加载物可以应用于由
                      - code [ref=e1107]: PowersUp.Buildings
                      - text: 指定的多种不同类型的建筑。
                    - list [ref=e1108]:
                      - listitem [ref=e1109]:
                        - paragraph [ref=e1110]: Ares 引入的建筑加载物建造限制与这一功能兼容。
                - paragraph [ref=e1111]:
                  - text: 在
                  - code [ref=e1112]: rulesmd.ini
                  - text: ：
                - generic [ref=e1115]: "[SOMEBUILDING] ; BuildingType, as an upgrade PowersUp.Owner=Self ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) PowersUp.Buildings= ; List of BuildingTypes"
                - generic [ref=e1116]:
                  - paragraph [ref=e1117]:  备注
                  - paragraph [ref=e1118]:
                    - text: 由于技术限制，使用 Ares 时通过
                    - code [ref=e1119]: PowersUp.Buildings
                    - text: 而不是
                    - code [ref=e1120]: PowersUpBuilding
                    - text: 放置的加载物（注意如果前者未设置而后者已设置则程序将
                    - code [ref=e1121]: PowersUpBuilding
                    - text: 视为
                    - code [ref=e1122]: PowersUp.Buildings
                    - text: 的第一个条目）
                    - strong [ref=e1123]: 不会
                    - text: 满足先决条件。建议的解决方法是通过加载物来提供一个超武武器通过
                    - link "虚拟投放" [ref=e1124] [cursor=pointer]:
                      - /url: "#limbodelivery"
                    - text: 的建筑来作为先决条件，当父建筑消失时这些先决条件会被另一个超级武器销毁，以此类推。
              - generic [ref=e1125]:
                - heading "电厂增幅器 " [level=3] [ref=e1126]:
                  - text: 电厂增幅器
                  - link "" [ref=e1127] [cursor=pointer]:
                    - /url: "#power-plant-enhancer"
                - list [ref=e1128]:
                  - listitem [ref=e1129]:
                    - paragraph [ref=e1130]: 当它存在时可以增加电厂产生的电量。
                    - list [ref=e1131]:
                      - listitem [ref=e1132]:
                        - paragraph [ref=e1133]: 当增幅器被出售或摧毁时电量将复原。
                      - listitem [ref=e1134]:
                        - paragraph [ref=e1135]:
                          - code [ref=e1136]: PowerPlantEnhancer.MaxCount
                          - text: 决定了此类建筑中参与电厂增幅的数量上限。负值代表无上限。
                - paragraph [ref=e1137]:
                  - text: 在
                  - code [ref=e1138]: rulesmd.ini
                  - text: ：
                - generic [ref=e1141]: "[SOMEBUILDING] ; BuildingType PowerPlantEnhancer.PowerPlants= ; List of BuildingTypes PowerPlantEnhancer.Amount=0 ; integer PowerPlantEnhancer.Factor=1.0 ; floating point value PowerPlantEnhancer.MaxCount=-1 ; integer"
              - generic [ref=e1142]:
                - heading "间谍效果 " [level=3] [ref=e1143]:
                  - text: 间谍效果
                  - link "" [ref=e1144] [cursor=pointer]:
                    - /url: "#spy-effects"
                - list [ref=e1145]:
                  - listitem [ref=e1146]:
                    - paragraph [ref=e1147]:
                      - text: 可以通过
                      - code [ref=e1148]: SpyEffect.Custom
                      - text: 开启额外的间谍效果。
                    - list [ref=e1149]:
                      - listitem [ref=e1150]:
                        - paragraph [ref=e1151]:
                          - code [ref=e1152]: SpyEffect.VictimSuperWeapon
                          - text: 会立即在被渗透建筑的坐标以被渗透方为所属发射一个超级武器。
                      - listitem [ref=e1153]:
                        - paragraph [ref=e1154]:
                          - code [ref=e1155]: SpyEffect.InfiltratorSuperWeapon
                          - text: 同上但超级武器的所属方来自间谍单位。
                - paragraph [ref=e1156]:
                  - text: 在
                  - code [ref=e1157]: rulesmd.ini
                  - text: ：
                - generic [ref=e1160]: "[SOMEBUILDING] ; BuildingType SpyEffect.Custom=false ; boolean SpyEffect.VictimSuperWeapon= ; SuperWeaponType SpyEffect.InfiltratorSuperWeapon= ; SuperWeaponType"
            - generic [ref=e1161]:
              - heading "步兵 " [level=2] [ref=e1162]:
                - text: 步兵
                - link "" [ref=e1163] [cursor=pointer]:
                  - /url: "#infantry"
              - generic [ref=e1164]:
                - heading "自定义步兵匍匐或部署状态的 FLH " [level=3] [ref=e1165]:
                  - text: 自定义步兵匍匐或部署状态的 FLH
                  - link "" [ref=e1166] [cursor=pointer]:
                    - /url: "#customizable-flh-when-infantry-is-prone-or-deployed"
                - list [ref=e1167]:
                  - listitem [ref=e1168]:
                    - paragraph [ref=e1169]:
                      - text: 现在步兵处于匍匐（爪巴）或部署状态的 FLH 可以独立于
                      - code [ref=e1170]: PrimaryFireFLH
                      - text: 和
                      - code [ref=e1171]: SecondaryFireFLH
                      - text: 进行设置。同样对
                      - link "Burst 开火坐标" [ref=e1172] [cursor=pointer]:
                        - /url: "#firing-offsets-for-specific-burst-shots"
                      - text: 生效。
                - paragraph [ref=e1173]:
                  - text: 在
                  - code [ref=e1174]: artmd.ini
                  - text: ：
                - generic [ref=e1177]: "[SOMEINFANTRY] ; InfantryType image PronePrimaryFireFLH= ; integer - Forward,Lateral,Height ProneSecondaryFireFLH= ; integer - Forward,Lateral,Height DeployedPrimaryFireFLH= ; integer - Forward,Lateral,Height DeployedSecondaryFireFLH= ; integer - Forward,Lateral,Height"
              - generic [ref=e1178]:
                - heading "自定义 SlavesFreeSound " [level=3] [ref=e1179]:
                  - text: 自定义
                  - code [ref=e1180]: SlavesFreeSound
                  - link "" [ref=e1181] [cursor=pointer]:
                    - /url: "#customizable-slavesfreesound"
                - list [ref=e1182]:
                  - listitem [ref=e1183]:
                    - paragraph [ref=e1184]:
                      - text: 现在
                      - code [ref=e1185]: SlavesFreeSound
                      - text: 可以单独为每个奴隶类步兵类型微观设置。
                - paragraph [ref=e1186]:
                  - text: 在
                  - code [ref=e1187]: rulesmd.ini
                  - text: ：
                - generic [ref=e1190]: "[SOMEINFANTRY] ; InfantryType, with Slaved=yes SlavesFreeSound= ; Sound entry, default to [AudioVisual] -> SlavesFreeSound"
              - generic [ref=e1191]:
                - heading "步兵类型默认伪装 " [level=3] [ref=e1192]:
                  - text: 步兵类型默认伪装
                  - link "" [ref=e1193] [cursor=pointer]:
                    - /url: "#default-disguise-for-individual-infantrytypes"
                - list [ref=e1194]:
                  - listitem [ref=e1195]:
                    - paragraph [ref=e1196]:
                      - text: 现在可以为每个步兵类型设置其
                      - code [ref=e1197]: DefaultDisguise
                      - text: 。
                    - list [ref=e1198]:
                      - listitem [ref=e1199]:
                        - paragraph [ref=e1200]:
                          - text: 此标签的优先级高于 Ares 的各阵营
                          - code [ref=e1201]: DefaultDisguise
                          - text: 。
                - paragraph [ref=e1202]:
                  - text: 在
                  - code [ref=e1203]: rulesmd.ini
                  - text: ：
                - generic [ref=e1206]: "[SOMEINFANTRY] ; InfantryType DefaultDisguise= ; InfantryType"
              - generic [ref=e1207]:
                - heading "非人步兵随机死亡动画 " [level=3] [ref=e1208]:
                  - text: 非人步兵随机死亡动画
                  - link "" [ref=e1209] [cursor=pointer]:
                    - /url: "#random-death-animaton-for-nothuman-infantry"
                - list [ref=e1210]:
                  - listitem [ref=e1211]:
                    - paragraph [ref=e1212]:
                      - text: 现在拥有
                      - code [ref=e1213]: NotHuman=yes
                      - text: 的步兵可以从
                      - code [ref=e1214]: Die1
                      - text: 到
                      - code [ref=e1215]: Die5
                      - text: 之间随机播放死亡动画序列而不再是硬编码的
                      - code [ref=e1216]: Die1
                      - text: 。
                    - list [ref=e1217]:
                      - listitem [ref=e1218]:
                        - paragraph [ref=e1219]: 在启用此功能前请务必调整步兵动画序列否则可能播放不可见的动画序列。
                - paragraph [ref=e1220]:
                  - text: 在
                  - code [ref=e1221]: rulesmd.ini
                  - text: ：
                - generic [ref=e1224]: "[SOMEINFANTRY] ; InfantryType NotHuman.RandomDeathSequence=yes ; boolean"
              - generic [ref=e1225]:
                - heading "奴隶解放演变 " [level=3] [ref=e1226]:
                  - text: 奴隶解放演变
                  - link "" [ref=e1227] [cursor=pointer]:
                    - /url: "#slaves-house-decision-customization-when-owner-is-killed"
                - list [ref=e1228]:
                  - listitem [ref=e1229]:
                    - paragraph [ref=e1230]:
                      - text: 现在你可以使用
                      - code [ref=e1231]: Slaved.OwnerWhenMasterKilled
                      - text: 来决定奴隶矿场被毁后奴隶移交的所属方或行为：
                    - list [ref=e1232]:
                      - listitem [ref=e1233]:
                        - paragraph [ref=e1234]:
                          - code [ref=e1235]: suicide
                          - text: ：以身殉主，奴隶矿场死亡则奴隶同步死亡。
                      - listitem [ref=e1236]:
                        - paragraph [ref=e1237]:
                          - code [ref=e1238]: master
                          - text: ：助纣为虐，拿起武器但所属不变。
                      - listitem [ref=e1239]:
                        - paragraph [ref=e1240]:
                          - code [ref=e1241]: neutral
                          - text: ：独善其身，解放后转为平民所属方开摆。
                      - listitem [ref=e1242]:
                        - paragraph [ref=e1243]:
                          - code [ref=e1244]: killer
                          - text: ：揭竿而起，解放后转为奴隶矿场击杀者的所属方。（原版行为）
                - paragraph [ref=e1245]:
                  - text: 在
                  - code [ref=e1246]: rulesmd.ini
                  - text: ：
                - generic [ref=e1249]: "[SOMEINFANTRY] ; InfantryType, with Slaved=yes Slaved.OwnerWhenMasterKilled=killer ; enumeration (suicide | master | killer | neutral)"
              - generic [ref=e1250]:
                - heading "在水中使用陆地序列 " [level=3] [ref=e1251]:
                  - text: 在水中使用陆地序列
                  - link "" [ref=e1252] [cursor=pointer]:
                    - /url: "#use-land-sequences-even-in-water"
                - list [ref=e1253]:
                  - listitem [ref=e1254]:
                    - paragraph [ref=e1255]:
                      - text: 设置
                      - code [ref=e1256]: OnlyUseLandSequences
                      - text: 为 true 可以使步兵即使在水中也只显示在陆地上使用的常规序列。
                - paragraph [ref=e1257]:
                  - text: 在
                  - code [ref=e1258]: artmd.ini
                  - text: ：
                - generic [ref=e1261]: "[SOMEINFANTRY] ; InfantryType image OnlyUseLandSequences=false ; boolean"
            - generic [ref=e1262]:
              - heading "抛射体 " [level=2] [ref=e1263]:
                - text: 抛射体
                - link "" [ref=e1264] [cursor=pointer]:
                  - /url: "#projectiles"
              - generic [ref=e1265]:
                - heading "攻击地下单位 " [level=3] [ref=e1266]:
                  - text: 攻击地下单位
                  - link "" [ref=e1267] [cursor=pointer]:
                    - /url: "#attack-technos-underground"
                - list [ref=e1268]:
                  - listitem [ref=e1269]:
                    - paragraph [ref=e1270]: 现在你可以允许抛射体对处于地下的单位发动攻击。
                    - list [ref=e1271]:
                      - listitem [ref=e1272]:
                        - paragraph [ref=e1273]:
                          - text: 若要实际造成杀伤，你还需要设置
                          - link "作用于地下单位" [ref=e1274] [cursor=pointer]:
                            - /url: "#damage-technos-underground"
                          - text: 。
                - paragraph [ref=e1275]:
                  - text: 在
                  - code [ref=e1276]: rulesmd.ini
                  - text: ：
                - generic [ref=e1279]: "[SOMEPROJECTILE] ; Projectile AU=false ; boolean"
                - generic [ref=e1280]:
                  - paragraph [ref=e1281]:  备注
                  - paragraph [ref=e1282]:
                    - text: 仅原版
                    - code [ref=e1283]: Inviso=yes
                    - text: 类抛射体或启用了
                    - code [ref=e1284]: Trajectory.(Straight/Bombard).SubjectToGround=false
                    - text: 的
                    - link "Phobos 直线弹道" [ref=e1285] [cursor=pointer]:
                      - /url: "#straight-trajectory"
                    - text: 和
                    - link "Phobos 轰击弹道" [ref=e1286] [cursor=pointer]:
                      - /url: "#bombard-trajectory"
                    - text: 可穿透地表。除此之外的抛射体在接触地面时将会强制引爆。
                  - paragraph [ref=e1287]:
                    - text: 为了能够攻击处于地下水平运动的单位，攻击者需要有
                    - code [ref=e1288]: SensorsSight
                    - text: 设置。
              - generic [ref=e1289]:
                - heading "伞降炸弹 " [level=3] [ref=e1290]:
                  - text: 伞降炸弹
                  - link "" [ref=e1291] [cursor=pointer]:
                    - /url: "#parabombs"
                - list [ref=e1292]:
                  - listitem [ref=e1293]:
                    - paragraph [ref=e1294]: 还原自 RA1（也在 Ares 中部分实现但未记载，若共用则 Phobos 版本优先），允许抛射体在被空中单位发射时伞降到地面。
                    - list [ref=e1295]:
                      - listitem [ref=e1296]:
                        - paragraph [ref=e1297]:
                          - text: 设置
                          - code [ref=e1298]: Parachuted
                          - text: 为 true 以启用此行为。注意：若与
                          - code [ref=e1299]: ROT
                          - text: "> 0 或"
                          - code [ref=e1300]: Vertical=true
                          - text: 等任何其他抛射体逻辑共用将会导致不理想的效果。
                      - listitem [ref=e1301]:
                        - paragraph [ref=e1302]:
                          - text: 可通过
                          - code [ref=e1303]: Parachuted.FallRate
                          - text: 来自定义降落速度，其上限由
                          - code [ref=e1304]: Parachuted.MaxFallRate
                          - text: 决定。
                      - listitem [ref=e1305]:
                        - paragraph [ref=e1306]:
                          - text: 可通过
                          - code [ref=e1307]: BombParachute
                          - text: 来自定义降落伞动画。该动画将使用 unit 色盘绘制映射为发射者所属的阵营色。
                - paragraph [ref=e1308]:
                  - text: 在
                  - code [ref=e1309]: rulesmd.ini
                  - text: ：
                - generic [ref=e1312]: "[SOMEPROJECTILE] ; Projectile Parachuted=false ; boolean Parachuted.FallRate=1 ; integer Parachuted.MaxFallRate= ; integer, default to [General] -> ParachuteMaxFallRate BombParachute= ; AnimationType, default to [General] -> BombParachute"
              - generic [ref=e1313]:
                - heading "抛射体拦截 " [level=3] [ref=e1314]:
                  - text: 抛射体拦截
                  - link "" [ref=e1315] [cursor=pointer]:
                    - /url: "#projectile-interception-logic"
                - paragraph [ref=e1316]:
                  - img "图像" [ref=e1317]
                  - emphasis [ref=e1318]:
                    - link "泰伯利亚危机" [ref=e1319] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/tiberium-crisis
                    - text: 中的拦截抛射体
                - list [ref=e1320]:
                  - listitem [ref=e1321]:
                    - paragraph [ref=e1322]:
                      - text: 现在可以通过在一些抛射体上设置
                      - code [ref=e1323]: Interceptable=true
                      - text: 来使它们能够被特定的科技类型拦截。如果该科技类型没有其他目标那么它将扫描范围内的可拦截抛射体并使用它的一个武器进行射击。抛射体可以定义
                      - code [ref=e1324]: Armor
                      - text: 和
                      - code [ref=e1325]: Strength
                      - text: 。无法对该抛射体护甲类型发起攻击的武器不会尝试拦截。在拦截时如果抛射体设置了
                      - code [ref=e1326]: Armor
                      - text: 那么从抛射体的当前血量中扣除一个等于拦截武器
                      - code [ref=e1327]: Damage
                      - text: 经弹头
                      - code [ref=e1328]: Verses
                      - text: 和科技类型火力加成调整后的数值。无论当前抛射体血量是否被减少若拦截后其血量为 0 或更低那么抛射体将被引爆。
                    - list [ref=e1329]:
                      - listitem [ref=e1330]:
                        - paragraph [ref=e1331]:
                          - code [ref=e1332]: Interceptor.Weapon
                          - text: 决定用于拦截抛射体的武器（0 =
                          - code [ref=e1333]: Primary
                          - text: ", 1 ="
                          - code [ref=e1334]: Secondary
                          - text: ）。
                        - list [ref=e1335]:
                          - listitem [ref=e1336]:
                            - paragraph [ref=e1337]:
                              - text: 拦截武器可能需要在其抛射体上将
                              - code [ref=e1338]: AA
                              - text: 设为 true 以使其能够根据抛射体相对地面的高度来瞄准。如果你不设置这些那么武器将无法分别瞄准低空或高空飞行的抛射体。
                      - listitem [ref=e1339]:
                        - paragraph [ref=e1340]:
                          - code [ref=e1341]: Interceptor.TargetingDelay
                          - text: 决定拦截者单位扫描可被拦截抛射体的频率（单位：帧）。间隔越小越能提升拦截者工作效率，但会降低游戏运行效率。该间隔不得设为 0，否则希望将会自动调整为 1 并在日志中输出开发者警告。
                      - listitem [ref=e1342]:
                        - paragraph [ref=e1343]:
                          - code [ref=e1344]: Interceptor.CanTargetHouses
                          - text: 控制抛射体（或其发射者）属于哪些所属方时可以被拦截。
                      - listitem [ref=e1345]:
                        - paragraph [ref=e1346]:
                          - code [ref=e1347]: Interceptor.GuardRange
                          - text: （以及
                          - code [ref=e1348]: Interceptor.(Rookie|Veteran|EliteGuardRange)
                          - text: ）是单位拦截抛射体的最大范围。不过武器的射程仍会限制单位的实际拦截范围。
                      - listitem [ref=e1349]:
                        - paragraph [ref=e1350]:
                          - code [ref=e1351]: Interceptor.MinimumGuardRange
                          - text: （以及
                          - code [ref=e1352]: Interceptor.(Rookie|Veteran|EliteMinimumGuardRange)
                          - text: ）是单位拦截抛射体的最小范围。任何小于此范围的抛射体都不会被拦截。
                      - listitem [ref=e1353]:
                        - paragraph [ref=e1354]:
                          - code [ref=e1355]: Interceptor.ApplyFirepowerMult
                          - text: 决定拦截武器的伤害是否受益于科技类型所拥有的火力加成。
                      - listitem [ref=e1356]:
                        - paragraph [ref=e1357]:
                          - code [ref=e1358]: Interceptable.DeleteOnIntercept
                          - text: 决定抛射体被拦截时是被简单的移除还是直接引爆。这会被拦截者的
                          - code [ref=e1359]: Interceptor.DeleteOnIntercept
                          - text: 设置覆盖。
                      - listitem [ref=e1360]:
                        - paragraph [ref=e1361]:
                          - code [ref=e1362]: Interceptable.WeaponOverride
                          - text: 可以设置一个武器覆盖替代此抛射体在拦截时的
                          - code [ref=e1363]: Damage
                          - text: 和
                          - code [ref=e1364]: Warhead
                          - text: 等特性进行引爆。这会被拦截者的
                          - code [ref=e1365]: Interceptor.WeaponOverride
                          - text: 设置覆盖。
                        - list [ref=e1366]:
                          - listitem [ref=e1367]:
                            - paragraph [ref=e1368]:
                              - text: 在拦截者上可以将
                              - code [ref=e1369]: Interceptor.WeaponReplaceProjectile
                              - text: 设为 true 以使
                              - code [ref=e1370]: Interceptor.WeaponOverride
                              - text: 也使用自己的抛射体类型（包括
                              - code [ref=e1371]: Image
                              - text: 和其他抛射体特性）和
                              - code [ref=e1372]: Speed
                              - text: 替换被拦截的抛射体。不会替换附着的粒子系统（
                              - code [ref=e1373]: AttachedSystem
                              - text: 是一个
                              - emphasis [ref=e1374]: Ares 功能
                              - text: ）。
                          - listitem [ref=e1375]:
                            - paragraph [ref=e1376]:
                              - text: 在拦截者上可以将
                              - code [ref=e1377]: Interceptor.WeaponCumulativeDamage
                              - text: 设为 true 以使
                              - code [ref=e1378]: Interceptor.WeaponOverride
                              - text: 武器的
                              - code [ref=e1379]: Damage
                              - text: 会叠加到抛射体的
                              - code [ref=e1380]: Damage
                              - text: 上而不是覆盖它。
                      - listitem [ref=e1381]:
                        - paragraph [ref=e1382]:
                          - code [ref=e1383]: Interceptor.KeepIntact
                          - text: 可设为 true 以允许被拦截的抛射体继续飞行就像它们没有被拦截一样，不过
                          - code [ref=e1384]: Interceptor.WeaponOverride
                          - text: 等效果仍会应用。
                - paragraph [ref=e1385]:
                  - text: 在
                  - code [ref=e1386]: rulesmd.ini
                  - text: ：
                - generic [ref=e1389]: "[SOMETECHNO] ; TechnoType Interceptor=false ; boolean Interceptor.Weapon=0 ; integer, weapon slot index (0 or 1) Interceptor.TargetingDelay=1 ; integer, game frames Interceptor.CanTargetHouses=enemies ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) Interceptor.GuardRange=0.0 ; floating point value Interceptor.VeteranGuardRange= ; floating point value Interceptor.EliteGuardRange= ; floating point value Interceptor.MinimumGuardRange=0.0 ; floating point value Interceptor.VeteranMinimumGuardRange= ; floating point value Interceptor.EliteMinimumGuardRange= ; floating point value Interceptor.ApplyFirepowerMult=true ; boolean Interceptor.DeleteOnIntercept=false ; boolean Interceptor.WeaponOverride= ; WeaponType Interceptor.WeaponReplaceProjectile=false ; boolean Interceptor.WeaponCumulativeDamage=false ; boolean Interceptor.KeepIntact=false ; boolean [SOMEPROJECTILE] ; Projectile Interceptable=false ; boolean Interceptable.DeleteOnIntercept=false ; boolean Interceptable.WeaponOverride= ; WeaponType Strength=0 ; integer Armor= ; ArmorType"
                - generic [ref=e1390]:
                  - paragraph [ref=e1391]:  备注
                  - paragraph [ref=e1392]:
                    - text: 目前如果拦截武器的开火者提前死亡那么没有
                    - code [ref=e1393]: Inviso=true
                    - text: 的拦截抛射体将无法拦截目标抛射体，这在未来可能会进行更改。
              - generic [ref=e1394]:
                - heading "抛射体弹道 " [level=3] [ref=e1395]:
                  - text: 抛射体弹道
                  - link "" [ref=e1396] [cursor=pointer]:
                    - /url: "#projectile-trajectories"
                - list [ref=e1397]:
                  - listitem [ref=e1398]:
                    - paragraph [ref=e1399]: 抛射体现在可以有自定义的弹道。
                    - list [ref=e1400]:
                      - listitem [ref=e1401]:
                        - paragraph [ref=e1402]:
                          - code [ref=e1403]: Trajectory
                          - text: 不应与原游戏的抛射体逻辑（
                          - code [ref=e1404]: Arcing
                          - text: 、
                          - code [ref=e1405]: ROT
                          - text: 、
                          - code [ref=e1406]: Vertical
                          - text: 或
                          - code [ref=e1407]: Inviso
                          - text: ）结合使用。尝试你这样做将导致其他逻辑被禁用并在日志文件中写入一条警告。
                      - listitem [ref=e1408]:
                        - paragraph [ref=e1409]:
                          - text: 抛射体的速度由
                          - code [ref=e1410]: Trajectory.Speed
                          - text: 定义，与
                          - code [ref=e1411]: ROT
                          - text: "> 0 抛射体不同的是"
                          - code [ref=e1412]: Trajectory.Speed
                          - text: 定义在抛射体上而不是武器上。
                        - list [ref=e1413]:
                          - listitem [ref=e1414]:
                            - paragraph [ref=e1415]:
                              - text: 对于
                              - code [ref=e1416]: Trajectory=Straight
                              - text: 它指的是抛射体的全程速度并且没有限制。
                          - listitem [ref=e1417]:
                            - paragraph [ref=e1418]:
                              - text: 对于
                              - code [ref=e1419]: Trajectory=Bombard
                              - text: 它指的是抛射体的初始速度并且没有限制。
                          - listitem [ref=e1420]:
                            - paragraph [ref=e1421]:
                              - text: 对于
                              - code [ref=e1422]: Trajectory=Parabola
                              - text: 它指的是抛射体仅用于模式 0、3 或 5 的水平速度并且没有限制。
                - paragraph [ref=e1423]:
                  - text: 在
                  - code [ref=e1424]: rulesmd.ini
                  - text: ：
                - generic [ref=e1427]: "[SOMEPROJECTILE] ; Projectile Trajectory.Speed=100.0 ; floating point value"
                - generic [ref=e1428]:
                  - heading "直线弹道 " [level=4] [ref=e1429]:
                    - text: 直线弹道
                    - link "" [ref=e1430] [cursor=pointer]:
                      - /url: "#straight-trajectory"
                  - paragraph [ref=e1431]:
                    - img "直线弹道爆能枪" [ref=e1432]
                    - emphasis [ref=e1433]: "@brsajo#9745 在其个人 mod 中使用直线弹道制作的爆能枪"
                  - list [ref=e1434]:
                    - listitem [ref=e1435]:
                      - paragraph [ref=e1436]: 不言自明，这是一种直线射击弹道。
                      - list [ref=e1437]:
                        - listitem [ref=e1438]:
                          - paragraph [ref=e1439]:
                            - code [ref=e1440]: Trajectory.Straight.DetonationDistance
                            - text: 控制抛射体强制引爆位置相对于目标单元格的距离阈值（每个游戏帧开始时、抛射体移动前检查）。设为 0 以禁用强制引爆（注意这可能导致抛射体飞掠目标）。如果
                            - code [ref=e1441]: Trajectory.Straight.ApplyRangeModifiers
                            - text: 设为 true 则任何来自开火者的武器射程加成也将在此处被使用。通过设置
                            - code [ref=e1442]: Trajectory.Straight.PassThrough=true
                            - text: 当值大于 0 时它指的是抛射体从自身开始移动的距离，当值小于 0 时它指的是抛射体飞跃目标后移动的距离（使用绝对值）。
                        - listitem [ref=e1443]:
                          - paragraph [ref=e1444]:
                            - code [ref=e1445]: Trajectory.Straight.TargetSnapDistance
                            - text: 控制抛射体在引爆时与目标的最大距离以使抛射体在引爆时 “瞬移” 到目标。设为 0 将禁用瞬移。
                        - listitem [ref=e1446]:
                          - paragraph [ref=e1447]:
                            - code [ref=e1448]: Trajectory.Straight.PassThrough
                            - text: 启用特殊的逻辑：抛射体在接触目标时不会引爆而是继续飞行到由
                            - code [ref=e1449]: Trajectory.Straight.DetonationDistance
                            - text: 定义的距离。注意抛射体发射角度会受此影响，如果与目标处于同一高度那么直接向前发射。
                        - listitem [ref=e1450]:
                          - paragraph [ref=e1451]:
                            - code [ref=e1452]: Trajectory.Straight.PassDetonate
                            - text: 启用抛射体在飞行过程中的额外爆炸。（如果你希望抛射体在飞行过程中每隔一定距离／时间引爆一次那么可以使用此功能）。
                          - list [ref=e1453]:
                            - listitem [ref=e1454]:
                              - paragraph [ref=e1455]:
                                - code [ref=e1456]: Trajectory.Straight.PassDetonateWarhead
                                - text: 定义由
                                - code [ref=e1457]: Trajectory.Straight.PassDetonate
                                - text: 引爆的弹头，
                                - code [ref=e1458]: Trajectory.Straight.PassDetonateDamage
                                - text: 定义由
                                - code [ref=e1459]: Trajectory.Straight.PassDetonateWarhead
                                - text: 引爆的伤害。
                            - listitem [ref=e1460]:
                              - paragraph [ref=e1461]:
                                - code [ref=e1462]: Trajectory.Straight.PassDetonateDelay
                                - text: 控制
                                - code [ref=e1463]: Trajectory.Straight.Warhead
                                - text: 所定义弹头的引爆间隔。
                            - listitem [ref=e1464]:
                              - paragraph [ref=e1465]:
                                - code [ref=e1466]: Trajectory.Straight.PassDetonateInitialDelay
                                - text: 控制
                                - code [ref=e1467]: Trajectory.Straight.PassDetonateWarhead
                                - text: 所定义弹头的初始引爆间隔。
                            - listitem [ref=e1468]:
                              - paragraph [ref=e1469]:
                                - code [ref=e1470]: Trajectory.Straight.PassDetonateLocal
                                - text: 控制
                                - code [ref=e1471]: Trajectory.Straight.PassDetonateWarhead
                                - text: 和武器
                                - code [ref=e1472]: Warhead
                                - text: 是否始终在下方地面引爆。它还将不再限制抛射体在使用
                                - code [ref=e1473]: Trajectory.Straight.ConfineAtHeight
                                - text: 时的垂直速度。
                        - listitem [ref=e1474]:
                          - paragraph [ref=e1475]:
                            - code [ref=e1476]: Trajectory.Straight.LeadTimeCalculate
                            - text: 控制抛射体在射击时是否需要计算目标的提前量。注意这不会影响炮塔的朝向。
                        - listitem [ref=e1477]:
                          - paragraph [ref=e1478]:
                            - code [ref=e1479]: Trajectory.Straight.OffsetCoord
                            - text: 控制锁定目标的偏移量。抛射体将瞄准此位置进行攻击。在此基础上它也支持
                            - code [ref=e1480]: Inaccurate=yes
                            - text: 和
                            - code [ref=e1481]: Trajectory.Straight.LeadTimeCalculate=true
                            - text: 。
                          - list [ref=e1482]:
                            - listitem [ref=e1483]:
                              - paragraph [ref=e1484]:
                                - code [ref=e1485]: Trajectory.Straight.RotateCoord
                                - text: 控制是否根据武器的
                                - code [ref=e1486]: Burst
                                - text: 在以
                                - code [ref=e1487]: Trajectory.Straight.OffsetCoord
                                - text: 为角平分线的角度内旋转抛射体的发射方向。设为 0 以禁用此功能。
                            - listitem [ref=e1488]:
                              - paragraph [ref=e1489]:
                                - code [ref=e1490]: Trajectory.Straight.MirrorCoord
                                - text: 控制
                                - code [ref=e1491]: Trajectory.Straight.OffsetCoord
                                - text: 是否需要镜像水平方向值以适应当前的连发索引。同时，
                                - code [ref=e1492]: Trajectory.Straight.RotateCoord
                                - text: 计算出的旋转方向也将被反转，每侧相邻抛射体之间的旋转角度不会受此改变。
                            - listitem [ref=e1493]:
                              - paragraph [ref=e1494]:
                                - code [ref=e1495]: Trajectory.Straight.UseDisperseBurst
                                - text: 控制
                                - code [ref=e1496]: Trajectory.Straight.RotateCoord
                                - text: 的计算是否基于其上级武器的
                                - code [ref=e1497]: Trajectory.Disperse.WeaponBurst
                                - text: 而不是武器的
                                - code [ref=e1498]: Burst
                                - text: 。此值不合适将导致不理想的视觉效果。
                            - listitem [ref=e1499]:
                              - paragraph [ref=e1500]:
                                - code [ref=e1501]: Trajectory.Straight.AxisOfRotation
                                - text: 控制计算
                                - code [ref=e1502]: Trajectory.Straight.RotateCoord
                                - text: 的转轴。随单位朝向或目标位置到源位置的向量旋转。
                        - listitem [ref=e1503]:
                          - paragraph [ref=e1504]:
                            - code [ref=e1505]: Trajectory.Straight.ProximityImpact
                            - text: 控制初始的近炸引信次数。当剩余次数足够且抛射体靠近另一个有效目标时它将引爆由
                            - code [ref=e1506]: Trajectory.Straight.ProximityWarhead
                            - text: 定义的弹头，如果剩余次数即将用完它将在当前位置引爆。此功能可以通过设为 0 禁用。负值整数表示无限次数。顺带一提，你可以使用带有低
                            - code [ref=e1507]: Versus
                            - text: 的武器
                            - code [ref=e1508]: Warhead
                            - text: 以瞄准目标，使用
                            - code [ref=e1509]: Trajectory.Straight.ProximityWarhead
                            - text: 造成实际伤害。（你可以使用此功能在抛射体飞行期间对遇到的所有单位造成非重复伤害。）
                          - list [ref=e1510]:
                            - listitem [ref=e1511]:
                              - paragraph [ref=e1512]:
                                - code [ref=e1513]: Trajectory.Straight.ProximityWarhead
                                - text: 定义由
                                - code [ref=e1514]: Trajectory.Straight.ProximityImpact
                                - text: 引爆的弹头，
                                - code [ref=e1515]: Trajectory.Straight.ProximityDamage
                                - text: 定义由
                                - code [ref=e1516]: Trajectory.Straight.ProximityWarhead
                                - text: 引爆的伤害。
                            - listitem [ref=e1517]:
                              - paragraph [ref=e1518]:
                                - code [ref=e1519]: Trajectory.Straight.ProximityRadius
                                - text: 控制近炸引信的范围。不支持负整数。
                            - listitem [ref=e1520]:
                              - paragraph [ref=e1521]:
                                - code [ref=e1522]: Trajectory.Straight.ProximityDirect
                                - text: 控制是否直接伤害目标而不是引爆弹头。
                            - listitem [ref=e1523]:
                              - paragraph [ref=e1524]:
                                - code [ref=e1525]: Trajectory.Straight.ProximityMedial
                                - text: 控制是否在抛射体位置而不是近炸目标位置引爆弹头。如果
                                - code [ref=e1526]: Trajectory.Straight.ProximityDirect
                                - text: 设为 true，这只会影响
                                - code [ref=e1527]: Trajectory.Straight.EdgeAttenuation
                                - text: 的计算结果。
                            - listitem [ref=e1528]:
                              - paragraph [ref=e1529]:
                                - code [ref=e1530]: Trajectory.Straight.ProximityAllies
                                - text: 控制友军是否也会触发近炸引信。
                            - listitem [ref=e1531]:
                              - paragraph [ref=e1532]:
                                - code [ref=e1533]: Trajectory.Straight.ProximityFlight
                                - text: 控制是否考虑空中的单位。
                        - listitem [ref=e1534]:
                          - paragraph [ref=e1535]:
                            - code [ref=e1536]: Trajectory.Straight.ThroughVehicles
                            - text: 控制抛射体是否不会被地面上的载具或战机阻挡。当它被阻挡时将直接在其位置引爆。如果它的
                            - code [ref=e1537]: Trajectory.Straight.ProximityImpact
                            - text: 次数还没耗尽，它也会在障碍物位置引爆一个
                            - code [ref=e1538]: Trajectory.Straight.ProximityImpact
                            - text: 。
                        - listitem [ref=e1539]:
                          - paragraph [ref=e1540]:
                            - code [ref=e1541]: Trajectory.Straight.ThroughBuilding
                            - text: 控制抛射体是否不会被建筑阻挡。当它被阻挡时将直接在其位置引爆。如果它的
                            - code [ref=e1542]: Trajectory.Straight.ProximityImpact
                            - text: 次数还没耗尽，它也会在障碍物位置引爆一个
                            - code [ref=e1543]: Trajectory.Straight.ProximityImpact
                            - text: 。
                        - listitem [ref=e1544]:
                          - paragraph [ref=e1545]:
                            - code [ref=e1546]: Trajectory.Straight.SubjectToGround
                            - text: 控制抛射体在击中地面时是否爆炸。注意这并不能让 AI 去寻找合适的攻击位置。
                        - listitem [ref=e1547]:
                          - paragraph [ref=e1548]:
                            - code [ref=e1549]: Trajectory.Straight.ConfineAtHeight
                            - text: 控制抛射体尽可能保持的飞行高度。通过设置
                            - code [ref=e1550]: SubjectToCliffs=true
                            - text: 可以使其不得从悬崖上向下移动。可以通过设置为非正整数来取消。如果
                            - code [ref=e1551]: Trajectory.Speed
                            - text: 大于 256，它将被强制取消。
                        - listitem [ref=e1552]:
                          - paragraph [ref=e1553]:
                            - code [ref=e1554]: Trajectory.Straight.EdgeAttenuation
                            - text: 控制抛射体杀伤的边缘衰减比例（包括弹道添加的所有伤害类型），即实际造成的伤害是将此值乘以当前距离与武器射程的比值。不能设为负整数。
                        - listitem [ref=e1555]:
                          - paragraph [ref=e1556]:
                            - code [ref=e1557]: Trajectory.Straight.CountAttenuation
                            - text: 控制抛射体杀伤的衰减系数（包括弹道添加的所有伤害类型），即每次造成伤害后的下一次伤害会翻多少倍。不能设为负整数。
                  - paragraph [ref=e1558]:
                    - text: 在
                    - code [ref=e1559]: rulesmd.ini
                    - text: ：
                  - generic [ref=e1562]: "[SOMEPROJECTILE] ; Projectile Trajectory=Straight ; Trajectory type Trajectory.Straight.ApplyRangeModifiers=false ; boolean Trajectory.Straight.DetonationDistance=0.4 ; floating point value Trajectory.Straight.TargetSnapDistance=0.5 ; floating point value Trajectory.Straight.PassThrough=false ; boolean Trajectory.Straight.PassDetonate=false ; boolean Trajectory.Straight.PassDetonateWarhead= ; WarheadType Trajectory.Straight.PassDetonateDamage=0 ; integer Trajectory.Straight.PassDetonateDelay=1 ; integer Trajectory.Straight.PassDetonateInitialDelay=0 ; integer Trajectory.Straight.PassDetonateLocal=false ; boolean Trajectory.Straight.LeadTimeCalculate=false ; boolean Trajectory.Straight.OffsetCoord=0,0,0 ; integer - Forward,Lateral,Height Trajectory.Straight.RotateCoord=0 ; floating point value Trajectory.Straight.MirrorCoord=true ; boolean Trajectory.Straight.UseDisperseBurst=false ; boolean Trajectory.Straight.AxisOfRotation=0,0,1 ; integer - Forward,Lateral,Height Trajectory.Straight.ProximityImpact=0 ; integer Trajectory.Straight.ProximityWarhead= ; WarheadType Trajectory.Straight.ProximityDamage=0 ; integer Trajectory.Straight.ProximityRadius=0.7 ; floating point value Trajectory.Straight.ProximityDirect=false ; boolean Trajectory.Straight.ProximityMedial=false ; boolean Trajectory.Straight.ProximityAllies=false ; boolean Trajectory.Straight.ProximityFlight=false ; boolean Trajectory.Straight.ThroughVehicles=true ; boolean Trajectory.Straight.ThroughBuilding=true ; boolean Trajectory.Straight.SubjectToGround=false ; boolean Trajectory.Straight.ConfineAtHeight=0 ; integer Trajectory.Straight.EdgeAttenuation=1.0 ; floating point value Trajectory.Straight.CountAttenuation=1.0 ; floating point value"
                  - generic [ref=e1563]:
                    - paragraph [ref=e1564]:  备注
                    - list [ref=e1565]:
                      - listitem [ref=e1566]:
                        - paragraph [ref=e1567]:
                          - text: 除非实在必要否则请设置较低的
                          - code [ref=e1568]: Trajectory.Straight.ProximityRadius
                          - text: 值。
                      - listitem [ref=e1569]:
                        - paragraph [ref=e1570]:
                          - text: 列于
                          - code [ref=e1571]: Trajectory.Straight.PassDetonateWarhead
                          - text: 和
                          - code [ref=e1572]: Trajectory.Straight.ProximityWarhead
                          - text: 的弹头必须在
                          - code [ref=e1573]: "[Warheads]"
                          - text: 中列出才能生效。
                - generic [ref=e1574]:
                  - heading "轰击弹道 " [level=4] [ref=e1575]:
                    - text: 轰击弹道
                    - link "" [ref=e1576] [cursor=pointer]:
                      - /url: "#bombard-trajectory"
                  - list [ref=e1577]:
                    - listitem [ref=e1578]:
                      - paragraph [ref=e1579]:
                        - text: 类似于
                        - code [ref=e1580]: Straight
                        - text: 但首先瞄准攻击者和目标间的某个坐标。当抛射体接近该拐点后它才会转向目标并在击中目标或地面时引爆。
                      - list [ref=e1581]:
                        - listitem [ref=e1582]:
                          - paragraph [ref=e1583]:
                            - code [ref=e1584]: Trajectory.Bombard.Height
                            - text: 控制拐点的高度。
                        - listitem [ref=e1585]:
                          - paragraph [ref=e1586]:
                            - code [ref=e1587]: Trajectory.Bombard.FallPercent
                            - text: 通过拐点位置占发射位置与目标位置间总距离的百分比来控制拐点的距离。如果设为 0% 则它将在开火位置的正上方。如果设为 100% 则它将位于目标正上方。
                          - list [ref=e1588]:
                            - listitem [ref=e1589]:
                              - paragraph [ref=e1590]:
                                - text: 每次发射时拐点位置的百分比值可以随机浮动，该值不大于
                                - code [ref=e1591]: Trajectory.Bombard.FallPercentShift
                                - text: 。如果设为 0 则随机调整将被禁用。
                            - listitem [ref=e1592]:
                              - paragraph [ref=e1593]:
                                - text: 你还可以使拐点在以
                                - code [ref=e1594]: Trajectory.Bombard.FallScatter.Max
                                - text: 为半径的圆内随机散布。如果设为 0 则随机散布将被禁用。
                                - code [ref=e1595]: Trajectory.Bombard.FallScatter.Min
                                - text: 可用于确定圆的最低半径。如果
                                - code [ref=e1596]: Trajectory.Bombard.FallScatter.Linear
                                - text: 设为 true，则随机散布范围将被限制在发射位置与目标位置之间连线的垂面。
                        - listitem [ref=e1597]:
                          - paragraph [ref=e1598]:
                            - code [ref=e1599]: Trajectory.Bombard.FreeFallOnTarget
                            - text: 控制它将如何击中目标。如果设为 true，则抛射体将在目标上方重新生成并自由落体。如果设为 false，则抛射体将正常从拐点位置飞向目标。
                        - listitem [ref=e1600]:
                          - paragraph [ref=e1601]:
                            - code [ref=e1602]: Trajectory.Bombard.NoLaunch
                            - text: 控制攻击者是否会自行发射抛射体。如果设为 true，则抛射体将直接从拐点位置下落。
                        - listitem [ref=e1603]:
                          - paragraph [ref=e1604]:
                            - code [ref=e1605]: Trajectory.Bombard.FallSpeed
                            - text: 控制抛射体经过拐点后的初速度。如果设为 0.0，则它将使用
                            - code [ref=e1606]: Trajectory.Speed
                            - text: 。当
                            - code [ref=e1607]: Trajectory.Bombard.FreeFallOnTarget
                            - text: 设为 true 时将无法工作。
                        - listitem [ref=e1608]:
                          - paragraph [ref=e1609]:
                            - code [ref=e1610]: Trajectory.Bombard.DetonationDistance
                            - text: 控制强制引爆位置相对于目标单元格的距离阈值（在每次游戏帧开始时检查，抛射体移动之前）。设为 0 可以禁用强制引爆（注意这可能导致抛射体越过目标）。
                        - listitem [ref=e1611]:
                          - paragraph [ref=e1612]:
                            - code [ref=e1613]: Trajectory.Bombard.DetonationHeight
                            - text: 控制当抛射体处于下降状态且低于发射位置的高度加上此值时将会提前引爆。设置为非负数时生效。如果
                            - code [ref=e1614]: Trajectory.Bombard.EarlyDetonation
                            - text: 设为 true，则它将在上升段生效，这表示当抛射体高度高于发射位置加上此值时将引爆。
                        - listitem [ref=e1615]:
                          - paragraph [ref=e1616]:
                            - code [ref=e1617]: Trajectory.Bombard.TargetSnapDistance
                            - text: 控制抛射体在引爆时与目标的最大距离以使抛射体在引爆时 “瞬移” 到目标。设为 0 将禁用瞬移。
                        - listitem [ref=e1618]:
                          - paragraph [ref=e1619]:
                            - code [ref=e1620]: Trajectory.Bombard.TurningPointAnims
                            - text: 如果设置将会在抛射体抵达拐点时播放动画。如果
                            - code [ref=e1621]: Trajectory.Bombard.FreeFallOnTarget
                            - text: 设为 true，则抛射体将与目标一起在目标上方生成。如果
                            - code [ref=e1622]: Trajectory.Bombard.NoLaunch
                            - text: 设为 true，则无论抛射体是否自由落体，它都将在抛射体下落的位置播放动画。如果列出了多个动画，则将随机选择一个。
                        - listitem [ref=e1623]:
                          - paragraph [ref=e1624]:
                            - code [ref=e1625]: Trajectory.Bombard.LeadTimeCalculate
                            - text: 控制抛射体在射击时是否需要计算目标的提前量。注意这不会影响炮塔的朝向。
                        - listitem [ref=e1626]:
                          - paragraph [ref=e1627]:
                            - text: 以下标签在
                            - code [ref=e1628]: Trajectory.Bombard.FreeFallOnTarget
                            - text: 设为 false 时进一步自定义抛射体的下落行为。
                          - list [ref=e1629]:
                            - listitem [ref=e1630]:
                              - paragraph [ref=e1631]:
                                - code [ref=e1632]: Trajectory.Bombard.OffsetCoord
                                - text: 控制锁定目标的偏移量。抛射体将瞄准此位置进行攻击。在此基础上它也支持
                                - code [ref=e1633]: Inaccurate=yes
                                - text: 和
                                - code [ref=e1634]: Trajectory.Bombard.LeadTimeCalculate=true
                                - text: 。
                            - listitem [ref=e1635]:
                              - paragraph [ref=e1636]:
                                - code [ref=e1637]: Trajectory.Bombard.RotateCoord
                                - text: 控制是否根据武器的
                                - code [ref=e1638]: Burst
                                - text: 在以
                                - code [ref=e1639]: Trajectory.Bombard.OffsetCoord
                                - text: 为角平分线的角度内旋转抛射体的发射方向。设为 0 以禁用此功能。
                            - listitem [ref=e1640]:
                              - paragraph [ref=e1641]:
                                - code [ref=e1642]: Trajectory.Bombard.MirrorCoord
                                - text: 控制
                                - code [ref=e1643]: Trajectory.Bombard.OffsetCoord
                                - text: 是否需要镜像水平方向值以适应当前的连发索引。同时，
                                - code [ref=e1644]: Trajectory.Bombard.RotateCoord
                                - text: 计算出的旋转方向也将被反转，每侧相邻抛射体之间的旋转角度不会受此改变。
                            - listitem [ref=e1645]:
                              - paragraph [ref=e1646]:
                                - code [ref=e1647]: Trajectory.Bombard.UseDisperseBurst
                                - text: 控制
                                - code [ref=e1648]: Trajectory.Bombard.RotateCoord
                                - text: 的计算是否基于其上级武器的
                                - code [ref=e1649]: Trajectory.Disperse.WeaponBurst
                                - text: 而不是武器的
                                - code [ref=e1650]: Burst
                                - text: 。此值不合适将导致不理想的视觉效果。
                            - listitem [ref=e1651]:
                              - paragraph [ref=e1652]:
                                - code [ref=e1653]: Trajectory.Bombard.AxisOfRotation
                                - text: 控制计算
                                - code [ref=e1654]: Trajectory.Bombard.RotateCoord
                                - text: 的转轴。随单位朝向或目标位置到源位置的向量旋转。
                        - listitem [ref=e1655]:
                          - paragraph [ref=e1656]:
                            - code [ref=e1657]: Trajectory.Bombard.SubjectToGround
                            - text: 控制抛射体在击中地面时是否爆炸。注意这并不能让 AI 去寻找合适的攻击位置。
                  - paragraph [ref=e1658]:
                    - text: 在
                    - code [ref=e1659]: rulesmd.ini
                    - text: ：
                  - generic [ref=e1662]: "[SOMEPROJECTILE] ; Projectile Trajectory=Bombard ; Trajectory type Trajectory.Bombard.Height=0.0 ; double Trajectory.Bombard.FallPercent=1.0 ; double Trajectory.Bombard.FallPercentShift=0.0 ; double Trajectory.Bombard.FallScatter.Max=0.0 ; floating point value Trajectory.Bombard.FallScatter.Min=0.0 ; floating point value Trajectory.Bombard.FallScatter.Linear=false ; boolean Trajectory.Bombard.FreeFallOnTarget=true ; boolean Trajectory.Bombard.NoLaunch=false ; boolean Trajectory.Bombard.FallSpeed=0.0 ; double Trajectory.Bombard.DetonationDistance=0.4 ; floating point value Trajectory.Bombard.DetonationHeight=-1 ; integer Trajectory.Bombard.EarlyDetonation=false ; boolean Trajectory.Bombard.TargetSnapDistance=0.5 ; floating point value Trajectory.Bombard.TurningPointAnims= ; List of AnimationTypes Trajectory.Bombard.LeadTimeCalculate=false ; boolean Trajectory.Bombard.OffsetCoord=0,0,0 ; integer - Forward,Lateral,Height Trajectory.Bombard.RotateCoord=0 ; floating point value Trajectory.Bombard.MirrorCoord=true ; boolean Trajectory.Bombard.UseDisperseBurst=false ; boolean Trajectory.Bombard.AxisOfRotation=0,0,1 ; integer - Forward,Lateral,Height Trajectory.Bombard.SubjectToGround=false ; boolean"
                - generic [ref=e1663]:
                  - heading "抛物线弹道 " [level=4] [ref=e1664]:
                    - text: 抛物线弹道
                    - link "" [ref=e1665] [cursor=pointer]:
                      - /url: "#parabola-trajectory"
                  - list [ref=e1666]:
                    - listitem [ref=e1667]:
                      - paragraph [ref=e1668]:
                        - text: 顾名思义，这是一种完全重置且拥有不同增强功能的类
                        - code [ref=e1669]: Arcing
                        - text: 弹道，它支持与
                        - code [ref=e1670]: Trajectory=Disperse
                        - text: 的联动。
                      - list [ref=e1671]:
                        - listitem [ref=e1672]:
                          - paragraph [ref=e1673]:
                            - code [ref=e1674]: Trajectory.Parabola.DetonationDistance
                            - text: 控制强制引爆位置相对于目标单元格的距离阈值（在每次游戏帧开始时检查，抛射体移动之前）。设为 0 可以禁用强制引爆（注意这可能导致抛射体越过目标）。更具体地说，当它被设为负值时，如果目标可移动，它将改变其目标到目标所在单元格的位置（这是为
                            - code [ref=e1675]: Disperse
                            - text: 和
                            - code [ref=e1676]: Airburst
                            - text: 而扩展的功能）。
                        - listitem [ref=e1677]:
                          - paragraph [ref=e1678]:
                            - code [ref=e1679]: Trajectory.Parabola.TargetSnapDistance
                            - text: 控制抛射体在引爆时与目标的最大距离以使抛射体在引爆时 “瞬移” 到目标。设为 0 将禁用瞬移。
                        - listitem [ref=e1680]:
                          - paragraph [ref=e1681]:
                            - code [ref=e1682]: Trajectory.Parabola.OpenFireMode
                            - text: 控制抛射体应该如何发射，它有如下 6 种模式：
                          - list [ref=e1683]:
                            - listitem [ref=e1684]:
                              - paragraph [ref=e1685]:
                                - text: Speed - 固定水平速度的自动计算模式，使用
                                - code [ref=e1686]: Trajectory.Speed
                                - text: 和目标坐标作为计算条件，即抛射体的飞行时间将永久固定。
                            - listitem [ref=e1687]:
                              - paragraph [ref=e1688]:
                                - text: Height - 固定最大高度的自动计算模式，使用
                                - code [ref=e1689]: Trajectory.Parabola.ThrowHeight
                                - text: 和目标坐标作为计算条件，即抛射体的引爆时间将相对固定。
                            - listitem [ref=e1690]:
                              - paragraph [ref=e1691]:
                                - text: Angle - 固定开火角度的自动计算模式，使用
                                - code [ref=e1692]: Trajectory.Parabola.LaunchAngle
                                - text: 和目标坐标作为计算条件。在此模式下，性能消耗较高且可能无法解决。不建议在启用
                                - code [ref=e1693]: SubjectToCliffs
                                - text: 或启用
                                - code [ref=e1694]: AA
                                - text: 且
                                - code [ref=e1695]: MinimumRange
                                - text: 较小时使用此模式。
                            - listitem [ref=e1696]:
                              - paragraph [ref=e1697]:
                                - text: SpeedAndHeight - 固定水平速度和最大高度模式，使用
                                - code [ref=e1698]: Trajectory.Speed
                                - text: 和
                                - code [ref=e1699]: Trajectory.Parabola.ThrowHeight
                                - text: 作为计算条件，即抛射体将只进行高度变化，高度随目标高度变化。
                            - listitem [ref=e1700]:
                              - paragraph [ref=e1701]:
                                - text: HeightAndAngle - 固定最大高度和开火角度模式，使用
                                - code [ref=e1702]: Trajectory.Parabola.ThrowHeight
                                - text: 和
                                - code [ref=e1703]: Trajectory.Parabola.LaunchAngle
                                - text: 作为计算条件，即抛射体将随高度变化而水平变化。
                            - listitem [ref=e1704]:
                              - paragraph [ref=e1705]:
                                - text: SpeedAndAngle - 固定水平速度和开火角度模式，使用
                                - code [ref=e1706]: Trajectory.Speed
                                - text: 和
                                - code [ref=e1707]: Trajectory.Parabola.LaunchAngle
                                - text: 作为计算条件，即抛射体弹道恒定。
                        - listitem [ref=e1708]:
                          - paragraph [ref=e1709]:
                            - code [ref=e1710]: Trajectory.Parabola.ThrowHeight
                            - text: 控制抛射体的最大高度，仅用于模式 1、3 或 4。具体高度将由取发射高度和目标高度中的较大值然后增加此值决定。不支持非正数。
                        - listitem [ref=e1711]:
                          - paragraph [ref=e1712]:
                            - code [ref=e1713]: Trajectory.Parabola.LaunchAngle
                            - text: 控制抛射体的开火角度，仅用于模式 2、4 或 5。在模式 2 或 5 中仅支持 -90.0 ~ 90.0（不能使用边界值），在模式 4 中则是 0.0 ~ 90.0（不能使用边界值）。
                        - listitem [ref=e1714]:
                          - paragraph [ref=e1715]:
                            - code [ref=e1716]: Trajectory.Parabola.LeadTimeCalculate
                            - text: 控制抛射体在射击时是否需要计算目标的提前量。注意这不会影响炮塔的朝向。
                        - listitem [ref=e1717]:
                          - paragraph [ref=e1718]:
                            - code [ref=e1719]: Trajectory.Parabola.DetonationAngle
                            - text: 控制当抛射体当前速度方向与水平方向的角度小于此值时，它将提前引爆。当值为 -90.0 ~ 90.0（不能使用边界值）时生效。
                        - listitem [ref=e1720]:
                          - paragraph [ref=e1721]:
                            - code [ref=e1722]: Trajectory.Parabola.DetonationHeight
                            - text: 控制当抛射体处于下落段且低于发射位置的高度加上此值时会提前引爆。设置为非负数时生效。
                        - listitem [ref=e1723]:
                          - paragraph [ref=e1724]:
                            - code [ref=e1725]: Trajectory.Parabola.BounceTimes
                            - text: 控制抛射体在击中地面或悬崖时可以弹跳的次数。注意过高的抛射体速度可能导致异常操作。此外，
                            - code [ref=e1726]: Trajectory.Parabola.DetonationDistance
                            - text: 与此不会冲突，它们将同时生效。因此，如果你想让子弹只在弹跳次数用尽后爆炸，你应该将
                            - code [ref=e1727]: Trajectory.Parabola.DetonationDistance
                            - text: 设置为非正数。
                          - list [ref=e1728]:
                            - listitem [ref=e1729]:
                              - paragraph [ref=e1730]:
                                - code [ref=e1731]: Trajectory.Parabola.BounceOnWater
                                - text: 控制能否在水面上弹跳。
                            - listitem [ref=e1732]:
                              - paragraph [ref=e1733]:
                                - code [ref=e1734]: Trajectory.Parabola.BounceDetonate
                                - text: 控制是否在每次弹跳时额外引爆一次弹头。
                            - listitem [ref=e1735]:
                              - paragraph [ref=e1736]:
                                - code [ref=e1737]: Trajectory.Parabola.BounceAttenuation
                                - text: 控制抛射体弹跳伤害的衰减系数，即每次造成伤害后的下一次伤害会翻多少倍。这也将影响最终引爆的伤害。
                            - listitem [ref=e1738]:
                              - paragraph [ref=e1739]:
                                - code [ref=e1740]: Trajectory.Parabola.BounceCoefficient
                                - text: 控制抛射体弹跳弹性的衰减系数，即每次弹跳后的速度会翻多少倍。
                        - listitem [ref=e1741]:
                          - paragraph [ref=e1742]:
                            - code [ref=e1743]: Trajectory.Parabola.OffsetCoord
                            - text: 控制锁定目标的偏移量。抛射体将瞄准此位置进行攻击。在此基础上它也支持
                            - code [ref=e1744]: Inaccurate=yes
                            - text: 和
                            - code [ref=e1745]: Trajectory.Parabola.LeadTimeCalculate=true
                            - text: 。
                          - list [ref=e1746]:
                            - listitem [ref=e1747]:
                              - paragraph [ref=e1748]:
                                - code [ref=e1749]: Trajectory.Parabola.RotateCoord
                                - text: 控制是否根据武器的
                                - code [ref=e1750]: Burst
                                - text: 在以
                                - code [ref=e1751]: Trajectory.Parabola.OffsetCoord
                                - text: 为角平分线的角度内旋转抛射体的发射方向。设为 0 以禁用此功能。
                            - listitem [ref=e1752]:
                              - paragraph [ref=e1753]:
                                - code [ref=e1754]: Trajectory.Parabola.MirrorCoord
                                - text: 控制
                                - code [ref=e1755]: Trajectory.Parabola.OffsetCoord
                                - text: 是否需要镜像水平方向值以适应当前的连发索引。同时，
                                - code [ref=e1756]: Trajectory.Parabola.RotateCoord
                                - text: 计算出的旋转方向也将被反转，每侧相邻抛射体之间的旋转角度不会受此改变。
                            - listitem [ref=e1757]:
                              - paragraph [ref=e1758]:
                                - code [ref=e1759]: Trajectory.Parabola.UseDisperseBurst
                                - text: 控制
                                - code [ref=e1760]: Trajectory.Parabola.RotateCoord
                                - text: 的计算是否基于其上级武器的
                                - code [ref=e1761]: Trajectory.Disperse.WeaponBurst
                                - text: 而不是武器的
                                - code [ref=e1762]: Burst
                                - text: 。此值不合适将导致不理想的视觉效果。
                            - listitem [ref=e1763]:
                              - paragraph [ref=e1764]:
                                - code [ref=e1765]: Trajectory.Parabola.AxisOfRotation
                                - text: 控制计算
                                - code [ref=e1766]: Trajectory.Parabola.RotateCoord
                                - text: 的转轴。随单位朝向或目标位置到源位置的向量旋转。
                  - paragraph [ref=e1767]:
                    - text: 在
                    - code [ref=e1768]: rulesmd.ini
                    - text: ：
                  - generic [ref=e1771]: "[SOMEPROJECTILE] ; Projectile Trajectory=Parabola ; Trajectory type Trajectory.Parabola.DetonationDistance=0.4 ; floating point value Trajectory.Parabola.TargetSnapDistance=0.5 ; floating point value Trajectory.Parabola.OpenFireMode=Speed ; ParabolaFireMode value enumeration (Speed|Height|Angle|SpeedAndHeight|HeightAndAngle|SpeedAndAngle) Trajectory.Parabola.ThrowHeight=600 ; integer Trajectory.Parabola.LaunchAngle=30 ; floating point value Trajectory.Parabola.LeadTimeCalculate=no ; boolean Trajectory.Parabola.DetonationAngle=-90.0 ; floating point value Trajectory.Parabola.DetonationHeight=-1 ; integer Trajectory.Parabola.BounceTimes=0 ; integer Trajectory.Parabola.BounceOnWater=no ; boolean Trajectory.Parabola.BounceDetonate=no ; boolean Trajectory.Parabola.BounceAttenuation=0.8 ; floating point value Trajectory.Parabola.BounceCoefficient=0.8 ; floating point value Trajectory.Parabola.OffsetCoord=0,0,0 ; integer - Forward,Lateral,Height Trajectory.Parabola.RotateCoord=0 ; floating point value Trajectory.Parabola.MirrorCoord=yes ; boolean Trajectory.Parabola.UseDisperseBurst=no ; boolean Trajectory.Parabola.AxisOfRotation=0,0,1 ; integer - Forward,Lateral,Height"
                  - generic [ref=e1772]:
                    - paragraph [ref=e1773]:  备注
                    - list [ref=e1774]:
                      - listitem [ref=e1775]:
                        - paragraph [ref=e1776]:
                          - text: 与原有的
                          - code [ref=e1777]: Arcing
                          - text: 相比，它还可以用于战机和空爆武器。
                      - listitem [ref=e1778]:
                        - paragraph [ref=e1779]:
                          - text: 当然，
                          - code [ref=e1780]: Gravity
                          - text: 仍会影响弹道。
              - generic [ref=e1781]:
                - heading "使抛射体被陆地或水域阻挡 " [level=3] [ref=e1782]:
                  - text: 使抛射体被陆地或水域阻挡
                  - link "" [ref=e1783] [cursor=pointer]:
                    - /url: "#projectiles-blocked-by-land-or-water"
                - list [ref=e1784]:
                  - listitem [ref=e1785]:
                    - paragraph [ref=e1786]:
                      - text: 现在可以通过将
                      - code [ref=e1787]: SubjectTo(Land/Water)
                      - text: 分别设为 true 以使抛射体将陆地或水域视为阻挡其路径的障碍物。发射此类抛射体的武器将把这些障碍物阻挡的目标视为超出射程并尝试重新移动自己的位置以便在不受这些障碍阻挡的情况下开火。如果
                      - code [ref=e1788]: SubjectTo(Land/Water).Detonate
                      - text: 设置为 true，那么抛射体设法与上述障碍交叠时将会爆炸。
                    - list [ref=e1789]:
                      - listitem [ref=e1790]:
                        - paragraph [ref=e1791]:
                          - text: 默认情况下
                          - code [ref=e1792]: Level=true
                          - text: 的抛射体在非水域的地块上爆炸，但不会将这些地块视为真正的障碍物。通过设置这些标签可以覆盖此行为。
                  - listitem [ref=e1793]:
                    - paragraph [ref=e1794]:
                      - code [ref=e1795]: SubjectToGround
                      - text: 用于避免抛射体穿地而过，如果将它设为 true 那么开火者会将所在高度低于开火位置下方地面高度的目标视为超出射程并调整自身所在位置以能够开火。由于技术原因，该功能对空军和建筑无效。在
                      - code [ref=e1796]: OpenTopped=true
                      - text: 的载具内开火的科技类型也不会受到影响。
                - paragraph [ref=e1797]:
                  - text: 在
                  - code [ref=e1798]: rulesmd.ini
                  - text: ：
                - generic [ref=e1801]: "[SOMEPROJECTILE] ; Projectile SubjectToLand= ; boolean SubjectToLand.Detonate=true ; boolean SubjectToWater= ; boolean SubjectToWater.Detonate=true ; boolean SubjectToGround=false ; boolean"
              - generic [ref=e1802]:
                - heading "归返武器 " [level=3] [ref=e1803]:
                  - text: 归返武器
                  - link "" [ref=e1804] [cursor=pointer]:
                    - /url: "#return-weapon"
                - list [ref=e1805]:
                  - listitem [ref=e1806]:
                    - paragraph [ref=e1807]:
                      - text: 现在可以通过设置
                      - code [ref=e1808]: ReturnWeapon
                      - text: 使一个已爆炸的抛射体（以类似于
                      - code [ref=e1809]: AirburstWeapon
                      - text: 或
                      - code [ref=e1810]: ShrapnelWeapon
                      - text: 的方式）发射另一个武器和抛射体返回到发射者。如果发射者在初始抛射体引爆前死亡则
                      - code [ref=e1811]: ReturnWeapon
                      - text: 不会发射。
                    - list [ref=e1812]:
                      - listitem [ref=e1813]:
                        - paragraph [ref=e1814]:
                          - code [ref=e1815]: ReturnWeapon.ApplyFirepowerMult
                          - text: 决定归返武器的伤害是否受益于科技类型所拥有的火力加成。
                - paragraph [ref=e1816]:
                  - text: 在
                  - code [ref=e1817]: rulesmd.ini
                  - text: ：
                - generic [ref=e1820]: "[SOMEPROJECTILE] ; Projectile ReturnWeapon= ; WeaponType ReturnWeapon.ApplyFirepowerMult=false ; boolean"
            - generic [ref=e1821]:
              - heading "超级武器 " [level=2] [ref=e1822]:
                - text: 超级武器
                - link "" [ref=e1823] [cursor=pointer]:
                  - /url: "#super-weapons"
              - generic [ref=e1824]:
                - heading "AI 超级武器发射延迟 " [level=3] [ref=e1825]:
                  - text: AI 超级武器发射延迟
                  - link "" [ref=e1826] [cursor=pointer]:
                    - /url: "#ai-superweapon-delay-timer"
                - list [ref=e1827]:
                  - listitem [ref=e1828]:
                    - paragraph [ref=e1829]: 默认情况下 AI 所属方只检查它是否拥有能够发射的超级武器并在 106 到 112 个游戏帧的随机间隔内发射它们。这一行为现在可以自定义设置为明确的间隔时间或予以禁用。0 及更小的值会禁用间隔并导致 AI 所属方每帧检查超级武器。
                - paragraph [ref=e1830]:
                  - text: 在
                  - code [ref=e1831]: rulesmd.ini
                  - text: ：
                - generic [ref=e1834]: "[General] AISuperWeaponDelay= ; integer, game frames"
              - generic [ref=e1835]:
                - heading "单位转换超武 " [level=3] [ref=e1836]:
                  - text: 单位转换超武
                  - link "" [ref=e1837] [cursor=pointer]:
                    - /url: "#convert-technotype"
                - list [ref=e1838]:
                  - listitem [ref=e1839]:
                    - paragraph [ref=e1840]: 现在弹头可以将受影响单位的科技类型更改为同大类的其他科技类型（步兵到步兵，车辆到车辆，战机到战机）。
                    - list [ref=e1841]:
                      - listitem [ref=e1842]:
                        - paragraph [ref=e1843]:
                          - code [ref=e1844]: ConvertN.From
                          - text: （此处 N 为 0, 1, 2…）指定哪些科技类型可用于转换。此条目可以列出许多类型以一次全部转换。当没有包含任何类型时将影响所有有效目标。
                      - listitem [ref=e1845]:
                        - paragraph [ref=e1846]:
                          - code [ref=e1847]: ConvertN.To
                          - text: 指定转换后的科技类型。
                      - listitem [ref=e1848]:
                        - paragraph [ref=e1849]:
                          - code [ref=e1850]: ConvertN.AffectsHouse
                          - text: 指定哪些所属方的单位可以被转换。
                      - listitem [ref=e1851]:
                        - paragraph [ref=e1852]:
                          - text: 若只指定一组转换则
                          - code [ref=e1853]: Convert.From
                          - text: 、
                          - code [ref=e1854]: Convert.To
                          - text: 和
                          - code [ref=e1855]: Convert.AffectsHouse
                          - text: （不带序号）相当于
                          - code [ref=e1856]: Convert0.From
                          - text: 、
                          - code [ref=e1857]: Convert0.To
                          - text: 和
                          - code [ref=e1858]: Convert0.AffectsHouse
                          - text: 的别称。
                      - listitem [ref=e1859]:
                        - paragraph [ref=e1860]:
                          - text: 转换影响被指定的
                          - strong [ref=e1861]: 所有
                          - text: 当前存在的科技类型，包括处于运输工具中的、驻扎在建筑内的、处于
                          - code [ref=e1862]: InfantryAbsorb=yes
                          - text: 或
                          - code [ref=e1863]: UnitAbsorb=yes
                          - text: 的建筑中的、正在
                          - code [ref=e1864]: Bunker=yes
                          - text: 建筑里的。
                - paragraph [ref=e1865]:
                  - text: 例如，这个超级武器可以将所有被影响的己方和友方
                  - code [ref=e1866]: SOLDIERA
                  - text: 和
                  - code [ref=e1867]: SOLDIERB
                  - text: 转换为
                  - code [ref=e1868]: NEWSOLDIER
                  - text: ：
                - generic [ref=e1871]: "[ExampleSW] Convert.From=SOLDIERA,SOLDIERB Convert.To=NEWSOLDIER Convert.AffectsHouse=team"
                - paragraph [ref=e1872]:
                  - text: 在
                  - code [ref=e1873]: rulesmd.ini
                  - text: ：
                - generic [ref=e1876]: "[SOMESW] ; SuperWeaponType ConvertN.From= ; List of TechnoTypes ConvertN.To= ; TechnoType ConvertN.AffectsHouse=owner ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) ; where N = 0, 1, 2, ... ; or Convert.From= ; List of TechnoTypes Convert.To= ; TechnoType Convert.AffectsHouse=owner ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all)"
                - generic [ref=e1877]:
                  - paragraph [ref=e1878]:  警告
                  - paragraph [ref=e1879]:
                    - text: 此功能与
                    - link "Ares 的单位转换" [ref=e1880] [cursor=pointer]:
                      - /url: https://ares-developers.github.io/Ares-docs/new/typeconversion.html
                    - text: 存在同样的限制。此功能不支持建筑类型。
                - generic [ref=e1881]:
                  - paragraph [ref=e1882]:  警告
                  - paragraph [ref=e1883]: 此功能需要 3.0 及以上版本的 Ares！如果未检测到 Ares 3.0+，单位的某些属性可能不会被更新。
              - generic [ref=e1884]:
                - heading "自定义超级武器所在栏 " [level=3] [ref=e1885]:
                  - text: 自定义超级武器所在栏
                  - link "" [ref=e1886] [cursor=pointer]:
                    - /url: "#customize-superweapon-tabindex"
                - list [ref=e1887]:
                  - listitem [ref=e1888]:
                    - paragraph [ref=e1889]:
                      - text: 现在你可以通过
                      - code [ref=e1890]: TabIndex
                      - text: 将超级武器的图标分配到侧边栏的任意标签页下。
                    - list [ref=e1891]:
                      - listitem [ref=e1892]:
                        - paragraph [ref=e1893]: 有效值为：0（建筑栏）、1（防御栏）、2（步兵栏）、3（载具栏）。
                - paragraph [ref=e1894]:
                  - text: 在
                  - code [ref=e1895]: rulesmd.ini
                  - text: ：
                - generic [ref=e1898]: "[SOMESW] ; SuperWeaponType TabIndex=1 ; integer"
              - generic [ref=e1899]:
                - heading "EMPulse 设置 " [level=3] [ref=e1900]:
                  - text: EMPulse 设置
                  - link "" [ref=e1901] [cursor=pointer]:
                    - /url: "#empulse-settings"
                - list [ref=e1902]:
                  - listitem [ref=e1903]:
                    - paragraph [ref=e1904]:
                      - text: 可以通过设置
                      - code [ref=e1905]: EMPulse.WeaponIndex
                      - text: 来自定义具有
                      - code [ref=e1906]: EMPulseCannon=true
                      - text: 的建筑在发射其所关联的
                      - code [ref=e1907]: Type=EMPulse
                      - text: 类超级武器时（
                      - strong [ref=e1908]: 仅
                      - text: 当
                      - code [ref=e1909]: EMPulse.TargetSelf=false
                      - text: 或省略时）所使用的武器。
                    - list [ref=e1910]:
                      - listitem [ref=e1911]:
                        - paragraph [ref=e1912]:
                          - text: 注意如果在同一个建筑发射第一种武器前发射另一种具有不同武器索引的
                          - code [ref=e1913]: Type=EMPulse
                          - text: 超级武器那么较晚者的设置将优先生效。
                      - listitem [ref=e1914]:
                        - paragraph [ref=e1915]:
                          - text: 此外由于技术限制目前除非手动列出了
                          - code [ref=e1916]: SW.RangeMinimum
                          - text: ／
                          - code [ref=e1917]: SW.RangeMaximum
                          - text: 否则始终默认使用主武器的
                          - code [ref=e1918]: Range/MinimumRange
                          - text: 执行瞄准限制。
                  - listitem [ref=e1919]:
                    - paragraph [ref=e1920]:
                      - text: 现在如果发射的超级武器拥有
                      - code [ref=e1921]: EMPulse.SuspendOthers=true
                      - text: 那么在第一个建筑发射之前，所有其他可以由同一建筑发射的
                      - code [ref=e1922]: Type=EMPulse
                      - text: 超级武器将被暂停直到第一个建筑发射完毕。
                - paragraph [ref=e1923]:
                  - text: 在
                  - code [ref=e1924]: rulesmd.ini
                  - text: ：
                - generic [ref=e1927]: "[SOMESW] ; SuperWeaponType EMPulse.WeaponIndex=0 ; integer, weapon slot index EMPulse.SuspendOthers=false ; boolean"
                - generic [ref=e1928]:
                  - paragraph [ref=e1929]:  备注
                  - paragraph [ref=e1930]:
                    - code [ref=e1931]: Type=EMPulse
                    - text: 超级武器及其任何关联标签是
                    - link "Ares 功能" [ref=e1932] [cursor=pointer]:
                      - /url: https://ares-developers.github.io/Ares-docs/new/superweapons/types/empulse.html
                    - text: 。
              - generic [ref=e1933]:
                - heading "虚拟投放 " [level=3] [ref=e1934]:
                  - text: 虚拟投放
                  - link "" [ref=e1935] [cursor=pointer]:
                    - /url: "#limbodelivery"
                - list [ref=e1936]:
                  - listitem [ref=e1937]:
                    - paragraph [ref=e1938]: 现在超级武器可以在地图外投放与在场上时表现一致的建筑。
                    - list [ref=e1939]:
                      - listitem [ref=e1940]:
                        - paragraph [ref=e1941]:
                          - code [ref=e1942]: LimboDelivery.Types
                          - text: 是超级武器发射时将创建的建筑类型列表。与超级武器的
                          - code [ref=e1943]: Type
                          - text: 和坐标无关。
                      - listitem [ref=e1944]:
                        - paragraph [ref=e1945]:
                          - code [ref=e1946]: LimboDelivery.IDs
                          - text: 是分配给建筑的数字 ID列表。这是虚拟击杀功能所必需的。
                  - listitem [ref=e1947]:
                    - paragraph [ref=e1948]:
                      - text: 创建的建筑不受地图上任何威胁的影响。从游戏中移除它们的唯一方法是使用设置了
                      - code [ref=e1949]: LimboKill.IDs
                      - text: 的超级武器。
                    - list [ref=e1950]:
                      - listitem [ref=e1951]:
                        - paragraph [ref=e1952]:
                          - code [ref=e1953]: LimboKill.AffectsHouse
                          - text: 设置那个所属方受此效果影响。
                      - listitem [ref=e1954]:
                        - paragraph [ref=e1955]:
                          - code [ref=e1956]: LimboKill.IDs
                          - text: 是建筑 ID列表，这些建筑将被立即从游戏中移除。
                      - listitem [ref=e1957]:
                        - paragraph [ref=e1958]:
                          - code [ref=e1959]: LimboKill.Counts
                          - text: 设置每种类型的建筑将被移除的数量。如果一个
                          - code [ref=e1960]: LimboKill.IDs
                          - text: 列表中的值在此列表有对应项则使用此处设置的值，否则按无数量限制进行移除。若此列表留空则所有类型均无数量限制。
                  - listitem [ref=e1961]:
                    - paragraph [ref=e1962]: 使用这些标签可以使投放变得随机。游戏将根据每个提供的 “掷骰子” 概率随机选择列表中的一个建筑。
                    - list [ref=e1963]:
                      - listitem [ref=e1964]:
                        - paragraph [ref=e1965]:
                          - code [ref=e1966]: LimboDelivery.RollChances
                          - text: 是 “掷骰子” 发生的概率列表。有效值的范围为 0%（从不发生）到 100%（总是发生）。默认为单次必出。
                      - listitem [ref=e1967]:
                        - paragraph [ref=e1968]:
                          - code [ref=e1969]: LimboDelivery.RandomWeightsN
                          - text: 是每个 “掷骰子” 发生概率的权重列表。有效值为 0（从不发生）到 100%（总是发生）。
                          - code [ref=e1970]: RandomWeights
                          - text: 是
                          - code [ref=e1971]: RandomWeights0
                          - text: 的有效别名。如果掷骰尝试没有指定权重，则使用最后一个权重。
                - generic [ref=e1972]:
                  - paragraph [ref=e1973]:  备注
                  - list [ref=e1974]:
                    - listitem [ref=e1975]:
                      - paragraph [ref=e1976]: 此功能可能不支持所有建筑标签。以下列出了已确认可正常工作的标签：
                      - list [ref=e1977]:
                        - listitem [ref=e1978]:
                          - paragraph [ref=e1979]: FactoryPlant
                        - listitem [ref=e1980]:
                          - paragraph [ref=e1981]: OrePurifier
                        - listitem [ref=e1982]:
                          - paragraph [ref=e1983]: SpySat
                        - listitem [ref=e1984]:
                          - paragraph [ref=e1985]: KeepAlive (Ares 3.0)
                        - listitem [ref=e1986]:
                          - paragraph [ref=e1987]: Prerequisite、PrerequisiteOverride、Prerequisite.List# (Ares 0.1)、Prerequisite.Negative (Ares 0.1)、GenericPrerequisites (Ares 0.1)
                        - listitem [ref=e1988]:
                          - paragraph [ref=e1989]: SuperWeapon、SuperWeapon2、SuperWeapons (Ares 0.9)、SW.AuxBuildings (Ares 0.9)、SW.NegBuildings (Ares 0.9)
                    - listitem [ref=e1990]:
                      - paragraph [ref=e1991]:
                        - text: 为使此功能与 AITriggerTypes 条件（“拥有者拥有？” 和 “敌人拥有？”）一起工作，
                        - code [ref=e1992]: LegalTarget
                        - text: 必须设置为 true。
                - paragraph [ref=e1993]:
                  - text: 在
                  - code [ref=e1994]: rulesmd.ini
                  - text: ：
                - generic [ref=e1997]: "[SOMESW] ; SuperWeaponType LimboDelivery.Types= ; List of BuildingTypes LimboDelivery.IDs= ; List of numeric IDs, -1 cannot be used LimboDelivery.RollChances= ; List of percentages LimboDelivery.RandomWeightsN= ; List of integers LimboKill.AffectsHouse=self ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) LimboKill.IDs= ; List of numeric IDs LimboKill.Counts= ; List of integers"
                - generic [ref=e1998]:
                  - paragraph [ref=e1999]:  警告
                  - paragraph [ref=e2000]:
                    - text: 谨记虚拟投放的建筑并不真实存在于地图上！这意味着它们不应启用需要与游戏战场内交互的机制（例如工厂、克隆、维修厂、停机坪）。它们还
                    - strong [ref=e2001]:
                      - text: 应该设为
                      - code [ref=e2002]: KeepAlive=no
                      - text: 或者可以被虚拟击杀
                    - text: "- 否则游戏永远不会结束。"
              - generic [ref=e2003]:
                - heading "联动超武 " [level=3] [ref=e2004]:
                  - text: 联动超武
                  - link "" [ref=e2005] [cursor=pointer]:
                    - /url: "#linked-superweapons"
                - list [ref=e2006]:
                  - listitem [ref=e2007]:
                    - paragraph [ref=e2008]:
                      - text: 超级武器现在可以通过
                      - code [ref=e2009]: SW.Link
                      - text: 设置一个联动超武列表，当原超级武器被发射时列表中的联动超武将被授予或强写计时器。
                  - listitem [ref=e2010]:
                    - paragraph [ref=e2011]:
                      - code [ref=e2012]: SW.Link.Grant
                      - text: 允许像核弹箱子那样为没有该超武的玩家授予一次使用权。
                  - listitem [ref=e2013]:
                    - paragraph [ref=e2014]:
                      - code [ref=e2015]: SW.Link.Ready
                      - text: 指定是否将被联动超武的计时器强写为就绪状态。
                  - listitem [ref=e2016]:
                    - paragraph [ref=e2017]:
                      - code [ref=e2018]: SW.Link.Reset
                      - text: 指定是否将被联动超武的计时器强写以进行重置。优先级高于
                      - code [ref=e2019]: SW.Link.Ready
                      - text: 。
                    - list [ref=e2020]:
                      - listitem [ref=e2021]:
                        - paragraph [ref=e2022]: 对于一个被授予的超武：
                        - list [ref=e2023]:
                          - listitem [ref=e2024]:
                            - paragraph [ref=e2025]:
                              - text: 检查
                              - code [ref=e2026]: SW.Link.Reset
                              - text: 以确认是否需要被重置。
                          - listitem [ref=e2027]:
                            - paragraph [ref=e2028]:
                              - text: 若为 false，检查
                              - code [ref=e2029]: SW.Link.Ready
                              - text: 以确认是否需要被设为就绪。
                          - listitem [ref=e2030]:
                            - paragraph [ref=e2031]:
                              - text: 若为 false，则初始状态由被授予超武自身的
                              - code [ref=e2032]: SW.InitialReady
                              - text: 决定。
                  - listitem [ref=e2033]:
                    - paragraph [ref=e2034]:
                      - code [ref=e2035]: Message.LinkedSWAcquired
                      - text: 将在至少有一个联动超武被授予或强写计时器时显示给发射者。
                  - listitem [ref=e2036]:
                    - paragraph [ref=e2037]:
                      - code [ref=e2038]: EVA.LinkedSWAcquired
                      - text: 将在至少有一个联动超武被授予或强写计时器时播放给发射者。
                  - listitem [ref=e2039]:
                    - paragraph [ref=e2040]: 使用这些标签可以使这些超武变得随机。游戏将根据每个提供的 “掷骰子” 概率随机选择列表中的一个建筑。
                    - list [ref=e2041]:
                      - listitem [ref=e2042]:
                        - paragraph [ref=e2043]:
                          - code [ref=e2044]: SW.Link.RollChances
                          - text: 是 “掷骰子” 发生的概率列表。有效值的范围为 0%（从不发生）到 100%（总是发生）。默认为单次必出。
                      - listitem [ref=e2045]:
                        - paragraph [ref=e2046]:
                          - code [ref=e2047]: SW.Link.RandomWeightsN
                          - text: 是每个 “掷骰子” 发生概率的权重列表。有效值为 0（从不发生）到 100%（总是发生）。
                          - code [ref=e2048]: RandomWeights
                          - text: 是
                          - code [ref=e2049]: RandomWeights0
                          - text: 的有效别名。如果掷骰尝试没有指定权重，则使用最后一个权重。
                - paragraph [ref=e2050]:
                  - text: 在
                  - code [ref=e2051]: rulesmd.ini
                  - text: ：
                - generic [ref=e2054]: "[SOMESW] ; SuperWeaponType SW.Link= ; List of SuperWeaponTypes SW.Link.Grant=false ; boolean SW.Link.Ready= ; boolean, default to SW.InitialReady for granted superweapons, false otherwise SW.Link.Reset=false ; boolean SW.Link.RollChances= ; List of percentages. SW.Link.RandomWeightsN= ; List of integers. Message.LinkedSWAcquired= ; CSF entry key EVA.LinkedSWAcquired= ; EVA entry"
              - generic [ref=e2055]:
                - heading "Next " [level=3] [ref=e2056]:
                  - text: Next
                  - link "" [ref=e2057] [cursor=pointer]:
                    - /url: "#next"
                - paragraph [ref=e2058]:
                  - img "图像" [ref=e2059]
                  - emphasis [ref=e2060]:
                    - link "虚幻" [ref=e2061] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/Cylearun
                    - text: 中通过
                    - code [ref=e2062]: SW.Next
                    - text: 将多个 ChronoSphere 与 ChronoWarp 类型的超武组成链式超武系统
                - list [ref=e2063]:
                  - listitem [ref=e2064]:
                    - paragraph [ref=e2065]: 现在超级武器可以向同一目标地点发射其他超级武器。发射的类型可以使用与虚拟投放相同的规则进行随机化（见上文）。
                    - list [ref=e2066]:
                      - listitem [ref=e2067]:
                        - paragraph [ref=e2068]:
                          - code [ref=e2069]: SW.Next.RealLaunch
                          - text: 控制发射初始超级武器的所有者是否必须拥有所列出的超级武器和足够
                          - code [ref=e2070]: Money.Amout
                          - text: 的资金来支持。否则强制发射。
                      - listitem [ref=e2071]:
                        - paragraph [ref=e2072]:
                          - code [ref=e2073]: SW.Next.IgnoreInhibitors
                          - text: 设置是否忽略每个超级武器的
                          - code [ref=e2074]: SW.Inhibitors
                          - text: ／
                          - code [ref=e2075]: SW.AnyInhibitor
                          - text: ，否则只有未被抑制的超级武器会被发射。
                      - listitem [ref=e2076]:
                        - paragraph [ref=e2077]:
                          - code [ref=e2078]: SW.Next.IgnoreDesignators
                          - text: 设置是否忽略每个超级武器的
                          - code [ref=e2079]: SW.Designators
                          - text: ／
                          - code [ref=e2080]: SW.AnyDesignator
                          - text: 。
                  - listitem [ref=e2081]:
                    - paragraph [ref=e2082]: 使用这些标签可以使这些超武变得随机。游戏将根据每个提供的 “掷骰子” 概率随机选择列表中的一个建筑。
                    - list [ref=e2083]:
                      - listitem [ref=e2084]:
                        - paragraph [ref=e2085]:
                          - code [ref=e2086]: SW.Next.RollChances
                          - text: 是 “掷骰子” 发生的概率列表。有效值的范围为 0%（从不发生）到 100%（总是发生）。默认为单次必出。
                      - listitem [ref=e2087]:
                        - paragraph [ref=e2088]:
                          - code [ref=e2089]: SW.Next.RandomWeightsN
                          - text: 是每个 “掷骰子” 发生概率的权重列表。有效值为 0（从不发生）到 100%（总是发生）。
                          - code [ref=e2090]: RandomWeights
                          - text: 是
                          - code [ref=e2091]: RandomWeights0
                          - text: 的有效别名。如果掷骰尝试没有指定权重，则使用最后一个权重。
                - paragraph [ref=e2092]:
                  - text: 在
                  - code [ref=e2093]: rulesmd.ini
                  - text: ：
                - generic [ref=e2096]: "[SOMESW] ; SuperWeaponType SW.Next= ; List of SuperWeaponTypes SW.Next.RealLaunch=true ; boolean SW.Next.IgnoreInhibitors=false ; boolean SW.Next.IgnoreDesignators=true ; boolean SW.Next.RollChances= ; List of percentages. SW.Next.RandomWeightsN= ; List of integers."
              - generic [ref=e2097]:
                - heading "在目标单元格处引爆弹头或武器 " [level=3] [ref=e2098]:
                  - text: 在目标单元格处引爆弹头或武器
                  - link "" [ref=e2099] [cursor=pointer]:
                    - /url: "#warhead-or-weapon-detonation-at-target-cell"
                - list [ref=e2100]:
                  - listitem [ref=e2101]:
                    - paragraph [ref=e2102]: 现在任何超级武器都可以在超级武器的目标单元格处引爆弹头或武器。
                    - list [ref=e2103]:
                      - listitem [ref=e2104]:
                        - paragraph [ref=e2105]:
                          - text: 如果同时拥有
                          - code [ref=e2106]: Detonate.Warhead
                          - text: 和
                          - code [ref=e2107]: Detonate.Weapon
                          - text: ，那么后者优先。
                      - listitem [ref=e2108]:
                        - paragraph [ref=e2109]:
                          - code [ref=e2110]: Detonate.Warhead.Full
                          - text: 可用于设置弹头是否在目标上完全引爆（作为虚拟武器的一部分）或者只能对所在区域造成杀伤并应用 Phobos 的弹头效果
                      - listitem [ref=e2111]:
                        - paragraph [ref=e2112]:
                          - code [ref=e2113]: Detonate.Damage
                          - text: 如果未设置则默认为
                          - code [ref=e2114]: Detonate.Weapon
                          - text: 的
                          - code [ref=e2115]: Damage
                          - text: ，对于
                          - code [ref=e2116]: Detonate.Warhead
                          - text: 则是 0。
                      - listitem [ref=e2117]:
                        - paragraph [ref=e2118]:
                          - text: 武器和弹头的行为就像由发射超级武器的建筑所发射的一样。这尊重诸如
                          - code [ref=e2119]: SW.RangeMinimum/Maximum
                          - text: 之类的控制语句（在这方面类似于 Ares 的 GenericWarhead 超级武器）。即便找不到发射建筑也仍会使用超级武器所属于的所属方来造成伤害并应用 Phobos 引入的弹头效果。
                      - listitem [ref=e2120]:
                        - paragraph [ref=e2121]:
                          - text: 如果
                          - code [ref=e2122]: Detonate.AtFirer
                          - text: 设置为 true，那么武器或弹头将在发射建筑上而不是超级武器的目标单元格处引爆。如果找不到发射建筑则不会引爆。
                - paragraph [ref=e2123]:
                  - text: 在
                  - code [ref=e2124]: rulesmd.ini
                  - text: ：
                - generic [ref=e2127]: "[SOMESW] ; SuperWeaponType Detonate.Warhead= ; WarheadType Detonate.Warhead.Full=true ; boolean Detonate.Weapon= ; WeaponType Detonate.Damage= ; integer Detonate.AtFirer=false ; boolean"
            - generic [ref=e2128]:
              - heading "科技类型 " [level=2] [ref=e2129]:
                - text: 科技类型
                - link "" [ref=e2130] [cursor=pointer]:
                  - /url: "#technos"
              - generic [ref=e2131]:
                - heading "侵略性移动攻击命令 " [level=3] [ref=e2132]:
                  - text: 侵略性移动攻击命令
                  - link "" [ref=e2133] [cursor=pointer]:
                    - /url: "#aggressive-attack-move-mission"
                - list [ref=e2134]:
                  - listitem [ref=e2135]:
                    - paragraph [ref=e2136]:
                      - code [ref=e2137]: AttackMove.Aggressive
                      - text: 允许你的单位在执行移动攻击（Ctrl+Shift）任务时主动攻击敌方的无武装建筑。
                  - listitem [ref=e2138]:
                    - paragraph [ref=e2139]:
                      - code [ref=e2140]: AttackMove.UpdateTarget
                      - text: 允许你的单位在执行移动攻击（Ctrl+Shift）任务时自动切换威胁值更高的目标。
                - paragraph [ref=e2141]:
                  - text: 在
                  - code [ref=e2142]: rulesmd.ini
                  - text: ：
                - generic [ref=e2145]: "[General] AttackMove.Aggressive=false ; boolean AttackMove.UpdateTarget=false ; boolean [SOMETECHNO] ; TechnoType AttackMove.Aggressive= ; boolean, default to [General] -> AttackMove.Aggressive AttackMove.UpdateTarget= ; boolean, default to [General] -> AttackMove.UpdateTarget"
              - generic [ref=e2146]:
                - heading "移动攻击 - 获取目标时的行为 " [level=3] [ref=e2147]:
                  - text: 移动攻击 - 获取目标时的行为
                  - link "" [ref=e2148] [cursor=pointer]:
                    - /url: "#attack-move-behavior-when-target-acquired"
                - list [ref=e2149]:
                  - listitem [ref=e2150]:
                    - paragraph [ref=e2151]:
                      - text: 现在你可以用
                      - code [ref=e2152]: AttackMove.StopWhenTargetAcquired
                      - text: 来让移动攻击的单位在发现敌人后停止移动，就像《星际》和《魔兽》中那样。
                    - list [ref=e2153]:
                      - listitem [ref=e2154]:
                        - paragraph [ref=e2155]: 此功能用于避免单位在执行移动攻击命令时冲锋过猛而暴毙。
                  - listitem [ref=e2156]:
                    - paragraph [ref=e2157]:
                      - text: 你也可以使用
                      - code [ref=e2158]: AttackMove.PursuitTarget
                      - text: 来让它们继续追击已锁定的单个目标。
                    - list [ref=e2159]:
                      - listitem [ref=e2160]:
                        - paragraph [ref=e2161]: 此功能对于基洛夫空艇这样的近战单位很有用。
                - paragraph [ref=e2162]:
                  - text: 在
                  - code [ref=e2163]: rulesmd.ini
                  - text: ：
                - generic [ref=e2166]: "[General] AttackMove.StopWhenTargetAcquired= ; boolean [SOMETECHNO] ; TechnoType AttackMove.StopWhenTargetAcquired= ; boolean, default to [General] -> AttackMove.StopWhenTargetAcquired if set, inverse of OpportunityFire otherwise. AttackMove.PursuitTarget= ; boolean"
                - generic [ref=e2167]:
                  - paragraph [ref=e2168]:  备注
                  - list [ref=e2169]:
                    - listitem [ref=e2170]:
                      - paragraph [ref=e2171]:
                        - text: 许多单位在执行移动攻击命令时本就有一个发现敌人后停止移动的行为，这与
                        - code [ref=e2172]: AttackMove.StopWhenTargetAcquired
                        - text: 无关。
                    - listitem [ref=e2173]:
                      - paragraph [ref=e2174]: 一些单位（例如 Jumpjet 类）在原版移动攻击命令下无法正常开火。具体原因不明，但该功能可以解决此问题。
                    - listitem [ref=e2175]:
                      - paragraph [ref=e2176]:
                        - text: 设置了
                        - code [ref=e2177]: AttackMove.StopWhenTargetAcquired=true
                        - text: 的 Jumpjet 单位会立即停止并且不会分散到某个单元格上。这是有意如此设计的。
              - generic [ref=e2178]:
                - heading "移动攻击 - 跟随 " [level=3] [ref=e2179]:
                  - text: 移动攻击 - 跟随
                  - link "" [ref=e2180] [cursor=pointer]:
                    - /url: "#attack-move-follow"
                - list [ref=e2181]:
                  - listitem [ref=e2182]:
                    - paragraph [ref=e2183]:
                      - text: 现在你可以让某些单位在执行移动攻击命令时跟随周围的单位。此跟随行为相当于跟随命令（
                      - code [ref=e2184]: "[Ctrl]+[Alt]"
                      - text: ）的效果。
                    - list [ref=e2185]:
                      - listitem [ref=e2186]:
                        - paragraph [ref=e2187]:
                          - text: 使用
                          - code [ref=e2188]: AttackMove.Follow.IncludeAir
                          - text: 来决定是否跟随空中单位。
                      - listitem [ref=e2189]:
                        - paragraph [ref=e2190]:
                          - text: 设置了
                          - code [ref=e2191]: AttackMove.Follow.IfMindControlIsFull=true
                          - text: 的心灵控制单位在达到心控数量上限时会进行跟随。
                  - listitem [ref=e2192]:
                    - paragraph [ref=e2193]: 此功能对用于医疗和维修的支援类单位应该很有用。
                - paragraph [ref=e2194]:
                  - text: 在
                  - code [ref=e2195]: rulesmd.ini
                  - text: ：
                - generic [ref=e2198]: "[SOMETECHNO] ; TechnoType AttackMove.Follow=false ; boolean AttackMove.Follow.IncludeAir=false ; boolean AttackMove.Follow.IfMindControlIsFull=false ; boolean"
              - generic [ref=e2199]:
                - heading "移动攻击 - 无武器单位 " [level=3] [ref=e2200]:
                  - text: 移动攻击 - 无武器单位
                  - link "" [ref=e2201] [cursor=pointer]:
                    - /url: "#attack-move-without-weapon"
                - list [ref=e2202]:
                  - listitem [ref=e2203]:
                    - paragraph [ref=e2204]:
                      - text: 在原版，没有武器的单位无法执行移动攻击命令。现在你可以通过
                      - code [ref=e2205]: AttackMove.IgnoreWeaponCheck=true
                      - text: 来禁用这一硬编码行为。
                    - list [ref=e2206]:
                      - listitem [ref=e2207]:
                        - paragraph [ref=e2208]: 无武器单位无法真正执行移动攻击行为。此功能是避免你同时选中无武器单位和其他单位的情况下移动攻击指针被禁用的。
                - paragraph [ref=e2209]:
                  - text: 在
                  - code [ref=e2210]: rulesmd.ini
                  - text: ：
                - generic [ref=e2213]: "[General] AttackMove.IgnoreWeaponCheck=false ; boolean"
              - generic [ref=e2214]:
                - heading "攻击无威胁建筑（单位定义） " [level=3] [ref=e2215]:
                  - text: 攻击无威胁建筑（单位定义）
                  - link "" [ref=e2216] [cursor=pointer]:
                    - /url: "#attack-non-threatening-structures-techno"
                - list [ref=e2217]:
                  - listitem [ref=e2218]:
                    - paragraph [ref=e2219]: 现在你可以自由地设置单位能否自动瞄准无威胁的建筑物。
                    - list [ref=e2220]:
                      - listitem [ref=e2221]:
                        - paragraph [ref=e2222]:
                          - code [ref=e2223]: AutoTarget.NoThreatBuildings
                          - text: 控制玩家操作的单位，
                          - code [ref=e2224]: AutoTargetAI.NoThreatBuildings
                          - text: 控制其他（由 AI 操作的）单位。
                - paragraph [ref=e2225]:
                  - text: 在
                  - code [ref=e2226]: rulesmd.ini
                  - text: ：
                - generic [ref=e2229]: "[General] AutoTarget.NoThreatBuildings=false ; boolean AutoTargetAI.NoThreatBuildings=true ; boolean"
              - generic [ref=e2230]:
                - heading "自定义子机发射器 " [level=3] [ref=e2231]:
                  - text: 自定义子机发射器
                  - link "" [ref=e2232] [cursor=pointer]:
                    - /url: "#aircraft-spawner-customizations"
                - paragraph [ref=e2233]:
                  - img "图像" [ref=e2234]
                  - emphasis [ref=e2235]:
                    - link "幻想奇遇" [ref=e2236] [cursor=pointer]:
                      - /url: https://www.moddb.com/mods/fantasy-adventure
                    - text: 中的有限追击范围子机
                - list [ref=e2237]:
                  - listitem [ref=e2238]:
                    - paragraph [ref=e2239]:
                      - text: 如果设置
                      - code [ref=e2240]: Spawner.LimitRange
                      - text: 则子机将在敌人超出子机发射器武器
                      - code [ref=e2241]: Range
                      - text: 设定的最大值范围后停止追击。
                    - list [ref=e2242]:
                      - listitem [ref=e2243]:
                        - paragraph [ref=e2244]:
                          - code [ref=e2245]: Spawner.ExtraLimitRange
                          - text: 是追击范围相对于武器射程进行调整的参量。
                  - listitem [ref=e2246]:
                    - paragraph [ref=e2247]:
                      - code [ref=e2248]: Spawner.DelayFrames
                      - text: 可用于设置每次从子机发射器中生成单位的最小游戏帧数。对于导弹默认是 9 帧，其他默认是 20 帧。
                  - listitem [ref=e2249]:
                    - paragraph [ref=e2250]:
                      - text: 如果
                      - code [ref=e2251]: Spawner.AttackImmediately
                      - text: 设为 true，战机子机将在生成后立即执行攻击任务而不是先等待其余战机生成和集结。
                  - listitem [ref=e2252]:
                    - paragraph [ref=e2253]:
                      - text: 若启用
                      - code [ref=e2254]: Spawner.UseTurretFacing
                      - text: 则子机发射器单位拥有炮塔时子机生成时的初始方向使用炮塔方向而非车体方向。
                  - listitem [ref=e2255]:
                    - paragraph [ref=e2256]:
                      - code [ref=e2257]: Spawner.RecycleRange
                      - text: 决定子机在距离母舰多少格以内可以被进行回收。
                  - listitem [ref=e2258]:
                    - paragraph [ref=e2259]:
                      - code [ref=e2260]: Spawner.RecycleAnim
                      - text: 用于设置回收时在子机位置播放的动画。如果列出了多个动画，则将随机选择一个。
                  - listitem [ref=e2261]:
                    - paragraph [ref=e2262]:
                      - code [ref=e2263]: Spawner.RecycleCoord
                      - text: 定义了子机将要前往母舰的哪个位置。
                    - list [ref=e2264]:
                      - listitem [ref=e2265]:
                        - paragraph [ref=e2266]:
                          - code [ref=e2267]: Spawner.RecycleOnTurret
                          - text: 定义这个位置是否相对于炮塔而非车体。
                - paragraph [ref=e2268]:
                  - text: 在
                  - code [ref=e2269]: rulesmd.ini
                  - text: ：
                - generic [ref=e2272]: "[SOMETECHNO] ; TechnoType Spawner.LimitRange=false ; boolean Spawner.ExtraLimitRange=0 ; integer, range in cells Spawner.DelayFrames= ; integer, game frames Spawner.AttackImmediately=false ; boolean Spawner.UseTurretFacing=false ; boolean Spawner.RecycleRange=-1 ; float, range in cells Spawner.RecycleAnim= ; List of AnimationTypes Spawner.RecycleCoord=0,0,0 ; integer - Forward,Lateral,Height Spawner.RecycleOnTurret=false ; boolean"
                - generic [ref=e2273]:
                  - paragraph [ref=e2274]:  备注
                  - paragraph [ref=e2275]:
                    - text: 如果你设置了回收的 FLH，那么最好一并设置一个至少为
                    - code [ref=e2276]: "0.5"
                    - text: 格的回收范围。否则子机发射器可能无法正确回收子机。
              - generic [ref=e2277]:
                - heading "基于弹药量的自动变形 " [level=3] [ref=e2278]:
                  - text: 基于弹药量的自动变形
                  - link "" [ref=e2279] [cursor=pointer]:
                    - /url: "#automatic-conversion-based-on-ammo"
                - list [ref=e2280]:
                  - listitem [ref=e2281]:
                    - paragraph [ref=e2282]: 单位现在可以根据弹药量转换成另一种单位
                  - listitem [ref=e2283]:
                    - paragraph [ref=e2284]:
                      - code [ref=e2285]: Ammo.AutoConvertMinimumAmount
                      - text: 决定触发自动变形的最小弹药量。
                  - listitem [ref=e2286]:
                    - paragraph [ref=e2287]:
                      - code [ref=e2288]: Ammo.AutoConvertMaximumAmount
                      - text: 决定触发自动变形的最大弹药量。
                  - listitem [ref=e2289]:
                    - paragraph [ref=e2290]:
                      - code [ref=e2291]: Ammo.AutoConvertType
                      - text: 指定变形成哪个新单位。该单位必须与原单位同属一类（载具变载具，步兵变步兵，战机变战机）。
                  - listitem [ref=e2292]:
                    - paragraph [ref=e2293]: 设为负数将会禁用弹药数量检查，当两个检查都被禁用时将不会触发变形。
                - paragraph [ref=e2294]:
                  - text: 在
                  - code [ref=e2295]: rulesmd.ini
                  - text: ：
                - generic [ref=e2298]: "[SOMETECHNO] ; TechnoType, before conversion Ammo.AutoConvertMinimumAmount=-1 ; integer Ammo.AutoConvertMaximumAmount=-1 ; integer Ammo.AutoConvertType= ; TechnoType, after conversion"
                - generic [ref=e2299]:
                  - paragraph [ref=e2300]:  警告
                  - paragraph [ref=e2301]:
                    - text: 此功能与
                    - link "Ares 的单位转换" [ref=e2302] [cursor=pointer]:
                      - /url: https://ares-developers.github.io/Ares-docs/new/typeconversion.html
                    - text: 存在同样的限制。此功能不支持建筑类型。
                - generic [ref=e2303]:
                  - paragraph [ref=e2304]:  警告
                  - paragraph [ref=e2305]: 此功能需要 3.0 及以上版本的 Ares！如果未检测到 Ares 3.0+，单位的某些属性可能不会被更新。
              - generic [ref=e2306]:
                - heading "自动删除乘客 " [level=3] [ref=e2307]:
                  - text: 自动删除乘客
                  - link "" [ref=e2308] [cursor=pointer]:
                    - /url: "#automatic-passenger-deletion"
                - list [ref=e2309]:
                  - listitem [ref=e2310]:
                    - paragraph [ref=e2311]: 运输工具可以随时间删除乘客。乘客将按照进入运输工具顺序的先后被删除。
                    - list [ref=e2312]:
                      - listitem [ref=e2313]:
                        - paragraph [ref=e2314]:
                          - code [ref=e2315]: PassengerDeletion.Rate
                          - text: 决定删除单个乘客所需的游戏帧数。
                        - list [ref=e2316]:
                          - listitem [ref=e2317]:
                            - paragraph [ref=e2318]:
                              - text: 如果
                              - code [ref=e2319]: PassengerDeletion.Rate.SizeMultiply
                              - text: 设为 true 则此时间间隔将乘算乘客的
                              - code [ref=e2320]: Size
                              - text: 。
                      - listitem [ref=e2321]:
                        - paragraph [ref=e2322]:
                          - text: 如果
                          - code [ref=e2323]: PassengerDeletion.UseCostAsRate
                          - text: 设为 true 则删除乘客的间隔将基于乘客的
                          - code [ref=e2324]: Cost
                          - text: 计算。这不考虑
                          - code [ref=e2325]: FactoryPlant
                          - text: 等修正。
                        - list [ref=e2326]:
                          - listitem [ref=e2327]:
                            - paragraph [ref=e2328]:
                              - code [ref=e2329]: PassengerDeletion.CostMultiplier
                              - text: 可用于设置基于成本的时间间隔倍率。
                          - listitem [ref=e2330]:
                            - paragraph [ref=e2331]:
                              - code [ref=e2332]: PassengerDeletion.CostRateCap
                              - text: 可用于设置基于成本计算的时间间隔上限。
                      - listitem [ref=e2333]:
                        - paragraph [ref=e2334]:
                          - code [ref=e2335]: PassengerDeletion.AllowedHouses
                          - text: 决定了哪些所属方的乘客会被删除。
                      - listitem [ref=e2336]:
                        - paragraph [ref=e2337]:
                          - text: 如果
                          - code [ref=e2338]: PassengerDeletion.DontScore
                          - text: 设为 true 则删除的乘客不会被视为被运输工具击杀（没有经验，不会计入所属方击杀数等）。
                      - listitem [ref=e2339]:
                        - paragraph [ref=e2340]:
                          - text: 如果
                          - code [ref=e2341]: PassengerDeletion.Soylent
                          - text: 设为 true 则会向运输工具的所有者返还一定数量的资金。具体金额由乘客的
                          - code [ref=e2342]: Soylent
                          - text: 决定，若未设置则由
                          - code [ref=e2343]: Cost
                          - text: 决定（这里可受到
                          - code [ref=e2344]: FactoryPlant
                          - text: 等修正的影响）。
                        - list [ref=e2345]:
                          - listitem [ref=e2346]:
                            - paragraph [ref=e2347]:
                              - code [ref=e2348]: PassengerDeletion.SoylentMultiplier
                              - text: 是直接应用于返还资金的倍率。
                          - listitem [ref=e2349]:
                            - paragraph [ref=e2350]:
                              - code [ref=e2351]: PassengerDeletion.SoylentAllowedHouses
                              - text: 决定了哪些所属方的乘客会造成资金返还。
                          - listitem [ref=e2352]:
                            - paragraph [ref=e2353]:
                              - code [ref=e2354]: PassengerDeletion.DisplaySoylent
                              - text: 可设为 true 以在运输工具上显示返还的资金金额。
                              - code [ref=e2355]: PassengerDeletion.DisplaySoylentToHouses
                              - text: 决定了哪些所属方可以看到此消息，
                              - code [ref=e2356]: PassengerDeletion.DisplaySoylentOffset
                              - text: 可用于调整显示坐标偏移。
                      - listitem [ref=e2357]:
                        - paragraph [ref=e2358]:
                          - code [ref=e2359]: PassengerDeletion.ReportSound
                          - text: 和
                          - code [ref=e2360]: PassengerDeletion.Anim
                          - text: 可用于分别指定在删除乘客时播放的声音和动画。如果列出了多个动画，则将随机选择一个。
                      - listitem [ref=e2361]:
                        - paragraph [ref=e2362]:
                          - text: 如果
                          - code [ref=e2363]: PassengerDeletion.UnderEMP
                          - text: 设为 true 则在运输工具受 EMP 影响或瘫痪时继续执行删除操作。
                - paragraph [ref=e2364]:
                  - text: 在
                  - code [ref=e2365]: rulesmd.ini
                  - text: ：
                - generic [ref=e2368]: "[SOMETECHNO] ; TechnoType PassengerDeletion.Rate=0 ; integer, game frames PassengerDeletion.Rate.SizeMultiply=true ; boolean PassengerDeletion.UseCostAsRate=false ; boolean PassengerDeletion.CostMultiplier=1.0 ; floating point value, percents or absolute PassengerDeletion.CostRateCap= ; integer, game frames PassengerDeletion.AllowedHouses=all ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) PassengerDeletion.DontScore=false ; boolean PassengerDeletion.Soylent=false ; boolean PassengerDeletion.SoylentMultiplier=1.0 ; float, percents or absolute PassengerDeletion.SoylentAllowedHouses=enemies ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) PassengerDeletion.DisplaySoylent=false ; boolean PassengerDeletion.DisplaySoylentToHouses=All ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) PassengerDeletion.DisplaySoylentOffset=0,0 ; X,Y, pixels relative to default PassengerDeletion.ReportSound= ; Sound entry PassengerDeletion.Anim= ; List of AnimationTypes PassengerDeletion.UnderEMP=false ; boolean"
              - generic [ref=e2369]:
                - heading "自动同步载员所属方 " [level=3] [ref=e2370]:
                  - text: 自动同步载员所属方
                  - link "" [ref=e2371] [cursor=pointer]:
                    - /url: "#automatic-passenger-owner-change-to-match-transport-owner"
                - list [ref=e2372]:
                  - listitem [ref=e2373]:
                    - paragraph [ref=e2374]:
                      - text: 如果运输工具的
                      - code [ref=e2375]: Passengers.SyncOwner
                      - text: 设为 true 则当运输工具的所有者发生改变那么其载员的所有者也将会更改以与运输工具同步。
                    - list [ref=e2376]:
                      - listitem [ref=e2377]:
                        - paragraph [ref=e2378]:
                          - text: 对于
                          - code [ref=e2379]: OpenTopped=true
                          - text: 的运输工具这还将禁用在运输工具暂时被心灵控制时阻止载员对目标进行攻击的检查。
                      - listitem [ref=e2380]:
                        - paragraph [ref=e2381]:
                          - text: 如果
                          - code [ref=e2382]: Passengers.SyncOwner.RevertOnExit
                          - text: 设为 true（默认行为），当载员被弹出时，其所属方将恢复为载员进入时所属方。
                      - listitem [ref=e2383]:
                        - paragraph [ref=e2384]:
                          - text: 不适用于通过
                          - code [ref=e2385]: Abductor=true
                          - text: 武器（
                          - emphasis [ref=e2386]: Ares 功能
                          - text: ）获取的载员。
                - paragraph [ref=e2387]:
                  - text: 在
                  - code [ref=e2388]: rulesmd.ini
                  - text: ：
                - generic [ref=e2391]: "[SOMETECHNO] ; TechnoType Passengers.SyncOwner=false ; boolean Passengers.SyncOwner.RevertOnExit=true ; boolean"
              - generic [ref=e2392]:
                - heading "自动发射武器 " [level=3] [ref=e2393]:
                  - text: 自动发射武器
                  - link "" [ref=e2394] [cursor=pointer]:
                    - /url: "#automatically-firing-weapons"
                - list [ref=e2395]:
                  - listitem [ref=e2396]:
                    - paragraph [ref=e2397]:
                      - text: 现在你可以设置
                      - code [ref=e2398]: AutoTargetOwnPosition
                      - text: 使科技类型根据
                      - code [ref=e2399]: AutoTargetOwnPosition.Self
                      - text: 选择当前单元格或开火者自身自动发射其武器而无需检索一个合适的目标。
                - paragraph [ref=e2400]:
                  - text: 在
                  - code [ref=e2401]: rulesmd.ini
                  - text: ：
                - generic [ref=e2404]: "[SOMETECHNO] ; TechnoType AutoTargetOwnPosition=false ; boolean AutoTargetOwnPosition.Self=false ; boolean"
                - generic [ref=e2405]:
                  - paragraph [ref=e2406]:  备注
                  - paragraph [ref=e2407]:
                    - text: 为了让该逻辑正常工作，你需要确保单位上没有设置
                    - code [ref=e2408]: CanPassiveAquire=false
                    - text: 等阻止索敌的语句。
              - generic [ref=e2409]:
                - heading "建造限制组 " [level=3] [ref=e2410]:
                  - text: 建造限制组
                  - link "" [ref=e2411] [cursor=pointer]:
                    - /url: "#build-limit-group"
                - list [ref=e2412]:
                  - listitem [ref=e2413]:
                    - paragraph [ref=e2414]: 现在你可以使不同的科技类型在一个组内共享建造限制。
                  - listitem [ref=e2415]:
                    - paragraph [ref=e2416]:
                      - code [ref=e2417]: BuildLimitGroup.Types
                      - text: 决定了将用于所选科技类型建造条件的其他科技类型。注意该语句并不提供任何限制效果。要实现这点你需要手动位每个科技类型设置建造限制。
                  - listitem [ref=e2418]:
                    - paragraph [ref=e2419]:
                      - code [ref=e2420]: BuildLimitGroup.Nums
                      - text: 决定了将达到建造限制的数量。如果使用单个整数，则使用组内所有科技类型的数量来计算建造限制。如果使用与
                      - code [ref=e2421]: BuildLimitGroup.Types
                      - text: 数量相同的整数列表，则会为每个科技类型计算建造限制，其值的位置与
                      - code [ref=e2422]: BuildLimitGroup.Types
                      - text: 中的位置对应。
                  - listitem [ref=e2423]:
                    - paragraph [ref=e2424]:
                      - code [ref=e2425]: BuildLimitGroup.Factor
                      - text: 决定了每个此类科技类型在计算建造限制时将被视为多少来进行计算（类似一个用于
                      - code [ref=e2426]: BuildLimit
                      - text: 的
                      - code [ref=e2427]: Size
                      - text: ）。
                    - list [ref=e2428]:
                      - listitem [ref=e2429]:
                        - paragraph [ref=e2430]:
                          - text: 这仅由 BuildLimitGroup 使用。其他地方不会使用它来计算，包括
                          - code [ref=e2431]: BuildLimitGroup.ExtraLimit
                          - text: 。
                  - listitem [ref=e2432]:
                    - paragraph [ref=e2433]:
                      - code [ref=e2434]: BuildLimitGroup.ContentIfAnyMatch
                      - text: 决定其建造限制的计算规则。如果设置为 true，则当组内任意科技类型的数量达到其
                      - code [ref=e2435]: BuildLimitGroup.Nums
                      - text: 值时视为全组达到建造限制。如果设置为 false，则只有当组内所有科技类型的数量达到时建造限制才有效。
                  - listitem [ref=e2436]:
                    - paragraph [ref=e2437]:
                      - code [ref=e2438]: BuildLimitGroup.NotBuildableIfQueueMatch
                      - text: 决定了禁用科技类型生产的时刻，如果设为 true 则已存在的科技类型与处于生产序列中的科技类型只和满足条件就会停止生产。如果设为 false 则只有地图上实际存在的科技类型满足条件才会停止生产。
                  - listitem [ref=e2439]:
                    - paragraph [ref=e2440]:
                      - text: 你还可以根据其所属方拥有的特定科技类型数量向
                      - code [ref=e2441]: BuildLimitGroup.Nums
                      - text: 添加一个额外调整值。
                    - list [ref=e2442]:
                      - listitem [ref=e2443]:
                        - paragraph [ref=e2444]:
                          - code [ref=e2445]: BuildLimitGroup.ExtraLimit.Types
                          - text: 决定了将用于额外值计算的科技类型。
                      - listitem [ref=e2446]:
                        - paragraph [ref=e2447]:
                          - code [ref=e2448]: BuildLimitGroup.ExtraLimit.Nums
                          - text: 决定了其额外值的增量。与
                          - code [ref=e2449]: BuildLimitGroup.ExtraLimit.Types
                          - text: 中对应位置的科技类型一一对应。每个列表中的科技类型会使建造限制增加其场上存在的数量 * 该列表中对应值。
                      - listitem [ref=e2450]:
                        - paragraph [ref=e2451]:
                          - code [ref=e2452]: BuildLimitGroup.ExtraLimit.MaxCount
                          - text: 决定了会被用于计算额外值的科技类型会被计入的最大数量。与
                          - code [ref=e2453]: BuildLimitGroup.ExtraLimit.Types
                          - text: 中对应位置的科技类型一一对应。如果未设置或设为小于 1 的值，则视为无最大数量限制。
                      - listitem [ref=e2454]:
                        - paragraph [ref=e2455]:
                          - code [ref=e2456]: BuildLimitGroup.ExtraLimit.MaxNum
                          - text: 决定了在计算额外值后
                          - code [ref=e2457]: BuildLimitGroup.Nums
                          - text: 的最大值。如果未设置或设为小于 1 的值，则视为无最大值。
                - paragraph [ref=e2458]:
                  - text: 在
                  - code [ref=e2459]: rulesmd.ini
                  - text: ：
                - generic [ref=e2462]: "[SOMETECHNO] ; TechnoType BuildLimitGroup.Types= ; List of TechnoTypes BuildLimitGroup.Nums= ; integer, or a List of integers BuildLimitGroup.Factor=1 ; integer BuildLimitGroup.ContentIfAnyMatch=false ; boolean BuildLimitGroup.NotBuildableIfQueueMatch=false ; boolean BuildLimitGroup.ExtraLimit.Types= ; List of TechnoTypes BuildLimitGroup.ExtraLimit.Nums= ; List of integers BuildLimitGroup.ExtraLimit.MaxCount= ; List of integers BuildLimitGroup.ExtraLimit.MaxNum=0 ; integer"
              - generic [ref=e2463]:
                - heading "根据操作者变形 " [level=3] [ref=e2464]:
                  - text: 根据操作者变形
                  - link "" [ref=e2465] [cursor=pointer]:
                    - /url: "#convert-technotype-on-owner-house-change"
                - list [ref=e2466]:
                  - listitem [ref=e2467]:
                    - paragraph [ref=e2468]: 现在你可以在操作者从人类改为 AI 玩家或从 AI 玩家改为人类玩家时执行单位转换。
                - paragraph [ref=e2469]:
                  - text: 在
                  - code [ref=e2470]: rulesmd.ini
                  - text: ：
                - generic [ref=e2473]: "[SOMETECHNO] ; TechnoType Convert.HumanToComputer= ; TechnoType Convert.ComputerToHuman= ; TechnoType"
              - generic [ref=e2474]:
                - heading "染色 " [level=3] [ref=e2475]:
                  - text: 染色
                  - link "" [ref=e2476] [cursor=pointer]:
                    - /url: "#custom-tint-on-technotypes"
                - list [ref=e2477]:
                  - listitem [ref=e2478]:
                    - paragraph [ref=e2479]:
                      - text: 通过设置
                      - code [ref=e2480]: Tint.Color
                      - text: 和
                      - code [ref=e2481]: Tint.Intensity
                      - text: 可以为拥有护盾的科技类型使用类似于铁幕／力场护盾或
                      - code [ref=e2482]: Psychedelic=true
                      - text: 弹头的染色效果。
                    - list [ref=e2483]:
                      - listitem [ref=e2484]:
                        - paragraph [ref=e2485]:
                          - code [ref=e2486]: Tint.Intensity
                          - text: 是增加／减少的光照，1.0 是默认的对象光照。
                      - listitem [ref=e2487]:
                        - paragraph [ref=e2488]:
                          - code [ref=e2489]: Tint.VisibleToHouses
                          - text: 可用于自定义哪些所属方可见这些染色效果。
                      - listitem [ref=e2490]:
                        - paragraph [ref=e2491]:
                          - text: 染色效果也可以通过
                          - link "Attach Effect" [ref=e2492] [cursor=pointer]:
                            - /url: "#attached-effects"
                          - text: 和
                          - link "护盾" [ref=e2493] [cursor=pointer]:
                            - /url: "#shields"
                          - text: 应用。
                - paragraph [ref=e2494]:
                  - text: 在
                  - code [ref=e2495]: rulesmd.ini
                  - text: ：
                - generic [ref=e2498]: "[SOMETECHNO] ; TechnoType Tint.Color= ; integer - R,G,B Tint.Intensity=0.0 ; floating point value Tint.VisibleToHouses=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all)"
              - generic [ref=e2499]:
                - heading "自定义镭射幽浮吸取 " [level=3] [ref=e2500]:
                  - text: 自定义镭射幽浮吸取
                  - link "" [ref=e2501] [cursor=pointer]:
                    - /url: "#customizable-disk-drain-logic"
                - list [ref=e2502]:
                  - listitem [ref=e2503]:
                    - paragraph [ref=e2504]: 可以单位微观定义吸取逻辑的属性。
                    - list [ref=e2505]:
                      - listitem [ref=e2506]:
                        - paragraph [ref=e2507]:
                          - code [ref=e2508]: DrainMoneyDisplay
                          - text: 和
                          - code [ref=e2509]: DrainMoneyDisplay.OnTarget
                          - text: 分别决定吸取金额是否会在开火者和目标上显示。
                      - listitem [ref=e2510]:
                        - paragraph [ref=e2511]:
                          - code [ref=e2512]: DrainMoneyDisplay.Houses
                          - text: 决定哪些所属方可以看到资金显示。
                      - listitem [ref=e2513]:
                        - paragraph [ref=e2514]:
                          - code [ref=e2515]: DrainMoneyDisplay.Offset
                          - text: 是资金显示中心的额外像素偏移量，默认为 0,0 即开火者的中心。
                      - listitem [ref=e2516]:
                        - paragraph [ref=e2517]:
                          - code [ref=e2518]: DrainMoneyDisplay.OnTarget.UseDisplayIncome
                          - text: 决定目标单位上的吸取金额是否使用期自身的
                          - code [ref=e2519]: DisplayIncome.Houses
                          - text: 和
                          - code [ref=e2520]: DisplayIncome.Offset
                          - text: 设置。若设为 false 则遵循开火者的
                          - code [ref=e2521]: DisplayIncome.Houses
                          - text: 和
                          - code [ref=e2522]: DisplayIncome.Offset
                          - text: 设置
                - paragraph [ref=e2523]:
                  - text: 在
                  - code [ref=e2524]: rulesmd.ini
                  - text: ：
                - generic [ref=e2527]: "[AudioVisual] DrainMoneyDisplay=false ; boolean DrainMoneyDisplay.Houses=all ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) DrainMoneyDisplay.OnTarget=false ; boolean DrainMoneyDisplay.OnTarget.UseDisplayIncome=true ; boolean [SOMETECHNO] ; TechnoType DrainMoneyFrameDelay= ; integer, default to [CombatDamage] -> DrainMoneyFrameDelay DrainMoneyAmount= ; integer, default to [CombatDamage] -> DrainMoneyAmount DrainAnimationType= ; AnimationType, default to [CombatDamage] -> DrainAnimationType DrainMoneyDisplay= ; boolean, default to [AudioVisual] -> DrainMoneyDisplay DrainMoneyDisplay.Houses= ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all), default to [AudioVisual] -> DrainMoneyDisplay.Houses DrainMoneyDisplay.Offset=0,0 ; X,Y, pixels relative to default DrainMoneyDisplay.OnTarget= ; boolean, default to [AudioVisual] -> DrainMoneyDisplay.OnTarget DrainMoneyDisplay.OnTarget.UseDisplayIncome= ; boolean"
              - generic [ref=e2528]:
                - heading "自定义 OpenTopped 属性 " [level=3] [ref=e2529]:
                  - text: 自定义
                  - code [ref=e2530]: OpenTopped
                  - text: 属性
                  - link "" [ref=e2531] [cursor=pointer]:
                    - /url: "#customizable-opentopped-properties"
                - list [ref=e2532]:
                  - listitem [ref=e2533]:
                    - paragraph [ref=e2534]:
                      - text: 现在你可以为每个科技类型微观设定全局
                      - code [ref=e2535]: OpenTopped
                      - text: 运输工具的属性。
                  - listitem [ref=e2536]:
                    - paragraph [ref=e2537]:
                      - code [ref=e2538]: OpenTopped.IgnoreRangefinding
                      - text: 可用于禁用
                      - code [ref=e2539]: OpenTopped
                      - text: 运输工具在接近超出射程的目标和扫描潜在目标时使用运输工具与所有载员之间的
                      - code [ref=e2540]: Range
                      - text: 最小武器的射程这一测距行为。
                  - listitem [ref=e2541]:
                    - paragraph [ref=e2542]:
                      - code [ref=e2543]: OpenTopped.AllowFiringIfDeactivated
                      - text: 可用于自定义当运输工具被瘫痪（EMP、
                      - code [ref=e2544]: PoweredUnit
                      - text: 等）时载员是否可以开火。
                  - listitem [ref=e2545]:
                    - paragraph [ref=e2546]:
                      - code [ref=e2547]: OpenTopped.ShareTransportTarget
                      - text: 控制运输工具的当前目标是否传递给乘客。
                  - listitem [ref=e2548]:
                    - paragraph [ref=e2549]:
                      - text: 你还可以通过
                      - code [ref=e2550]: OpenTransport.RangeBonus/DamageMultiplier
                      - text: 为运输工具内的乘客单独定义射程加成与伤害倍率，该设置独立于运输工具的
                      - code [ref=e2551]: OpenTopped.RangeBonus/DamageMultiplier
                      - text: 生效。
                  - listitem [ref=e2552]:
                    - paragraph [ref=e2553]:
                      - code [ref=e2554]: OpenTopped.DecloakToFire
                      - text: 可自定义 OpenTopped 的运输工具是否必须解除隐形才能使其乘客开火。
                - paragraph [ref=e2555]:
                  - text: 在
                  - code [ref=e2556]: rulesmd.ini
                  - text: ：
                - generic [ref=e2559]: "[General] OpenTopped.DecloakToFire=true ; boolean [SOMETECHNO] ; TechnoType, transport with OpenTopped=yes OpenTopped.RangeBonus= ; integer, default to [CombatDamage] -> OpenToppedRangeBonus OpenTopped.DamageMultiplier= ; floating point value, default to [CombatDamage] -> OpenToppedDamageMultiplier OpenTopped.WarpDistance= ; integer, default to [CombatDamage] -> OpenToppedWarpDistance OpenTopped.IgnoreRangefinding=false ; boolean OpenTopped.AllowFiringIfDeactivated=true ; boolean OpenTopped.ShareTransportTarget=true ; boolean OpenTopped.DecloakToFire= ; boolean, defaults to [General] -> OpenTopped.DecloakToFire [SOMETECHNO] ; TechnoType, passenger OpenTransport.RangeBonus=0 ; integer OpenTransport.DamageMultiplier=1.0 ; floating point value"
                - generic [ref=e2560]:
                  - paragraph [ref=e2561]:  备注
                  - paragraph [ref=e2562]: 乘客在 OpenTopped 载具中的主动寻敌范围不受这些射程加成值的影响。
              - generic [ref=e2563]:
                - heading "自定义子机序列 " [level=3] [ref=e2564]:
                  - text: 自定义子机序列
                  - link "" [ref=e2565] [cursor=pointer]:
                    - /url: "#customizable-spawns-queue"
                - list [ref=e2566]:
                  - listitem [ref=e2567]:
                    - paragraph [ref=e2568]:
                      - text: 现在可以通过
                      - code [ref=e2569]: Spawns.Queue
                      - text: 从子机发射器生成多种子机。该序列中的子机顺序即为其重新生成顺序。
                    - list [ref=e2570]:
                      - listitem [ref=e2571]:
                        - paragraph [ref=e2572]:
                          - text: 仍需设置
                          - code [ref=e2573]: Spawns
                          - text: 以启用子机逻辑并作为默认子机。
                      - listitem [ref=e2574]:
                        - paragraph [ref=e2575]:
                          - text: 仍需设置
                          - code [ref=e2576]: SpawnsNumber
                          - text: 以决定子机数量。
                      - listitem [ref=e2577]:
                        - paragraph [ref=e2578]:
                          - text: 如果队列长度超过子机发射器的
                          - code [ref=e2579]: SpawnsNumber
                          - text: ，超出部分的子机将被忽略。如果队列长度过短则剩余部分由
                          - code [ref=e2580]: Spawns
                          - text: 定义的子机填补。因此建议将它们设为等长。
                - paragraph [ref=e2581]:
                  - text: 在
                  - code [ref=e2582]: rulesmd.ini
                  - text: ：
                - generic [ref=e2585]: "[SOMETECHNO] ; TechnoType Spawns.Queue= ; List of AircraftTypes, in order"
                - generic [ref=e2586]:
                  - paragraph [ref=e2587]:  警告
                  - paragraph [ref=e2588]:
                    - text: 注意队列中的所有子机应当拥有相同的
                    - code [ref=e2589]: MissileSpawn
                    - text: 值（均为 true 或均为 false）。混合使用会导致导弹类子机无法命中目标。
              - generic [ref=e2590]:
                - heading "自定义 Ares 的雷达干扰逻辑 " [level=3] [ref=e2591]:
                  - text: 自定义 Ares 的雷达干扰逻辑
                  - link "" [ref=e2592] [cursor=pointer]:
                    - /url: "#customize-ares-s-radar-jam-logic"
                - list [ref=e2593]:
                  - listitem [ref=e2594]:
                    - paragraph [ref=e2595]: 现在可以自定义 Ares 雷达干扰逻辑的部分属性。
                    - list [ref=e2596]:
                      - listitem [ref=e2597]:
                        - paragraph [ref=e2598]:
                          - code [ref=e2599]: RadarJamHouses
                          - text: 决定哪些所属方会受到雷达干扰效果影响。
                      - listitem [ref=e2600]:
                        - paragraph [ref=e2601]:
                          - code [ref=e2602]: RadarJamDelay
                          - text: 决定干扰间隔，默认同 Ares 为 30。较短的间隔会使干扰生效更及时但会降低性能。
                      - listitem [ref=e2603]:
                        - paragraph [ref=e2604]:
                          - code [ref=e2605]: RadarJamAffect
                          - text: 决定哪些拥有
                          - code [ref=e2606]: Radar=yes
                          - text: 或
                          - code [ref=e2607]: SpySat=yes
                          - text: 的建筑会受到干扰。如果为空则所有雷达建筑都会受到干扰。
                      - listitem [ref=e2608]:
                        - paragraph [ref=e2609]:
                          - code [ref=e2610]: RadarJamIgnore
                          - text: 决定哪些拥有
                          - code [ref=e2611]: Radar=yes
                          - text: 或
                          - code [ref=e2612]: SpySat=yes
                          - text: 的建筑不受到干扰。
                - paragraph [ref=e2613]:
                  - text: 在
                  - code [ref=e2614]: rulesmd.ini
                  - text: ：
                - generic [ref=e2617]: "[SOMETECHNO] ; TechnoType, with RadarJamRadius= RadarJamHouses=enemies ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) RadarJamDelay=30 ; integer RadarJamAffect= ; List of BuildingTypes RadarJamIgnore= ; List of BuildingTypes"
              - generic [ref=e2618]:
                - heading "单位出售音效 " [level=3] [ref=e2619]:
                  - text: 单位出售音效
                  - link "" [ref=e2620] [cursor=pointer]:
                    - /url: "#customize-eva-voice-and-sellsound-when-selling-units"
                - list [ref=e2621]:
                  - listitem [ref=e2622]:
                    - paragraph [ref=e2623]: 当建筑或单位被出售时将向所有者播放出售音效和 EVA 语音。这些设置以允许微观定义。
                    - list [ref=e2624]:
                      - listitem [ref=e2625]:
                        - paragraph [ref=e2626]:
                          - code [ref=e2627]: EVA.Sold
                          - text: 用于自定义出售时的 EVA 语音。
                      - listitem [ref=e2628]:
                        - paragraph [ref=e2629]:
                          - code [ref=e2630]: SellSound
                          - text: 用于自定义出售时的音效。
                - paragraph [ref=e2631]:
                  - text: 在
                  - code [ref=e2632]: rulesmd.ini
                  - text: ：
                - generic [ref=e2635]: "[SOMETECHNO] ; BuildingType or VehicleType EVA.Sold= ; EVA entry, default to EVA_StructureSold for buildings and EVA_UnitSold for vehicles SellSound= ; Sound entry, default to [AudioVisual] -> SellSound"
                - generic [ref=e2636]:
                  - paragraph [ref=e2637]:  备注
                  - paragraph [ref=e2638]:
                    - text: 原版游戏中出售载具的
                    - code [ref=e2639]: SellSound
                    - text: 是全局的。这已改为与建筑出售的
                    - code [ref=e2640]: SellSound
                    - text: 保持一致。
              - generic [ref=e2641]:
                - heading "禁用副武器自动推算 " [level=3] [ref=e2642]:
                  - text: 禁用副武器自动推算
                  - link "" [ref=e2643] [cursor=pointer]:
                    - /url: "#disabling-fallback-to-elite-secondary-weapon"
                - list [ref=e2644]:
                  - listitem [ref=e2645]:
                    - paragraph [ref=e2646]:
                      - text: 现在如果
                      - code [ref=e2647]: (Elite)Primary
                      - text: 武器无法对选定目标开火那么可以通过将
                      - code [ref=e2648]: NoSecondaryWeaponFallback
                      - text: 设为 true（默认为 false）来禁用其尝试换用
                      - code [ref=e2649]: (Elite)Secondary
                      - text: 武器。
                      - code [ref=e2650]: NoSecondaryWeaponFallback.AllowAA
                      - text: 控制对抛射体拥有
                      - code [ref=e2651]: AA
                      - text: 且应对空中目标的情况。这不适用于总是选择
                      - code [ref=e2652]: (Elite)Secondary
                      - text: 武器的特殊情况，包括但不限于以下几种：
                    - list [ref=e2653]:
                      - listitem [ref=e2654]:
                        - paragraph [ref=e2655]:
                          - code [ref=e2656]: OpenTransportWeapon=1
                          - text: 的单位在一个
                          - code [ref=e2657]: OpenTopped=true
                          - text: 的运输工具内开火。
                      - listitem [ref=e2658]:
                        - paragraph [ref=e2659]:
                          - code [ref=e2660]: NoAmmoWeapon=1
                          - text: 的单位在
                          - code [ref=e2661]: Ammo
                          - text: 大于 0 且当前弹药数量小于等于
                          - code [ref=e2662]: NoAmmoAmount
                          - text: 。
                      - listitem [ref=e2663]:
                        - paragraph [ref=e2664]:
                          - text: 拥有
                          - code [ref=e2665]: DeployFireWeapon=1
                          - text: 的
                          - code [ref=e2666]: IsSimpleDeployer=true
                          - text: 单位处于部署状态。
                      - listitem [ref=e2667]:
                        - paragraph [ref=e2668]:
                          - code [ref=e2669]: DrainWeapon=true
                          - text: 的武器应对敌方
                          - code [ref=e2670]: Drainable=yes
                          - text: 的建筑。
                      - listitem [ref=e2671]:
                        - paragraph [ref=e2672]:
                          - text: 单位使用一个
                          - code [ref=e2673]: Warhead
                          - text: 拥有
                          - code [ref=e2674]: IsLocomotor=true
                          - text: 设置的
                          - code [ref=e2675]: (Elite)Primary
                          - text: 应对建筑。
                      - listitem [ref=e2676]:
                        - paragraph [ref=e2677]:
                          - text: 对所有者或盟友的
                          - code [ref=e2678]: Overpowerable=true
                          - text: 建筑使用
                          - code [ref=e2679]: Warhead
                          - text: 拥有
                          - code [ref=e2680]: ElectricAssault=true
                          - text: 设置的武器。
                      - listitem [ref=e2681]:
                        - paragraph [ref=e2682]:
                          - code [ref=e2683]: Overpowerable=true
                          - text: 的建筑当前处于过载状态。
                      - listitem [ref=e2684]:
                        - paragraph [ref=e2685]:
                          - text: 任何使用
                          - code [ref=e2686]: (Elite)WeaponX
                          - text: 的系统也完全不受影响，例如
                          - code [ref=e2687]: Gunner=true
                          - text: 或
                          - code [ref=e2688]: IsGattling=true
                          - text: 。
                  - listitem [ref=e2689]:
                    - paragraph [ref=e2690]:
                      - text: 现在如果
                      - code [ref=e2691]: "[CombatDamage] -> AllowWeaponSelectAgainstWalls"
                      - text: 设置为 true，假设
                      - code [ref=e2692]: Primary
                      - text: 武器的弹头拥有
                      - code [ref=e2693]: Wall=false
                      - text: ，而
                      - code [ref=e2694]: Secondary
                      - text: 武器拥有
                      - code [ref=e2695]: Wall=true
                      - text: 且开火者没有将
                      - code [ref=e2696]: NoSecondaryWeaponFallback
                      - text: 设为 true 那么
                      - code [ref=e2697]: Secondary
                      - text: 将在应对墙时被使用。这可以在单位上微观定义以覆盖全局值。
                - paragraph [ref=e2698]:
                  - text: 在
                  - code [ref=e2699]: rulesmd.ini
                  - text: ：
                - generic [ref=e2702]: "[CombatDamage] AllowWeaponSelectAgainstWalls=false ; boolean [SOMETECHNO] ; TechnoType NoSecondaryWeaponFallback=false ; boolean NoSecondaryWeaponFallback.AllowAA=false ; boolean AllowWeaponSelectAgainstWalls= ; boolean, default to [CombatDamage] -> AllowWeaponSelectAgainstWalls"
              - generic [ref=e2703]:
                - heading "伪装逻辑增强 " [level=3] [ref=e2704]:
                  - text: 伪装逻辑增强
                  - link "" [ref=e2705] [cursor=pointer]:
                    - /url: "#disguise-logic-additions-disguise-based-movement-speed-disguise-blinking-visibility"
                - list [ref=e2706]:
                  - listitem [ref=e2707]:
                    - paragraph [ref=e2708]:
                      - code [ref=e2709]: DisguiseBlinkingVisibility
                      - text: 可用于自定义哪些玩家可以看到单位的伪装闪烁。这不影响目标选择，但会影响军衔的可见性——闪烁的伪装意味着始终可见原单位的军衔而不是伪装单位的。
                    - list [ref=e2710]:
                      - listitem [ref=e2711]:
                        - paragraph [ref=e2712]:
                          - text: 另一个需要注意的是：在单人任务中，就伪装闪烁而言，任何被玩家所控制的所属方所拥有的伪装单位即便与玩家所属方不是盟友也视为当前玩家所拥有，这意味着玩家始终可以看到它们的伪装闪烁，除非
                          - code [ref=e2713]: DisguiseBlinkingVisibility
                          - text: 设置为
                          - code [ref=e2714]: none
                          - text: 或
                          - code [ref=e2715]: enemies
                          - text: 。
                  - listitem [ref=e2716]:
                    - paragraph [ref=e2717]:
                      - code [ref=e2718]: UseDisguiseMovementSpeed
                      - text: 如果设置则在可行的情况下伪装单位将调整其移动速度以匹配伪装目标的速度。注意即使伪装被识破只要未被解除此设置就依旧生效。
                - paragraph [ref=e2719]:
                  - text: 在
                  - code [ref=e2720]: rulesmd.ini
                  - text: ：
                - generic [ref=e2723]: "[General] DisguiseBlinkingVisibility=owner ; List of Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) [SOMETECHNO] ; TechnoType UseDisguiseMovementSpeed=false ; boolean"
              - generic [ref=e2724]:
                - heading "不参与基地中心计算 " [level=3] [ref=e2725]:
                  - text: 不参与基地中心计算
                  - link "" [ref=e2726] [cursor=pointer]:
                    - /url: "#exclusion-from-base-center-calculations"
                - list [ref=e2727]:
                  - listitem [ref=e2728]:
                    - paragraph [ref=e2729]: 这可用于将科技类型从基地中心计算中排除（用于特定 AI 脚本和 AI 超武瞄准模式等）通常仅有建筑参与计算，但初始基地中心的确会计入所属方的初始单位，该设置对此也可生效。
                - paragraph [ref=e2730]:
                  - text: 在
                  - code [ref=e2731]: rulesmd.ini
                  - text: ：
                - generic [ref=e2734]: "[SOMETECHNO] ; TechnoType IgnoreForBaseCenter=false ; boolean"
              - generic [ref=e2735]:
                - heading "拓展的盖特掉档逻辑 " [level=3] [ref=e2736]:
                  - text: 拓展的盖特掉档逻辑
                  - link "" [ref=e2737] [cursor=pointer]:
                    - /url: "#extended-gattling-rate-down-logic"
                - list [ref=e2738]:
                  - listitem [ref=e2739]:
                    - paragraph [ref=e2740]:
                      - text: 现在你可以自定义
                      - code [ref=e2741]: RateDown
                      - text: 的一些效果。
                    - list [ref=e2742]:
                      - listitem [ref=e2743]:
                        - paragraph [ref=e2744]:
                          - code [ref=e2745]: RateDown.Delay
                          - text: 控制停火多少帧后才开始使用
                          - code [ref=e2746]: RateDown
                          - text: 减少盖特计时器。
                      - listitem [ref=e2747]:
                        - paragraph [ref=e2748]:
                          - code [ref=e2749]: RateDown.Reset
                          - text: 控制当科技类型失去目标或更换目标时是否立即清空盖特计时器。
                      - listitem [ref=e2750]:
                        - paragraph [ref=e2751]:
                          - code [ref=e2752]: RateDown.Cover.Value
                          - text: 用于在科技类型的弹药低于
                          - code [ref=e2753]: RateDown.Cover.AmmoBelow
                          - text: 时替代
                          - code [ref=e2754]: RateDown
                          - text: 使用。
                - paragraph [ref=e2755]:
                  - text: 在
                  - code [ref=e2756]: rulesmd.ini
                  - text: ：
                - generic [ref=e2759]: "[SOMETECHNO] ; TechnoType, with IsGattling=yes RateDown.Delay=0 ; integer, game frames RateDown.Reset=false ; boolean RateDown.Cover.Value=0 ; integer RateDown.Cover.AmmoBelow=-2 ; integer"
              - generic [ref=e2760]:
                - heading "Burst 开火坐标 " [level=3] [ref=e2761]:
                  - text: Burst 开火坐标
                  - link "" [ref=e2762] [cursor=pointer]:
                    - /url: "#firing-offsets-for-specific-burst-shots"
                - list [ref=e2763]:
                  - listitem [ref=e2764]:
                    - paragraph [ref=e2765]:
                      - text: 现在你可以通过使用
                      - code [ref=e2766]: (Elite)(Prone/Deployed)PrimaryFire|SecondaryFire|WeaponX|FLH.BurstN
                      - text: 标签为拥有
                      - code [ref=e2767]: Burst
                      - text: 的武器指定每个连发单独的开火坐标，具体取决于你的科技类型使用哪些武器。
                      - code [ref=e2768]: BurstN
                      - text: 中的
                      - emphasis [ref=e2769]: "N"
                      - text: 是从 0 开始的连发索引，这些值将按顺序解析，直到没有常规或精英武器的值为止，如果精英武器缺少值则默认使用常规武器的 FLH。如果特定连发索引缺少值，则使用基础标签（例如
                      - code [ref=e2770]: PrimaryFireFLH
                      - text: ）的值。
                  - listitem [ref=e2771]:
                    - paragraph [ref=e2772]: 特定连发索引使用的是不会根据连发索引而将 L 值镜像的绝对坐标。
                - paragraph [ref=e2773]:
                  - text: 在
                  - code [ref=e2774]: artmd.ini
                  - text: ：
                - generic [ref=e2777]: "[SOMETECHNO] ; TechnoType Image FLHKEY.BurstN= ; integer - Forward,Lateral,Height. FLHKey refers to weapon-specific FLH key name and N is zero-based burst shot index."
              - generic [ref=e2778]:
                - heading "对特定目标使用特定武器 " [level=3] [ref=e2779]:
                  - text: 对特定目标使用特定武器
                  - link "" [ref=e2780] [cursor=pointer]:
                    - /url: "#forcing-specific-weapon-against-certain-targets"
                - paragraph [ref=e2781]:
                  - img "图像" [ref=e2782]
                  - emphasis [ref=e2783]:
                    - 'link "C&C: Reloaded" [ref=e2784] [cursor=pointer]':
                      - /url: https://www.moddb.com/mods/cncreloaded
                    - text: 中使用
                    - code [ref=e2785]: ForceWeapon.Naval.Decloaked
                    - text: 的海军对水下目标行为
                - paragraph [ref=e2786]:
                  - img "图像" [ref=e2787]
                  - emphasis [ref=e2788]:
                    - 'link "C&C: Reloaded" [ref=e2789] [cursor=pointer]':
                      - /url: https://www.moddb.com/mods/cncreloaded
                    - text: 中敌人使用
                    - code [ref=e2790]: ForceWeapon.UnderEMP
                    - text: 攻击 EMP 状态目标的行为
                - list [ref=e2791]:
                  - listitem [ref=e2792]:
                    - paragraph [ref=e2793]: 可用于覆盖正常的武器选择逻辑，以强制对特定目标使用特定武器。目标满足条件则按所列出规则的顺序使用第一个满足条件的规则。
                    - list [ref=e2794]:
                      - listitem [ref=e2795]:
                        - paragraph [ref=e2796]:
                          - code [ref=e2797]: ForceWeapon.Naval.Decloaked
                          - text: 强制指定对未隐形（下潜）状态
                          - code [ref=e2798]: Naval=yes
                          - text: 的目标使用的武器。如果你的海军单位有一个武器仅用于水下目标另一个武器用于水面目标那么这个规则会很有用。
                      - listitem [ref=e2799]:
                        - paragraph [ref=e2800]:
                          - code [ref=e2801]: ForceWeapon.Cloaked
                          - text: 强制指定对隐形（下潜）状态目标使用的武器。
                      - listitem [ref=e2802]:
                        - paragraph [ref=e2803]:
                          - code [ref=e2804]: ForceWeapon.Disguised
                          - text: 强制指定针对伪装目标所使用的武器。
                      - listitem [ref=e2805]:
                        - paragraph [ref=e2806]:
                          - code [ref=e2807]: ForceWeapon.UnderEMP
                          - text: 强制指定对与被 EMP 瘫痪了的目标所使用的武器。
                      - listitem [ref=e2808]:
                        - paragraph [ref=e2809]:
                          - code [ref=e2810]: ForceWeapon.InRange
                          - text: 强制指定了一个当目标进入武器
                          - code [ref=e2811]: Range
                          - text: 范围时的可选武器列表。如果
                          - code [ref=e2812]: ForceWeapon.InRange.TechnoOnly
                          - text: 设为 true 则仅在目标为单位时才能像其他强制武器效果那样生效，否则在攻击空地时也会生效。该单位会按列表顺序选取首个符合条件的武器。在未设置
                          - code [ref=e2813]: ForceAAWeapon.InRange
                          - text: 的情况下这同时用于地面和空中目标。
                        - list [ref=e2814]:
                          - listitem [ref=e2815]:
                            - paragraph [ref=e2816]:
                              - code [ref=e2817]: ForceAAWeapon.InRange
                              - text: 是
                              - code [ref=e2818]: ForceWeapon.InRange
                              - text: 的对空版本。当两个参数同时存在时
                              - code [ref=e2819]: ForceWeapon.InRange
                              - text: 仅用于对地。
                          - listitem [ref=e2820]:
                            - paragraph [ref=e2821]:
                              - code [ref=e2822]: Force(AA)Weapon.InRange.Overrides
                              - text: 用于覆盖武器
                              - code [ref=e2823]: Range
                              - text: 的数值参与武器选取。列表中的数值与
                              - code [ref=e2824]: Force(AA)Weapon.InRange
                              - text: 中的武器序号一一对应，如果一个武器的对应的值小于 0 或不存在那么使用武器自身的
                              - code [ref=e2825]: Range
                              - text: 。
                          - listitem [ref=e2826]:
                            - paragraph [ref=e2827]:
                              - text: 如果
                              - code [ref=e2828]: Force(AA)Weapon.InRange.ApplyRangeModifiers
                              - text: 设为 true 则任何来自开火者的武器射程加成也将参与射程判定。
                      - listitem [ref=e2829]:
                        - paragraph [ref=e2830]: 一系列根据目标类型强制使用特定武器的标签：
                        - list [ref=e2831]:
                          - listitem [ref=e2832]:
                            - paragraph [ref=e2833]:
                              - code [ref=e2834]: ForceWeapon.Naval.Units
                              - text: 强制指定对
                              - code [ref=e2835]: Naval=yes
                              - text: 的单位所使用的武器。优先级高于
                              - code [ref=e2836]: ForceWeapon.Units
                              - text: 。
                          - listitem [ref=e2837]:
                            - paragraph [ref=e2838]:
                              - code [ref=e2839]: ForceWeapon.Defenses
                              - text: 是
                              - code [ref=e2840]: ForceWeapon.Buildings
                              - text: 针对
                              - code [ref=e2841]: BuildCat=Combat
                              - text: 类建筑目标的分离设置，不启用即沿用后者。
                          - listitem [ref=e2842]:
                            - paragraph [ref=e2843]:
                              - code [ref=e2844]: ForceWeapon.Infantry/Units/Aircraft
                              - text: 在未设置
                              - code [ref=e2845]: ForceAAWeapon.Infantry/Units/Aircraft
                              - text: 时同时控制对空对地。
                          - listitem [ref=e2846]:
                            - paragraph [ref=e2847]:
                              - code [ref=e2848]: ForceAAWeapon.Infantry/Units/Aircraft
                              - text: 是
                              - code [ref=e2849]: ForceWeapon.Infantry/Units/Aircraft
                              - text: 的对空版本。当两个参数同时存在时后者仅用于对地。
                - paragraph [ref=e2850]:
                  - text: 在
                  - code [ref=e2851]: rulesmd.ini
                  - text: ：
                - generic [ref=e2854]: "[SOMETECHNO] ; TechnoType ForceWeapon.Naval.Decloaked=-1 ; integer, -1 to disable ForceWeapon.Cloaked=-1 ; integer, -1 to disable ForceWeapon.Disguised=-1 ; integer, -1 to disable ForceWeapon.UnderEMP=-1 ; integer, -1 to disable ForceWeapon.InRange= ; List of integers ForceWeapon.InRange.Overrides= ; List of floating-point values ForceWeapon.InRange.ApplyRangeModifiers=false ; boolean ForceWeapon.InRange.TechnoOnly=true ; boolean ForceAAWeapon.InRange= ; List of integers ForceAAWeapon.InRange.Overrides= ; List of floating-point values ForceAAWeapon.InRange.ApplyRangeModifiers=false ; boolean ForceWeapon.Buildings=-1 ; integer, -1 to disable ForceWeapon.Defenses=-1 ; integer, -1 to disable ForceWeapon.Infantry=-1 ; integer, -1 to disable ForceWeapon.Naval.Units=-1 ; integer, -1 to disable ForceWeapon.Units=-1 ; integer, -1 to disable ForceWeapon.Aircraft=-1 ; integer, -1 to disable ForceAAWeapon.Infantry=-1 ; integer, -1 to disable ForceAAWeapon.Units=-1 ; integer, -1 to disable ForceAAWeapon.Aircraft=-1 ; integer, -1 to disable"
                - generic [ref=e2855]:
                  - paragraph [ref=e2856]:  备注
                  - paragraph [ref=e2857]:
                    - text: 特别说明，如果某个位置的
                    - code [ref=e2858]: Force(AA)Weapon.InRange
                    - text: 设为 -1 而
                    - code [ref=e2859]: Force(AA)Weapon.InRange.Overrides
                    - text: 为正值，那么在满足条件时使用默认的武器选取规则。
              - generic [ref=e2860]:
                - heading "快速进入载具／建筑 " [level=3] [ref=e2861]:
                  - text: 快速进入载具／建筑
                  - link "" [ref=e2862] [cursor=pointer]:
                    - /url: "#fast-access-vehicle-structure"
                - list [ref=e2863]:
                  - listitem [ref=e2864]:
                    - paragraph [ref=e2865]: 现在你可以让步兵或载具类载员无需排队地快速进入或离开运输载具／建筑。
                - paragraph [ref=e2866]:
                  - text: 在
                  - code [ref=e2867]: rulesmd.ini
                  - text: ：
                - generic [ref=e2870]: "[General] NoQueueUpToEnter=false ; boolean NoQueueUpToUnload=false ; boolean NoQueueUpToEnter.Buildings= ; boolean, default to NoQueueUpToEnter NoQueueUpToUnload.Buildings= ; boolean, default to NoQueueUpToUnload [SOMEVEHICLE/SOMEBUILDING] ; VehicleType/BuildingType, transport NoQueueUpToEnter= ; boolean, default to [General] -> NoQueueUpToEnter(.Buildings) NoQueueUpToUnload= ; boolean, default to [General] -> NoQueueUpToUnload(.Buildings)"
                - generic [ref=e2871]:
                  - paragraph [ref=e2872]:  备注
                  - paragraph [ref=e2873]:
                    - text: 注意该逻辑用于
                    - link "乘客" [ref=e2874] [cursor=pointer]:
                      - /url: https://modenc.renegadeprojects.com/Passengers
                    - text: 逻辑，这与
                    - link "驻军" [ref=e2875] [cursor=pointer]:
                      - /url: https://modenc.renegadeprojects.com/Occupier
                    - text: 是两个不同的东西。
              - generic [ref=e2876]:
                - heading "初始子机数量 " [level=3] [ref=e2877]:
                  - text: 初始子机数量
                  - link "" [ref=e2878] [cursor=pointer]:
                    - /url: "#initial-spawns-number"
                - list [ref=e2879]:
                  - listitem [ref=e2880]:
                    - paragraph [ref=e2881]:
                      - text: 现在可以设置子机发射器的初始子机数量，而不再总是初始满载。如果初始数量大于
                      - code [ref=e2882]: SpawnsNumber
                      - text: 则无效。
                - paragraph [ref=e2883]:
                  - text: 在
                  - code [ref=e2884]: rulesmd.ini
                  - text: ：
                - generic [ref=e2887]: "[SOMETECHNO] ; TechnoType InitialSpawnsNumber= ; integer"
              - generic [ref=e2888]:
                - heading "科技类型与克隆步兵的初始血量 " [level=3] [ref=e2889]:
                  - text: 科技类型与克隆步兵的初始血量
                  - link "" [ref=e2890] [cursor=pointer]:
                    - /url: "#initial-strength-for-technotypes-and-cloned-infantry"
                - paragraph [ref=e2891]:
                  - img "图像" [ref=e2892]
                  - emphasis [ref=e2893]:
                    - 'link "C&C: Reloaded" [ref=e2894] [cursor=pointer]':
                      - /url: https://www.moddb.com/mods/cncreloaded
                    - text: 中克隆步兵的初始血量示例
                - list [ref=e2895]:
                  - listitem [ref=e2896]:
                    - paragraph [ref=e2897]:
                      - code [ref=e2898]: InitialStrength
                      - text: 可用于设置科技类型的初始血量。
                  - listitem [ref=e2899]:
                    - paragraph [ref=e2900]:
                      - code [ref=e2901]: InitialStrength.Cloning
                      - text: 可以用于指定克隆步兵由
                      - code [ref=e2902]: Cloning=true
                      - text: 建筑创建时的初始血量百分比（单个值或从其中随机选取的一对值）。
                - paragraph [ref=e2903]:
                  - text: 在
                  - code [ref=e2904]: rulesmd.ini
                  - text: ：
                - generic [ref=e2907]: "[SOMETECHNO] ; TechnoType InitialStrength= ; integer [SOMEBUILDING] ; BuildingType InitialStrength.Cloning= ; floating point value - single or comma-sep. range (percentages)"
                - generic [ref=e2908]:
                  - paragraph [ref=e2909]:  备注
                  - paragraph [ref=e2910]:
                    - code [ref=e2911]: InitialStrength
                    - text: 和
                    - code [ref=e2912]: InitialStrength.Cloning
                    - text: 都不会超过单位的
                    - code [ref=e2913]: Strength
                    - text: ，即使你设置了一个比它更大的值。
              - generic [ref=e2914]:
                - heading "自毁 " [level=3] [ref=e2915]:
                  - text: 自毁
                  - link "" [ref=e2916] [cursor=pointer]:
                    - /url: "#kill-object-automatically"
                - list [ref=e2917]:
                  - listitem [ref=e2918]:
                    - paragraph [ref=e2919]:
                      - text: 如果满足以下
                      - strong [ref=e2920]: 任何
                      - text: 条件对象将会自毁：
                    - list [ref=e2921]:
                      - listitem [ref=e2922]:
                        - paragraph [ref=e2923]:
                          - code [ref=e2924]: OnAmmoDepletion
                          - text: ：如果剩余弹药达到 0 则对象死亡。
                      - listitem [ref=e2925]:
                        - paragraph [ref=e2926]:
                          - code [ref=e2927]: OnOwnerChange
                          - text: ：该对象所属方发生变更。
                        - list [ref=e2928]:
                          - listitem [ref=e2929]:
                            - paragraph [ref=e2930]:
                              - code [ref=e2931]: OnOwnerChange.HumanToComputer/ComputerToHuman
                              - text: ：该对象的所属方从人类玩家转为 AI 玩家或从 AI 玩家转为人类玩家。若未设置则默认同
                              - code [ref=e2932]: OnOwnerChange
                              - text: 。
                      - listitem [ref=e2933]:
                        - paragraph [ref=e2934]:
                          - code [ref=e2935]: AfterDelay
                          - text: ：如果倒计时（以帧为单位）达到 0 则对象死亡。
                      - listitem [ref=e2936]:
                        - paragraph [ref=e2937]:
                          - code [ref=e2938]: TechnosExist
                          - text: ／
                          - code [ref=e2939]: TechnosDontExist
                          - text: ：如果科技类型分别存在或不存在则对象死亡。
                        - list [ref=e2940]:
                          - listitem [ref=e2941]:
                            - paragraph [ref=e2942]:
                              - code [ref=e2943]: Technos(Dont)Exist.Any
                              - text: 控制需要列出的单个科技类型还是所有科技类型来满足条件。
                          - listitem [ref=e2944]:
                            - paragraph [ref=e2945]:
                              - code [ref=e2946]: Technos(Dont)Exist.AllowLimboed
                              - text: 控制是否计入虚拟的科技类型（例如在运输工具中的那些）。
                          - listitem [ref=e2947]:
                            - paragraph [ref=e2948]:
                              - code [ref=e2949]: Technos(Dont)Exist.Houses
                              - text: 控制检查哪些所属方。
                  - listitem [ref=e2950]:
                    - paragraph [ref=e2951]: 自毁行为有以下选择：
                    - list [ref=e2952]:
                      - listitem [ref=e2953]:
                        - paragraph [ref=e2954]:
                          - code [ref=e2955]: kill
                          - text: ：对象将正常摧毁。
                      - listitem [ref=e2956]:
                        - paragraph [ref=e2957]:
                          - code [ref=e2958]: vanish
                          - text: ：对象将被直接从游戏中静默移除而不是真正击杀。
                      - listitem [ref=e2959]:
                        - paragraph [ref=e2960]:
                          - code [ref=e2961]: sell
                          - text: ：如果对象是拥有建造动画的
                          - strong [ref=e2962]: 建筑
                          - text: ，它将被出售而不是被摧毁。
                  - listitem [ref=e2963]:
                    - paragraph [ref=e2964]:
                      - text: 如果未设置此项那么自毁逻辑将不会启用。如果选择
                      - code [ref=e2965]: vanish
                      - text: 行为，那么可以使用
                      - code [ref=e2966]: AutoDeath.VanishAnimation
                      - text: 设置自毁时播放的动画。如果列出了多个动画，则将随机选择一个。
                  - listitem [ref=e2967]:
                    - paragraph [ref=e2968]:
                      - text: 此逻辑还支持通过
                      - link "虚拟投放" [ref=e2969] [cursor=pointer]:
                        - /url: "#limbodelivery"
                      - text: 提供的建筑。不过这种情况下所有
                      - code [ref=e2970]: AutoDeath.Behavior
                      - text: 值都将只是使建筑简单地移除。
                - paragraph [ref=e2971]:
                  - text: 在
                  - code [ref=e2972]: rulesmd.ini
                  - text: ：
                - generic [ref=e2975]: "[SOMETECHNO] ; TechnoType AutoDeath.Behavior= ; enumeration (kill | vanish | sell), default not set AutoDeath.VanishAnimation= ; List of AnimationTypes AutoDeath.OnAmmoDepletion=false ; boolean AutoDeath.OnOwnerChange=false ; boolean AutoDeath.OnOwnerChange.HumanToComputer= ; boolean, default to AutoDeath.OnOwnerChange AutoDeath.OnOwnerChange.ComputerToHuman= ; boolean, default to AutoDeath.OnOwnerChange AutoDeath.AfterDelay=0 ; positive integer AutoDeath.TechnosDontExist= ; List of TechnoTypes AutoDeath.TechnosDontExist.Any=false ; boolean AutoDeath.TechnosDontExist.AllowLimboed=false ; boolean AutoDeath.TechnosDontExist.Houses=owner ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all) AutoDeath.TechnosExist= ; List of TechnoTypes AutoDeath.TechnosExist.Any=true ; boolean AutoDeath.TechnosExist.AllowLimboed=false ; boolean AutoDeath.TechnosExist.Houses=owner ; Affected House Enumeration (none|owner/self|allies/ally|team|enemies/enemy|all)"
                - generic [ref=e2976]:
                  - paragraph [ref=e2977]:  备注
                  - paragraph [ref=e2978]:
                    - text: 请注意
                    - strong [ref=e2979]: 如果你没有使用 Ares 3.0+
                    - text: 那么对于携带载员的单位即使使用
                    - code [ref=e2980]: kill
                    - text: 行为载员也不会被释放。
              - generic [ref=e2981]:
                - heading "低优先级部署 " [level=3] [ref=e2982]:
                  - text: 低优先级部署
                  - link "" [ref=e2983] [cursor=pointer]:
                    - /url: "#low-priority-for-deploy"
                - list [ref=e2984]:
